n":"血流媒介皮膚蛍光分光法（FMSF）を利用し、皮膚組織細胞のNADH蛍光シグナルを測定して微小血管循環を評価する医療機器。微小循環、代謝調節、糖尿病関連血管合併症の非侵襲的診断・モニタリングに使用する。","specialty":"内科"},"en":{"title":"AngioExpert Skin Fluorescence Vascular Circulation Detector","description":"AngioExpert is a medical device that uses flow-mediated skin fluorescence spectroscopy, FMSF, to assess microvascular circulation by measuring NADH fluorescence signals in skin tissue cells.\nIt is intended for non-invasive diagnosis and monitoring of microcirculation, metabolic regulation, and diabetes-related vascular complications.","specialty":"Internal Medicine"}}},{"id":442,"category":"device","number":237,"langs":{"zh":{"title":"Plenity\n纤维素水凝胶胶囊","description":"Plenity\n®适用于体重指数(BMI)为25-40kg/m2的超重或肥胖成人以助其减轻体重，并应与饮食控制和运动结合使用。","specialty":"内科"},"ja":{"title":"Plenity セルロースハイドロゲルカプセル","description":"BMI 25～40 kg/m²の過体重または肥満成人の減量補助に使用し、食事管理・運動と併用する。","specialty":"内科"},"en":{"title":"Plenity Cellulose Hydrogel Capsules","description":"Plenity® is intended for overweight or obese adults with BMI 25–40 kg/m² to assist weight loss and should be used together with dietary control and exercise.","specialty":"Internal Medicine"}}},{"id":443,"category":"device","number":238,"langs":{"zh":{"title":"持续葡萄糖监测系统\n（Continuous Glucose\nMonitoring System）、\n传感器套装\n（Sensor kit）","description":"血糖监控","specialty":"内分泌科"},"ja":{"title":"持続血糖モニタリングシステム（Continuous Glucose Monitoring System）／センサーキット","description":"血糖モニタリング。","specialty":"内分泌科"},"en":{"title":"Continuous Glucose Monitoring System and Sensor Kit","description":"Blood glucose monitoring.","specialty":"Endocrinology"}}},{"id":444,"category":"device","number":239,"langs":{"zh":{"title":"FreeStyle Libre 2 持续葡萄糖监测系统（FreeStyle Libre 2 持续葡萄糖监测系统扫描检测仪套装）","description":"FreeStyle Libre 2 持续葡萄糖监测系统扫描检测仪（以下简称“扫描检测仪”）与FreeStyle Libre2持续葡萄糖监测系统传感器（以下简称“传感器”）配合使用时，适用于测量糖尿病患者（4 周岁及以上，包括孕妇）的组织间液葡萄糖水平。扫描检测仪和传感器旨在替代糖尿病自我管理（包括胰岛素注射）中的血糖测试。所适用的儿童（4-12 周岁）仅限于由至少年满18周岁的看护人监督的儿童。该看护人负责管理或协助儿童管理扫描检测仪和传感器，还负责解读或协助儿童解读传感器葡萄糖解读。","specialty":"内分泌科"},"ja":{"title":"FreeStyle Libre 2 持続血糖モニタリングシステム、リーダーキット","description":"FreeStyle Libre 2リーダーをFreeStyle Libre 2センサーと併用し、4歳以上、妊婦を含む、糖尿病患者の間質液グルコース値を測定する。糖尿病自己管理、インスリン投与を含む、における血糖測定の代替を意図する。4～12歳の小児は18歳以上の介護者の監督下に限る。介護者はリーダー・センサー管理およびセンサーグルコース値の解釈を管理・補助する。","specialty":"内分泌科"},"en":{"title":"FreeStyle Libre 2 Continuous Glucose Monitoring System, Reader Kit","description":"When the FreeStyle Libre 2 reader is used with the FreeStyle Libre 2 sensor, it is intended to measure interstitial glucose levels in patients with diabetes aged 4 years and older, including pregnant women. The reader and sensor are intended to replace blood glucose testing for diabetes self-management, including insulin dosing. Children aged 4–12 years are limited to those supervised by a caregiver aged at least 18 years. The caregiver is responsible for managing or assisting the child in managing the reader and sensor and for interpreting or assisting the child in interpreting sensor glucose readings.","specialty":"Endocrinology"}}},{"id":445,"category":"device","number":240,"langs":{"zh":{"title":"热疗消融系统（Rezūm\nGenerator）一次性使用热疗消融导\n管（Rezūm Delivery Device）","description":"治疗良性前列腺增生（BPH）患者","specialty":"泌尿外科"},"ja":{"title":"Rezūm Generator 温熱アブレーションシステム／Rezūm Delivery Device 単回使用温熱アブレーションカテーテル","description":"良性前立腺肥大症（BPH）患者の治療。","specialty":"泌尿器科"},"en":{"title":"Rezūm Generator Thermal Ablation System and Single-Use Rezūm Delivery Device","description":"Treatment of patients with benign prostatic hyperplasia, BPH.","specialty":"Urology"}}},{"id":446,"category":"device","number":241,"langs":{"zh":{"title":"一次性使用可吸收隔离水凝胶\nSpaceOAR System","description":"拟用于在前列腺癌放射治疗期间暂时将直肠前壁隔离至远离前列腺的位置，一次性使用可吸收隔离水凝胶创造这个空间的目的是减少传导至直肠前部的辐射剂量。一次性使用可吸收隔离水凝胶由可生物降解材料构成，能够在前列腺放射治疗的整个过程中保持形成的空间，并随着时间的推移被患者的身体完全吸收。","specialty":"泌尿外科"},"ja":{"title":"SpaceOAR System 単回使用吸収性ハイドロゲルスペーサー","description":"前立腺癌放射線治療中に直腸前壁を一時的に前立腺から離す。形成された空間により直腸前部への放射線量を低減する。生分解性材料で構成され、前立腺放射線治療期間中空間を維持し、時間とともに患者体内へ完全吸収される。","specialty":"泌尿器科"},"en":{"title":"SpaceOAR System Single-Use Absorbable Hydrogel Spacer","description":"Intended to temporarily separate the anterior rectal wall away from the prostate during radiotherapy for prostate cancer. The purpose of creating this space is to reduce the radiation dose delivered to the anterior rectum. The hydrogel is made of biodegradable material, maintains the created space throughout prostate radiotherapy, and is completely absorbed by the patient's body over time.","specialty":"Urology"}}},{"id":447,"category":"device","number":242,"langs":{"zh":{"title":"一次性使用电子膀胱镜(及电子内窥镜图像处理器)","description":"诊断性膀胱镜和膀胱、尿道内灌注液的灌注。","specialty":"泌尿外科"},"ja":{"title":"単回使用電子膀胱鏡および電子内視鏡画像処理装置","description":"診断的膀胱鏡および膀胱・尿道内への灌流液注入に使用する。","specialty":"泌尿器科"},"en":{"title":"Single-Use Electronic Cystoscope and Electronic Endoscopic Image Processor","description":"For diagnostic cystoscopy and irrigation/instillation of fluid into the bladder and urethra.","specialty":"Urology"}}},{"id":448,"category":"device","number":243,"langs":{"zh":{"title":"Schelin Catheter\n谢林导管","description":"Schelin 导管的医学适应症为适于前列腺内和前列腺周注射药物的疾病或病症，例如：\n采用经尿道微波疗法（TUMT）或经尿道前列腺切除术（TURP）治疗 BPH 期间，通过注射麻醉剂 /镇痛剂的方式实施疼痛管理。\n用于适于前列腺内和前列腺周注射药物，采用 TUMT 或 TURP 技术治疗 BPH 的手术，如注射收敛剂","specialty":"泌尿外科"},"ja":{"title":"Schelin Catheter","description":"前立腺内・前立腺周囲への薬剤注射に適する疾患・病態に使用する。例：\nTUMTまたはTURPでBPH治療中に麻酔薬／鎮痛薬を注射して疼痛管理を行う。\nTUMTまたはTURPによるBPH手術で、収斂剤など前立腺内・周囲への薬剤注射に使用する。","specialty":"泌尿器科"},"en":{"title":"Schelin Catheter","description":"Medical indications include diseases or conditions suitable for intraprostatic and periprostatic drug injection, for example:\npain management by injection of anesthetic/analgesic during BPH treatment with transurethral microwave therapy, TUMT, or transurethral resection of the prostate, TURP;\nprocedures using TUMT or TURP for BPH that are suitable for intraprostatic/periprostatic drug injection, such as injection of an astringent.","specialty":"Urology"}}},{"id":449,"category":"device","number":244,"langs":{"zh":{"title":"蓝光光源 LIGHT SOURCE LED\nBLUE BNDL","description":"（光动力学诊断系统）用于泌尿外科，对增生和恶性肿瘤患者进行PDD光动力学诊断。","specialty":"泌尿外科"},"ja":{"title":"LIGHT SOURCE LED BLUE BNDL 青色光源","description":"光線力学診断システムとして、泌尿器科で過形成・悪性腫瘍患者のPDD光線力学診断に使用する。","specialty":"泌尿器科"},"en":{"title":"LIGHT SOURCE LED BLUE BNDL","description":"Photodynamic diagnostic system used in urology for PDD photodynamic diagnosis in patients with hyperplasia and malignant tumors.","specialty":"Urology"}}},{"id":450,"category":"device","number":245,"langs":{"zh":{"title":"蓝光内窥镜 TELESCOPE BLUE","description":"（光动力学诊断系统）用于泌尿外科，对增生和恶性肿瘤患者进行PDD光动力学诊断。","specialty":"泌尿外科"},"ja":{"title":"TELESCOPE BLUE 青色光内視鏡","description":"光線力学診断システムとして、泌尿器科で過形成・悪性腫瘍患者のPDD光線力学診断に使用する。","specialty":"泌尿器科"},"en":{"title":"TELESCOPE BLUE","description":"Photodynamic diagnostic system used in urology for PDD photodynamic diagnosis in patients with hyperplasia and malignant tumors.","specialty":"Urology"}}},{"id":451,"category":"device","number":246,"langs":{"zh":{"title":"人工海绵体及配件(带抗生素涂层)","description":"适用于治疗慢性、器质性男性勃起机能障碍（阳痿）。","specialty":"泌尿外科"},"ja":{"title":"抗菌薬コーティング付き陰茎プロテーゼおよび付属品","description":"慢性・器質性男性勃起機能障害、インポテンス、の治療に適応する。","specialty":"泌尿器科"},"en":{"title":"Penile Prosthesis and Accessories, Antibiotic-Coated","description":"For treatment of chronic organic male erectile dysfunction, impotence.","specialty":"Urology"}}},{"id":452,"category":"device","number":247,"langs":{"zh":{"title":"肾脏冲击波治疗设备","description":"Nephrospec 旨在改善肾脏血流，用于治疗诊断为慢性肾脏病（CKD)患者的高血压。","specialty":"泌尿外科"},"ja":{"title":"腎臓衝撃波治療装置","description":"Nephrospecは腎血流を改善し、慢性腎臓病（CKD）と診断された患者の高血圧を治療することを目的とする。","specialty":"泌尿器科"},"en":{"title":"Renal Shock Wave Treatment Device","description":"Nephrospec is intended to improve renal blood flow and treat hypertension in patients diagnosed with chronic kidney disease, CKD.","specialty":"Urology"}}},{"id":453,"category":"device","number":248,"langs":{"zh":{"title":"射频治疗勃起障碍设备Vertica\nErectile Dysfunction device","description":"Vertica是一种电池供电的便携式医疗设备，利用射频能量改善勃起功能。该设备适用于家庭使用。","specialty":"泌尿外科"},"ja":{"title":"Vertica Erectile Dysfunction Device","description":"高周波エネルギーで勃起機能を改善する電池駆動の携帯型医療機器。家庭使用に適応する。","specialty":"泌尿器科"},"en":{"title":"Vertica Erectile Dysfunction Device","description":"A battery-powered portable medical device that uses radiofrequency energy to improve erectile function. Intended for home use.","specialty":"Urology"}}},{"id":454,"category":"device","number":249,"langs":{"zh":{"title":"蓝光摄像头 LOGIC HD PENDUAL\nCAMERA HEAD BLUE","description":"（光动力学诊断系统）用于泌尿外科，对增生和恶性肿瘤患者进行PDD光动力学诊断。","specialty":"泌尿外科"},"ja":{"title":"LOGIC HD PENDUAL CAMERA HEAD BLUE 青色光カメラヘッド","description":"光線力学診断システムとして、泌尿器科で過形成・悪性腫瘍患者のPDD光線力学診断に使用する。","specialty":"泌尿器科"},"en":{"title":"LOGIC HD PENDUAL CAMERA HEAD BLUE","description":"Photodynamic diagnostic system used in urology for PDD photodynamic diagnosis in patients with hyperplasia and malignant tumors.","specialty":"Urology"}}},{"id":455,"category":"device","number":220,"langs":{"zh":{"title":"生物人工血管Artegraft Collagen Vascular Graft","description":"Artegraft预期可在主动脉远端用作节段性动脉替代物、动脉旁路、动静脉分流(常规方法已证明无法满足需要)或动脉补片人工血管。\n• 对于自体大隐静脉缺失或不适当的患者，应将Artegraft用于股腘动脉旁路移植术。","specialty":"普外科"},"ja":{"title":"Artegraft Collagen Vascular Graft 生体人工血管","description":"大動脈遠位での分節動脈代替、動脈バイパス、通常法で対応できない動静脈シャント、または動脈パッチ人工血管として使用する。\n• 自家大伏在静脈が欠損または不適切な患者では、大腿膝窩動脈バイパス移植にArtegraftを使用する。","specialty":"一般外科"},"en":{"title":"Artegraft Collagen Vascular Graft","description":"Artegraft is intended for use distal to the aorta as a segmental arterial substitute, arterial bypass, arteriovenous shunt when conventional methods have proved inadequate, or arterial patch graft.\n• In patients with absent or unsuitable autologous great saphenous vein, Artegraft should be used for femoropopliteal bypass grafting.","specialty":"General Surgery"}}},{"id":456,"category":"device","number":250,"langs":{"zh":{"title":"牙周组织再生诱导材料","description":"Emdogain®结合牙周/种植体周围手术局部应用，重建因牙周/种植体周围疾病或外伤而缺失的牙周组织。作为牙外科手术过程的一部分，Straumann®Emdogain®还可以用于软组织创伤的治愈过程中。Emdogain®可有效治疗与大于 3mm（X 光片）垂直骨质流失相应的大于6mm 的牙周袋部位。Emdogain®还可有效地治疗超过 2mm的非“贯通性”根分叉病变。与仅使用冠向移位翻瓣相比，在衰退性缺损部位使用 Emdogain®可改善牙根覆盖，具有良好的美观效果，角化组织增长和附件再生的潜力。Emdogain®还适用于拔牙区的治疗。Emdogain®可以帮助治疗在牙龈或者口腔黏膜上（比如黏骨膜瓣）由于手术切口造成的干净并未发炎的伤口。Straumann®Emdogain®已被证明可以提高种植体周围炎的手术治疗效果，改善受影响的种植体的临床疗效。将 Emdogain®加入到种植体周围病的补救治疗，可以提高种植体周围黏膜炎的治疗效果。","specialty":"口腔科"},"ja":{"title":"歯周組織再生誘導材料","description":"Emdogain®は、歯周／インプラント周囲手術と併用して局所適用し、歯周／インプラント周囲疾患または外傷により失われた歯周組織を再建する。歯科外科手術の一環として、Straumann® Emdogain®は軟組織創傷の治癒過程にも使用できる。Emdogain®は、X線画像上3 mmを超える垂直性骨喪失に相当する6 mmを超える歯周ポケット部位の治療に有効である。Emdogain®は、2 mmを超える非「貫通性」根分岐部病変にも有効である。歯冠側移動フラップのみの場合と比較して、退縮性欠損部にEmdogain®を使用すると、歯根被覆が改善され、良好な審美的結果、角化組織の増加および付着再生の可能性が得られる。Emdogain®は抜歯部位の治療にも適用される。Emdogain®は、外科的切開によって歯肉または口腔粘膜（粘膜骨膜弁など）に生じた清潔で炎症のない創傷の治療を補助できる。Straumann® Emdogain®は、インプラント周囲炎の外科的治療効果を高め、影響を受けたインプラントの臨床成績を改善することが示されている。インプラント周囲疾患の救済治療にEmdogain®を追加することで、インプラント周囲粘膜炎の治療効果を高めることができる。","specialty":"口腔科"},"en":{"title":"Periodontal Tissue Regeneration Material","description":"Emdogain® is applied locally in conjunction with periodontal/peri-implant surgery to reconstruct periodontal tissue lost due to periodontal/peri-implant disease or trauma. As part of dental surgical procedures, Straumann® Emdogain® can also be used during the healing of soft-tissue wounds. Emdogain® is effective in treating periodontal pockets deeper than 6 mm corresponding to vertical bone loss greater than 3 mm (radiographically). Emdogain® is also effective for non-through-and-through furcation defects exceeding 2 mm. Compared with coronally advanced flap alone, use of Emdogain® in recession defects can improve root coverage, with favorable esthetic outcomes, increased keratinized tissue, and the potential for attachment regeneration. Emdogain® is also indicated for treatment of extraction sites. Emdogain® can help treat clean, non-inflamed wounds of the gingiva or oral mucosa (such as mucoperiosteal flaps) caused by surgical incisions. Straumann® Emdogain® has been shown to improve surgical treatment outcomes for peri-implantitis and the clinical outcomes of affected implants. Adding Emdogain® to remedial treatment for peri-implant disease can improve treatment outcomes for peri-implant mucositis.","specialty":"Dentistry"}}},{"id":457,"category":"device","number":251,"langs":{"zh":{"title":"牙齿表面处理凝胶","description":"Straumann®PrefGel®的预期用途是在牙周手术期间局部用于暴露的牙根表面，用以去除玷污层。Straumann®PrefGel®预期仅与 Straumann® Emdogain®结合使用。已证明，在应用 Straumann®Emdogain®之前使用 PrefGel®可以有效地清除玷污层。此外，还已证明 PrefGel®可以通过选择性地清除矿物质，在暴露且处理后的牙根表面上形成一层胶原纤维网，而这有助于 Straumann®Emdogain®的应用。","specialty":"口腔科"},"ja":{"title":"歯面処理ゲル","description":"Straumann® PrefGel®は、歯周手術中に露出した歯根表面へ局所使用し、スメア層を除去することを目的とする。Straumann® PrefGel®はStraumann® Emdogain®との併用のみを意図している。Straumann® Emdogain®適用前にPrefGel®を使用すると、スメア層を効果的に除去できることが示されている。さらにPrefGel®は、ミネラルを選択的に除去することにより、露出・処理された歯根表面にコラーゲン線維網を形成し、Straumann® Emdogain®の適用を助けることも示されている。","specialty":"口腔科"},"en":{"title":"Tooth Surface Treatment Gel","description":"Straumann® PrefGel® is intended for topical application to exposed root surfaces during periodontal surgery to remove the smear layer. Straumann® PrefGel® is intended for use only in combination with Straumann® Emdogain®. PrefGel® has been shown to effectively remove the smear layer before application of Straumann® Emdogain®. It has also been shown that, by selectively removing minerals, PrefGel® forms a collagen-fiber network on exposed and treated root surfaces, which facilitates application of Straumann® Emdogain®.","specialty":"Dentistry"}}},{"id":458,"category":"device","number":252,"langs":{"zh":{"title":"牙科种植体","description":"牙科种植体用于需部分或完全口腔修复重建的患者。\n在使用前，必须确定患者是否有足够的牙槽骨宽度来支持种植体。\n此外，在植入前应仔细评估与拟定植入部位相关的神经、重要血管、上颌窦和软组织空间。","specialty":"口腔科"},"ja":{"title":"歯科インプラント","description":"歯科インプラントは、口腔の部分的または全面的な修復・再建を必要とする患者に使用する。\n使用前に、インプラントを支持するのに十分な歯槽骨幅があるか確認しなければならない。\nまた、埋入前には予定埋入部位に関連する神経、重要血管、上顎洞および軟組織スペースを慎重に評価する必要がある。","specialty":"口腔科"},"en":{"title":"Dental Implant","description":"Dental implants are intended for patients requiring partial or complete oral restorative reconstruction.\nBefore use, it must be determined whether the patient has sufficient alveolar bone width to support the implant.\nIn addition, nerves, major blood vessels, the maxillary sinus, and soft-tissue spaces associated with the proposed implant site should be carefully evaluated before implantation.","specialty":"Dentistry"}}},{"id":459,"category":"device","number":253,"langs":{"zh":{"title":"高级手术包","description":"适用于需部分或完全口腔修复重建的患者，是一个植入物/假体安装所需仪器和工具的箱子，该套件包含用于骨骼准备的钻头、用于植入物插入的工具和钥匙、用于假体安装的假体钥匙。","specialty":"口腔科"},"ja":{"title":"アドバンスド・サージカルキット","description":"口腔の部分的または全面的な修復・再建を必要とする患者に適用する。インプラント／補綴物の装着に必要な器具・工具を収納したキットで、骨形成用ドリル、インプラント挿入用の器具・キー、補綴物装着用の補綴キーを含む。","specialty":"口腔科"},"en":{"title":"Advanced Surgical Kit","description":"For patients requiring partial or complete oral restorative reconstruction. This is a case containing instruments and tools required for implant/prosthesis installation, including drills for bone preparation, tools and drivers for implant insertion, and prosthetic drivers for prosthesis installation.","specialty":"Dentistry"}}},{"id":460,"category":"device","number":254,"langs":{"zh":{"title":"种植修复器材","description":"种植修复器材用于需部分或完全口腔修复重建的患者。种植修复器被用于牙冠或全修复体连接到牙科种植体。种植修复器材的形状、尺寸和角度因患者的情况而异。种植修复器材位于口腔内，用于连接种植体和牙冠，由钛材料制成。","specialty":"口腔科"},"ja":{"title":"インプラント補綴部材","description":"インプラント補綴部材は、口腔の部分的または全面的な修復・再建を必要とする患者に使用する。クラウンまたは全顎補綴物を歯科インプラントに接続するために使用される。形状、寸法、角度は患者の状態によって異なる。口腔内でインプラントとクラウンを接続するために用いられ、チタン製である。","specialty":"口腔科"},"en":{"title":"Implant Prosthetic Components","description":"Implant prosthetic components are intended for patients requiring partial or complete oral restorative reconstruction. They are used to connect a crown or full restoration to a dental implant. Their shape, size, and angulation vary according to the patient's condition. The components are placed in the oral cavity to connect the implant and crown and are made of titanium.","specialty":"Dentistry"}}},{"id":461,"category":"device","number":255,"langs":{"zh":{"title":"Infinix Universal Composite\nInfinix 通用复合材料","description":"1.后部区域的修复（I类和II类）\n2.前部修复（III、IV类）\n3.V类修复（颈椎龋、牙根龋烂、楔形缺损）\n4.变色前牙贴面\n5.活动牙夹板\n6.臼齿和前臼齿的扩展裂隙密封\n7.修复复合材料/陶瓷贴面\n将QASI颗粒添加到Infinix通用复合材料减少了脱矿，这是龋齿形成过程的一部分。","specialty":"口腔科"},"ja":{"title":"Infinix Universal Composite\nInfinix ユニバーサルコンポジット","description":"1. 臼歯部修復（I級、II級）\n2. 前歯部修復（III級、IV級）\n3. V級修復（歯頸部う蝕、根面う蝕、楔状欠損）\n4. 変色前歯のベニア\n5. 動揺歯の固定\n6. 大臼歯・小臼歯の拡張裂溝封鎖\n7. コンポジット／セラミックベニアの修復\nInfinix Universal CompositeにQASI粒子を添加することで、う蝕形成過程の一部である脱灰を低減する。","specialty":"口腔科"},"en":{"title":"Infinix Universal Composite","description":"1. Posterior restorations (Class I and II)\n2. Anterior restorations (Class III and IV)\n3. Class V restorations (cervical caries, root caries, wedge-shaped defects)\n4. Veneering of discolored anterior teeth\n5. Splinting of mobile teeth\n6. Extended fissure sealing of molars and premolars\n7. Repair of composite/ceramic veneers\nAddition of QASI particles to Infinix Universal Composite reduces demineralization, which is part of the caries-formation process.","specialty":"Dentistry"}}},{"id":462,"category":"device","number":256,"langs":{"zh":{"title":"Infinix Universal Bond\nInfinix通用粘合剂","description":"1)使用光固化复合树脂或复合材料直接修复\n2) 作为间接修复前处理的空腔密封\n3) 治疗过敏性牙齿和/或暴露的牙根表面\n4) 使用光固化复合树脂对由陶瓷、混合陶瓷或复合树脂制成的断裂冠/桥进行口腔内修复\n5) 由陶瓷、混合陶瓷或固化复合树脂制成的假体矫治器的表面处理\n6) 使用轻固化或双固化复合树脂的堆芯构建\n7) 汞合金修复体下的空腔密封\n对于适用范围1、2、3、6和7，该装置显示出抗菌的空腔清洁效果。","specialty":"口腔科"},"ja":{"title":"Infinix Universal Bond\nInfinix ユニバーサルボンド","description":"1) 光重合型コンポジットレジンまたはコンポジット材料を用いた直接修復\n2) 間接修復前処理としての窩洞封鎖\n3) 知覚過敏歯および／または露出根面の治療\n4) セラミック、ハイブリッドセラミックまたはコンポジットレジン製の破折クラウン／ブリッジを、光重合型コンポジットレジンで口腔内修復\n5) セラミック、ハイブリッドセラミックまたは硬化コンポジットレジン製補綴装置の表面処理\n6) 光重合型またはデュアルキュア型コンポジットレジンによる支台築造\n7) アマルガム修復物下の窩洞封鎖\n適用範囲1、2、3、6、7では、本装置は抗菌性の窩洞清掃効果を示す。","specialty":"口腔科"},"en":{"title":"Infinix Universal Bond","description":"1) Direct restorations using light-cured composite resin or composite material\n2) Cavity sealing as pretreatment before indirect restorations\n3) Treatment of hypersensitive teeth and/or exposed root surfaces\n4) Intraoral repair of fractured crowns/bridges made of ceramic, hybrid ceramic, or composite resin using light-cured composite resin\n5) Surface treatment of prosthetic appliances made of ceramic, hybrid ceramic, or cured composite resin\n6) Core build-up using light-cured or dual-cured composite resin\n7) Cavity sealing beneath amalgam restorations\nFor indications 1, 2, 3, 6, and 7, the device demonstrates an antibacterial cavity-cleaning effect.","specialty":"Dentistry"}}},{"id":463,"category":"device","number":257,"langs":{"zh":{"title":"Infinix Flowable Composite\nInfinix 可流动复合材料","description":"1.III类和IV类修复体\n2.修复微创口腔（包括小型无应力咬合修复）\n3.作为直接或间接修复的基底/垫底\n4.修复美学间接修复中的小缺陷\n5.凹坑和裂缝密封剂\n6.阻挡底切\n7.修复树脂和丙烯酸临时材料\n将QASI颗粒添加到Infinix 可流动复合材料减少了脱矿，这是龋齿形成过程的一部分。","specialty":"口腔科"},"ja":{"title":"Infinix Flowable Composite\nInfinix フロアブルコンポジット","description":"1. III級およびIV級修復\n2. 低侵襲修復（小規模な非応力咬合修復を含む）\n3. 直接または間接修復のベース／ライナー\n4. 審美的間接修復における小欠損の修復\n5. 小窩裂溝封鎖材\n6. アンダーカットのブロックアウト\n7. レジンおよびアクリル仮封材料の修復\nInfinix Flowable CompositeにQASI粒子を添加することで、う蝕形成過程の一部である脱灰を低減する。","specialty":"口腔科"},"en":{"title":"Infinix Flowable Composite","description":"1. Class III and IV restorations\n2. Minimally invasive restorations (including small non-stress-bearing occlusal restorations)\n3. Base/liner for direct or indirect restorations\n4. Repair of small defects in esthetic indirect restorations\n5. Pit and fissure sealant\n6. Blocking out undercuts\n7. Repair of resin and acrylic provisional materials\nAddition of QASI particles to Infinix Flowable Composite reduces demineralization, which is part of the caries-formation process.","specialty":"Dentistry"}}},{"id":464,"category":"device","number":258,"langs":{"zh":{"title":"Wirele-X根尖定位仪","description":"Wirele-X根尖定位仪是一种用于根管治疗过程中定位根尖止点和测定工作长度的电子设备，该设备能够在各种条件下（干燥和潮湿）获得正确的结果。\nWirele-X显示屏是一种监控应用程序，它以图形形式在屏幕上显示Wirele-X根尖定位仪的工作进度。","specialty":"口腔科"},"ja":{"title":"Wirele-X 根尖位置測定器","description":"Wirele-X根尖位置測定器は、根管治療中に根尖終点を特定し、作業長を測定するための電子機器であり、乾燥・湿潤を含むさまざまな条件で正確な結果を得ることができる。\nWirele-Xディスプレイは、Wirele-X根尖位置測定器の作業進行状況を画面上にグラフィカルに表示するモニタリングアプリケーションである。","specialty":"口腔科"},"en":{"title":"Wirele-X Apex Locator","description":"The Wirele-X apex locator is an electronic device used during root canal treatment to locate the apical endpoint and determine working length. The device can obtain correct results under various conditions, both dry and moist.\nThe Wirele-X display is a monitoring application that graphically shows the operating progress of the Wirele-X apex locator on screen.","specialty":"Dentistry"}}},{"id":465,"category":"device","number":259,"langs":{"zh":{"title":"Bone growth accelerating device\n（MED）\n牙科愈合帽","description":"MED旨在通过产生长达30天的脉冲电磁场来加速牙科种植体周围的骨形成过程，从而治疗正在进行种植牙植入的患者。\n根据牙医的建议以及MED模型与不同植入品牌的兼容性，MED适用于所有进行种植牙植入的患者。","specialty":"口腔科"},"ja":{"title":"Bone growth accelerating device\n（MED）\n歯科用ヒーリングキャップ","description":"MEDは、最大30日間のパルス電磁場を発生させることにより、歯科インプラント周囲の骨形成を促進し、歯科インプラント埋入中の患者を治療することを目的とする。\n歯科医師の推奨およびMEDモデルと各インプラントブランドとの互換性に基づき、MEDは歯科インプラント埋入を受けるすべての患者に適用できる。","specialty":"口腔科"},"en":{"title":"Bone Growth Accelerating Device\n(MED)\nDental Healing Cap","description":"MED is intended to accelerate bone formation around dental implants by generating a pulsed electromagnetic field for up to 30 days, thereby treating patients undergoing dental implantation.\nBased on the dentist's recommendation and compatibility of the MED model with different implant brands, MED is suitable for all patients undergoing dental implant placement.","specialty":"Dentistry"}}},{"id":466,"category":"device","number":260,"langs":{"zh":{"title":"Treatment Center\n牙科综合治疗台","description":"牙科综合治疗台适用于人类口腔医学以下应用领域中的适用范围：\n●预防性牙科治疗●修复口腔医学●牙周治疗●牙髓拍摄●牙齿修复术●颌骨矫正●外科治疗●牙科治疗的其他应用领域\n本产品可用于诊断和治疗","specialty":"口腔科"},"ja":{"title":"Treatment Center\n歯科総合治療ユニット","description":"歯科総合治療ユニットは、人の口腔医療における以下の分野で使用する：\n●予防歯科 ●修復歯科 ●歯周治療 ●歯内療法撮影 ●歯科修復 ●顎矯正 ●外科治療 ●その他の歯科治療分野\n本製品は診断および治療に使用できる。","specialty":"口腔科"},"en":{"title":"Treatment Center\nDental Treatment Unit","description":"The dental treatment unit is intended for the following fields of human dentistry:\n● Preventive dentistry ● Restorative dentistry ● Periodontal treatment ● Endodontic imaging ● Dental restoration ● Orthodontics ● Surgical treatment ● Other fields of dental treatment\nThis product can be used for diagnosis and treatment.","specialty":"Dentistry"}}},{"id":467,"category":"device","number":261,"langs":{"zh":{"title":"Smartbone® on demand\n四肢重建定制骨","description":"1.牙科手术：水平和垂直牙槽嵴增高;牙槽骨严重萎缩;\n2.颅面外科手术：创伤性、肿瘤性或退行性颅颌面骨缺损;","specialty":"口腔科"},"ja":{"title":"Smartbone® on demand\n四肢再建用カスタム骨","description":"1. 歯科手術：水平・垂直歯槽堤増大、重度歯槽骨萎縮；\n2. 頭蓋顎顔面外科：外傷性、腫瘍性または変性性の頭蓋顎顔面骨欠損；","specialty":"口腔科"},"en":{"title":"Smartbone® on demand\nCustomized Bone for Limb Reconstruction","description":"1. Dental surgery: horizontal and vertical alveolar ridge augmentation; severe alveolar bone atrophy;\n2. Craniofacial surgery: traumatic, neoplastic, or degenerative cranio-maxillofacial bone defects;","specialty":"Dentistry"}}},{"id":468,"category":"device","number":262,"langs":{"zh":{"title":"牙科种植体周治疗系统Dental\nImplant Cleaning System","description":"牙科种植体周治疗系统供牙科人员对患者使用。该系统用于需要去除已植入的、发生骨结合的、导电的牙科种植体上所形成生物膜的患者。该清洁系统用于去除种植体的暴露、非骨结合区域上的生物膜。该清洁系统为牙科人员治疗种植体周围炎和/或种植体周围粘膜炎提供了基本条件。","specialty":"口腔科"},"ja":{"title":"歯科インプラント周囲治療システム Dental Implant Cleaning System","description":"歯科インプラント周囲治療システムは、歯科医療従事者が患者に使用する。本システムは、埋入済みで骨結合した導電性歯科インプラント上に形成されたバイオフィルムの除去を必要とする患者に使用する。洗浄システムは、インプラントの露出した非骨結合領域にあるバイオフィルムを除去する。歯科医療従事者がインプラント周囲炎および／またはインプラント周囲粘膜炎を治療するための基本条件を提供する。","specialty":"口腔科"},"en":{"title":"Dental Implant Cleaning System","description":"The Dental Implant Cleaning System is intended for dental professionals to use on patients. It is intended for patients requiring removal of biofilm formed on implanted, osseointegrated, conductive dental implants. The cleaning system removes biofilm from exposed, non-osseointegrated areas of the implant. It provides the basic conditions for dental professionals to treat peri-implantitis and/or peri-implant mucositis.","specialty":"Dentistry"}}},{"id":469,"category":"device","number":263,"langs":{"zh":{"title":"竖式康复桌（ERIGO PRO）","description":"用于神经病患者和卧床不起的患者的早期功能动员，甚至在重症监护中，增加心血管能力，尤其是在继发性垂直化过程中，通过强烈的感觉运动刺激促进运动恢复，预防由于固定和活动能力丧失引起的并发症（例如血栓形成，肌肉萎缩，挛缩，褥疮），保持或增加运动范围，改善患者警觉性，放松肌肉痉挛，预防或延迟不使用肌萎缩症，增加局部血液循环","specialty":"康复科"},"ja":{"title":"立位型リハビリテーションテーブル（ERIGO PRO）","description":"神経疾患患者や寝たきり患者の早期機能的動員に使用し、集中治療下でも使用できる。心血管能力を高め、特に二次的な立位化の過程で強い感覚運動刺激により運動回復を促進し、固定や移動能力喪失による合併症（血栓形成、筋萎縮、拘縮、褥瘡など）を予防し、関節可動域を維持または拡大し、患者の覚醒度を改善し、筋痙攣を緩和し、廃用性筋萎縮を予防または遅延させ、局所血流を増加させる。","specialty":"リハビリテーション科"},"en":{"title":"Vertical Rehabilitation Table (ERIGO PRO)","description":"For early functional mobilization of neurological and bedridden patients, including in intensive care. It increases cardiovascular capacity, particularly during secondary verticalization, promotes motor recovery through intensive sensorimotor stimulation, prevents complications caused by immobilization and loss of mobility (such as thrombosis, muscle atrophy, contracture, and pressure sores), maintains or increases range of motion, improves patient alertness, relaxes muscle spasm, prevents or delays disuse muscle atrophy, and increases local blood circulation.","specialty":"Rehabilitation Medicine"}}},{"id":470,"category":"device","number":264,"langs":{"zh":{"title":"上肢骨骼训练机器人（ARMEO\nSENSO）","description":"机械化上肢协调运动和生物反馈。\n适用于上肢中度至轻度损伤的患者。\n适用于因神经系统疾病(中风、帕金森病、多发性硬化症、脑瘫、脊髓损伤、创伤性脑损伤、格林-巴利综合征)、创伤(周围神经系统损伤、骨折)、肌肉骨骼疾病(不稳定、疼痛、矫形外科手术)或年龄相关疾病等原因导致上肢功能受损的患者","specialty":"康复科"},"ja":{"title":"上肢骨格訓練ロボット（ARMEO SENSO）","description":"機械化された上肢協調運動とバイオフィードバック。\n上肢に中等度から軽度の障害がある患者に適用する。\n神経疾患（脳卒中、パーキンソン病、多発性硬化症、脳性麻痺、脊髄損傷、外傷性脳損傷、ギラン・バレー症候群）、外傷（末梢神経系損傷、骨折）、筋骨格系疾患（不安定性、疼痛、整形外科手術）、または加齢関連疾患などにより上肢機能が障害された患者に適用する。","specialty":"リハビリテーション科"},"en":{"title":"Upper-Limb Skeletal Training Robot (ARMEO SENSO)","description":"Mechanized upper-limb coordination exercises and biofeedback.\nSuitable for patients with moderate to mild upper-limb impairment.\nSuitable for patients with impaired upper-limb function caused by neurological diseases (stroke, Parkinson's disease, multiple sclerosis, cerebral palsy, spinal cord injury, traumatic brain injury, Guillain-Barré syndrome), trauma (peripheral nervous system injury, fractures), musculoskeletal disorders (instability, pain, orthopedic surgery), or age-related disorders.","specialty":"Rehabilitation Medicine"}}},{"id":471,"category":"device","number":265,"langs":{"zh":{"title":"反重力跑台","description":"通过加压气囊减轻练习者身体承重，避免他们过度使用骨骼关节，使练习者既达到锻炼肌肉的目的，又不至于产生运动伤害。\n用于运动员、老年人下肢骨折术后、中枢神经损伤引起的运动障碍，废用型肌萎缩、平衡功能障碍，关节活动度受限，日常健身等","specialty":"康复科"},"ja":{"title":"反重力トレッドミル","description":"加圧エアバッグによって使用者の体重負荷を軽減し、骨・関節への過剰な負荷を避けながら、筋肉を鍛えつつ運動障害を生じにくくする。\nアスリート、高齢者の下肢骨折術後、中枢神経損傷による運動障害、廃用性筋萎縮、平衡機能障害、関節可動域制限、日常的なフィットネスなどに使用する。","specialty":"リハビリテーション科"},"en":{"title":"Anti-Gravity Treadmill","description":"Reduces body-weight loading through a pressurized air chamber, preventing excessive loading of bones and joints while allowing muscle exercise without causing exercise injury.\nIntended for athletes, elderly patients after lower-limb fracture surgery, movement disorders caused by central nervous system injury, disuse muscle atrophy, balance dysfunction, limited joint range of motion, daily fitness, etc.","specialty":"Rehabilitation Medicine"}}},{"id":472,"category":"device","number":266,"langs":{"zh":{"title":"腹部背部康复仪","description":"具有气体阻力的机械化运动系统，可以自动获取数据结果，主要针对膝关节置换术，膝关节退行性病变，韧带损伤的患者，可以在减重状态下增强肌力训练。\n\n针对腹部、左腹和右腹以及背部肌肉的触屏界面双重功能训练器械\n• 标配范围限制器和等距测试","specialty":"康复科"},"ja":{"title":"腹部・背部リハビリテーション装置","description":"空気抵抗を利用した機械化運動システムで、データ結果を自動取得できる。主に膝関節置換術後、膝関節変性疾患、靱帯損傷の患者を対象とし、免荷状態で筋力訓練を強化できる。\n\n腹部、左腹部・右腹部および背部筋を対象とするタッチスクリーン式デュアルファンクション訓練機器。\n• 可動域リミッターおよび等尺性テストを標準装備。","specialty":"リハビリテーション科"},"en":{"title":"Abdominal/Back Rehabilitation Trainer","description":"A mechanized exercise system with pneumatic resistance that can automatically obtain data results. It is mainly intended for patients after knee replacement, with degenerative knee disease, or ligament injury, and can strengthen muscles under reduced-weight conditions.\n\nDual-function training equipment with a touchscreen interface for the abdominal, left and right oblique, and back muscles.\n• Standard range limiter and isometric testing.","specialty":"Rehabilitation Medicine"}}},{"id":473,"category":"device","number":267,"langs":{"zh":{"title":"腿部伸展/弯曲康复仪","description":"采用独特的气压阻力技术，通过电脑控制气压泵为训练器提供平稳且按照实际运动规律变化的负荷阻力，让肌肉在适合强度下训练，提高力量训练的质量和效果，实现实际运动在器械上的模拟。主要针对上肢、上半身肌群肌力恢复，上肢带关节活动度恢复。","specialty":"康复科"},"ja":{"title":"脚伸展／屈曲リハビリテーション装置","description":"独自の空気圧抵抗技術を採用し、コンピュータ制御の空気ポンプにより、実際の運動パターンに沿って滑らかに変化する負荷抵抗を提供する。筋肉を適切な強度で訓練し、筋力訓練の質と効果を高め、実際の運動を機器上で再現する。主に上肢・上半身筋群の筋力回復および上肢帯関節可動域の回復を対象とする。","specialty":"リハビリテーション科"},"en":{"title":"Leg Extension/Flexion Rehabilitation Trainer","description":"Uses unique pneumatic-resistance technology. A computer-controlled air pump provides smooth load resistance that varies according to actual movement patterns, allowing muscles to train at an appropriate intensity, improving the quality and effectiveness of strength training, and simulating real movement on the equipment. Mainly intended for recovery of upper-limb and upper-body muscle strength and restoration of upper-limb-girdle range of motion.","specialty":"Rehabilitation Medicine"}}},{"id":474,"category":"device","number":268,"langs":{"zh":{"title":"蹬腿康复仪","description":"带触屏界面的训练器械，针对臀大肌、腘绳肌和股四头肌。器材有两个独立的杠杆，可以分别锻炼双腿。标配范围限制器和等距测试","specialty":"康复科"},"ja":{"title":"レッグプレス・リハビリテーション装置","description":"大殿筋、ハムストリングス、大腿四頭筋を対象としたタッチスクリーン式訓練機器。左右独立した2本のレバーを備え、両脚を個別に訓練できる。可動域リミッターと等尺性テストを標準装備。","specialty":"リハビリテーション科"},"en":{"title":"Leg Press Rehabilitation Trainer","description":"Training equipment with a touchscreen interface targeting the gluteus maximus, hamstrings, and quadriceps. The equipment has two independent levers so each leg can be trained separately. Standard range limiter and isometric testing.","specialty":"Rehabilitation Medicine"}}},{"id":475,"category":"device","number":269,"langs":{"zh":{"title":"胸大肌三角肌康复仪","description":"带触屏界面的训练器械，针对上背部和二头肌。有两个独立杠杆臂，可以分别训练双臂","specialty":"康复科"},"ja":{"title":"大胸筋・三角筋リハビリテーション装置","description":"上背部と上腕二頭筋を対象とするタッチスクリーン式訓練機器。左右独立した2本のレバーアームを備え、両腕を個別に訓練できる。","specialty":"リハビリテーション科"},"en":{"title":"Pectoralis/Deltoid Rehabilitation Trainer","description":"Training equipment with a touchscreen interface targeting the upper back and biceps. It has two independent lever arms so both arms can be trained separately.","specialty":"Rehabilitation Medicine"}}},{"id":476,"category":"device","number":270,"langs":{"zh":{"title":"上推/下拉康复仪","description":"具有气体阻力的机械化运动系统，可以自动获取数据结果，主要是用于针对上背部、胸部和肩膀肌肉的带触屏界面双重功能训练器械","specialty":"康复科"},"ja":{"title":"プッシュ／プルダウン・リハビリテーション装置","description":"空気抵抗を利用した機械化運動システムで、データ結果を自動取得できる。主に上背部、胸部、肩部の筋肉を対象とするタッチスクリーン式デュアルファンクション訓練機器である。","specialty":"リハビリテーション科"},"en":{"title":"Push/Pull-Down Rehabilitation Trainer","description":"A mechanized exercise system with pneumatic resistance that can automatically obtain data results. It is mainly a dual-function training device with a touchscreen interface for the upper-back, chest, and shoulder muscles.","specialty":"Rehabilitation Medicine"}}},{"id":477,"category":"device","number":271,"langs":{"zh":{"title":"二头肌、三头肌锻炼仪","description":"具有气体阻力的机械化运动系统和计算机网络管理的可单独编程的协议，可以自动获取数据结果。\n用来锻炼二头肌和三头肌肌肉群的带触屏界面双功能训练器械。有两个独立杠杆臂，可以分别训练双臂","specialty":"康复科"},"ja":{"title":"上腕二頭筋・上腕三頭筋トレーニング装置","description":"空気抵抗を利用した機械化運動システムと、コンピュータネットワーク管理による個別プログラム可能なプロトコルを備え、データ結果を自動取得できる。\n上腕二頭筋・上腕三頭筋群を鍛えるタッチスクリーン式デュアルファンクション訓練機器。左右独立した2本のレバーアームにより両腕を個別に訓練できる。","specialty":"リハビリテーション科"},"en":{"title":"Biceps/Triceps Exercise Trainer","description":"A mechanized exercise system with pneumatic resistance and individually programmable protocols managed through a computer network, capable of automatically obtaining data results.\nA dual-function training device with a touchscreen interface for exercising the biceps and triceps muscle groups. It has two independent lever arms so both arms can be trained separately.","specialty":"Rehabilitation Medicine"}}},{"id":478,"category":"device","number":272,"langs":{"zh":{"title":"可扭转运动仪","description":"可扭转运动仪具有气体阻力的机械化运动系统和计算机网络管理的可单独编程的协议，可以自动获取数据结果;\n针对旋转肌群的训练器械。专为轮椅使用者设计。","specialty":"康复科"},"ja":{"title":"回旋運動装置","description":"回旋運動装置は、空気抵抗を利用した機械化運動システムと、コンピュータネットワーク管理による個別プログラム可能なプロトコルを備え、データ結果を自動取得できる。\n回旋筋群を対象とする訓練機器で、車椅子使用者向けに設計されている。","specialty":"リハビリテーション科"},"en":{"title":"Rotational Exercise Trainer","description":"The rotational exercise trainer uses a mechanized pneumatic-resistance exercise system and individually programmable protocols managed through a computer network, and can automatically obtain data results;\nA training device for rotational muscle groups, specially designed for wheelchair users.","specialty":"Rehabilitation Medicine"}}},{"id":479,"category":"device","number":273,"langs":{"zh":{"title":"内收/外展康复仪","description":"具有气体阻力的机械化运动系统，可以自动获取数据结果，主要是针对下肢损伤后期的肌力的训练，主要通过减重状态下来做髋关节内收外展训练，来加强内收肌群，臀肌，外展肌群的力量训练","specialty":"康复科"},"ja":{"title":"内転／外転リハビリテーション装置","description":"空気抵抗を利用した機械化運動システムで、データ結果を自動取得できる。主に下肢損傷後期の筋力訓練を目的とし、免荷状態で股関節内転・外転訓練を行い、内転筋群、殿筋群、外転筋群の筋力を強化する。","specialty":"リハビリテーション科"},"en":{"title":"Adduction/Abduction Rehabilitation Trainer","description":"A mechanized exercise system with pneumatic resistance that can automatically obtain data results. It is mainly intended for muscle-strength training in the later stages of lower-limb injury, using reduced-weight conditions for hip adduction and abduction training to strengthen the adductors, gluteal muscles, and abductors.","specialty":"Rehabilitation Medicine"}}},{"id":480,"category":"device","number":274,"langs":{"zh":{"title":"功能训练滑轮","description":"采用独特的气压阻力技术，通过电脑控制气压泵为训练器提供平稳且按照实际运动规律变化的负荷阻力，让肌肉在适合强度下训练，提高力量训练的质量和效果，实现实际运动在器械上的模拟。\n主要针对上肢、上半身肌群肌力恢复，上肢带关节活动度恢复。","specialty":"康复科"},"ja":{"title":"ファンクショナルトレーニング・プーリー","description":"独自の空気圧抵抗技術を採用し、コンピュータ制御の空気ポンプにより、実際の運動パターンに沿って滑らかに変化する負荷抵抗を提供する。筋肉を適切な強度で訓練し、筋力訓練の質と効果を高め、実際の運動を機器上で再現する。\n主に上肢・上半身筋群の筋力回復および上肢帯関節可動域の回復を対象とする。","specialty":"リハビリテーション科"},"en":{"title":"Functional Training Pulley","description":"Uses unique pneumatic-resistance technology. A computer-controlled air pump provides smooth load resistance that varies according to actual movement patterns, allowing muscles to train at an appropriate intensity, improving the quality and effectiveness of strength training, and simulating real movement on the equipment.\nMainly intended for recovery of upper-limb and upper-body muscle strength and restoration of upper-limb-girdle range of motion.","specialty":"Rehabilitation Medicine"}}},{"id":481,"category":"device","number":275,"langs":{"zh":{"title":"电动滑轮锻炼凳","description":"目标肌群肌力训练。\n用于下肢、臀大肌、腰背肌肌力训练者","specialty":"康复科"},"ja":{"title":"電動プーリー運動ベンチ","description":"対象筋群の筋力訓練。\n下肢、大殿筋、腰背部筋の筋力訓練を行う者に使用する。","specialty":"リハビリテーション科"},"en":{"title":"Electric Pulley Exercise Bench","description":"Strength training of target muscle groups.\nFor users training the lower limbs, gluteus maximus, and lumbar/back muscles.","specialty":"Rehabilitation Medicine"}}},{"id":482,"category":"device","number":276,"langs":{"zh":{"title":"性能等距测试仪","description":"膝关节肌力测试","specialty":"康复科"},"ja":{"title":"パフォーマンス等尺性テスター","description":"膝関節筋力テスト。","specialty":"リハビリテーション科"},"en":{"title":"Performance Isometric Tester","description":"Knee-joint muscle-strength testing.","specialty":"Rehabilitation Medicine"}}},{"id":483,"category":"device","number":277,"langs":{"zh":{"title":"镜像康复仪","description":"适用于上肢运动神经损伤、脑卒中后一侧肢体偏瘫、创伤后习得性废用、假肢安装术后等。","specialty":"康复科"},"ja":{"title":"ミラーリハビリテーション装置","description":"上肢運動神経損傷、脳卒中後の片側肢体麻痺、外傷後の学習性不使用、義肢装着後などに適用する。","specialty":"リハビリテーション科"},"en":{"title":"Mirror Rehabilitation Device","description":"Suitable for upper-limb motor nerve injury, unilateral limb hemiplegia after stroke, post-traumatic learned non-use, after prosthesis fitting, etc.","specialty":"Rehabilitation Medicine"}}},{"id":484,"category":"device","number":278,"langs":{"zh":{"title":"关节等速康复训练仪","description":"机电运动系统和动态肌肉能力测量。\n等速评估仪主要针对全身关节在各种运动形态下的评估，用于评估肌力，关节活动度的训练，是定量的肌力评估和训练方法","specialty":"康复科"},"ja":{"title":"関節等速リハビリテーション訓練装置","description":"電気機械式運動システムおよび動的筋能力測定。\n等速評価装置は主に全身の関節をさまざまな運動様式で評価し、筋力評価および関節可動域訓練に用いる。定量的な筋力評価・訓練方法である。","specialty":"リハビリテーション科"},"en":{"title":"Joint Isokinetic Rehabilitation Training System","description":"Electromechanical exercise system and dynamic muscle-capacity measurement.\nThe isokinetic assessment system is mainly used to evaluate joints throughout the body under various movement patterns, assess muscle strength and train joint range of motion, providing a quantitative method for muscle-strength assessment and training.","specialty":"Rehabilitation Medicine"}}},{"id":485,"category":"device","number":279,"langs":{"zh":{"title":"脊柱等速康复训练仪","description":"机电运动系统和脊柱动态肌肉能力测量。\n另一类针对脊柱及周围关节的评估，主要运动方式有等速，等张，等距训练，有被动活动，主动活动，以及抗阻运动","specialty":"康复科"},"ja":{"title":"脊柱等速リハビリテーション訓練装置","description":"電気機械式運動システムおよび脊柱の動的筋能力測定。\n脊柱および周辺関節を対象とする別タイプの評価装置で、主な運動方式には等速、等張、等尺性訓練があり、他動運動、自動運動、抵抗運動を行う。","specialty":"リハビリテーション科"},"en":{"title":"Spinal Isokinetic Rehabilitation Training System","description":"Electromechanical exercise system and dynamic measurement of spinal muscle capacity.\nAnother category for assessment of the spine and surrounding joints. Major exercise modes include isokinetic, isotonic, and isometric training, with passive movement, active movement, and resisted exercise.","specialty":"Rehabilitation Medicine"}}},{"id":486,"category":"device","number":280,"langs":{"zh":{"title":"便携式外骨骼康复机器人","description":"针对外骨骼进行步态康复的机电机器人。可为下半身完全或者不完全损伤人士进行康复，它能帮助患者实现基本的行走、爬楼梯及一些特殊的训练动作。该款机器人，有超过 20 种步行模式进行选择，还可以操控。","specialty":"康复科"},"ja":{"title":"携帯型外骨格リハビリテーションロボット","description":"外骨格を用いた歩行リハビリテーション用の電気機械式ロボット。下半身に完全または不完全な障害がある人のリハビリテーションに使用でき、基本的な歩行、階段昇降、特別な訓練動作を補助する。20種類を超える歩行モードを選択でき、操作も可能である。","specialty":"リハビリテーション科"},"en":{"title":"Portable Exoskeleton Rehabilitation Robot","description":"An electromechanical robot for gait rehabilitation using an exoskeleton. It can provide rehabilitation for persons with complete or incomplete lower-body impairment and help patients perform basic walking, stair climbing, and certain special training movements. The robot offers more than 20 selectable walking modes and can also be controlled.","specialty":"Rehabilitation Medicine"}}},{"id":487,"category":"device","number":281,"langs":{"zh":{"title":"膝关节韧带评估测量仪","description":"用于测量膝关节前后松弛度","specialty":"康复科"},"ja":{"title":"膝関節靱帯評価測定器","description":"膝関節の前後方向の弛緩度を測定する。","specialty":"リハビリテーション科"},"en":{"title":"Knee Ligament Assessment Measuring Device","description":"Used to measure anterior-posterior knee laxity.","specialty":"Rehabilitation Medicine"}}},{"id":488,"category":"device","number":282,"langs":{"zh":{"title":"空气波压力治疗仪","description":"用于对人体外周血液和组织施加周期变化的压力，促进并改善血液循环","specialty":"康复科"},"ja":{"title":"空気圧波圧迫治療器","description":"人体の末梢血管および組織に周期的に変化する圧力を加え、血液循環を促進・改善する。","specialty":"リハビリテーション科"},"en":{"title":"Intermittent Pneumatic Compression Therapy Device","description":"Applies cyclically varying pressure to peripheral blood vessels and tissues of the body to promote and improve blood circulation.","specialty":"Rehabilitation Medicine"}}},{"id":489,"category":"device","number":283,"langs":{"zh":{"title":"运动分析仪","description":"微结构运动参数测量","specialty":"康复科"},"ja":{"title":"運動解析装置","description":"微細構造の運動パラメータを測定する。","specialty":"リハビリテーション科"},"en":{"title":"Motion Analyzer","description":"Measurement of microstructural motion parameters.","specialty":"Rehabilitation Medicine"}}},{"id":490,"category":"device","number":284,"langs":{"zh":{"title":"理疗仪","description":"利用电极低频电流和温热作用于人体的方式缓解肌肉疼痛","specialty":"康复科"},"ja":{"title":"理学療法装置","description":"電極による低周波電流と温熱を人体に作用させ、筋肉痛を緩和する。","specialty":"リハビリテーション科"},"en":{"title":"Physiotherapy Device","description":"Relieves muscle pain by applying low-frequency electrical current through electrodes and heat to the body.","specialty":"Rehabilitation Medicine"}}},{"id":491,"category":"device","number":285,"langs":{"zh":{"title":"高频短波治疗仪","description":"适用于胸腔、腹腔、盆腔等深部组织的亚急性、慢性炎症如慢性前列腺炎、良性前列腺增生、盆腔炎等疾病的治疗","specialty":"康复科"},"ja":{"title":"高周波短波治療器","description":"胸腔、腹腔、骨盤腔などの深部組織における亜急性・慢性炎症、例えば慢性前立腺炎、良性前立腺肥大、骨盤内炎症性疾患などの治療に適用する。","specialty":"リハビリテーション科"},"en":{"title":"High-Frequency Shortwave Therapy Device","description":"Suitable for treatment of subacute and chronic inflammation of deep tissues in the thoracic, abdominal, and pelvic cavities, such as chronic prostatitis, benign prostatic hyperplasia, and pelvic inflammatory disease.","specialty":"Rehabilitation Medicine"}}},{"id":492,"category":"device","number":286,"langs":{"zh":{"title":"盆底肌治疗仪","description":"适用于产后盆底功能康复，压力性尿失禁（含产后压力性尿失禁），轻度盆腔器官脱垂的治疗，慢性盆腔疼痛的缓解，增强阴道收缩功能，改善盆底肌松弛和肌肉健康状态，刺激细胞恢复功能，提高局部机能，促进产后阴道复旧","specialty":"康复科"},"ja":{"title":"骨盤底筋治療器","description":"産後の骨盤底機能リハビリテーション、腹圧性尿失禁（産後腹圧性尿失禁を含む）、軽度骨盤臓器脱の治療、慢性骨盤痛の緩和、膣収縮機能の増強、骨盤底筋の弛緩および筋健康状態の改善、細胞機能回復の刺激、局所機能の向上、産後膣復古の促進に適用する。","specialty":"リハビリテーション科"},"en":{"title":"Pelvic Floor Muscle Therapy Device","description":"Suitable for postpartum pelvic-floor rehabilitation; treatment of stress urinary incontinence (including postpartum stress urinary incontinence) and mild pelvic-organ prolapse; relief of chronic pelvic pain; enhancement of vaginal contraction; improvement of pelvic-floor muscle laxity and muscle health; stimulation of cellular functional recovery; improvement of local function; and promotion of postpartum vaginal recovery.","specialty":"Rehabilitation Medicine"}}},{"id":493,"category":"device","number":287,"langs":{"zh":{"title":"平衡和姿势训练仪","description":"N/A","specialty":"康复科"},"ja":{"title":"バランス・姿勢訓練装置","description":"N/A","specialty":"リハビリテーション科"},"en":{"title":"Balance and Posture Training Device","description":"N/A","specialty":"Rehabilitation Medicine"}}},{"id":494,"category":"device","number":288,"langs":{"zh":{"title":"低温理疗箱","description":"一种临床上用于化疗后护发或是作为头部局部降温的低温理疗仪","specialty":"康复科"},"ja":{"title":"低温理学療法ボックス","description":"化学療法後の毛髪保護、または頭部の局所冷却に臨床使用される低温理学療法装置。","specialty":"リハビリテーション科"},"en":{"title":"Low-Temperature Therapy Chamber","description":"A low-temperature physiotherapy device used clinically for hair preservation after chemotherapy or for localized cooling of the head.","specialty":"Rehabilitation Medicine"}}},{"id":495,"category":"device","number":289,"langs":{"zh":{"title":"多功能理疗台","description":"设置了血压测量仪,能够及时的测出患者的血压,为医护人员节约了为患者治疗的时间,让医生为患者治疗更方便快捷,也设置了万向自锁轮,为行动不便的患者提供了便利,避免了因不能移动治疗台,医护人员拿医疗器具跑来跑去的问题,多功能治疗台,可以让患者更舒心,医护人员更省心","specialty":"康复科"},"ja":{"title":"多機能治療台","description":"血圧測定器を備え、患者の血圧を迅速に測定でき、医療従事者の治療時間を節約し、治療をより便利かつ迅速にする。また、自在式セルフロックキャスターを備え、移動が困難な患者の利便性を高め、治療台を移動できないために医療従事者が器具を持って往復する問題を避ける。多機能治療台により、患者はより快適に、医療従事者はより効率的に対応できる。","specialty":"リハビリテーション科"},"en":{"title":"Multifunctional Treatment Table","description":"Equipped with a blood-pressure monitor for timely measurement of patient blood pressure, saving treatment time for medical staff and making treatment more convenient. It is also equipped with universal self-locking casters, providing convenience for patients with limited mobility and avoiding the need for staff to carry medical instruments back and forth because the treatment table cannot be moved. The multifunctional treatment table can make patients more comfortable and medical staff more efficient.","specialty":"Rehabilitation Medicine"}}},{"id":496,"category":"device","number":290,"langs":{"zh":{"title":"鲍巴斯操作台","description":"N/A","specialty":"康复科"},"ja":{"title":"ボバース訓練台","description":"N/A","specialty":"リハビリテーション科"},"en":{"title":"Bobath Treatment Table","description":"N/A","specialty":"Rehabilitation Medicine"}}},{"id":497,"category":"device","number":291,"langs":{"zh":{"title":"负压治疗舱","description":"改变了以往拔罐的局限性。治疗方面能对风湿，类风湿以及风寒湿毒风邪引起的各种疑难杂症，慢性支气管炎等彻底治愈。","specialty":"康复科"},"ja":{"title":"陰圧治療チャンバー","description":"従来の吸い玉療法の限界を変えた。治療面では、リウマチ、関節リウマチ、および風寒湿毒・風邪による各種難治性疾患、慢性気管支炎などを完全に治癒できる。","specialty":"リハビリテーション科"},"en":{"title":"Negative-Pressure Therapy Chamber","description":"Overcomes the limitations of conventional cupping. In treatment, it can completely cure rheumatism, rheumatoid arthritis, various difficult and miscellaneous diseases caused by wind-cold-dampness-toxin and pathogenic wind, chronic bronchitis, etc.","specialty":"Rehabilitation Medicine"}}},{"id":498,"category":"device","number":292,"langs":{"zh":{"title":"卧式康复功率车","description":"计算机控制的医疗测力计。在肺功能康复训练的过程中，结合病人佩戴的心电监测仪以及指夹式血氧检测器监测病人运动过程中的生命体征，让病人以60-70m/s的速度进行，及时根据病人的心率，血氧，主观感受进行强度的调整，提升病人肺康复疗效和对病人康复过程的安全进行监测\n适用人群：COPD，支气管感染，肺气肿等肺功能障碍人群","specialty":"康复科"},"ja":{"title":"リカンベント型リハビリテーション・エルゴメーター","description":"コンピュータ制御の医療用エルゴメーター。肺機能リハビリテーション訓練中、患者が装着する心電図モニターと指先型パルスオキシメータを併用して運動中のバイタルサインを監視し、患者を60～70 m/sの速度で運動させ、心拍数、血中酸素、主観的感覚に応じて適宜強度を調整することで、肺リハビリテーション効果を高め、リハビリテーション過程の安全性を監視する。\n適用対象：COPD、気管支感染、肺気腫などの肺機能障害を有する人。","specialty":"リハビリテーション科"},"en":{"title":"Recumbent Rehabilitation Ergometer","description":"A computer-controlled medical ergometer. During pulmonary rehabilitation training, the patient's vital signs are monitored using a worn ECG monitor and fingertip pulse oximeter. The patient exercises at a speed of 60-70 m/s, and intensity is adjusted promptly based on heart rate, blood oxygen, and subjective sensation to improve pulmonary rehabilitation efficacy and monitor safety during rehabilitation.\nApplicable population: people with pulmonary dysfunction such as COPD, bronchial infection, and emphysema.","specialty":"Rehabilitation Medicine"}}},{"id":499,"category":"device","number":293,"langs":{"zh":{"title":"上肢康复功率车","description":"ERGOLINE 系列康复功率车适用于运动测试、心脏病和心血管患者的康复。","specialty":"康复科"},"ja":{"title":"上肢リハビリテーション・エルゴメーター","description":"ERGOLINEシリーズのリハビリテーション・エルゴメーターは、運動負荷試験および心疾患・心血管疾患患者のリハビリテーションに適用する。","specialty":"リハビリテーション科"},"en":{"title":"Upper-Limb Rehabilitation Ergometer","description":"ERGOLINE rehabilitation ergometers are suitable for exercise testing and rehabilitation of patients with heart disease and cardiovascular disease.","specialty":"Rehabilitation Medicine"}}},{"id":500,"category":"device","number":294,"langs":{"zh":{"title":"竖式康复功率车","description":"ERGOLINE 系列康复功率车适用于运动测试、心脏病和心血管患者的康复。","specialty":"康复科"},"ja":{"title":"立位型リハビリテーション・エルゴメーター","description":"ERGOLINEシリーズのリハビリテーション・エルゴメーターは、運動負荷試験および心疾患・心血管疾患患者のリハビリテーションに適用する。","specialty":"リハビリテーション科"},"en":{"title":"Upright Rehabilitation Ergometer","description":"ERGOLINE rehabilitation ergometers are suitable for exercise testing and rehabilitation of patients with heart disease and cardiovascular disease.","specialty":"Rehabilitation Medicine"}}},{"id":501,"category":"device","number":295,"langs":{"zh":{"title":"康复跑台","description":"康复跑台主要用于耐力训练、休闲健身训练和步态训练。结合外部设备，康复跑台也可作为肌电图(EMG)和心电图测量、心肺功能测试以及通过压力测试诊断和预后心血管疾病的负荷设备。将康复跑台与外部设备相结合,可构建套医用电气系统。","specialty":"康复科"},"ja":{"title":"リハビリテーション・トレッドミル","description":"リハビリテーション・トレッドミルは主に持久力訓練、レクリエーションフィットネス訓練、歩行訓練に使用する。外部機器と組み合わせることで、筋電図（EMG）・心電図測定、心肺機能検査、負荷試験による心血管疾患の診断・予後評価に用いる負荷装置としても使用できる。外部機器と組み合わせることで、医用電気システムを構成できる。","specialty":"リハビリテーション科"},"en":{"title":"Rehabilitation Treadmill","description":"The rehabilitation treadmill is mainly used for endurance training, recreational fitness training, and gait training. In combination with external equipment, it can also serve as a load device for electromyography (EMG) and electrocardiography me
