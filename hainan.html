釈する。一般医、小児科医、呼吸器科医および関連スタッフが診療所または病院で使用する。","specialty":"呼吸器内科"},"en":{"title":"Ambulatory Lung Diagnosis System\nPortable Pulmonary Function Diagnostic System","description":"Used to measure forced vital capacity parameters and oscillatory airway resistance in patients aged 2 years and older. These data, together with the patient's medical history, are used to interpret the physiological status of spontaneously breathing patients. Intended for use by general practitioners, pediatricians, pulmonologists, and related staff in clinics or hospitals.","specialty":"Respiratory Medicine"}}},{"id":513,"category":"device","number":307,"langs":{"zh":{"title":"Actis 髋关节组件 (ACTIS DuoFix\nHip Prosthesis)","description":"适用于全髋关节置换","specialty":"骨科"},"ja":{"title":"Actis 股関節コンポーネント (ACTIS DuoFix Hip Prosthesis)","description":"人工股関節全置換術に適用する。","specialty":"整形外科"},"en":{"title":"Actis Hip Component (ACTIS DuoFix Hip Prosthesis)","description":"Indicated for total hip replacement.","specialty":"Orthopedics"}}},{"id":514,"category":"device","number":308,"langs":{"zh":{"title":"单半径全膝关节系统（Triathlon\nTritanium Knee System）","description":"用于膝关节置换","specialty":"骨科"},"ja":{"title":"単一半径人工膝関節システム（Triathlon Tritanium Knee System）","description":"膝関節置換に使用する。","specialty":"整形外科"},"en":{"title":"Single-Radius Total Knee System (Triathlon Tritanium Knee System)","description":"For knee replacement.","specialty":"Orthopedics"}}},{"id":515,"category":"device","number":309,"langs":{"zh":{"title":"骨性关节炎注射凝胶\n（Regenogel）","description":"适用于所有遭受关节疼痛、骨关节炎或其他退行性关节疾病(在膝，髋，踝，肩，手指，脚趾等部位)的病人","specialty":"骨科"},"ja":{"title":"変形性関節症用注入ゲル（Regenogel）","description":"膝、股関節、足関節、肩、手指、足趾などにおける関節痛、変形性関節症またはその他の変性性関節疾患を有するすべての患者に適用する。","specialty":"整形外科"},"en":{"title":"Osteoarthritis Injectable Gel (Regenogel)","description":"Suitable for all patients suffering from joint pain, osteoarthritis, or other degenerative joint diseases involving the knee, hip, ankle, shoulder, fingers, toes, etc.","specialty":"Orthopedics"}}},{"id":516,"category":"device","number":310,"langs":{"zh":{"title":"富血小板血浆透明质酸钠复合溶液制备用套装","description":"产品制备后用于膝关节内注射，可治疗关节疼痛和改善功能。","specialty":"骨科"},"ja":{"title":"多血小板血漿・ヒアルロン酸ナトリウム複合溶液調製キット","description":"調製後、膝関節内注射に使用し、関節痛を治療して機能を改善する。","specialty":"整形外科"},"en":{"title":"Kit for Preparing Platelet-Rich Plasma/Sodium Hyaluronate Composite Solution","description":"After preparation, the product is used for intra-articular injection into the knee to treat joint pain and improve function.","specialty":"Orthopedics"}}},{"id":517,"category":"device","number":311,"langs":{"zh":{"title":"富血小板血浆透明质酸钠复合溶液制备用套装","description":"产品制备后用于膝关节内注射，可治疗关节疼痛和改善功能。","specialty":"骨科"},"ja":{"title":"多血小板血漿・ヒアルロン酸ナトリウム複合溶液調製キット","description":"調製後、膝関節内注射に使用し、関節痛を治療して機能を改善する。","specialty":"整形外科"},"en":{"title":"Kit for Preparing Platelet-Rich Plasma/Sodium Hyaluronate Composite Solution","description":"After preparation, the product is used for intra-articular injection into the knee to treat joint pain and improve function.","specialty":"Orthopedics"}}},{"id":518,"category":"device","number":312,"langs":{"zh":{"title":"颈椎椎间融合器\nZSFab Cervical Interbody System","description":"颈椎椎间融合器适用于至少经过了六周非手术治疗的骨骼成熟患者的前路椎间融合术；颈椎椎间融合器适用于治疗颈椎间盘影像学研究（X 光片、CT、MRI）证实的由于来自 C2-T1 多个连续节段的神经根病、脊髓病和/或疼痛带来的变性和/或颈椎不稳定。颈椎椎间融合器设计需要由松质骨和/或皮质松质骨组成的自体和/或同种异体骨骨移植材料来促进骨融合，并需要与审批通过的颈椎辅助内固定装置一起使用。","specialty":"骨科"},"ja":{"title":"頸椎椎間融合ケージ\nZSFab Cervical Interbody System","description":"頸椎椎間融合ケージは、少なくとも6週間の非手術治療を受けた骨格成熟患者の前方椎体間固定術に適用する。頸椎椎間板の画像検査（X線、CT、MRI）で確認された、C2～T1の複数連続椎間レベルに由来する神経根症、脊髄症および／または疼痛による変性および／または頸椎不安定性の治療に適用する。骨癒合を促進するため、海綿骨および／または皮質海綿骨からなる自家骨および／または同種骨移植材を必要とし、承認済みの頸椎補助内固定装置と併用する必要がある。","specialty":"整形外科"},"en":{"title":"Cervical Interbody Fusion Cage\nZSFab Cervical Interbody System","description":"The cervical interbody fusion cage is indicated for anterior interbody fusion in skeletally mature patients who have undergone at least six weeks of non-surgical treatment. It is indicated for treatment of degeneration and/or cervical instability caused by radiculopathy, myelopathy, and/or pain from multiple contiguous C2-T1 levels, as confirmed by cervical-disc imaging studies (X-ray, CT, MRI). The cervical interbody fusion cage is designed to require autograft and/or allograft bone graft material consisting of cancellous bone and/or corticocancellous bone to promote fusion and must be used with an approved supplemental cervical internal fixation device.","specialty":"Orthopedics"}}},{"id":519,"category":"device","number":313,"langs":{"zh":{"title":"Smartbone® on demand\n四肢重建定制骨","description":"骨科手术：因创伤性损失和缺损的骨体积重建；因手术切除肿瘤或退行性病变导致的骨缺损；关节置换翻修手术中的大量骨缺失。","specialty":"骨科"},"ja":{"title":"Smartbone® on demand\n四肢再建用カスタム骨","description":"整形外科手術：外傷による骨量喪失・欠損の再建、腫瘍または変性病変の外科的切除による骨欠損、人工関節再置換術における大量骨欠損。","specialty":"整形外科"},"en":{"title":"Smartbone® on demand\nCustomized Bone for Limb Reconstruction","description":"Orthopedic surgery: reconstruction of bone volume lost or deficient due to trauma; bone defects caused by surgical resection of tumors or degenerative lesions; massive bone loss in revision joint arthroplasty.","specialty":"Orthopedics"}}},{"id":520,"category":"device","number":314,"langs":{"zh":{"title":"Marrow Cellution Bone Marrow\nAspiration Needle\n骨髓抽吸针","description":"骨髓抽吸针适用于使用标准活塞注射器抽吸骨髓或自体血液。","specialty":"骨科"},"ja":{"title":"Marrow Cellution Bone Marrow Aspiration Needle\n骨髄穿刺吸引針","description":"標準的なプランジャー式シリンジを使用して骨髄または自家血液を吸引するために使用する。","specialty":"整形外科"},"en":{"title":"Marrow Cellution Bone Marrow Aspiration Needle","description":"The bone marrow aspiration needle is intended for aspiration of bone marrow or autologous blood using a standard plunger syringe.","specialty":"Orthopedics"}}},{"id":521,"category":"device","number":315,"langs":{"zh":{"title":"Hyalofast\n透明质酸软骨修复支架","description":"Hyalofast是一种可生物降解的支持物，用于包埋间充质干细胞，修复软骨或骨软骨损伤。","specialty":"骨科"},"ja":{"title":"Hyalofast\nヒアルロン酸軟骨修復スキャフォールド","description":"Hyalofastは、間葉系幹細胞を包埋して軟骨または骨軟骨損傷を修復するための生分解性支持体である。","specialty":"整形外科"},"en":{"title":"Hyalofast\nHyaluronic Acid Cartilage Repair Scaffold","description":"Hyalofast is a biodegradable support used to embed mesenchymal stem cells for repair of cartilage or osteochondral lesions.","specialty":"Orthopedics"}}},{"id":522,"category":"device","number":316,"langs":{"zh":{"title":"Limfa 低频磁疗装置Limfa Therapy","description":"LIMFA THERAPY 是一种用于磁疗的医疗设备，用于治疗骨关节和肌肉骨骼病变，可用于急性期和慢性期。\nLIMFA THERAPY 磁场产生的生物效应包括：抗炎作用、镇痛作用、抗水肿效果、结缔组织修复、骨组织修复、神经肌肉组织修复、肌肉松弛作用。","specialty":"骨科"},"ja":{"title":"Limfa 低周波磁気治療装置 Limfa Therapy","description":"LIMFA THERAPYは磁気治療用の医療機器で、骨関節および筋骨格系病変の治療に使用し、急性期・慢性期の双方で使用できる。\nLIMFA THERAPYの磁場が生じる生物学的効果には、抗炎症作用、鎮痛作用、抗浮腫効果、結合組織修復、骨組織修復、神経筋組織修復、筋弛緩作用が含まれる。","specialty":"整形外科"},"en":{"title":"Limfa Low-Frequency Magnetic Therapy Device / Limfa Therapy","description":"LIMFA THERAPY is a medical device for magnetic therapy used to treat osteoarticular and musculoskeletal disorders in both acute and chronic phases.\nThe biological effects produced by the LIMFA THERAPY magnetic field include anti-inflammatory effects, analgesic effects, anti-edema effects, connective-tissue repair, bone-tissue repair, neuromuscular-tissue repair, and muscle relaxation.","specialty":"Orthopedics"}}},{"id":523,"category":"device","number":317,"langs":{"zh":{"title":"自体血小板血浆富集器和自体蛋白富集器系统（GPSIII、GPSIII Mini、nStride）","description":"本产品预期用于在患者治疗期间，采用少量患者血样安全快速地制备自体富血小板血浆（PRP）。当临床应用要求认为有必要时，可以在PRP应用于骨科手术部位前将其与自体移植骨和异体移植骨混合","specialty":"骨科"},"ja":{"title":"自家多血小板血漿濃縮器・自家タンパク濃縮器システム（GPSIII、GPSIII Mini、nStride）","description":"患者治療中に少量の患者血液サンプルを用いて、自家多血小板血漿（PRP）を安全かつ迅速に調製することを目的とする。臨床応用上必要と判断された場合、PRPを整形外科手術部位に適用する前に、自家骨移植材および同種骨移植材と混合できる。","specialty":"整形外科"},"en":{"title":"Autologous Platelet-Rich Plasma Concentrator and Autologous Protein Concentrator System (GPSIII, GPSIII Mini, nStride)","description":"This product is intended to safely and rapidly prepare autologous platelet-rich plasma (PRP) from a small sample of the patient's blood during treatment. When deemed necessary for clinical use, the PRP may be mixed with autograft and allograft bone before application to an orthopedic surgical site.","specialty":"Orthopedics"}}},{"id":524,"category":"device","number":318,"langs":{"zh":{"title":"自体脂肪微颗粒处理装置LIPOGEMS\nPROCESS DEVICE","description":"LIPOGEMS 系统是一种无菌医疗器械，用于在医疗程序中封闭式处理脂肪组织提取物，这些医疗程序包括通过合法销售的抽脂系统进行自体脂肪的获取、聚集和转移。该器械用于需要转移所获取脂肪组织的以下医疗专业:骨外科、关节镜手术、神经外科、肠胃及附件器官手术、泌尿外科、普通外科、妇科手术、胸外科、腹腔镜手术，以及需要美化身体曲线的整形外科。仅限市场上合法销售的辅助物品才能与本系统配合使用，如注射器。如果获取的脂肪要转移，则其只能在没有进行任何额外处理的情况下使用。(本次拟申请骨科相关疾病)","specialty":"骨科"},"ja":{"title":"自家脂肪微細粒子処理装置 LIPOGEMS PROCESS DEVICE","description":"LIPOGEMSシステムは無菌医療機器であり、合法的に販売されている脂肪吸引システムを用いた自家脂肪の採取、集積、移植を含む医療手技において、脂肪組織抽出物を閉鎖系で処理するために使用する。採取した脂肪組織の移植を必要とする以下の診療分野で使用する：整形外科、関節鏡手術、脳神経外科、消化管および付属臓器手術、泌尿器科、一般外科、婦人科手術、胸部外科、腹腔鏡手術、ならびに身体輪郭の美容改善を必要とする形成外科。本システムには、シリンジなど合法的に市販されている補助品のみを併用できる。採取脂肪を移植する場合、追加処理を行わずに使用しなければならない。（今回の申請は整形外科関連疾患を対象とする。）","specialty":"整形外科"},"en":{"title":"Autologous Micro-Fragmented Adipose Tissue Processing Device\nLIPOGEMS PROCESS DEVICE","description":"The LIPOGEMS system is a sterile medical device for closed processing of adipose-tissue extracts during medical procedures involving harvesting, concentration, and transfer of autologous adipose tissue using legally marketed liposuction systems. The device is intended for the following medical specialties where transfer of harvested adipose tissue is required: orthopedic surgery, arthroscopic surgery, neurosurgery, gastrointestinal and accessory-organ surgery, urology, general surgery, gynecologic surgery, thoracic surgery, laparoscopic surgery, and plastic surgery requiring body-contour enhancement. Only legally marketed accessories, such as syringes, may be used with the system. If harvested adipose tissue is transferred, it may only be used without any additional processing. (The present application is intended for orthopedic-related diseases.)","specialty":"Orthopedics"}}},{"id":525,"category":"device","number":319,"langs":{"zh":{"title":"自体脂肪及自体血管基质组分(SVF)制备装置\nMICROLYZER SMART SVF KIT","description":"用于乳化脂肪组织，从脂肪组织中获得基质血管组分(SVF)，关节内注射辅助修复受损关节组织;辅助治疗韧带和肌肉组织的损伤。","specialty":"骨科"},"ja":{"title":"自家脂肪および自家間質血管細胞群（SVF）調製装置\nMICROLYZER SMART SVF KIT","description":"脂肪組織を乳化し、脂肪組織から間質血管細胞群（SVF）を取得するために使用する。関節内注射により損傷した関節組織の修復を補助し、靱帯・筋組織損傷の補助治療に用いる。","specialty":"整形外科"},"en":{"title":"Autologous Adipose Tissue and Stromal Vascular Fraction (SVF) Preparation Device\nMICROLYZER SMART SVF KIT","description":"Used to emulsify adipose tissue and obtain stromal vascular fraction (SVF) from adipose tissue; for intra-articular injection to assist repair of damaged joint tissue and as adjunctive treatment for ligament and muscle-tissue injuries.","specialty":"Orthopedics"}}},{"id":526,"category":"device","number":320,"langs":{"zh":{"title":"超声引导松解刀套件(扳机状指)Trigger Finger Sono\nInstruments","description":"本套件为一次性使用医疗器械，用于超声引导下的手部微创手术。\n超声引导松解刀适用于成人常见的上肢疾患:\n扳机状指/拇指(经皮松解环形滑车，特别是A1滑车，可伴有或不伴有相邻的腱鞘囊肿)。","specialty":"骨科"},"ja":{"title":"超音波ガイド下リリースナイフキット（ばね指）Trigger Finger Sono Instruments","description":"本キットは、超音波ガイド下の低侵襲手外科手術に用いる単回使用医療機器である。\n超音波ガイド下リリースナイフは、成人に多い上肢疾患に適用する：\nばね指／ばね母指（輪状滑車、特にA1滑車の経皮的切離。隣接する腱鞘嚢腫を伴う場合・伴わない場合の双方を含む）。","specialty":"整形外科"},"en":{"title":"Ultrasound-Guided Release Knife Kit (Trigger Finger)\nTrigger Finger Sono Instruments","description":"This kit is a single-use medical device for minimally invasive hand surgery under ultrasound guidance.\nThe ultrasound-guided release knife is indicated for common upper-limb disorders in adults:\nTrigger finger/thumb (percutaneous release of the annular pulley, especially the A1 pulley, with or without an adjacent tendon-sheath cyst).","specialty":"Orthopedics"}}},{"id":527,"category":"device","number":321,"langs":{"zh":{"title":"超声引导松解刀套件(腕管)Carpal\nTunnelSono Instruments","description":"本套件为一次性使用医疗器械，用于超声引导下的手部微创手术。\n超声引导松解刀适用于成人常见的上肢疾患:腕管综合征(经皮松解腕横韧带或屈肌支持带)。","specialty":"骨科"},"ja":{"title":"超音波ガイド下リリースナイフキット（手根管）Carpal Tunnel Sono Instruments","description":"本キットは、超音波ガイド下の低侵襲手外科手術に用いる単回使用医療機器である。\n超音波ガイド下リリースナイフは、成人に多い上肢疾患である手根管症候群（横手根靱帯または屈筋支帯の経皮的切離）に適用する。","specialty":"整形外科"},"en":{"title":"Ultrasound-Guided Release Knife Kit (Carpal Tunnel)\nCarpal Tunnel Sono Instruments","description":"This kit is a single-use medical device for minimally invasive hand surgery under ultrasound guidance.\nThe ultrasound-guided release knife is indicated for a common upper-limb disorder in adults: carpal tunnel syndrome (percutaneous release of the transverse carpal ligament or flexor retinaculum).","specialty":"Orthopedics"}}},{"id":528,"category":"device","number":322,"langs":{"zh":{"title":"骨修复材料Osteopore aXOpore\nOTO","description":"aXOpore®OTO是一种骨修复材料，适用于填充非骨结构固有稳定性所致的骨缺损或间隙。这些缺损可能是手术造成的骨缺损，也可能是创伤性骨损伤造成的骨缺损。aXOpore®OTO适用于填充骨骼系统（四肢和骨盆）的骨缺损或间隙。aXOpore® OTO可直接使用，也可与血液或骨髓抽吸物混合后使用。aXOpore® OTO由PCL-TCP（聚己内酯+磷酸三钙）制成，在愈合过程中会被吸收并被宿主骨组织替代。","specialty":"骨科"},"ja":{"title":"骨修復材料 Osteopore aXOpore OTO","description":"aXOpore® OTOは、骨構造そのものの安定性に本質的ではない骨欠損または空隙を充填するための骨修復材料である。欠損は外科的に形成されたもの、または外傷性骨損傷によるものがある。aXOpore® OTOは、骨格系（四肢および骨盤）の骨欠損または空隙の充填に適用する。直接使用することも、血液または骨髄穿刺液と混合して使用することもできる。PCL-TCP（ポリカプロラクトン＋リン酸三カルシウム）からなり、治癒過程で吸収され、宿主骨組織に置換される。","specialty":"整形外科"},"en":{"title":"Bone Repair Material Osteopore aXOpore OTO","description":"aXOpore® OTO is a bone repair material indicated for filling bone defects or voids that are not intrinsic to the structural stability of bone. These defects may be surgically created or caused by traumatic bone injury. aXOpore® OTO is indicated for filling bone defects or voids in the skeletal system (limbs and pelvis). aXOpore® OTO may be used directly or mixed with blood or bone-marrow aspirate. It is made of PCL-TCP (polycaprolactone + tricalcium phosphate), is absorbed during healing, and is replaced by host bone tissue.","specialty":"Orthopedics"}}},{"id":529,"category":"device","number":323,"langs":{"zh":{"title":"光能消融导管套件（PLDD Kit）","description":"PLDD Kit 可用于治疗腰椎、胸椎和颈椎的局限性椎间盘突出，继发性椎间孔狭窄(I 期和II期)，以及慢性关节综合征和骶髂大关节综合征。","specialty":"骨科"},"ja":{"title":"光エネルギーアブレーションカテーテルキット（PLDD Kit）","description":"PLDD Kitは、腰椎、胸椎、頸椎の限局性椎間板ヘルニア、二次性椎間孔狭窄（I期・II期）、慢性椎間関節症候群および仙腸大関節症候群の治療に使用できる。","specialty":"整形外科"},"en":{"title":"Photonic Ablation Catheter Kit (PLDD Kit)","description":"PLDD Kit may be used to treat localized lumbar, thoracic, and cervical disc herniation, secondary foraminal stenosis (stage I and II), chronic facet joint syndrome, and sacroiliac major-joint syndrome.","specialty":"Orthopedics"}}},{"id":530,"category":"device","number":324,"langs":{"zh":{"title":"半导体激光治疗仪（Leonardo）","description":"Leonardo 是一种用于组织治疗的医用激光设备，它通过医用光纤提供激光，用于外科手术过程中应用部位的切开、切除、汽化、消融、止血或凝固。\n本次申报仅用于骨科适应症：局限性腰椎间盘突出、局限性颈椎间盘突出、局限性胸椎间盘突出、椎间盘源性疼痛、腰椎管狭窄、骶髂关节去神经术等。","specialty":"骨科"},"ja":{"title":"半導体レーザー治療器（Leonardo）","description":"Leonardoは組織治療用医療レーザー装置であり、医療用光ファイバーを介してレーザーを供給し、外科手術中の適用部位で切開、切除、蒸散、アブレーション、止血または凝固を行う。\n今回の申請は整形外科適応に限定される：限局性腰椎椎間板ヘルニア、限局性頸椎椎間板ヘルニア、限局性胸椎椎間板ヘルニア、椎間板性疼痛、腰部脊柱管狭窄症、仙腸関節除神経術など。","specialty":"整形外科"},"en":{"title":"Semiconductor Laser Treatment Device (Leonardo)","description":"Leonardo is a medical laser device for tissue treatment. It delivers laser energy through medical optical fibers for incision, excision, vaporization, ablation, hemostasis, or coagulation at the application site during surgery.\nThe present application is limited to orthopedic indications: localized lumbar disc herniation, localized cervical disc herniation, localized thoracic disc herniation, discogenic pain, lumbar spinal stenosis, sacroiliac joint denervation, etc.","specialty":"Orthopedics"}}},{"id":531,"category":"device","number":325,"langs":{"zh":{"title":"矫形器","description":"AposTherapy系统预期由经过培训的专业人员使用，以调节施加在下肢上的重量/力(s)的分布。AposTherapy系统预期用于膝骨性关节炎患者，以帮助暂时减轻膝关节疼痛，并改善日常生活活动中的下肢功能","specialty":"骨科"},"ja":{"title":"装具","description":"AposTherapyシステムは、訓練を受けた専門家が使用し、下肢に加わる重量／力の分布を調整することを目的とする。膝変形性関節症患者に使用し、膝関節痛を一時的に軽減し、日常生活動作における下肢機能の改善を補助する。","specialty":"整形外科"},"en":{"title":"Orthotic Device","description":"The AposTherapy system is intended to be used by trained professionals to adjust the distribution of weight/force(s) applied to the lower limbs. The AposTherapy system is intended for patients with knee osteoarthritis to help temporarily reduce knee pain and improve lower-limb function during activities of daily living.","specialty":"Orthopedics"}}},{"id":532,"category":"device","number":326,"langs":{"zh":{"title":"无菌可吸收\n透明质酸关节内植入凝胶","description":"SupintroTM用于治疗骨关节炎等关节疾病的症状。SupintroTM适用于人体关节中滑液的粘弹性补充或替代。它适用于治疗疼痛、关节保护、抗炎、抑制软骨变性并激活骨关节炎(OA)区域的软骨再生、膝关节病I-II-III 级以及退行性半月板和退行性关节疾病。","specialty":"骨科"},"ja":{"title":"無菌吸収性ヒアルロン酸関節内インプラントゲル","description":"SupintroTMは変形性関節症などの関節疾患の症状治療に使用する。人体関節における滑液の粘弾性を補充または代替することを目的とする。疼痛治療、関節保護、抗炎症、軟骨変性の抑制、変形性関節症（OA）部位の軟骨再生活性化、膝関節症I～III級、変性半月板および変性関節疾患に適用する。","specialty":"整形外科"},"en":{"title":"Sterile Absorbable Hyaluronic Acid Intra-Articular Implant Gel","description":"SupintroTM is used to treat symptoms of joint diseases such as osteoarthritis. SupintroTM is intended to supplement or replace the viscoelastic properties of synovial fluid in human joints. It is indicated for pain treatment, joint protection, anti-inflammatory effects, inhibition of cartilage degeneration and activation of cartilage regeneration in osteoarthritis (OA) areas, grade I-II-III knee arthropathy, degenerative meniscal disease, and degenerative joint disease.","specialty":"Orthopedics"}}},{"id":533,"category":"device","number":327,"langs":{"zh":{"title":"iN300 血液双重滤过机","description":"治疗血色病","specialty":"感染科"},"ja":{"title":"iN300 血液二重濾過装置","description":"ヘモクロマトーシスの治療。","specialty":"感染症科"},"en":{"title":"iN300 Double-Filtration Blood Machine","description":"Treatment of hemochromatosis.","specialty":"Infectious Diseases"}}},{"id":534,"category":"device","number":328,"langs":{"zh":{"title":"IN300 血液双重滤过机专用耗材","description":"治疗血色病","specialty":"感染科"},"ja":{"title":"IN300 血液二重濾過装置専用消耗品","description":"ヘモクロマトーシスの治療。","specialty":"感染症科"},"en":{"title":"Dedicated Consumables for IN300 Double-Filtration Blood Machine","description":"Treatment of hemochromatosis.","specialty":"Infectious Diseases"}}},{"id":535,"category":"device","number":329,"langs":{"zh":{"title":"数字成像控制器 EXALT\nCONTROLLER","description":"拟用于配合成像导管用于内窥镜诊断、治疗和影像探查。","specialty":"肝胆外科"},"ja":{"title":"デジタルイメージングコントローラー EXALT CONTROLLER","description":"イメージングカテーテルと組み合わせ、内視鏡診断、治療および画像観察に使用することを目的とする。","specialty":"肝胆道外科"},"en":{"title":"Digital Imaging Controller EXALT CONTROLLER","description":"Intended for use with an imaging catheter for endoscopic diagnosis, treatment, and imaging exploration.","specialty":"Hepatobiliary Surgery"}}},{"id":536,"category":"device","number":330,"langs":{"zh":{"title":"非热效应机械性组织消融聚焦超声系统Focused U1trasound System\nFor Non-therma1,\nMechanica1 Tissue Ab1ation","description":"通过非热效应机械性的聚焦超声作用，对肝脏肿瘤（包括不可切除的肝脏肿瘤）进行非侵入性破坏。","specialty":"肝胆外科"},"ja":{"title":"Focused Ultrasound System for Non-thermal, Mechanical Tissue Ablation\n非熱的機械的組織アブレーション用集束超音波システム","description":"非熱的・機械的な集束超音波作用により、切除不能肝腫瘍を含む肝腫瘍を非侵襲的に破壊する。","specialty":"肝胆道外科"},"en":{"title":"Focused Ultrasound System for Non-thermal, Mechanical Tissue Ablation","description":"Provides non-invasive destruction of liver tumors, including unresectable liver tumors, through non-thermal mechanical effects of focused ultrasound.","specialty":"Hepatobiliary Surgery"}}},{"id":537,"category":"device","number":331,"langs":{"zh":{"title":"TheraSphere Y-90\n玻璃微球系统\n(TheraSphere Y-90 Glass\nMicrospere System)","description":"TheraSphere\n用于治疗肝脏\n恶性肿瘤","specialty":"肝胆外科"},"ja":{"title":"TheraSphere Y-90 ガラスマイクロスフィアシステム\n(TheraSphere Y-90 Glass Microspere System)","description":"TheraSphereは肝臓悪性腫瘍の治療に使用する。","specialty":"肝胆道外科"},"en":{"title":"TheraSphere Y-90 Glass Microsphere System\n(TheraSphere Y-90 Glass Microspere System)","description":"TheraSphere is used to treat malignant liver tumors.","specialty":"Hepatobiliary Surgery"}}},{"id":538,"category":"device","number":332,"langs":{"zh":{"title":"正电子发射及 X 射线计算机断层成像系统Positron Emission\nTomography (PET) System\nComputed Tomography (CT)\nSystem","description":"该系统可以帮助受过相应培训的医疗专家检测、定位、诊断、分段和重新分段病变、肿瘤、疾病与器官功能，以进行疾病与功能紊乱评估，其中包括但不限于心血管疾病、神经功能紊乱和癌症。医生还可以利用系统生成的图像进行放射治疗计划和介入放射学手术。\n• 本系统可用于肺癌高风险人群的低剂量扫描筛检。","specialty":"肝胆外科"},"ja":{"title":"陽電子放出断層撮影（PET）／X線コンピュータ断層撮影（CT）システム","description":"適切な訓練を受けた医療専門家が、病変、腫瘍、疾患および臓器機能の検出、位置特定、診断、病期分類、再病期分類を行い、疾患や機能障害を評価することを支援する。対象には心血管疾患、神経機能障害、癌などが含まれるが、これらに限定されない。医師は本システムが生成した画像を放射線治療計画およびインターベンショナルラジオロジー手技にも利用できる。\n• 本システムは肺癌高リスク者の低線量スキャンによるスクリーニングに使用できる。","specialty":"肝胆道外科"},"en":{"title":"Positron Emission Tomography (PET) System / Computed Tomography (CT) System","description":"The system can assist appropriately trained medical specialists in detecting, locating, diagnosing, staging and restaging lesions, tumors, diseases, and organ function for assessment of disease and functional disorders, including but not limited to cardiovascular disease, neurological disorders, and cancer. Physicians may also use images generated by the system for radiation therapy planning and interventional radiology procedures.\n• The system can be used for low-dose scanning screening of people at high risk of lung cancer.","specialty":"Hepatobiliary Surgery"}}},{"id":539,"category":"device","number":333,"langs":{"zh":{"title":"钇[90Y]树脂微球及其输送 装置\n（Yttrium [90Y] Resin\nMicrospheres and Delivery\nDevice)","description":"90Y为较理想的治疗用放射性核素，其半衰期为64h，辐射类型为纯β辐射(0.9MeV)，可由90Sr-90Y发生器得到。90Y主要用于制备治疗用放射性药物。90Y-玻璃微球和90Y-树脂微球(20～30μm)用于治疗肝癌(动脉内注射)，90Y-EDTMP可用于治疗白血病、骨髓细胞瘤等。","specialty":"肝胆外科"},"ja":{"title":"イットリウム［90Y］樹脂マイクロスフィアおよびデリバリーデバイス\n（Yttrium [90Y] Resin Microspheres and Delivery Device）","description":"90Yは治療用として比較的理想的な放射性核種で、半減期64時間、放射線種は純β線（0.9 MeV）であり、90Sr-90Yジェネレータから得ることができる。90Yは主に治療用放射性医薬品の調製に用いられる。90Yガラスマイクロスフィアおよび90Y樹脂マイクロスフィア（20～30 μm）は肝癌治療（動脈内注射）に用いられ、90Y-EDTMPは白血病、骨髄腫などの治療に使用できる。","specialty":"肝胆道外科"},"en":{"title":"Yttrium [90Y] Resin Microspheres and Delivery Device","description":"90Y is a relatively ideal therapeutic radionuclide, with a half-life of 64 h and pure beta radiation (0.9 MeV), and can be obtained from a 90Sr-90Y generator. 90Y is mainly used to prepare therapeutic radiopharmaceuticals. 90Y glass microspheres and 90Y resin microspheres (20-30 μm) are used to treat liver cancer (intra-arterial injection), and 90Y-EDTMP can be used to treat leukemia, myeloma, etc.","specialty":"Hepatobiliary Surgery"}}},{"id":540,"category":"device","number":334,"langs":{"zh":{"title":"电子十二指肠成像导管 EXALT\nMODEL D SINGLE-USE\nDUODENOSCOPE","description":"拟用于配合 EXALT 数字成像控制器，用于对十二指肠部位进行观察和诊断，并在十二指肠内进行包括内镜检查和内镜手术的各类操作。","specialty":"肝胆外科"},"ja":{"title":"電子十二指腸イメージングカテーテル EXALT MODEL D SINGLE-USE DUODENOSCOPE","description":"EXALTデジタルイメージングコントローラーと組み合わせ、十二指腸の観察・診断、および十二指腸内で内視鏡検査・内視鏡手術を含む各種操作を行うために使用する。","specialty":"肝胆道外科"},"en":{"title":"Electronic Duodenal Imaging Catheter EXALT MODEL D SINGLE-USE DUODENOSCOPE","description":"Intended for use with the EXALT digital imaging controller to observe and diagnose the duodenum and to perform various procedures in the duodenum, including endoscopic examination and endoscopic surgery.","specialty":"Hepatobiliary Surgery"}}},{"id":541,"category":"device","number":335,"langs":{"zh":{"title":"GMV Thuzzle 多波射频治疗仪","description":"单波和连续的多波模式：通过重新激活淋巴系统，刺激脂肪细胞释放毒素和多余的液体，重新建立正确的平衡。电磁波通过刺激让细胞产生新的胶原蛋白、弹性蛋白和透明质酸，提高了成纤维细胞膜的钠-钾泵活性。因此，该技术旨在治疗皱纹，放松面部和身体皮肤(Ptosis)，以减少局部脂肪沉积、手术疤痕或痤疮疤痕，并治疗不同进化阶段的水肿性纤维硬化性小管病(OFSP)。径向分数制模式（可选）：径向分频模式使表皮表面微消融与真皮的定向体积加热同步进行，以促进真皮的收缩和新生胶原的形成。传递信号的创新方式刺激和提拉组织，从根本上解决随着时间推移组织塌陷的主要原因。这种组合使治疗粗糙的纹理，失弹性和黑斑成为可能。阴道治疗(可选选择)：由于采用了特定的手柄，该设备还可以应用于妇科领域的以下病理：1. 阴道萎缩2. 尿失禁和其他功能障碍的治疗3. 阴道脱垂4. 恢复阴道管的校准和张力5. 改善真皮的微循环和增厚，刺激纤维、胶原蛋白和弹性蛋白的产生。 \"","specialty":"妇科"},"ja":{"title":"GMV Thuzzle マルチウェーブ高周波治療器","description":"単一波および連続マルチウェーブモード：リンパ系を再活性化し、脂肪細胞から毒素と余剰液の放出を刺激して、適切なバランスを再構築する。電磁波刺激により細胞に新たなコラーゲン、エラスチン、ヒアルロン酸を産生させ、線維芽細胞膜のナトリウム・カリウムポンプ活性を高める。そのため、本技術はしわ、顔面・身体皮膚の弛緩（Ptosis）の治療、局所脂肪沈着、手術瘢痕またはニキビ瘢痕の軽減、ならびにさまざまな進行段階の浮腫性線維硬化性小管病（OFSP）の治療を目的とする。ラジアル・フラクショナルモード（オプション）：表皮表面の微小アブレーションと真皮の標的体積加熱を同期させ、真皮収縮と新生コラーゲン形成を促進する。革新的な信号伝達方式により組織を刺激・リフトし、時間経過に伴う組織の崩れの主因に根本から対応する。この組み合わせにより、粗い皮膚質感、弾力低下、黒斑の治療が可能となる。膣治療（オプション）：専用ハンドピースにより、婦人科領域の以下の病態にも使用できる。1. 膣萎縮、2. 尿失禁およびその他の機能障害の治療、3. 膣脱、4. 膣管の径および緊張の回復、5. 真皮微小循環・肥厚の改善、線維、コラーゲンおよびエラスチン産生の刺激。\"","specialty":"婦人科"},"en":{"title":"GMV Thuzzle Multi-Wave Radiofrequency Treatment Device","description":"Single-wave and continuous multi-wave modes: by reactivating the lymphatic system, adipocytes are stimulated to release toxins and excess fluid, restoring proper balance. Electromagnetic waves stimulate cells to produce new collagen, elastin, and hyaluronic acid and increase sodium-potassium pump activity in fibroblast membranes. The technology is therefore intended to treat wrinkles and laxity (ptosis) of facial and body skin, reduce localized fat deposits, surgical scars or acne scars, and treat edematous fibrosclerotic panniculopathy (OFSP) at different stages of progression. Radial fractional mode (optional): the radial fractional mode synchronizes micro-ablation of the epidermal surface with targeted volumetric heating of the dermis to promote dermal contraction and neocollagenesis. The innovative signal-delivery method stimulates and lifts tissue, addressing the principal cause of tissue collapse over time. This combination enables treatment of rough texture, loss of elasticity, and dark spots. Vaginal treatment (optional): using a dedicated handpiece, the device can also be applied in gynecology for the following conditions: 1. vaginal atrophy; 2. treatment of urinary incontinence and other dysfunctions; 3. vaginal prolapse; 4. restoration of vaginal canal caliber and tone; 5. improvement of dermal microcirculation and thickening, stimulating production of fibers, collagen, and elastin. \"","specialty":"Gynecology"}}},{"id":542,"category":"device","number":336,"langs":{"zh":{"title":"人工耳蜗植入术中检测系统\nNucleus® SmartNav System","description":"Nucleus SmartNav旨在与其他设备结合使用，在人工耳蜗外科手术过程中提供术中测量，帮助监测电极植入、放置和功能，并用于声音处理单元的后续调试或编程。Nucleus SmartNav 与CP1150S 手术处理器一起组合成一套预期只能由手术室内的外科医生和医疗保健专业人士使用的术中工具","specialty":"耳鼻咽喉科"},"ja":{"title":"人工内耳植込み術中検査システム\nNucleus® SmartNav System","description":"Nucleus SmartNavは他の装置と組み合わせ、人工内耳手術中に術中測定を提供し、電極の挿入、位置、機能のモニタリングを支援するとともに、その後のサウンドプロセッサの調整・プログラミングに使用することを目的とする。Nucleus SmartNavとCP1150S手術用プロセッサは、手術室内で外科医および医療専門職のみが使用する術中ツール一式を構成する。","specialty":"耳鼻咽喉科"},"en":{"title":"Intraoperative Cochlear Implant Testing System\nNucleus® SmartNav System","description":"Nucleus SmartNav is intended for use in combination with other devices to provide intraoperative measurements during cochlear implant surgery, helping monitor electrode insertion, placement, and function, and for subsequent fitting or programming of the sound-processing unit. Nucleus SmartNav together with the CP1150S surgical processor forms an intraoperative tool intended to be used only by surgeons and healthcare professionals in the operating room.","specialty":"Otorhinolaryngology"}}},{"id":543,"category":"device","number":337,"langs":{"zh":{"title":"Cochlear™ Nucleus® Nexa™ 人工\n耳蜗植入体（附Slim Modiolar电\n极）","description":"科利耳 Nucleus® NexaTM 人工耳蜗植入体（附Slim Straight电极）适用于以下个人。\n群组 A:17 岁以下的儿童（无最低年龄限制），依据临床确立的诊断：•单耳或双耳有感觉神经性听力损失。受损耳朵的典型手术前阈值显示纯音平均受损程度介于中度严重至极度严重之间。使用助听器（可能）效果甚微或无效。•有家人或照顾人员可提供支持并致力于让儿童持续参与听力复健。•体重为 7 kg 或以上，因为装置灭菌后可能会有残留的环氧乙烷。\n群组 B:18 岁以上的个人，其临床确立语后双耳或单侧感觉神经性听力损失，且佩戴助听器（可能）效果甚微或无效。受损耳朵的典型手术前阈值显示纯音平均受损程度介于中度严重至严重之间。\n群组 C:年龄为 18 岁以上、学语前或学语中耳聋的个人，有极度严重双耳感觉神经性听力损失，且佩戴助听器(可能) 效果甚微或无效。","specialty":"耳鼻咽喉科"},"ja":{"title":"Cochlear™ Nucleus® Nexa™ 人工内耳インプラント（Slim Modiolar電極付き）","description":"Cochlear Nucleus® NexaTM人工内耳インプラント（Slim Straight電極付き）は以下の個人に適用する。\nグループA：17歳未満の小児（最低年齢制限なし）で、臨床的に確立された診断に基づくもの：•片耳または両耳の感音難聴。障害耳の典型的な術前閾値は、純音平均で中等度重度から最重度の難聴を示す。補聴器を使用しても（使用可能な場合）効果がわずか、または無効。•家族または介護者が支援でき、小児が継続して聴覚リハビリテーションに参加することに協力できること。•装置滅菌後にエチレンオキサイドが残留する可能性があるため、体重7 kg以上。\nグループB：18歳以上で、臨床的に確立された言語習得後の両耳または片側感音難聴があり、補聴器を装用しても（使用可能な場合）効果がわずか、または無効な者。障害耳の典型的な術前閾値は、純音平均で中等度重度から重度の難聴を示す。\nグループC：18歳以上で、言語習得前または言語習得中に失聴し、両耳に最重度感音難聴があり、補聴器を装用しても（使用可能な場合）効果がわずか、または無効な者。","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear™ Nucleus® Nexa™ Cochlear Implant (with Slim Modiolar Electrode)","description":"The Cochlear Nucleus® NexaTM cochlear implant (with Slim Straight electrode) is indicated for the following individuals.\nGroup A: Children under 17 years of age (no minimum age), based on clinically established diagnosis: • unilateral or bilateral sensorineural hearing loss. Typical preoperative thresholds in the affected ear show a pure-tone average ranging from moderately severe to profound hearing loss. Hearing aids provide little or no benefit (where applicable). • Family members or caregivers are available to provide support and are committed to the child's continued participation in auditory rehabilitation. • Body weight is 7 kg or more because residual ethylene oxide may remain after device sterilization.\nGroup B: Individuals aged 18 years and older with clinically established postlingual bilateral or unilateral sensorineural hearing loss and little or no benefit from hearing aids (where applicable). Typical preoperative thresholds in the affected ear show a pure-tone average ranging from moderately severe to severe hearing loss.\nGroup C: Individuals aged 18 years and older with prelingual or perilingual deafness, profound bilateral sensorineural hearing loss, and little or no benefit from hearing aids (where applicable).","specialty":"Otorhinolaryngology"}}},{"id":544,"category":"device","number":338,"langs":{"zh":{"title":"Cochlear™ Nucleus® Nexa™ 人工\n耳蜗植入体","description":"科利耳 Nucleus® NexaTM 人工耳蜗植入体（附Slim Straight电极）适用于以下个人。\n群组 A:17 岁以下的儿童（无最低年龄限制），依据临床确立的诊断：•单耳或双耳有感觉神经性听力损失。受损耳朵的典型手术前阈值显示纯音平均受损程度介于中度严重至极度严重之间。使用助听器（可能）效果甚微或无效。•有家人或照顾人员可提供支持并致力于让儿童持续参与听力复健。•体重为 7 kg 或以上，因为装置灭菌后可能会有残留的环氧乙烷。\n群组 B:18 岁以上的个人，其临床确立语后双耳或单侧感觉神经性听力损失，且佩戴助听器（可能）效果甚微或无效。受损耳朵的典型手术前阈值显示纯音平均受损程度介于中度严重至严重之间。群","specialty":"耳鼻咽喉科"},"ja":{"title":"Cochlear™ Nucleus® Nexa™ 人工内耳インプラント","description":"Cochlear Nucleus® NexaTM人工内耳インプラント（Slim Straight電極付き）は以下の個人に適用する。\nグループA：17歳未満の小児（最低年齢制限なし）で、臨床的に確立された診断に基づくもの：•片耳または両耳の感音難聴。障害耳の典型的な術前閾値は、純音平均で中等度重度から最重度の難聴を示す。補聴器を使用しても（使用可能な場合）効果がわずか、または無効。•家族または介護者が支援でき、小児が継続して聴覚リハビリテーションに参加することに協力できること。•装置滅菌後にエチレンオキサイドが残留する可能性があるため、体重7 kg以上。\nグループB：18歳以上で、臨床的に確立された言語習得後の両耳または片側感音難聴があり、補聴器を装用しても（使用可能な場合）効果がわずか、または無効な者。障害耳の典型的な術前閾値は、純音平均で中等度重度から重度の難聴を示す。群","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear™ Nucleus® Nexa™ Cochlear Implant","description":"The Cochlear Nucleus® NexaTM cochlear implant (with Slim Straight electrode) is indicated for the following individuals.\nGroup A: Children under 17 years of age (no minimum age), based on clinically established diagnosis: • unilateral or bilateral sensorineural hearing loss. Typical preoperative thresholds in the affected ear show a pure-tone average ranging from moderately severe to profound hearing loss. Hearing aids provide little or no benefit (where applicable). • Family members or caregivers are available to provide support and are committed to the child's continued participation in auditory rehabilitation. • Body weight is 7 kg or more because residual ethylene oxide may remain after device sterilization.\nGroup B: Individuals aged 18 years and older with clinically established postlingual bilateral or unilateral sensorineural hearing loss and little or no benefit from hearing aids (where applicable). Typical preoperative thresholds in the affected ear show a pure-tone average ranging from moderately severe to severe hearing loss. Group","specialty":"Otorhinolaryngology"}}},{"id":545,"category":"device","number":339,"langs":{"zh":{"title":"科利耳® Nucleus™ Kanso™ 3\nNexa™ 声音处理器","description":"适用于佩戴兼容型科利耳 Nucleus 植入体的植入者。\n声音处理器与以下科利耳 Nucleus 植入体兼容：\n• Nexa（CI1000）系列植入体：CI1012、CI1022、CI1032。","specialty":"耳鼻咽喉科"},"ja":{"title":"Cochlear® Nucleus™ Kanso™ 3 Nexa™ サウンドプロセッサ","description":"互換性のあるCochlear Nucleusインプラントを装用する植込み患者に適用する。\nサウンドプロセッサは以下のCochlear Nucleusインプラントと互換性がある：\n• Nexa（CI1000）シリーズ：CI1012、CI1022、CI1032。","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear® Nucleus™ Kanso™ 3 Nexa™ Sound Processor","description":"Indicated for recipients using compatible Cochlear Nucleus implants.\nThe sound processor is compatible with the following Cochlear Nucleus implants:\n• Nexa (CI1000) series implants: CI1012, CI1022, CI1032.","specialty":"Otorhinolaryngology"}}},{"id":546,"category":"device","number":340,"langs":{"zh":{"title":"Cochlear™ 手术用处理器","description":"手术用处理器适用于佩戴兼容的科利耳Nucleus 植入体的植入者。\n手术用处理器适合与以下术中应用软件配合使用：Nucleus SmartNav、Cochlear Objective Measures。\n手术用处理器与以下科利耳 Nucleus 植入体兼容：CI1000 系列植入体：CI1012、CI1022、CI1024、CI1032。\n与 Nucleus SmartNav 配合使用时，手术用处理器使用以下科利耳电池：科利耳加强扩展型电池模块，充电式。","specialty":"耳鼻咽喉科"},"ja":{"title":"Cochlear™ 手術用プロセッサ","description":"手術用プロセッサは、互換性のあるCochlear Nucleusインプラントを装用する植込み患者に適用する。\n以下の術中アプリケーションとの併用に適する：Nucleus SmartNav、Cochlear Objective Measures。\n以下のCochlear Nucleusインプラントと互換性がある：CI1000シリーズ：CI1012、CI1022、CI1024、CI1032。\nNucleus SmartNavと併用する場合、手術用プロセッサは以下のCochlearバッテリーを使用する：Cochlear Power Extend充電式バッテリーモジュール。","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear™ Surgical Processor","description":"The surgical processor is intended for recipients using compatible Cochlear Nucleus implants.\nThe surgical processor is suitable for use with the following intraoperative applications: Nucleus SmartNav, Cochlear Objective Measures.\nThe surgical processor is compatible with the following Cochlear Nucleus implants: CI1000 series implants: CI1012, CI1022, CI1024, CI1032.\nWhen used with Nucleus SmartNav, the surgical processor uses the following Cochlear battery: Cochlear Power Extend battery module, rechargeable.","specialty":"Otorhinolaryngology"}}},{"id":547,"category":"device","number":341,"langs":{"zh":{"title":"声音处理器","description":"科利耳 Nucleus Kanso 3 声音处理器适用于佩戴兼容型科利耳 Nucleus 植入体的植入者。声音处理器与以下科利耳Nucleus 植入体兼容：• CI600 系列植入体：CI612、CI622、CI632。CI500 系列植入体：CI512、CI513、CI522、CI532、CI551、ABI541• CI24RE 系列植入体：CI422、CI24RE(CA)、CI24RE (ST)、CI24RE(CS)、CI24REH (HybridL24)、CI8REH (Hybrid S8)、CI12REH(HybridS12)• CI24R 系列植入体：CI24R (CS)、CI24R (CA)、CI24R(ST)• CI24M 系列植入体：CI24M、ABI24M、CI11+11+2M• CI24MH（也称为 CI 6+6+2M)","specialty":"耳鼻咽喉科"},"ja":{"title":"サウンドプロセッサ","description":"Cochlear Nucleus Kanso 3サウンドプロセッサは、互換性のあるCochlear Nucleusインプラントを装用する植込み患者に適用する。以下のCochlear Nucleusインプラントと互換性がある：• CI600シリーズ：CI612、CI622、CI632。CI500シリーズ：CI512、CI513、CI522、CI532、CI551、ABI541 • CI24REシリーズ：CI422、CI24RE(CA)、CI24RE(ST)、CI24RE(CS)、CI24REH (HybridL24)、CI8REH (Hybrid S8)、CI12REH(HybridS12) • CI24Rシリーズ：CI24R(CS)、CI24R(CA)、CI24R(ST) • CI24Mシリーズ：CI24M、ABI24M、CI11+11+2M • CI24MH（CI 6+6+2Mとも呼ばれる）。","specialty":"耳鼻咽喉科"},"en":{"title":"Sound Processor","description":"The Cochlear Nucleus Kanso 3 sound processor is intended for recipients using compatible Cochlear Nucleus implants. The sound processor is compatible with the following Cochlear Nucleus implants: • CI600 series implants: CI612, CI622, CI632. CI500 series implants: CI512, CI513, CI522, CI532, CI551, ABI541 • CI24RE series implants: CI422, CI24RE(CA), CI24RE(ST), CI24RE(CS), CI24REH (HybridL24), CI8REH (Hybrid S8), CI12REH (HybridS12) • CI24R series implants: CI24R(CS), CI24R(CA), CI24R(ST) • CI24M series implants: CI24M, ABI24M, CI11+11+2M • CI24MH (also known as CI 6+6+2M).","specialty":"Otorhinolaryngology"}}},{"id":548,"category":"device","number":342,"langs":{"zh":{"title":"人工耳蜗植入体（含声音处理器）","description":"语前聋患者:\n①植入年龄通常为12个月-6岁。（植入年龄越小效果越佳，具体可以根据医生决定。6岁以上的儿童或青少年需要有一定的听力语言基础，自幼有助听器佩戴史和听觉言语康复训练史）\n②双耳重度或极重度感音神经性聋。\n③无手术禁忌症。\n④监护人和/或植入者本人对人工耳蜗植入有正确认识和适当的期望值。\n⑤具备听觉言语康复教育的条件。\n语后聋患者:①各年龄段的语后聋患者。②双耳重度或极重度感音神经性聋，依靠助听器不能进行正常听觉言语交流。③无手术禁忌症。④植入者本人和/或监护人对人工耳蜗植入有正确认识和适当的期望值。","specialty":"耳鼻咽喉科"},"ja":{"title":"人工内耳インプラント（サウンドプロセッサ含む）","description":"言語習得前失聴患者：\n①植込み年齢は通常12か月～6歳。（植込み年齢が若いほど効果が良い。具体的には医師が判断できる。6歳を超える小児または青少年は一定の聴覚・言語基盤を有し、幼少期から補聴器装用歴および聴覚言語リハビリテーション訓練歴が必要。）\n②両耳重度または最重度感音難聴。\n③手術禁忌がないこと。\n④保護者および／または植込み本人が人工内耳植込みについて正しく理解し、適切な期待を有すること。\n⑤聴覚言語リハビリテーション教育を受けられる条件があること。\n言語習得後失聴患者：①各年齢層の言語習得後失聴患者。②両耳重度または最重度感音難聴で、補聴器では通常の聴覚言語コミュニケーションができない。③手術禁忌がない。④本人および／または保護者が人工内耳植込みについて正しく理解し、適切な期待を有する。","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear Implant (Including Sound Processor)","description":"Prelingually deaf patients:\n① Implantation age is generally 12 months to 6 years. (Younger implantation age generally gives better results; the specific timing may be determined by the physician. Children or adolescents over 6 years should have a certain auditory-language foundation, a history of hearing-aid use from an early age, and auditory-verbal rehabilitation training.)\n② Bilateral severe or profound sensorineural hearing loss.\n③ No surgical contraindications.\n④ The guardian and/or recipient has a correct understanding of cochlear implantation and appropriate expectations.\n⑤ Conditions are available for auditory-verbal rehabilitation education.\nPostlingually deaf patients: ① Postlingually deaf patients of all ages. ② Bilateral severe or profound sensorineural hearing loss, with hearing aids insufficient for normal auditory-verbal communication. ③ No surgical contraindications. ④ The recipient and/or guardian has a correct understanding of cochlear implantation and appropriate expectations.","specialty":"Otorhinolaryngology"}}},{"id":549,"category":"device","number":343,"langs":{"zh":{"title":"人工耳蜗植入体（含声音处理器）","description":"语前聋患者:\n①植入年龄通常为12个月-6岁。（植入年龄越小效果越佳，具体可以根据医生决定。6岁以上的儿童或青少年需要有一定的听力语言基础，自幼有助听器佩戴史和听觉言语康复训练史）\n②双耳重度或极重度感音神经性聋。\n③无手术禁忌症。\n④监护人和/或植入者本人对人工耳蜗植入有正确认识和适当的期望值。\n⑤具备听觉言语康复教育的条件。\n语后聋患者:\n①各年龄段的语后聋患者。\n②双耳重度或极重度感音神经性聋，依靠助听器不能进行正常听觉言语交流。\n③无手术禁忌症。\n④植入者本人和/或监护人对人工耳蜗植入有正确认识和适当的期望值。","specialty":"耳鼻咽喉科"},"ja":{"title":"人工内耳インプラント（サウンドプロセッサ含む）","description":"言語習得前失聴患者：\n①植込み年齢は通常12か月～6歳。（植込み年齢が若いほど効果が良い。具体的には医師が判断できる。6歳を超える小児または青少年は一定の聴覚・言語基盤を有し、幼少期から補 dB HL以下）。","specialty":"耳鼻咽喉科"},"en":{"title":"Implantable Hearing Prosthesis System","description":"Indicated for adults aged 18 years and older. Conductive or mixed hearing loss with bone-conduction thresholds shown by audiological testing to be better than or equal to 45 dB HL at 500 Hz, 1 kHz, 2 kHz, and 3 kHz. Unilateral sensorineural deafness, i.e., one ear with severe to profound sensorineural hearing loss and the other ear with normal hearing (air conduction better than or equal to 20 dB HL at 0.5, 1, 2, and 3 kHz).","specialty":"Otorhinolaryngology"}}},{"id":561,"category":"device","number":355,"langs":{"zh":{"title":"声音处理器及其配件、软件、手术工具包","description":"该产品与美国领先仿生有限公司人工耳蜗植入体联合使用，通过对声音进行数字处理，对听觉通路进行电刺激来恢复听觉，适用于患有重度或极重度感音神经性耳聋的儿童及成人","specialty":"耳鼻咽喉科"},"ja":{"title":"サウンドプロセッサおよびアクセサリ、ソフトウェア、手術用ツールキット","description":"本製品は米国Advanced Bionics社の人工内耳インプラントと併用し、音をデジタル処理して聴覚経路を電気刺激することで聴覚を回復する。重度または最重度感音難聴を有する小児および成人に適用する。","specialty":"耳鼻咽喉科"},"en":{"title":"Sound Processor and Accessories, Software, and Surgical Tool Kit","description":"This product is used together with cochlear implants from Advanced Bionics, USA. It restores hearing by digitally processing sound and electrically stimulating the auditory pathway and is suitable for children and adults with severe or profound sensorineural hearing loss.","specialty":"Otorhinolaryngology"}}},{"id":562,"category":"device","number":356,"langs":{"zh":{"title":"RONDO3声音处理器","description":"适用于植入了带有可移除磁铁的MED-EL人工耳蜗的患者使用（Mi1200SYNCHRONY，Mi1210SYNCHRONYST、Mi1250SYNCHRONY2 [以下简称SYNCHRONY]、Mi1260SONATA2 [以下简称SONATA2]），也适用于植入了不带可移除磁铁的MED-EL人工耳蜗的患者（Mi1000CONCERTO或Mi1050CONCERTO2 [以下简称CONCERTO]、SONATAti¹⁰⁰ [以下简称SONATA]、PULSARci¹⁰⁰ [以下简称PULSAR]、C40+或C40）³。适用人群信息：RONDO3声音处理器适合所有年龄的患者。","specialty":"耳鼻咽喉科"},"ja":{"title":"RONDO3 サウンドプロセッサ","description":"取り外し可能な磁石を有するMED-EL人工内耳（Mi1200 SYNCHRONY、Mi1210 SYNCHRONY ST、Mi1250 SYNCHRONY 2［以下SYNCHRONY］、Mi1260 SONATA 2［以下SONATA2］）を植込んだ患者、および取り外し可能な磁石を有しないMED-EL人工内耳（Mi1000 CONCERTOまたはMi1050 CONCERTO 2［以下CONCERTO］、SONATAti¹⁰⁰［以下SONATA］、PULSARci¹⁰⁰［以下PULSAR］、C40+またはC40）³を植込んだ患者に使用する。適用患者：RONDO3サウンドプロセッサは全年齢の患者に適する。","specialty":"耳鼻咽喉科"},"en":{"title":"RONDO3 Sound Processor","description":"For use by patients implanted with MED-EL cochlear implants with removable magnets (Mi1200 SYNCHRONY, Mi1210 SYNCHRONY ST, Mi1250 SYNCHRONY 2 [hereinafter SYNCHRONY], Mi1260 SONATA 2 [hereinafter SONATA2]) and also by patients implanted with MED-EL cochlear implants without removable magnets (Mi1000 CONCERTO or Mi1050 CONCERTO 2 [hereinafter CONCERTO], SONATAti¹⁰⁰ [hereinafter SONATA], PULSARci¹⁰⁰ [hereinafter PULSAR], C40+ or C40)³. Applicable population: the RONDO3 sound processor is suitable for patients of all ages.","specialty":"Otorhinolaryngology"}}},{"id":563,"category":"device","number":357,"langs":{"zh":{"title":"人工耳蜗植入体\nMi1250 SYNCHRONY 2","description":"通过对听觉传导通路进行电刺激，可使患有重度到极重度听力缺陷、使用传统助听器在最佳辅助条件下收效甚微或仍不奏效的患者重获听觉。","specialty":"耳鼻咽喉科"},"ja":{"title":"人工内耳インプラント\nMi1250 SYNCHRONY 2","description":"聴覚伝導路を電気刺激することで、重度から最重度の聴覚障害があり、従来の補聴器を最適条件で使用しても効果がわずか、または無効な患者の聴覚を回復させる。","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear Implant\nMi1250 SYNCHRONY 2","description":"By electrically stimulating the auditory conduction pathway, it can restore hearing to patients with severe to profound hearing impairment who obtain little or no benefit from conventional hearing aids under optimal aided conditions.","specialty":"Otorhinolaryngology"}}},{"id":564,"category":"device","number":358,"langs":{"zh":{"title":"骨传导植入式听力系统 Osia®2\nCochlear\nTM Osia®2 Bone-conduction\nhearing\nimplant system","description":"a) 传导性或混合性听力损失。骨传导阈值（纯音平均值）（PTA4；0.5、1、2和4 kHz 均值）≤ 55 dB HL；\nb) 单侧感音神经性耳聋（SSD）。正常耳部的空气传导阈值（纯音平均值）（PTA4；0.5、1、2和3 kHz 均值）≤ 20 dB HL。","specialty":"耳鼻咽喉科"},"ja":{"title":"骨導植込み型聴覚システム Osia®2\nCochlear™ Osia®2 Bone-conduction hearing implant system","description":"a) 伝音難聴または混合難聴。骨導閾値（純音平均）（PTA4；0.5、1、2、4 kHzの平均）≤55 dB HL；\nb) 片側性感音難聴（SSD）。正常聴力耳の気導閾値（純音平均）（PTA4；0.5、1、2、3 kHzの平均）≤20 dB HL。","specialty":"耳鼻咽喉科"},"en":{"title":"Osia®2 Bone-Conduction Hearing Implant System\nCochlear™ Osia®2 Bone-conduction hearing implant system","description":"a) Conductive or mixed hearing loss. Bone-conduction threshold (pure-tone average) (PTA4; mean at 0.5, 1, 2, and 4 kHz) ≤ 55 dB HL;\nb) Single-sided sensorineural deafness (SSD). Air-conduction threshold in the normal-hearing ear (pure-tone average) (PTA4; mean at 0.5, 1, 2, and 3 kHz) ≤ 20 dB HL.","specialty":"Otorhinolaryngology"}}},{"id":565,"category":"device","number":359,"langs":{"zh":{"title":"Nucleus 8 Sound Processor\nNucleus 8人工耳蜗声音处理器","description":"Nucleus 8 声音处理器适用于植入相容科利耳Nucleus 植入的植入者","specialty":"耳鼻咽喉科"},"ja":{"title":"Nucleus 8 Sound Processor\nNucleus 8 人工内耳サウンドプロセッサ","description":"Nucleus 8サウンドプロセッサは、互換性のあるCochlear Nucleusインプラントを植込んだ患者に適用する。","specialty":"耳鼻咽喉科"},"en":{"title":"Nucleus 8 Sound Processor\nNucleus 8 Cochlear Implant Sound Processor","description":"The Nucleus 8 sound processor is intended for recipients implanted with compatible Cochlear Nucleus implants.","specialty":"Otorhinolaryngology"}}},{"id":566,"category":"device","number":360,"langs":{"zh":{"title":"SONNET2 EAS 声音处理器\nSONNET2 EAS Audio Processor","description":"SONNET2 EAS声音处理器是 MEDEL 人工耳蜗植入系统的外部组件，适用于已植入 Mi1200 SYNCHRONY、Mi1210 SYNCHRONY ST 或 Mi1250 SYNCHRONY 2（以下简称 SYNCHRONY）、Mi1000 CONCERTO（以下简称 CONCERTO）、SONATAti100（以下简称 SONATA）、PULSARci100（以下简称 PULSAR）、C40+ 或 C40 人工耳蜗的患者。\nSONNET2 EAS适用于典型的日常环境（家庭、办公室、户外等），适合所有年龄的患者。\nSONNET2 EAS的助听功能供有功能性低频听力的患者使用。术后声学放大装置（即使用组合电声刺激）用于从 125Hz 到 1700Hz 频率范围内的 30dBHL 和 80dBHL 之间（当使用半增益调试规则时）的听力损失。","specialty":"耳鼻咽喉科"},"ja":{"title":"SONNET2 EAS サウンドプロセッサ\nSONNET2 EAS Audio Processor","description":"SONNET2 EASサウンドプロセッサはMED-EL人工内耳システムの外部コンポーネントであり、Mi1200 SYNCHRONY、Mi1210 SYNCHRONY ST、Mi1250 SYNCHRONY 2（以下SYNCHRONY）、Mi1000 CONCERTO（以下CONCERTO）、SONATAti100（以下SONATA）、PULSARci100（以下PULSAR）、C40+またはC40人工内耳を植込んだ患者に適用する。\nSONNET2 EASは典型的な日常環境（家庭、オフィス、屋外など）で使用し、全年齢の患者に適する。\nSONNET2 EASの補聴機能は機能的な低周波聴力を有する患者に使用する。術後音響増幅装置（すなわち電気音響刺激の併用）は、125 Hz～1700 Hzの周波数範囲で30 dB HL～80 dB HLの難聴（ハーフゲイン調整ルール使用時）に用いる。","specialty":"耳鼻咽喉科"},"en":{"title":"SONNET2 EAS Sound Processor\nSONNET2 EAS Audio Processor","description":"The SONNET2 EAS sound processor is an external component of the MED-EL cochlear implant system and is intended for patients implanted with Mi1200 SYNCHRONY, Mi1210 SYNCHRONY ST, or Mi1250 SYNCHRONY 2 (hereinafter SYNCHRONY), Mi1000 CONCERTO (hereinafter CONCERTO), SONATAti100 (hereinafter SONATA), PULSARci100 (hereinafter PULSAR), C40+, or C40 cochlear implants.\nSONNET2 EAS is intended for typical everyday environments (home, office, outdoors, etc.) and is suitable for patients of all ages.\nThe hearing-aid function of SONNET2 EAS is for patients with functional low-frequency hearing. Postoperative acoustic amplification (i.e., combined electric-acoustic stimulation) is used for hearing loss between 30 dB HL and 80 dB HL in the frequency range from 125 Hz to 1700 Hz (when using the half-gain fitting rule).","specialty":"Otorhinolaryngology"}}},{"id":567,"category":"device","number":361,"langs":{"zh":{"title":"Nucleus® ABI541听觉脑干植入体\nNucleus® ABI541 auditory\nbrainstem implant","description":"适用于12岁或以上因下列原因患有双侧第 8 对脑神经完全或部分功能障碍的患者：\n听觉肿瘤（例如听神经瘤、前庭神经鞘瘤或 2 型神经纤维瘤病）。\n头部损伤导致的第 8 对脑神经撕裂。\n耳蜗完全骨化或无法从人工耳蜗植入体获得足够的已知临床好处。","specialty":"耳鼻咽喉科"},"ja":{"title":"Nucleus® ABI541 聴性脳幹インプラント","description":"以下の原因により両側第8脳神経の完全または部分的機能障害を有する12歳以上の患者に適用する：\n聴覚腫瘍（例：聴神経腫、前庭神経鞘腫、2型神経線維腫症）。\n頭部外傷による第8脳神経断裂。\n蝸牛の完全骨化、または人工内耳インプラントから十分な既知の臨床的利益が得られない場合。","specialty":"耳鼻咽喉科"},"en":{"title":"Nucleus® ABI541 Auditory Brainstem Implant","description":"Indicated for patients aged 12 years or older with complete or partial bilateral dysfunction of the eighth cranial nerve due to:\nAuditory tumors (e.g., acoustic neuroma, vestibular schwannoma, or neurofibromatosis type 2).\nTearing of the eighth cranial nerve due to head injury.\nComplete cochlear ossification or inability to obtain sufficient known clinical benefit from a cochlear implant.","specialty":"Otorhinolaryngology"}}},{"id":568,"category":"device","number":362,"langs":{"zh":{"title":"辅助人工耳蜗植\n入系统Auxiliary Cochlear\nimplantation system（手术镊,机械\n植入驱动器,机械臂,机械臂对准器）","description":"OTOARM 预期用于固定和稳定兼容器械，以便进行可控定位。\nOTOARM Aligner 预期用于为兼容器械提供平移和角运动的方式。\nCONNECTOR OD 预期用于促进兼容设备的受限线性移动\nForceps OD 预期用于抓取，控制和移动兼容设备。\nOTODRIVE 预期用于以使用者设定的，可控的速度移动兼容设备。\n• 拟用于适应症：OTOARM 预期用于固定和稳定兼容器械，以便进行可控定位；\nOTOARM Aligner 预期用于为兼容器械提供平移和角运动的方式；\nCONNECTOR OD 预期用于促进兼容设备的受限线性移动；\nForcepsOD预期用于抓取，控制和移动兼容设备；\nOTODRIVE 预期用于以使用者设定的、可控的速度移动兼容设备；\n五项产品需联合使用组成辅助人工耳蜗植入系统，用于辅助人工耳蜗植入体电极植入。","specialty":"耳鼻咽喉科"},"ja":{"title":"人工内耳植込み補助システム Auxiliary Cochlear implantation system\n（手術鉗子、機械式挿入ドライバー、ロボットアーム、ロボットアームアライナー）","description":"OTOARMは互換器具を保持・安定化し、制御された位置決めを行うことを目的とする。\nOTOARM Alignerは互換器具に並進運動および角運動の手段を提供することを目的とする。\nCONNECTOR ODは互換装置の制限された直線移動を促進することを目的とする。\nForceps ODは互換装置を把持、制御、移動することを目的とする。\nOTODRIVEは使用者が設定した制御可能な速度で互換装置を移動することを目的とする。\n• 適応：OTOARMは互換器具を保持・安定化し、制御された位置決めを行う；\nOTOARM Alignerは互換器具に並進運動および角運動の手段を提供する；\nCONNECTOR ODは互換装置の制限された直線移動を促進する；\nForceps ODは互換装置を把持、制御、移動する；\nOTODRIVEは使用者が設定した制御可能な速度で互換装置を移動する；\n5製品を組み合わせて人工内耳植込み補助システムを構成し、人工内耳電極の挿入を補助する。","specialty":"耳鼻咽喉科"},"en":{"title":"Auxiliary Cochlear Implantation System\n(surgical forceps, mechanical insertion driver, robotic arm, robotic arm aligner)","description":"OTOARM is intended to hold and stabilize compatible instruments for controlled positioning.\nOTOARM Aligner is intended to provide translational and angular movement for compatible instruments.\nCONNECTOR OD is intended to facilitate restricted linear movement of compatible devices.\nForceps OD is intended to grasp, control, and move compatible devices.\nOTODRIVE is intended to move compatible devices at a user-set, controllable speed.\n• Intended indications: OTOARM is intended to hold and stabilize compatible instruments for controlled positioning;\nOTOARM Aligner is intended to provide translational and angular movement for compatible instruments;\nCONNECTOR OD is intended to facilitate restricted linear movement of compatible devices;\nForceps OD is intended to grasp, control, and move compatible devices;\nOTODRIVE is intended to move compatible devices at a user-set, controllable speed;\nThe five products must be used together to form an auxiliary cochlear implantation system to assist insertion of cochlear implant electrodes.","specialty":"Otorhinolaryngology"}}},{"id":569,"category":"device","number":363,"langs":{"zh":{"title":"Coch1ear Os ia OSI300 植入体\n(Coch1ear Os ia OSI300\nImp1ant)","description":"预期用途：\n科利耳 Osia 系统采用骨传导方式，将声音传输至耳蜗(内耳)，以增强听力。OSI300 植入体作为科利耳 Osia 系统的一部分，用于将外部声音处理器的信息转换为机械振动。适应证：\nOSI300 植入体适用于以下疾病的患者：\na.传导性或混合性听力损失。纯音骨导平均阈值（PTA4；0.5、1、2和4 kHz 下的均值）≤55 dB HL;\nb.单侧感音神经性耳聋（SSD）。听力正常耳朵中的纯音气导平均阈值（PTA4，0.5、1、2和3 kHz 下的均值）≤20 dB HL。","specialty":"耳鼻咽喉科"},"ja":{"title":"Cochlear Osia OSI300 インプラント","description":"使用目的：\nCochlear Osiaシステムは骨導により音を蝸牛（内耳）へ伝達し、聴力を補強する。OSI300インプラントはCochlear Osiaシステムの一部として、外部サウンドプロセッサからの情報を機械振動へ変換する。適応：\nOSI300インプラントは以下の患者に適用する：\na. 伝音難聴または混合難聴。純音骨導平均閾値（PTA4；0.5、1、2、4 kHzの平均）≤55 dB HL；\nb. 片側性感音難聴（SSD）。正常聴力耳の純音気導平均閾値（PTA4；0.5、1、2、3 kHzの平均）≤20 dB HL。","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear Osia OSI300 Implant","description":"Intended use:\nThe Cochlear Osia system uses bone conduction to transmit sound to the cochlea (inner ear) to enhance hearing. As part of the Cochlear Osia system, the OSI300 implant converts information from the external sound processor into mechanical vibration. Indications:\nThe OSI300 implant is indicated for patients with the following conditions:\na. Conductive or mixed hearing loss. Pure-tone average bone-conduction threshold (PTA4; mean at 0.5, 1, 2, and 4 kHz) ≤ 55 dB HL;\nb. Single-sided sensorineural deafness (SSD). Pure-tone average air-conduction threshold in the normal-hearing ear (PTA4; mean at 0.5, 1, 2, and 3 kHz) ≤ 20 dB HL.","specialty":"Otorhinolaryngology"}}},{"id":570,"category":"device","number":364,"langs":{"zh":{"title":"Coch1ear Os ia 2(I) 声音处理器套\n件（Coch1ear Os ia 2(I) Sound\nProcessor kit)","description":"预期用途：Osia 声音处理器设计为科利耳 Osia 系统的组成部分，其通过数字感应链路拾取环境声音信号并传输至植入体。\n适应证：Osia 2（I）声音处理器套件适用于兼容科利耳 Osia 植入体的植入者。Osia_2（I）声音处理器套件与下列科利耳 Osia 植入体兼容：OSI300。","specialty":"耳鼻咽喉科"},"ja":{"title":"Cochlear Osia 2(I) サウンドプロセッサキット","description":"使用目的：OsiaサウンドプロセッサはCochlear Osiaシステムの構成要素として設計され、環境音信号を取得し、デジタル誘導リンクを介してインプラントへ伝送する。\n適応：Osia 2(I)サウンドプロセッサキットは、互換性のあるCochlear Osiaインプラントを植込んだ患者に適用する。Osia 2(I)サウンドプロセッサキットは以下のCochlear Osiaインプラントと互換性がある：OSI300。","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear Osia 2(I) Sound Processor Kit","description":"Intended use: The Osia sound processor is designed as a component of the Cochlear Osia system, picking up environmental sound signals and transmitting them to the implant via a digital inductive link.\nIndications: The Osia 2(I) sound processor kit is intended for recipients with compatible Cochlear Osia implants. The Osia 2(I) sound processor kit is compatible with the following Cochlear Osia implant: OSI300.","specialty":"Otorhinolaryngology"}}},{"id":571,"category":"device","number":365,"langs":{"zh":{"title":"声音处理器SONNET 3 Audio\nProcessor","description":"用于MED-EL人工耳蜗植入体和听觉脑干植入系统的声音处理器，用于唤起听觉。","specialty":"耳鼻咽喉科"},"ja":{"title":"サウンドプロセッサ SONNET 3 Audio Processor","description":"MED-EL人工内耳インプラントおよび聴性脳幹インプラントシステム用のサウンドプロセッサで、聴覚を喚起するために使用する。","specialty":"耳鼻咽喉科"},"en":{"title":"Sound Processor SONNET 3 Audio Processor","description":"A sound processor for MED-EL cochlear implants and auditory brainstem implant systems, used to evoke hearing.","specialty":"Otorhinolaryngology"}}},{"id":572,"category":"device","number":366,"langs":{"zh":{"title":"耳科手术术前规划软件","description":"OTOPLAN 可用于研究与人工耳蜗植入术相关的解剖结构，为 HEARO procedure 制定手术计划。","specialty":"耳鼻咽喉科"},"ja":{"title":"耳科手術術前計画ソフトウェア","description":"OTOPLANは、人工内耳植込み術に関連する解剖構造を検討し、HEARO procedureの手術計画を作成するために使用できる。","specialty":"耳鼻咽喉科"},"en":{"title":"Preoperative Otologic Surgical Planning Software","description":"OTOPLAN may be used to study anatomical structures related to cochlear implantation and to develop a surgical plan for the HEARO procedure.","specialty":"Otorhinolaryngology"}}},{"id":573,"category":"device","number":367,"langs":{"zh":{"title":"人工耳蜗植入体HiRes™\nUltra3DCIHiFocus™\nMSElectrodePlus","description":"HiResolution仿生耳系统旨在通过电信号刺激听觉神经，来帮助重度至极重度感音神经性耳聋患者恢复一定程度的听觉。","specialty":"耳鼻咽喉科"},"ja":{"title":"人工内耳インプラント HiRes™ Ultra3D CI HiFocus™ MS Electrode Plus","description":"HiResolutionバイオニックイヤーシステムは、聴神経を電気信号で刺激することにより、重度から最重度感音難聴患者が一定程度の聴覚を回復することを支援する。","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear Implant HiRes™ Ultra3D CI HiFocus™ MS Electrode Plus","description":"The HiResolution Bionic Ear System is intended to help patients with severe to profound sensorineural hearing loss regain a degree of hearing by electrically stimulating the auditory nerve.","specialty":"Otorhinolaryngology"}}},{"id":574,"category":"device","number":368,"langs":{"zh":{"title":"声音处理器Nucleus 8 Sound\nProcessor (Nexa coil)","description":"科利耳 Nucleus® 8 声音处理器（Nexa Coil）适用于植入与之兼容的科利耳 Nucleus 植入体的植入者。本声音处理器与以下科利耳 Nucleus 植入体兼容：• Nexa（CI1000）系列植入体：CI1012、CI1022、CI1032。","specialty":"耳鼻咽喉科"},"ja":{"title":"サウンドプロセッサ Nucleus 8 Sound Processor (Nexa coil)","description":"Cochlear Nucleus® 8サウンドプロセッサ（Nexa Coil）は、互換性のあるCochlear Nucleusインプラントを植込んだ患者に適用する。本サウンドプロセッサは以下のCochlear Nucleusインプラントと互換性がある：• Nexa（CI1000）シリーズ：CI1012、CI1022、CI1032。","specialty":"耳鼻咽喉科"},"en":{"title":"Sound Processor Nucleus 8 Sound Processor (Nexa coil)","description":"The Cochlear Nucleus® 8 sound processor (Nexa Coil) is intended for recipients implanted with compatible Cochlear Nucleus implants. This sound processor is compatible with the following Cochlear Nucleus implants: • Nexa (CI1000) series implants: CI1012, CI1022, CI1032.","specialty":"Otorhinolaryngology"}}},{"id":575,"category":"device","number":369,"langs":{"zh":{"title":"人工耳蜗调机设备MAESTRO 11","description":"该软件用于 MED-EL 人工耳蜗植入体和听觉脑干植入体配置 MED-EL 声音处理器，并进行客观测量。\n人工耳蜗编程界面盒，包括其线圈和线缆一起旨在作为与 MED-EL 设备进行连接的接口用于不同临床应用","specialty":"耳鼻咽喉科"},"ja":{"title":"人工内耳調整装置 MAESTRO 11","description":"本ソフトウェアは、MED-EL人工内耳インプラントおよび聴性脳幹インプラント向けにMED-ELサウンドプロセッサを設定し、客観的測定を行うために使用する。\n人工内耳プログラミング・インターフェースボックスは、コイルおよびケーブルとともに、さまざまな臨床用途でMED-EL装置に接続するためのインターフェースとして使用することを目的とする。","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear Implant Fitting Equipment MAESTRO 11","description":"The software is used to configure MED-EL sound processors for MED-EL cochlear implants and auditory brainstem implants and to perform objective measurements.\nThe cochlear implant programming interface box, together with its coil and cables, is intended as an interface for connection to MED-EL devices in various clinical applications.","specialty":"Otorhinolaryngology"}}},{"id":576,"category":"device","number":370,"langs":{"zh":{"title":"数字一体化骨导助听系统（Contact\nForte）","description":"数字一体化骨导助听系统 CONTACTFORTE 通过处理声音并将其传输到内耳来补偿听力损失。","specialty":"耳鼻咽喉科"},"ja":{"title":"デジタル一体型骨導補聴システム（Contact Forte）","description":"CONTACT FORTEデジタル一体型骨導補聴システムは、音を処理して内耳に伝達することで聴力損失を補償する。","specialty":"耳鼻咽喉科"},"en":{"title":"Integrated Digital Bone-Conduction Hearing System (Contact Forte)","description":"The CONTACT FORTE integrated digital bone-conduction hearing system compensates for hearing loss by processing sound and transmitting it to the inner ear.","specialty":"Otorhinolaryngology"}}},{"id":577,"category":"device","number":371,"langs":{"zh":{"title":"数字骨导助听系统Contact mini","description":"Contact mini 旨在通过处理声音并将其传输到内耳来补偿听力损失。","specialty":"耳鼻咽喉科"},"ja":{"title":"デジタル骨導補聴システム Contact mini","description":"Contact miniは、音を処理して内耳に伝達することで聴力損失を補償することを目的とする。","specialty":"耳鼻咽喉科"},"en":{"title":"Digital Bone-Conduction Hearing System Contact mini","description":"Contact mini is intended to compensate for hearing loss by processing sound and transmitting it to the inner ear.","specialty":"Otorhinolaryngology"}}},{"id":578,"category":"device","number":372,"langs":{"zh":{"title":"数字骨导助听系统Contact Star\nEvo1","description":"Contact star evo1 旨在通过处理声音并将其传输到内耳来补偿听力损失。","specialty":"耳鼻咽喉科"},"ja":{"title":"デジタル骨導補聴システム Contact Star Evo1","description":"Contact star evo1は、音を処理して内耳に伝達することで聴力損失を補償することを目的とする。","specialty":"耳鼻咽喉科"},"en":{"title":"Digital Bone-Conduction Hearing System Contact Star Evo1","description":"Contact star evo1 is intended to compensate for hearing loss by processing sound and transmitting it to the inner ear.","specialty":"Otorhinolaryngology"}}},{"id":579,"category":"device","number":373,"langs":{"zh":{"title":"人工耳蜗调机设备MAESTRO\nSystem Software 9.0","description":"由于 MAESTRO 9.0 人工耳蜗调机设备是MED-EL人工耳蜗植入系统的外部组件，因此适用于MED-EL人工耳蜗植入系统的所有适应症。","specialty":"耳鼻咽喉科"},"ja":{"title":"人工内耳調整装置 MAESTRO System Software 9.0","description":"MAESTRO 9.0人工内耳調整装置はMED-EL人工内耳システムの外部コンポーネントであるため、MED-EL人工内耳システムのすべての適応に適用する。","specialty":"耳鼻咽喉科"},"en":{"title":"Cochlear Implant Fitting Equipment MAESTRO System Software 9.0","description":"Because the MAESTRO 9.0 cochlear implant fitting equipment is an external component of the MED-EL cochlear implant system, it is indicated for all indications of the MED-EL cochlear implant system.","specialty":"Otorhinolaryngology"}}},{"id":580,"category":"device","number":374,"langs":{"zh":{"title":"药物输送系统\n(Dosage delivery\nsystems )","description":"服配药器，Maralixibat 口服液给药使用（限于配套临床急需进口药品Maralixibat 使用）。","specialty":"儿科"},"ja":{"title":"薬剤送達システム\n(Dosage delivery systems)","description":"服薬・投薬器。Maralixibat経口液の投与に使用する（対応する臨床上緊急に必要な輸入医薬品Maralixibatとの併用に限定）。","specialty":"小児科"},"en":{"title":"Dosage Delivery Systems","description":"Medication dosing device for administration of Maralixibat oral solution (limited to use with the supporting clinically urgently needed imported drug Maralixibat).","specialty":"Pediatrics"}}},{"id":581,"category":"device","number":375,"langs":{"zh":{"title":"闭环胰岛素输注系统（Insulin\nManagement System）","description":"闭环胰岛素输注系统(TouchCare系统)适用于2至75岁1型糖尿病患者使用。本系统仅供单个患者使用，并应在医护人员指导下使用。\n胰岛素泵专为需以设定和可调速率连续皮下输注胰岛素的糖尿病患者设计，用于糖尿病管理。\n持续血糖监测系统用于持续监测组织间液中的葡萄糖水平，并检测可能的低血糖和高血糖事件。对CGM系统结果的解读应基于葡萄糖趋势和多次连续读数。\n闭环胰岛素输注系统(TouchCare系统)融入了APGO技术，该技术能够依据持续血糖监测系统(CGM)得出的血糖变化趋势及连续读数，自动调节胰岛素的输注量。无论是否启用APGO功能，胰岛素泵均可正常使用。","specialty":"儿科"},"ja":{"title":"クローズドループ・インスリン注入システム（Insulin Management System）","description":"クローズドループ・インスリン注入システム（TouchCareシステム）は、2～75歳の1型糖尿病患者に適用する。本システムは単一患者専用で、医療従事者の指導下で使用する。\nインスリンポンプは、設定・調整可能な速度でインスリンを持続皮下注入する必要がある糖尿病患者向けに設計され、糖尿病管理に使用する。\n持続血糖モニタリングシステムは、間質液中のグルコース値を持続的に監視し、低血糖・高血糖イベントの可能性を検出する。CGMシステム結果の解釈は、グルコースのトレンドと複数回の連続測定値に基づく。\nクローズドループ・インスリン注入システム（TouchCareシステム）にはAPGO技術が組み込まれ、持続血糖モニタリングシステム（CGM）から得られる血糖変化トレンドと連続測定値に基づき、インスリン注入量を自動調節できる。APGO機能の有効・無効にかかわらず、インスリンポンプは正常に使用できる。","specialty":"小児科"},"en":{"title":"Closed-Loop Insulin Infusion System (Insulin Management System)","description":"The closed-loop insulin infusion system (TouchCare system) is intended for patients aged 2 to 75 years with type 1 diabetes. The system is for use by a single patient only and should be used under the guidance of healthcare professionals.\nThe insulin pump is designed for patients with diabetes who require continuous subcutaneous insulin infusion at set and adjustable rates for diabetes management.\nThe continuous glucose monitoring system is used to continuously monitor glucose levels in interstitial fluid and detect possible hypoglycemic and hyperglycemic events. Interpretation of CGM system results should be based on glucose trends and multiple consecutive readings.\nThe closed-loop insulin infusion system (TouchCare system) incorporates APGO technology, which can automatically adjust insulin delivery based on glucose trends and consecutive readings from the continuous glucose monitoring system (CGM). The insulin pump can function normally whether or not the APGO function is enabled.","specialty":"Pediatrics"}}},{"id":582,"category":"device","number":376,"langs":{"zh":{"title":"注意力缺陷多动障碍经皮神经电刺激器Transcutaneous Electrical Nerve\nStimulator ForAttention Deficit\nHyperactivity Disorder","description":"作为单一疗法，适用于 7 至 12 岁、当前未服用处方 ADHD 药物的儿童注意力缺陷多动障碍（ADHD）患者。该设备仅限按处方用于患者治疗，应在看护者的监督下在睡眠期间使用。","specialty":"儿科"},"ja":{"title":"注意欠如・多動症用経皮的電気神経刺激装置 Transcutaneous Electrical Nerve Stimulator for Attention Deficit Hyperactivity Disorder","description":"単独療法として、現在処方ADHD薬を服用していない7～12歳の注意欠如・多動症（ADHD）患児に適用する。本装置は処方に基づく患者治療に限定され、介護者の監督下で睡眠中に使用する。","specialty":"小児科"},"en":{"title":"Transcutaneous Electrical Nerve Stimulator for Attention Deficit Hyperactivity Disorder","description":"As monotherapy, indicated for children aged 7 to 12 years with attention deficit hyperactivity disorder (ADHD) who are not currently taking prescription ADHD medication. The device is prescription-only for patient treatment and should be used during sleep under caregiver supervision.","specialty":"Pediatrics"}}},{"id":583,"category":"device","number":377,"langs":{"zh":{"title":"抗 PD-L1 (SP142)兔单克隆抗体试剂(免疫组织化学法) (VENTANA\nPD-L1 (SP142) Assay)","description":"用于非小细胞肺癌患者治疗决策的检测","specialty":"病理科"},"ja":{"title":"抗PD-L1（SP142）ウサギモノクローナル抗体試薬（免疫組織化学法）\n(VENTANA PD-L1 (SP142) Assay)","description":"非小細胞肺癌患者の治療方針決定のための検査。","specialty":"病理科"},"en":{"title":"Anti-PD-L1 (SP142) Rabbit Monoclonal Antibody Reagent (Immunohistochemistry)\n(VENTANA PD-L1 (SP142) Assay)","description":"Testing for treatment decision-making in patients with non-small cell lung cancer.","specialty":"Pathology"}}},{"id":584,"category":"device","number":378,"langs":{"zh":{"title":"Negative Control(Monoclonal)\n鼠单克隆阴性质控抗体","description":"鼠单克隆阴性质控抗体预期用于实验室中在BenchMark IHC/ISH仪器上作为福尔马林固定、石蜡包埋组织切片中小鼠免疫球蛋白非特异性结合的质控。","specialty":"病理科"},"ja":{"title":"Negative Control (Monoclonal)\nマウスモノクローナル陰性対照抗体","description":"マウスモノクローナル陰性対照抗体は、研究室でBenchMark IHC/ISH装置を用い、ホルマリン固定パラフィン包埋組織切片におけるマウス免疫グロブリンの非特異的結合を管理するための対照として使用する。","specialty":"病理科"},"en":{"title":"Negative Control (Monoclonal)\nMouse Monoclonal Negative Control Antibody","description":"The mouse monoclonal negative control antibody is intended for laboratory use on BenchMark IHC/ISH instruments as a control for nonspecific binding of mouse immunoglobulin in formalin-fixed, paraffin-embedded tissue sections.","specialty":"Pathology"}}},{"id":585,"category":"device","number":379,"langs":{"zh":{"title":"VENTANA FOLR1 (FOLR1-2.1)\nRxDx Assay\nFOLR1 (FOLR1-2.1) 抗体检测试剂\n（免疫组织化学法）","description":"FOLR1 (FOLR1-2.1) 抗体检测试剂（免疫组织化学法）\n（VENTANA FOLR1 (FOLR1-2.1) RxDx Assay）是一种采用小鼠anti-FOLR1单克隆抗体（克隆FOLR1-2.1）的定性免疫组织化学检测法，预期用于通过光学显微镜评估福尔马林固定、石蜡包埋的上皮性卵巢癌、输卵管癌或原发性腹膜癌组织样本中的叶酸受体α（FOLR1）蛋白。在BenchMark ULTRA 仪器上本抗体试剂与DAB 染色液（OptiView DAB IHC Detection Kit）联合用于对样本进行染色。\nFOLR1 表达的临床cut-off 值为≥ 75%的肿瘤细胞（TC）呈中等和/或强染色强度水平的细胞膜染色。\n该检测适用于辅助识别可能符合ELAHERE（索星-米妥昔单抗）治疗条件的上皮性卵巢癌、输卵管癌或原发性腹膜癌患者。","specialty":"病理科"},"ja":{"title":"VENTANA FOLR1 (FOLR1-2.1) RxDx Assay\nFOLR1 (FOLR1-2.1) 抗体検出試薬（免疫組織化学法）","description":"FOLR1 (FOLR1-2.1) 抗体検出試薬（免疫組織化学法）（VENTANA FOLR1 (FOLR1-2.1) RxDx Assay）は、マウスanti-FOLR1モノクローナル抗体（クローンFOLR1-2.1）を用いた定性的免疫組織化学検査であり、ホルマリン固定パラフィン包埋された上皮性卵巣癌、卵管癌または原発性腹膜癌の組織検体における葉酸受容体α（FOLR1）タンパクを光学顕微鏡で評価することを目的とする。BenchMark ULTRA装置上で、本抗体試薬をDAB染色液（OptiView DAB IHC Detection Kit）と併用して検体を染色する。\nFOLR1発現の臨床cut-off値は、腫瘍細胞（TC）の75%以上が中等度および／または強度の細胞膜染色を示すこと。\n本検査は、ELAHERE（ミルベツキシマブ ソラブタンシン）治療の対象となる可能性がある上皮性卵巣癌、卵管癌または原発性腹膜癌患者の識別を補助する。","specialty":"病理科"},"en":{"title":"VENTANA FOLR1 (FOLR1-2.1) RxDx Assay\nFOLR1 (FOLR1-2.1) Antibody Detection Reagent (Immunohistochemistry)","description":"The FOLR1 (FOLR1-2.1) antibody detection reagent (immunohistochemistry) (VENTANA FOLR1 (FOLR1-2.1) RxDx Assay) is a qualitative immunohistochemical assay using a mouse anti-FOLR1 monoclonal antibody (clone FOLR1-2.1). It is intended for microscopic evaluation of folate receptor alpha (FOLR1) protein in formalin-fixed, paraffin-embedded tissue specimens from epithelial ovarian cancer, fallopian tube cancer, or primary peritoneal cancer. On the BenchMark ULTRA instrument, this antibody reagent is used with DAB staining solution (OptiView DAB IHC Detection Kit) to stain specimens.\nThe clinical cut-off for FOLR1 expression is membranous staining with moderate and/or strong intensity in ≥75% of tumor cells (TC).\nThis test is intended to assist in identifying patients with epithelial ovarian cancer, fallopian tube cancer, or primary peritoneal cancer who may be eligible for ELAHERE (mirvetuximab soravtansine) treatment.","specialty":"Pathology"}}},{"id":586,"category":"device","number":380,"langs":{"zh":{"title":"医疗用高周波温热仪","description":"利用高周波温热治疗癌症","specialty":"肿瘤科"},"ja":{"title":"医療用高周波温熱治療器","description":"高周波温熱療法を利用して癌を治療する。","specialty":"腫瘍科"},"en":{"title":"Medical High-Frequency Hyperthermia Device","description":"Uses high-frequency hyperthermia to treat cancer.","specialty":"Oncology"}}},{"id":587,"category":"device","number":381,"langs":{"zh":{"title":"实体肿瘤基因变异全景检测试剂盒","description":"实体肿瘤基因变异全景检测试剂盒是一款定性体外诊断试剂盒，采用下一代测序技术，对来源于既往已确诊实体恶性肿瘤患者的福尔马林固定石蜡包埋(FFPE)肿瘤组织中提取的DNA进行测序，用于检测探针覆盖范围内的实体瘤多基因的变异。本检测可提供肿瘤体细胞突变谱信息，包括单核苷酸变异(SNVS)、插入缺失变异(indels)、基因拷贝数扩增(1类)、基因重排/融合(4类)微卫星不稳定性(MSI)以及肿瘤突变负荷(TMB)。基于本试剂盒获得的肿瘤样本的变异信息，医疗卫生专业人员可参考相关肿瘤学专业指南进行解读和应用。检测结果不应作为任何特定治疗药物标示适应症的直接处方依据或最终结论。","specialty":"病理科、医学检验科"},"ja":{"title":"固形腫瘍遺伝子変異パノラマ検査キット","description":"固形腫瘍遺伝子変異パノラマ検査キットは、次世代シーケンシング技術を用いる定性的体外診断用キットである。既に固形悪性腫瘍と診断された患者のホルマリン固定パラフィン包埋（FFPE）腫瘍組織から抽出したDNAをシーケンスし、プローブカバー範囲内の固形腫瘍多遺伝子変異を検出する。本検査は、単一塩基変異（SNVs）、挿入・欠失変異（indels）、遺伝子コピー数増幅（1類）、遺伝子再構成／融合（4類）、マイクロサテライト不安定性（MSI）、腫瘍遺伝子変異量（TMB）を含む腫瘍体細胞変異プロファイル情報を提供できる。本キットで得られた腫瘍検体の変異情報は、医療従事者が関連する腫瘍学専門ガイドラインを参照して解釈・利用できる。検査結果は、特定の治療薬の標示適応に対する直接的な処方根拠または最終結論として使用してはならない。","specialty":"病理科・臨床検査科"},"en":{"title":"Panoramic Solid Tumor Gene-Variant Detection Kit","description":"The Panoramic Solid Tumor Gene-Variant Detection Kit is a qualitative in vitro diagnostic kit that uses next-generation sequencing technology to sequence DNA extracted from formalin-fixed, paraffin-embedded (FFPE) tumor tissue from patients with previously diagnosed solid malignancies, for detection of multi-gene variants in solid tumors within the probe coverage range. The test can provide information on the tumor somatic mutation profile, including single nucleotide variants (SNVs), insertion/deletion variants (indels), gene copy-number amplification (1 class), gene rearrangements/fusions (4 classes), microsatellite instability (MSI), and tumor mutational burden (TMB). Healthcare professionals may interpret and apply variant information obtained from tumor samples using this kit with reference to relevant professional oncology guidelines. Test results should not be used as the direct prescribing basis or final conclusion for the labeled indication of any specific therapeutic drug.","specialty":"Pathology, Laboratory Medicine"}}},{"id":588,"category":"device","number":382,"langs":{"zh":{"title":"辅助生殖用培养基","description":"人体胚胎从受精卵到囊胚期的培养、胚胎移植。","specialty":"生殖健康与不孕症科"},"ja":{"title":"生殖補助医療用培養液","description":"ヒト胚を受精卵から胚盤胞期まで培養し、胚移植に使用する。","specialty":"生殖医療・不妊症科"},"en":{"title":"Culture Medium for Assisted Reproduction","description":"Culture of human embryos from fertilized egg to blastocyst stage; embryo transfer.","specialty":"Reproductive Health and Infertility"}}},{"id":589,"category":"device","number":383,"langs":{"zh":{"title":"红外系统(热成像车)（Thermidas IR\nSystem）","description":"作为辅助设备，配合其他临床诊断程序，用于人体所有皮肤区域具有热学意义的病变的诊断成像。该系统用于审查和报告温度分布模式及变化。这些热学模式的价值意义需由专业人员通过调查确定。\n本系统\n不适用于绝对温度测量。仅供受过专业培训的技术人员使用。","specialty":"重症医学科、普外科"},"ja":{"title":"赤外線システム（サーマルイメージングカート）（Thermidas IR System）","description":"補助装置として他の臨床診断手順と組み合わせ、人体のすべての皮膚領域における熱的意義を有する病変の診断画像に使用する。本システムは温度分布パターンおよびその変化の確認・報告に用いる。これらの熱パターンの意義は、専門家が調査により判断する必要がある。\n本システムは絶対温度測定には使用しない。専門的な訓練を受けた技術者のみが使用する。","specialty":"集中治療科・一般外科"},"en":{"title":"Infrared System (Thermal Imaging Cart) (Thermidas IR System)","description":"As an auxiliary device, used together with other clinical diagnostic procedures for diagnostic imaging of thermally significant lesions in (()=>{
const T=window.ANTSU_TEXT;
const getSiteLang=()=>localStorage.getItem('antsuSiteLang')||'ja';
let siteLang=getSiteLang();
function applySiteLang(){
 document.documentElement.lang=siteLang==='ja'?'ja':'en';
 document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(T[siteLang][k]!=null)el.textContent=T[siteLang][k]});
 document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{const k=el.dataset.i18nPlaceholder;if(T[siteLang][k]!=null)el.placeholder=T[siteLang][k]});
 document.querySelectorAll('[data-site-lang]').forEach(b=>b.classList.toggle('active',b.dataset.siteLang===siteLang));
 window.dispatchEvent(new CustomEvent('antsu:lang',{detail:{lang:siteLang}}));
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-site-lang]');if(b){siteLang=b.dataset.siteLang;localStorage.setItem('antsuSiteLang',siteLang);applySiteLang()}});
const menu=document.querySelector('.mobile-menu'), mobile=document.querySelector('.mobile-nav');if(menu&&mobile)menu.addEventListener('click',()=>mobile.classList.toggle('open'));
window.Antsu={getSiteLang:()=>siteLang,applySiteLang};
applySiteLang();
})();

</script><script>
(()=>{

function site(){return window.Antsu?.getSiteLang()||'ja'}
function text(k){return window.ANTSU_TEXT[site()][k]}
function normalize(s){return (s||'').toLowerCase().normalize('NFKC')}
function filtered(){return data.filter(p=>{if(category!=='all'&&p.category!==category)return false;const l=p.langs[productLang];if(specialty&&l.specialty!==specialty)return false;if(query){const hay=normalize(l.title+' '+l.description+' '+l.specialty);if(!hay.includes(normalize(query)))return false}return true})}
function rebuildSpecialties(){const current=select.value;const vals=[...new Set(data.filter(p=>category==='all'||p.category===category).map(p=>p.langs[productLang].specialty).filter(Boolean))].sort((a,b)=>a.localeCompare(b,productLang==='ja'?'ja':'en'));select.innerHTML='';const all=document.createElement('option');all.value='';all.textContent=text('specialtyAll');select.appendChild(all);vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o)});if(vals.includes(current)){select.value=current;specialty=current}else{specialty=''}}

function render(){const rows=filtered();countEl.textContent=`${rows.length} ${text('results')}`;grid.innerHTML='';empty.hidden=rows.length!==0;rows.slice(0,shown).forEach(p=>{const l=p.langs[productLang];const card=document.createElement('article');card.className='product-card';card.innerHTML=`<div class="product-meta"><span class="badge ${p.category}">${esc(catLabel(p.category,site()))}</span><span>No. ${p.number}</span>${l.specialty?`<span>· ${esc(l.specialty)}</span>`:''}</div><h3>${esc(l.title).replace(/\n/g,'<br>')}</h3><div class="product-desc">${esc(l.description)}</div><button class="details-btn" type="button">${text('details')}</button>`;const btn=card.querySelector('.details-btn');btn.addEventListener('click',()=>{card.classList.toggle('expanded');btn.textContent=card.classList.contains('expanded')?text('close'):text('details')});grid.appendChild(card)});load.hidden=rows.length<=shown}
function reset(){shown=30;rebuildSpecialties();render()}
document.querySelectorAll('[data-product-lang]').forEach(b=>b.addEventListener('click',()=>{productLang=b.dataset.productLang;document.querySelectorAll('[data-product-lang]').forEach(x=>x.classList.toggle('active',x===b));reset()}));
document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));reset()}));
document.getElementById('productSearch').addEventListener('input',e=>{query=e.target.value;shown=30;render()});select.addEventListener('change',e=>{specialty=e.target.value;shown=30;render()});load.addEventListener('click',()=>{shown+=30;render()});window.addEventListener('antsu:lang',()=>{rebuildSpecialties();render()});reset();
})();
