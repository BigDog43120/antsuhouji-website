alty":"眼科"},"en":{"title":"Preloaded Micro-Incision Extended Depth-of-Focus Intraocular Lens (Intraocular Lens and Dedicated Injector)","description":"The MINI WELL intraocular lens is intended for visual correction in adult patients, with or without presbyopia, who require primary intraocular lens implantation after cataract extraction, and for visual correction in presbyopic adults who have undergone refractive lens extraction and wish to reduce dependence on spectacles for distance and near vision. The intraocular lens must be implanted in the capsular bag.","specialty":"Ophthalmology"}}},{"id":308,"category":"device","number":103,"langs":{"zh":{"title":"青光眼引流支架（iStent inject® W Trabecular Micro-Bypass System）","description":"拟用于联合白内障手术，降低轻中度原发性开角型青光眼成年患者的眼压（IOP）。","specialty":"眼科"},"ja":{"title":"iStent inject® W Trabecular Micro-Bypass System 緑内障ドレナージステント","description":"白内障手術との併用により、軽度～中等度原発開放隅角緑内障の成人患者の眼圧（IOP）を低下させる目的で使用する。","specialty":"眼科"},"en":{"title":"iStent inject® W Trabecular Micro-Bypass System","description":"Intended for use in conjunction with cataract surgery to reduce intraocular pressure, IOP, in adult patients with mild to moderate primary open-angle glaucoma.","specialty":"Ophthalmology"}}},{"id":309,"category":"device","number":104,"langs":{"zh":{"title":"飞秒白内障人工晶状体 (LACS Aspheric Intraocular Lens)","description":"后房型人工晶状体用于成年患者囊外白内障摘除术或超声乳化手术后无晶状体眼的视力矫正。人工晶状体植入囊袋内。","specialty":"眼科"},"ja":{"title":"LACS Aspheric Intraocular Lens フェムト秒白内障用眼内レンズ","description":"後房型眼内レンズで、成人患者の嚢外白内障摘出術または超音波乳化吸引術後の無水晶体眼視力矯正に使用する。嚢内に植え込む。","specialty":"眼科"},"en":{"title":"LACS Aspheric Intraocular Lens","description":"Posterior chamber intraocular lens for visual correction of aphakia in adult patients following extracapsular cataract extraction or phacoemulsification. The intraocular lens is implanted in the capsular bag.","specialty":"Ophthalmology"}}},{"id":310,"category":"device","number":105,"langs":{"zh":{"title":"白内障激光撕囊手术系统","description":"（白内障激光撕囊手术系统）：CAPSULaser®白内障激光撕囊手术系统被指定用于白内障手术期间的前囊切开术。","specialty":"眼科"},"ja":{"title":"白内障レーザー前嚢切開システム","description":"CAPSULaser®白内障レーザー前嚢切開システムは、白内障手術中の前嚢切開に使用する。","specialty":"眼科"},"en":{"title":"Cataract Laser Capsulotomy System","description":"The CAPSULaser® cataract laser capsulotomy system is designated for anterior capsulotomy during cataract surgery.","specialty":"Ophthalmology"}}},{"id":311,"category":"device","number":106,"langs":{"zh":{"title":"患者界面透镜","description":"患者界面镜片可短暂的放置在角膜上，用作眼科检查的诊断镜片，以及白内障手术期间用于前囊切开术的CAPSULaser®白内障激光撕囊手术系统的辅助设备。","specialty":"眼科"},"ja":{"title":"患者インターフェースレンズ","description":"一時的に角膜上へ配置し、眼科検査の診断用レンズとして、また白内障手術中の前嚢切開に用いるCAPSULaser®白内障レーザー前嚢切開システムの補助機器として使用する。","specialty":"眼科"},"en":{"title":"Patient Interface Lens","description":"The patient interface lens can be placed temporarily on the cornea as a diagnostic lens for ophthalmic examinations and as an accessory to the CAPSULaser® cataract laser capsulotomy system for anterior capsulotomy during cataract surgery.","specialty":"Ophthalmology"}}},{"id":312,"category":"device","number":107,"langs":{"zh":{"title":"囊膜染色剂","description":"通过对晶状体的前囊染色，可用于眼科手术（即适用于白内障手术）","specialty":"眼科"},"ja":{"title":"嚢染色剤","description":"水晶体前嚢を染色することにより眼科手術、すなわち白内障手術、に使用する。","specialty":"眼科"},"en":{"title":"Capsular Staining Agent","description":"For ophthalmic surgery, specifically cataract surgery, by staining the anterior lens capsule.","specialty":"Ophthalmology"}}},{"id":313,"category":"device","number":108,"langs":{"zh":{"title":"强脉冲光治疗仪","description":"该医疗器械采用 OPE（多色光诱导热刺激）和 LIGHT MODULATION（生物刺激单色光（LED）技术，用于在医疗环境中由专业人员（医生/眼科医生）进行以下治疗使用目的： OPE IPL 600nm 治疗睑板腺功能障碍（干眼症）以刺激患者泪膜脂成分的分泌。红色光 LED 由于 LED 发光，它会触发内源性眼睑发热。","specialty":"眼科"},"ja":{"title":"強パルス光治療装置","description":"OPE、多色光誘導熱刺激、とLIGHT MODULATION、生体刺激性単色LED光、技術を使用し、医療環境で医師／眼科医など専門家が以下の治療を行う：OPE IPL 600 nmによるマイボーム腺機能不全、ドライアイ、治療で涙液膜脂質成分の分泌を刺激する。赤色LED光はLED照射により内因性眼瞼加温を誘発する。","specialty":"眼科"},"en":{"title":"Intense Pulsed Light Treatment Device","description":"This medical device uses OPE, polychromatic light-induced thermal stimulation, and LIGHT MODULATION, biostimulatory monochromatic LED light, for professional use by physicians/ophthalmologists in medical settings for the following purposes: OPE IPL 600 nm treatment of meibomian gland dysfunction, dry eye disease, to stimulate secretion of the lipid component of the tear film. Red LED light triggers endogenous eyelid warming through LED emission.","specialty":"Ophthalmology"}}},{"id":314,"category":"device","number":109,"langs":{"zh":{"title":"预装式肝素涂层人工晶状体","description":"白内障患者晶状体摘除术后无晶状体眼的视力矫正。目标患者人群：无晶状体的成人患者（年满 18 岁）","specialty":"眼科"},"ja":{"title":"プレロード式ヘパリンコーティング眼内レンズ","description":"白内障患者の水晶体摘出後の無水晶体眼の視力矯正に使用する。対象患者：18歳以上の無水晶体成人患者。","specialty":"眼科"},"en":{"title":"Preloaded Heparin-Coated Intraocular Lens","description":"For visual correction of aphakia after lens extraction in cataract patients. Target population: aphakic adult patients aged 18 years and older.","specialty":"Ophthalmology"}}},{"id":315,"category":"device","number":110,"langs":{"zh":{"title":"飞秒激光角膜屈光治疗机（含一次性使用无菌负压治疗环、电动手术台）","description":"该产品在医疗机构中使用，用于在下列眼科手术中切割角膜：屈光手术（球镜-0.5D～-10D，柱镜 0D～5D）、穿透性或板层角膜移植术、角膜瓣的制作。本款一次性使用无菌负压治疗环是蔡司飞秒激光角膜屈光治疗机的附件，其预期用途为飞秒激光角膜屈光治疗机的预期用途。本手术台仅用于对人进行手术、治疗和检查。仅能在专用房间内使用本手术台。本手术台只能用于最大体重 250公斤（551 磅）的患者。本手术台只能在专业的医疗机构内使用。与飞秒激光角膜屈光治疗机配合使用。","specialty":"眼科"},"ja":{"title":"フェムト秒レーザー角膜屈折治療装置（ディスポーザブル滅菌吸引治療リング、電動手術台を含む）","description":"医療機関で以下の眼科手術における角膜切開に使用する：屈折手術、球面度数-0.5 D～-10 D、円柱度数0 D～5 D、全層または層状角膜移植術、角膜フラップ作製。ディスポーザブル滅菌吸引治療リングはZEISSフェムト秒レーザー角膜屈折治療装置の付属品で、意図する用途は本体と同じ。手術台は人体の手術、治療、検査のみに使用し、専用室内のみで使用する。最大体重250 kg、551 lb、までの患者にのみ使用でき、専門医療機関でのみ使用する。フェムト秒レーザー角膜屈折治療装置と併用する。","specialty":"眼科"},"en":{"title":"Femtosecond Laser Corneal Refractive Treatment System, Including Disposable Sterile Vacuum Treatment Ring and Electric Operating Table","description":"For use in medical institutions to cut the cornea during the following ophthalmic procedures: refractive surgery, spherical -0.5 D to -10 D and cylindrical 0 D to 5 D; penetrating or lamellar keratoplasty; and creation of corneal flaps. The disposable sterile vacuum treatment ring is an accessory to the ZEISS femtosecond laser corneal refractive treatment system and has the same intended use as the main system. The operating table is used only for surgery, treatment, and examination of humans, only in dedicated rooms, for patients weighing no more than 250 kg, 551 lb, and only in professional medical institutions. It is used in combination with the femtosecond laser corneal refractive treatment system.","specialty":"Ophthalmology"}}},{"id":316,"category":"device","number":111,"langs":{"zh":{"title":"干眼检测仪","description":"Gaush iDea 可以进行评估和支持干眼病（DED）诊断有关的检查，尤其是：\n测量泪河高度：通过自动对设备拍摄照片（直接从干涉仪视频或使用“泪液弯月面”），以毫米为单位测量水样层的量并保存值；\nNIBUT 检查：录制视频，以无创的方式通过破裂时间来评估泪膜的稳定性，并保存其数值；睑板腺成像：使用红外光拍摄睑板腺的照片。该设备可以自动分析腺体的损失面积，并将其与相关的分级等级进行比较；\n眨眼质量检查：通过 Gaush iDea，您可以自动检查患者的眨眼并确定其质量。相机会在正常眨眼过程中记录患者眼睛的视频。该软件将分析该视频，并让您了解患者在眨眼期间如何挤压睑板腺。","specialty":"眼科"},"ja":{"title":"ドライアイ検査装置","description":"Gaush iDeaはドライアイ（DED）の評価・診断支援に関する検査を行う。特に：\n涙液メニスカス高測定：装置撮影画像、干渉計動画から直接、または「涙液メニスカス」機能、を自動利用して水層量をmm単位で測定し保存する。\nNIBUT検査：動画を記録し、非侵襲的に涙液膜破壊時間から安定性を評価し数値を保存する。\nマイボーム腺画像：赤外光でマイボーム腺を撮影し、腺欠損面積を自動解析して関連グレードと比較する。\n瞬目品質検査：患者の瞬目を自動検査し品質を判定する。通常の瞬目中に眼を動画撮影し、ソフトウェアが解析して瞬目時にマイボーム腺がどのように圧迫されるかを確認できる。","specialty":"眼科"},"en":{"title":"Dry Eye Diagnostic Device","description":"Gaush iDea can perform examinations to evaluate and support diagnosis of dry eye disease, DED, especially:\nTear meniscus height measurement: automatically uses images taken by the device, directly from interferometer video or using the tear meniscus function, to measure the aqueous layer in millimeters and save the value;\nNIBUT examination: records video to noninvasively assess tear film stability by breakup time and save the value;\nMeibomian gland imaging: uses infrared light to photograph the meibomian glands. The device can automatically analyze the area of gland loss and compare it with the corresponding grading scale;\nBlink quality examination: Gaush iDea automatically assesses patient blinking and determines blink quality. The camera records the patient's eyes during normal blinking. The software analyzes the video to show how the patient compresses the meibomian glands during blinking.","specialty":"Ophthalmology"}}},{"id":317,"category":"device","number":112,"langs":{"zh":{"title":"近视防控软性角膜接触镜 ACUVUE® Abiliti™ 1-Day Soft Therapeutic Lenses for MyopiaManagement","description":"该产品为日戴型软性角膜接触镜，推荐更换周期 1 天，用于矫正近视（配戴镜片时）并能减缓儿童的近视进展。适用于初始配戴年龄7-12 岁，屈光度为-0.75D 至-4.50D 且散光不大于 1.00D，无眼部疾病有晶体眼并有近视症状需矫正远视力的人群。","specialty":"眼科"},"ja":{"title":"ACUVUE® Abiliti™ 1-Day Soft Therapeutic Lenses for Myopia Management 近視進行抑制用ソフトコンタクトレンズ","description":"終日装用型ソフトコンタクトレンズで、推奨交換周期は1日。装用中の近視矯正と小児の近視進行抑制に使用する。初回装用年齢7～12歳、屈折度-0.75 D～-4.50 D、乱視1.00 D以下、眼疾患のない有水晶体眼で、遠見視力矯正を必要とする近視症状を有する者に適応する。","specialty":"眼科"},"en":{"title":"ACUVUE® Abiliti™ 1-Day Soft Therapeutic Lenses for Myopia Management","description":"Daily-wear soft corneal contact lenses with a recommended replacement interval of 1 day, used to correct myopia while worn and slow myopia progression in children. Intended for initial wearers aged 7–12 years with refractive error from -0.75 D to -4.50 D, astigmatism no greater than 1.00 D, no ocular disease, phakic eyes, and myopic symptoms requiring distance vision correction.","specialty":"Ophthalmology"}}},{"id":318,"category":"device","number":113,"langs":{"zh":{"title":"ELIOS 系统（含医用激光探针）","description":"ELIOS 系统是一款专用于在小梁网状结构内形成贯穿通道（即小梁造瘘术）的激光手术设备。（医用激光探针与配套的 ELIOS 系统共同使用，故适应症与设备一致）","specialty":"眼科"},"ja":{"title":"ELIOSシステム（医療用レーザープローブを含む）","description":"ELIOSシステムは、小柱網内に貫通路を形成する、小柱切開術、ことに特化したレーザー手術装置である。医療用レーザープローブは対応ELIOSシステムと併用するため、適応症は装置と同一。","specialty":"眼科"},"en":{"title":"ELIOS System, Including Medical Laser Probe","description":"The ELIOS system is a laser surgical device specifically designed to create full-thickness channels in the trabecular meshwork, trabeculotomy. The medical laser probe is used with the corresponding ELIOS system and therefore has the same indications.","specialty":"Ophthalmology"}}},{"id":319,"category":"device","number":114,"langs":{"zh":{"title":"EndoArt ®人工角膜内皮层膜片","description":"适用于内皮功能失代偿引发的慢性角膜水肿。","specialty":"眼科"},"ja":{"title":"EndoArt® 人工角膜内皮膜","description":"内皮機能代償不全による慢性角膜浮腫に適応する。","specialty":"眼科"},"en":{"title":"EndoArt® Artificial Corneal Endothelial Layer","description":"For chronic corneal edema caused by endothelial decompensation.","specialty":"Ophthalmology"}}},{"id":320,"category":"device","number":115,"langs":{"zh":{"title":"KeraKlear XT 人工角膜","description":"KeraKlear XT 人工角膜用于成人角膜混浊患者,包括：1、角膜失明的眼睛(最佳矫正思伦视力等于或小于20/200)；2、不适合使用供体组织进行标准穿透性角膜移植术的眼睛；3、拒绝使用供体组织进行标准穿透性角膜移植术的患者的眼睛；4、医学上禁止采取预防移植排斥反应所需辅助措施的眼睛。","specialty":"眼科"},"ja":{"title":"KeraKlear XT 人工角膜","description":"成人の角膜混濁患者に使用し、以下を含む：1. 角膜失明眼、最良矯正Snellen視力20/200以下、2. ドナー組織を用いた標準的全層角膜移植術に適さない眼、3. ドナー組織を用いた標準的全層角膜移植術を拒否する患者の眼、4. 移植拒絶予防に必要な補助措置が医学的に禁忌である眼。","specialty":"眼科"},"en":{"title":"KeraKlear XT Artificial Cornea","description":"For adult patients with corneal opacity, including: 1. eyes with corneal blindness, best-corrected Snellen visual acuity ≤20/200; 2. eyes unsuitable for standard penetrating keratoplasty using donor tissue; 3. eyes of patients who refuse standard penetrating keratoplasty using donor tissue; 4. eyes in which adjunctive measures required to prevent graft rejection are medically contraindicated.","specialty":"Ophthalmology"}}},{"id":321,"category":"device","number":116,"langs":{"zh":{"title":"微创巩膜造口系统 Minimally Invasive Micro Sclerostomy（MIMS）System","description":"眼科手术器械用于青光眼的前房穿刺以降低高眼压","specialty":"眼科"},"ja":{"title":"Minimally Invasive Micro Sclerostomy（MIMS）System 微小侵襲強膜造口システム","description":"緑内障に対し前房穿刺を行い高眼圧を低下させる眼科手術器具。","specialty":"眼科"},"en":{"title":"Minimally Invasive Micro Sclerostomy (MIMS) System","description":"Ophthalmic surgical instrument used for anterior chamber puncture in glaucoma to reduce elevated intraocular pressure.","specialty":"Ophthalmology"}}},{"id":322,"category":"device","number":117,"langs":{"zh":{"title":"MIMS® surgical device Disposable Handpiece（DHP）一次性使用手术工具","description":"一次性使用手术工具与微创巩膜造口系统配合使用，故适应症与设备一致：眼科手术器械用于青光眼的前房穿刺以降低高眼压","specialty":"眼科"},"ja":{"title":"MIMS® Surgical Device Disposable Handpiece（DHP）ディスポーザブル手術器具","description":"微小侵襲強膜造口システムと併用するため、適応症は装置と同一：緑内障に対し前房穿刺を行い高眼圧を低下させる眼科手術器具。","specialty":"眼科"},"en":{"title":"MIMS® Surgical Device Disposable Handpiece (DHP)","description":"The disposable surgical instrument is used with the minimally invasive micro sclerostomy system and therefore has the same indication: an ophthalmic surgical instrument used for anterior chamber puncture in glaucoma to reduce elevated intraocular pressure.","specialty":"Ophthalmology"}}},{"id":323,"category":"device","number":118,"langs":{"zh":{"title":"衍射型多焦点人工晶状体 Intraocular lens","description":"IOL用于替代天然晶状体，以获得白内障晶状体被摘除后成年患者无晶状体眼的视力矫正。IOL适用于希望从老花眼矫正和降低眼镜依赖性中受益的患者。预期植入在囊袋中。\n散光矫正型IOL:也适用于矫正规则性角膜散光。","specialty":"眼科"},"ja":{"title":"回折型多焦点眼内レンズ","description":"天然水晶体を置換し、白内障水晶体摘出後の成人無水晶体眼の視力矯正に使用する。老視矯正と眼鏡依存低減の恩恵を希望する患者に適応し、嚢内植込みを予定する。\n乱視矯正型IOLは規則性角膜乱視の矯正にも適応する。","specialty":"眼科"},"en":{"title":"Diffractive Multifocal Intraocular Lens","description":"The IOL replaces the natural lens to provide visual correction of aphakia in adult patients after cataract lens extraction. It is intended for patients who wish to benefit from presbyopia correction and reduced spectacle dependence. It is intended for implantation in the capsular bag.\nToric IOLs are also intended to correct regular corneal astigmatism.","specialty":"Ophthalmology"}}},{"id":324,"category":"device","number":119,"langs":{"zh":{"title":"角膜交联核黄素溶液","description":"Riboflavin solution for corneal cross-linking\n\n角膜交联核黄素溶液与角膜交联紫外光照射仪结合应用于眼科，以进行角膜交联过程\n选择性适应症\n\n圆锥角膜和/或继发性扩张；\n进行性圆锥角膜；\n1、2、3期圆锥角膜；\n圆锥角膜，在生物显微镜下有透明角膜(透明角膜)。\n附加适应症\n光学矫正依从性差的非进行性圆锥角膜；\n小儿进行性圆锥角膜；\n角膜曲率≤ 62 D 的圆锥角膜；\n圆锥角膜伴 Vogt 条纹\n圆锥角膜伴接触镜不耐受；\n圆锥角膜，在不能通过眼镜和/或隐形眼镜进行光学矫正的患者-感染性角膜炎。（与角膜交联紫外光照射仪共用适应症）","specialty":"眼科"},"ja":{"title":"角膜クロスリンキング用リボフラビン溶液","description":"角膜クロスリンキング用紫外線照射装置と併用し、眼科で角膜クロスリンキング処置を行う。\n選択適応：\n円錐角膜および／または続発性拡張。\n進行性円錐角膜。\n1、2、3期円錐角膜。\n生体顕微鏡で透明角膜を認める円錐角膜。\n追加適応：\n光学矯正へのコンプライアンスが不良な非進行性円錐角膜。\n小児進行性円錐角膜。\n角膜曲率≤62 Dの円錐角膜。\nVogt線条を伴う円錐角膜。\nコンタクトレンズ不耐容を伴う円錐角膜。\n眼鏡および／またはコンタクトレンズによる光学矯正ができない円錐角膜患者。\n感染性角膜炎。角膜クロスリンキング用紫外線照射装置と共通の適応症。","specialty":"眼科"},"en":{"title":"Riboflavin Solution for Corneal Cross-Linking","description":"Riboflavin solution for corneal cross-linking is used in ophthalmology together with a corneal cross-linking UV irradiation device to perform corneal cross-linking.\nSelective indications:\nkeratoconus and/or secondary ectasia;\nprogressive keratoconus;\nstage 1, 2, or 3 keratoconus;\nkeratoconus with a clear cornea on biomicroscopy.\nAdditional indications:\nnon-progressive keratoconus with poor compliance with optical correction;\npediatric progressive keratoconus;\nkeratoconus with corneal curvature ≤62 D;\nkeratoconus with Vogt striae;\nkeratoconus with contact lens intolerance;\nkeratoconus in patients who cannot be optically corrected with spectacles and/or contact lenses;\ninfectious keratitis. These indications are shared with the corneal cross-linking UV irradiation device.","specialty":"Ophthalmology"}}},{"id":325,"category":"device","number":120,"langs":{"zh":{"title":"角膜交联紫外光照射仪","description":"UV-A light emitter for corneal cross-linking\n\n用于治疗圆锥角膜、角膜扩张(屈光手术或医源性手术后)、感染性角膜炎、PMD(透明边缘性角膜变性)、无菌角膜溶解、大泡性角膜病变","specialty":"眼科"},"ja":{"title":"角膜クロスリンキング用UV-A照射装置","description":"円錐角膜、屈折手術または医原性手術後の角膜拡張、感染性角膜炎、PMD、ペルーシド角膜辺縁変性、無菌性角膜融解、水疱性角膜症の治療に使用する。","specialty":"眼科"},"en":{"title":"UV-A Light Emitter for Corneal Cross-Linking","description":"For treatment of keratoconus, corneal ectasia after refractive or iatrogenic surgery, infectious keratitis, PMD, pellucid marginal degeneration, sterile corneal melting, and bullous keratopathy.","specialty":"Ophthalmology"}}},{"id":326,"category":"device","number":121,"langs":{"zh":{"title":"Presbia Flexivue Microlens™","description":"柔性眼睛微晶片\n\n柔性角膜微晶片是用来改善成年老视患者的近视力。本产品应在非主视眼角膜基质制造囊袋而植入，囊袋的制备必须使用150kHz或更高重复频率的飞秒激光。本产品应精确定位于视轴的中心，最大化改善患者近视力，同时远视力和对比敏感度的降低最小。","specialty":"眼科"},"ja":{"title":"Presbia Flexivue Microlens™","description":"成人老視患者の近見視力を改善する柔軟性角膜マイクロレンズ。非優位眼の角膜実質にポケットを作製して植え込み、ポケット作製には150 kHz以上の反復周波数を持つフェムト秒レーザーを使用する。本品を視軸中心に正確に配置し、近見視力改善を最大化しつつ遠見視力とコントラスト感度低下を最小化する。","specialty":"眼科"},"en":{"title":"Presbia Flexivue Microlens™","description":"Flexible corneal microlens used to improve near vision in adult presbyopic patients. The device should be implanted into a stromal pocket created in the cornea of the nondominant eye. The pocket must be created using a femtosecond laser with a repetition frequency of 150 kHz or higher. The device should be precisely centered on the visual axis to maximize improvement in near vision while minimizing reduction in distance vision and contrast sensitivity.","specialty":"Ophthalmology"}}},{"id":327,"category":"device","number":122,"langs":{"zh":{"title":"Medone®polyTip®Cannula 25/38 set","description":"视网膜下注射套件\n\n眼科视网膜下注射","specialty":"眼科"},"ja":{"title":"Medone® polyTip® Cannula 25/38 set","description":"網膜下注射セット。\n眼科網膜下注射に使用する。","specialty":"眼科"},"en":{"title":"Medone® polyTip® Cannula 25/38 Set","description":"Subretinal injection set.\nFor ophthalmic subretinal injection.","specialty":"Ophthalmology"}}},{"id":328,"category":"device","number":123,"langs":{"zh":{"title":"内界膜和视网膜前膜双层染色剂","description":"Brilliant Peel® Dual Dye\n\n用于内界膜(ILM)选择性染色的无菌染料和选择性地对视网膜前膜(ERM)进行染色","specialty":"眼科"},"ja":{"title":"Brilliant Peel® Dual Dye 内境界膜・網膜前膜二重染色剤","description":"内境界膜（ILM）を選択的に染色し、網膜前膜（ERM）も選択的に染色する滅菌色素。","specialty":"眼科"},"en":{"title":"Brilliant Peel® Dual Dye for Internal Limiting Membrane and Epiretinal Membrane","description":"Sterile dye for selective staining of the internal limiting membrane, ILM, and selective staining of the epiretinal membrane, ERM.","specialty":"Ophthalmology"}}},{"id":329,"category":"device","number":124,"langs":{"zh":{"title":"植入式微型黄斑镜","description":"Implantable Miniature Telescopes (IMT)\n\n适用于55岁或以上患有稳定中度至重度视力障碍患者由于终末期年龄相关性黄斑变性导致的双眼中央暗点","specialty":"眼科"},"ja":{"title":"Implantable Miniature Telescope（IMT）植込み型小型黄斑望遠鏡","description":"55歳以上で安定した中等度～重度視覚障害があり、終末期加齢黄斑変性による両眼中心暗点を有する患者に適応する。","specialty":"眼科"},"en":{"title":"Implantable Miniature Telescope (IMT)","description":"For patients aged 55 years and older with stable moderate to severe visual impairment and bilateral central scotomas caused by end-stage age-related macular degeneration.","specialty":"Ophthalmology"}}},{"id":330,"category":"device","number":125,"langs":{"zh":{"title":"elita Femtosecond Laser","description":"飞秒激光角膜屈光治疗机\n\nELITA 系统适用于角膜屈光透镜摘除，以减少或消除有或无散光的最高-12.00D球体近视，最高-6.00D柱近视，以及使负柱面法则在-1.00D和-12.00D之间的球体和柱近视。ELITA 系统适用于年满或以上的患者，记录表明在过去年中表现出稳定的显性折射，表现为0.50D的显性折射球镜等值(MRSE)的变化。","specialty":"眼科"},"ja":{"title":"elita Femtosecond Laser","description":"フェムト秒レーザー角膜屈折治療装置。\nELITAシステムは角膜屈折レンチクル摘出に使用し、乱視の有無を問わず球面近視最大-12.00 D、円柱近視最大-6.00 D、およびマイナスシリンダー表記で球面・円柱近視が-1.00 D～-12.00 Dの範囲にある近視を低減または消失させる。所定年齢以上で、過去1年間に顕性屈折が安定し、顕性屈折球面等価（MRSE）の変化が0.50 D以内であることが記録された患者に適応する。","specialty":"眼科"},"en":{"title":"elita Femtosecond Laser","description":"Femtosecond laser corneal refractive treatment system.\nThe ELITA system is intended for corneal refractive lenticule extraction to reduce or eliminate spherical myopia up to -12.00 D with or without astigmatism, cylindrical myopia up to -6.00 D, and spherical and cylindrical myopia under minus-cylinder convention between -1.00 D and -12.00 D. The ELITA system is intended for patients of the specified age or older whose records show stable manifest refraction over the previous year, defined as a change of 0.50 D in manifest refraction spherical equivalent, MRSE.","specialty":"Ophthalmology"}}},{"id":331,"category":"device","number":126,"langs":{"zh":{"title":"elita PATIENT INTERFACE","description":"病人接口组件\n\n配合飞秒激光角膜屈光治疗机（型号：elita Femtosecond Laser）使用时固定患者眼球。","specialty":"眼科"},"ja":{"title":"elita PATIENT INTERFACE","description":"elita Femtosecond Laserと併用する際に患者眼球を固定する患者インターフェース部品。","specialty":"眼科"},"en":{"title":"elita PATIENT INTERFACE","description":"Patient interface component used to stabilize the patient's eye when used with the elita Femtosecond Laser.","specialty":"Ophthalmology"}}},{"id":332,"category":"device","number":127,"langs":{"zh":{"title":"AddOn IOL","description":"AddOn附加式人工晶状体\n\nAddon 附加式人工晶状体可植入眼后房睫状沟中，适用于已植入囊袋人工晶状体的患者。\n单焦点晶状体\nA4SW00 为植入囊袋人工晶状体的患者提供屈光矫正。\n三焦点散光晶状体\nA4EW0M、A4DW0M为植入囊袋人工晶状体的患者提供近距离和中距离视力以提高脱镜率，并提供屈光度数的调整。\n单焦点散光晶状体\nA4TW0T、A4TW00、A4FW0T、A4FW00 为植入囊袋人工晶状体的患者提供角膜散光矫正，并提供屈光度数的调整。\n衍射散光晶状体\nA4HW0M 为植入囊袋人工晶状体的患者提供良好的近距离和中距离视力以提高脱镜率，进行角膜散光矫正，并提供屈光度数的调整。","specialty":"眼科"},"ja":{"title":"AddOn IOL","description":"AddOn追加眼内レンズ。\n後房毛様溝に植え込み、すでに嚢内眼内レンズを植え込んでいる患者に適応する。\n単焦点レンズ：A4SW00は屈折矯正を提供する。\n三焦点乱視レンズ：A4EW0M、A4DW0Mは近距離・中距離視力を提供して脱眼鏡率を高め、屈折度数調整も行う。\n単焦点乱視レンズ：A4TW0T、A4TW00、A4FW0T、A4FW00は角膜乱視矯正と屈折度数調整を行う。\n回折型乱視レンズ：A4HW0Mは良好な近距離・中距離視力を提供し脱眼鏡率を高め、角膜乱視矯正と屈折度数調整を行う。","specialty":"眼科"},"en":{"title":"AddOn IOL","description":"AddOn supplementary intraocular lens.\nThe AddOn supplementary IOL can be implanted in the ciliary sulcus of the posterior chamber and is intended for patients who already have an intraocular lens implanted in the capsular bag.\nMonofocal lens: A4SW00 provides refractive correction for patients with a capsular-bag IOL.\nTrifocal toric lens: A4EW0M and A4DW0M provide near and intermediate vision to improve spectacle independence and allow refractive power adjustment.\nMonofocal toric lens: A4TW0T, A4TW00, A4FW0T and A4FW00 provide correction of corneal astigmatism and refractive power adjustment.\nDiffractive toric lens: A4HW0M provides good near and intermediate vision to improve spectacle independence, corrects corneal astigmatism, and allows refractive power adjustment.","specialty":"Ophthalmology"}}},{"id":333,"category":"device","number":128,"langs":{"zh":{"title":"GLAUCOMA DRAINAGE DEVICES","description":"青光眼引流装置\n\n适用于药物或传统手术治疗无效的成人青光眼患者，或传统手术治疗失败的成人青光眼患者","specialty":"眼科"},"ja":{"title":"GLAUCOMA DRAINAGE DEVICES 緑内障ドレナージ装置","description":"薬物または従来手術が無効な成人緑内障患者、または従来手術が不成功であった成人緑内障患者に適応する。","specialty":"眼科"},"en":{"title":"GLAUCOMA DRAINAGE DEVICES","description":"For adult glaucoma patients in whom medication or conventional surgical treatment is ineffective, or adult glaucoma patients in whom conventional surgery has failed.","specialty":"Ophthalmology"}}},{"id":334,"category":"device","number":129,"langs":{"zh":{"title":"茶树油眼睑日常护理泡沫剂Naviblef Daily Care","description":"Naviblef Daily Care能有效去除眼睑上的过多油脂、花粉和其他残留物，这些残留物会增加刺激、睑缘炎（由于存在毛囊蠕形螨和细菌感染或干眼症状而引起的）风险。\n对于已经使用Naviblef Intensive Care进行睑缘炎治疗的患者，推荐将Naviblef Daily Care作为维持治疗。","specialty":"眼科"},"ja":{"title":"Naviblef Daily Care ティーツリーオイル眼瞼デイリーケアフォーム","description":"眼瞼上の過剰な油脂、花粉、その他残留物を効果的に除去する。これらは刺激や、ニキビダニ・細菌感染・ドライアイ症状に関連する眼瞼炎リスクを高める。\nNaviblef Intensive Careで眼瞼炎治療を行った患者には、Naviblef Daily Careを維持療法として推奨する。","specialty":"眼科"},"en":{"title":"Naviblef Daily Care Tea Tree Oil Eyelid Daily Care Foam","description":"Naviblef Daily Care effectively removes excess oils, pollen, and other residues from the eyelids that can increase the risk of irritation and blepharitis caused by Demodex mites, bacterial infection, or dry-eye symptoms.\nFor patients who have already used Naviblef Intensive Care to treat blepharitis, Naviblef Daily Care is recommended as maintenance treatment.","specialty":"Ophthalmology"}}},{"id":335,"category":"device","number":130,"langs":{"zh":{"title":"交联透明质酸钠/辅酶 Q10/维生素 E TPGS 滴眼液VISUXL","description":"VISUXL 是一种不含防腐剂的眼科、润滑和抗氧化溶液，由辅酶 Q10、维生素 E TPGS 和交联透明质酸盐组成。交联透明质酸是一种比非交联形式更稳定、更有效的透明质酸形式，使 VISUXL 具有更好的粘弹性、粘膜模拟和保湿性能，并且随着时间的推移更有效。交联透明质酸和抗氧化剂/抗自由基物质的组合在以下情况下提供了更有效的治疗：\n③ 干眼症；\n③ 屈光手术、异物创伤和手术后角膜和结膜表面连续性的改变；\n③ 与代谢紊乱（糖尿病）相关的眼表改变；\n③ 环境压力（烟雾、氯化水、微气候变化、烟、空调）；\n③ 强烈和长时间暴露于紫外线和电离辐射；\n③ 长时间使用电脑、显示器或电视。","specialty":"眼科"},"ja":{"title":"VISUXL 架橋ヒアルロン酸ナトリウム／コエンザイムQ10／ビタミンE TPGS点眼液","description":"VISUXLは防腐剤を含まない眼科用潤滑・抗酸化溶液で、コエンザイムQ10、ビタミンE TPGS、架橋ヒアルロン酸塩からなる。架橋ヒアルロン酸は非架橋型より安定で有効な形態で、VISUXLに優れた粘弾性、粘膜模倣性、保湿性を与え、時間経過とともにより有効に作用する。架橋ヒアルロン酸と抗酸化／抗フリーラジカル物質の組み合わせは以下でより有効な治療を提供する：\nドライアイ。\n屈折手術、異物外傷、手術後の角膜・結膜表面連続性変化。\n代謝異常、糖尿病、に伴う眼表面変化。\n環境ストレス、煙、塩素処理水、微気候変化、喫煙、空調。\n強い・長時間の紫外線および電離放射線曝露。\nコンピュータ、モニター、テレビの長時間使用。","specialty":"眼科"},"en":{"title":"VISUXL Cross-Linked Sodium Hyaluronate/Coenzyme Q10/Vitamin E TPGS Eye Drops","description":"VISUXL is a preservative-free ophthalmic lubricating and antioxidant solution containing coenzyme Q10, vitamin E TPGS, and cross-linked hyaluronate. Cross-linked hyaluronic acid is a more stable and effective form than non-cross-linked hyaluronic acid, giving VISUXL improved viscoelastic, mucomimetic, and moisturizing properties and greater effectiveness over time. The combination of cross-linked hyaluronic acid and antioxidant/free-radical scavenging substances provides more effective treatment in the following situations:\ndry eye disease;\nchanges in corneal and conjunctival surface continuity after refractive surgery, foreign-body trauma, and surgery;\nocular surface changes associated with metabolic disorders, diabetes;\nenvironmental stress, smoke, chlorinated water, microclimate changes, smoking, air conditioning;\nintense and prolonged exposure to ultraviolet and ionizing radiation;\nprolonged use of computers, displays, or television.","specialty":"Ophthalmology"}}},{"id":336,"category":"device","number":131,"langs":{"zh":{"title":"茶树油眼睑加强护理泡沫剂Naviblef Intensive Care","description":"Naviblef Intensive Care适用于卫生和机械去除睫毛和眼睑上的严重眼部分泌物和碎屑，这些是由睑缘炎和睑结膜炎、细菌或蠕形螨(眼睑螨虫)、干眼、隐形眼镜佩戴或眼部手术引起的炎症引起的。\nNaviblef Intensive Care可以帮助降低眼睑和睫毛上的细菌和蠕形螨引起的感染风险，在眼部手术前后也是如此。","specialty":"眼科"},"ja":{"title":"Naviblef Intensive Care ティーツリーオイル眼瞼集中ケアフォーム","description":"眼瞼炎・眼瞼結膜炎、細菌またはニキビダニ、眼瞼ダニ、ドライアイ、コンタクトレンズ装用、眼科手術による炎症で生じる、睫毛・眼瞼上の重度眼分泌物やデブリを衛生的・機械的に除去する。\n眼瞼・睫毛上の細菌・ニキビダニによる感染リスクを低減するのに役立ち、眼科手術前後にも使用できる。","specialty":"眼科"},"en":{"title":"Naviblef Intensive Care Tea Tree Oil Eyelid Foam","description":"Naviblef Intensive Care is intended for hygienic and mechanical removal of severe ocular secretions and debris from eyelashes and eyelids caused by inflammation related to blepharitis and blepharoconjunctivitis, bacterial infection or Demodex, eyelid mites, dry eye, contact lens wear, or ocular surgery.\nIt can help reduce the risk of infection caused by bacteria and Demodex on the eyelids and eyelashes, including before and after ocular surgery.","specialty":"Ophthalmology"}}},{"id":337,"category":"device","number":132,"langs":{"zh":{"title":"交联羧甲基纤维素钠/辅酶 Q10/维生素 E TPGS 眼用凝胶","description":"VisuXL 凝胶是一种不含防腐剂的眼用凝胶，含有润滑和抗氧化成分：辅酶 Q10、维生素E TPGS 和交联羧甲基纤维素钠。VisuXL凝胶适合白天和夜间使用。交联羧甲基纤维素钠和抗氧化剂/抗自由基物质的结合使 VisuXL 凝胶成为以下情况的高效治疗剂：\n• 中度至重度干眼症；\n• 异物外伤；\n• 屈光角膜手术和角膜移植后角膜和结膜表面连续性的改变。为了缓解典型的术后症状，VisuXL 凝胶可作为眼睑与角膜和结膜上皮之间的缓冲垫；\n• 与代谢紊乱（糖尿病）相关的眼表改变。","specialty":"眼科"},"ja":{"title":"架橋カルボキシメチルセルロースナトリウム／コエンザイムQ10／ビタミンE TPGS眼用ゲル","description":"VisuXL Gelは防腐剤を含まない眼用ゲルで、コエンザイムQ10、ビタミンE TPGS、架橋カルボキシメチルセルロースナトリウムを含む。昼夜使用可能。架橋カルボキシメチルセルロースナトリウムと抗酸化／抗フリーラジカル物質の組み合わせにより以下に有効：\n• 中等度～重度ドライアイ。\n• 異物外傷。\n• 屈折角膜手術・角膜移植後の角膜・結膜表面連続性変化。典型的術後症状の緩和のため、眼瞼と角膜・結膜上皮間の緩衝材として作用する。\n• 代謝異常、糖尿病、に伴う眼表面変化。","specialty":"眼科"},"en":{"title":"Cross-Linked Sodium Carboxymethylcellulose/Coenzyme Q10/Vitamin E TPGS Ophthalmic Gel","description":"VisuXL Gel is a preservative-free ophthalmic gel containing lubricating and antioxidant ingredients: coenzyme Q10, vitamin E TPGS, and cross-linked sodium carboxymethylcellulose. It is suitable for daytime and nighttime use. The combination of cross-linked sodium carboxymethylcellulose and antioxidant/free-radical scavenging substances makes VisuXL Gel an effective treatment for:\n• moderate to severe dry eye disease;\n• foreign-body trauma;\n• changes in corneal and conjunctival surface continuity after refractive corneal surgery and corneal transplantation. To relieve typical postoperative symptoms, VisuXL Gel can act as a buffer between the eyelid and corneal/conjunctival epithelium;\n• ocular surface changes associated with metabolic disorders, diabetes.","specialty":"Ophthalmology"}}},{"id":338,"category":"device","number":133,"langs":{"zh":{"title":"复方ω-3 多不饱和脂肪酸维生素 A 棕榈酸酯滴眼液VisuEVO","description":"VisuEVO®是一种创新配方，含有 omega-3 必需脂肪酸、维生素 A 和 D 以及超滤磷脂。\n由于脂质体（磷脂）、Omega-3 和维生素 D 的存在，VisuEVO®可减少由眼睛表面炎症引起的泪膜过度蒸发。维生素 A 和磷脂是泪膜的天然成分。它们的抗氧化作用可以防止活性氧造成的损伤，促进泪膜的平衡和保留，以及控制其蒸发。Omega-3、维生素 D 和磷脂可改善泪膜的渗透性，保护其免受过度蒸发引起的炎症。由于其配方，VisuEVO®适用于：\n\n对于所有形式的蒸发性干眼症，通过减少水相（即泪膜）的蒸发来提高脂质层的稳定性（例如，长时间使用电脑、阅读、驾驶、使用药物、眼部过敏和隐形眼镜都可能引起）；\n2.作为眼科手术的预处理，以帮助恢复眼睛表面的脂质完整性；\n3.用于因睑板腺脂质分泌减少引起的干眼症；\n4.用于因黏蛋白缺乏引起的干眼症；\n5.适用于因使用含防腐剂滴眼液而导致干眼症恶化的情况。","specialty":"眼科"},"ja":{"title":"VisuEVO 複合ω-3多価不飽和脂肪酸・ビタミンAパルミチン酸エステル点眼液","description":"VisuEVO®はomega-3必須脂肪酸、ビタミンA・D、限外濾過リン脂質を含む革新的処方。\nリポソーム、リン脂質、Omega-3、ビタミンDにより、眼表面炎症による涙液膜の過剰蒸発を低減する。ビタミンAとリン脂質は涙液膜の天然成分で、抗酸化作用により活性酸素損傷を防ぎ、涙液膜バランス・保持を促し、蒸発を制御する。Omega-3、ビタミンD、リン脂質は涙液膜透過性を改善し、過剰蒸発による炎症から保護する。適応：\n1. あらゆる蒸発亢進型ドライアイで、水相、涙液膜、の蒸発を減らして脂質層安定性を高める。長時間のPC使用、読書、運転、薬剤使用、眼アレルギー、コンタクトレンズなどが原因となり得る。\n2. 眼科手術前処置として眼表面の脂質完全性回復を補助する。\n3. マイボーム腺脂質分泌低下によるドライアイ。\n4. ムチン欠乏によるドライアイ。\n5. 防腐剤含有点眼液でドライアイが悪化した場合。","specialty":"眼科"},"en":{"title":"VisuEVO Compound Omega-3 Polyunsaturated Fatty Acid/Vitamin A Palmitate Eye Drops","description":"VisuEVO® is an innovative formulation containing omega-3 essential fatty acids, vitamins A and D, and ultrafiltered phospholipids.\nBecause of the presence of liposomes, phospholipids, omega-3, and vitamin D, VisuEVO® can reduce excessive tear-film evaporation caused by ocular surface inflammation. Vitamin A and phospholipids are natural components of the tear film. Their antioxidant action can prevent damage from reactive oxygen species, promote tear-film balance and retention, and control evaporation. Omega-3, vitamin D, and phospholipids can improve tear-film permeability and protect against inflammation caused by excessive evaporation. The formulation is intended for:\n1. all forms of evaporative dry eye, improving lipid-layer stability by reducing evaporation of the aqueous phase, tear film, including conditions potentially caused by prolonged computer use, reading, driving, medication use, ocular allergy, and contact lens wear;\n2. pretreatment before ophthalmic surgery to help restore lipid integrity of the ocular surface;\n3. dry eye caused by reduced meibomian gland lipid secretion;\n4. dry eye caused by mucin deficiency;\n5. worsening of dry eye caused by preservative-containing eye drops.","specialty":"Ophthalmology"}}},{"id":339,"category":"device","number":134,"langs":{"zh":{"title":"辅酶 Q10 维生素 E TPGS 滴眼液","description":"COQUN\n\nCOQUN®是一种无菌、不含防腐剂的滴眼液，含有辅酶Q10 和维生素 E TPGS 这两种抗氧化物质，COQUN®可作为抗高血压青光眼治疗（降低高眼压）的补充疗法，因为它具有对抗与这种病理密切相关的氧化损伤的能力。","specialty":"眼科"},"ja":{"title":"COQUN コエンザイムQ10・ビタミンE TPGS点眼液","description":"COQUN®はコエンザイムQ10とビタミンE TPGSという2種の抗酸化物質を含む滅菌・防腐剤無添加点眼液。高眼圧を低下させる緑内障治療の補助療法として使用でき、この病態と密接に関連する酸化損傷に対抗する能力を有する。","specialty":"眼科"},"en":{"title":"COQUN Coenzyme Q10/Vitamin E TPGS Eye Drops","description":"COQUN® is a sterile, preservative-free eye drop containing the antioxidants coenzyme Q10 and vitamin E TPGS. It can be used as adjunctive therapy to ocular hypotensive glaucoma treatment, reduction of elevated intraocular pressure, because of its ability to counter oxidative damage closely associated with this condition.","specialty":"Ophthalmology"}}},{"id":340,"category":"device","number":135,"langs":{"zh":{"title":"日抛视力矫正用着色隐形眼镜","description":"（SEED 1dayPure EDOF）\n\n视力矫正","specialty":"眼科"},"ja":{"title":"SEED 1dayPure EDOF 1日使い捨て着色視力矯正コンタクトレンズ","description":"視力矯正。","specialty":"眼科"},"en":{"title":"SEED 1dayPure EDOF Daily Disposable Tinted Contact Lens for Vision Correction","description":"Vision correction.","specialty":"Ophthalmology"}}},{"id":341,"category":"device","number":136,"langs":{"zh":{"title":"眼科玻璃体视网膜及白内障超声乳化手术设备UNITY VCS","description":"眼科玻璃体视网膜及白内障超声乳化手术设备及其兼容的手术附件配合使用时，适用于前节（即超声乳化和白内障摘除）和后节（即玻璃体视网膜）眼科手术。此外，当配备激光时，该系统适用于光凝术（即玻璃体视网膜和黄斑病变）。","specialty":"眼科"},"ja":{"title":"UNITY VCS 眼科硝子体網膜・白内障超音波乳化手術装置","description":"対応手術付属品と併用し、前眼部、超音波乳化・白内障摘出、および後眼部、硝子体網膜、手術に使用する。レーザー搭載時は光凝固術、硝子体網膜・黄斑病変、にも適応する。","specialty":"眼科"},"en":{"title":"UNITY VCS Vitreoretinal and Cataract Phacoemulsification Surgical System","description":"When used with compatible surgical accessories, the system is intended for anterior segment ophthalmic surgery, phacoemulsification and cataract extraction, and posterior segment vitreoretinal surgery. When equipped with a laser, it is also intended for photocoagulation, including vitreoretinal and macular lesions.","specialty":"Ophthalmology"}}},{"id":342,"category":"device","number":137,"langs":{"zh":{"title":"眼科玻璃体视网膜及白内障超声乳化手术设备的手术附件Unity Vitreoretina1 Ca taract System andaccessories","description":"①复合功能玻切头：适用于后节眼科手术。\n②联合功能玻切头：适用于前节和后节手术。\n③前节超乳包附件：适用于前节眼科手术。\n④前节玻切头：适用于前节眼科手术。\n⑤后节玻切头：适用于后节眼科手术。\n⑥一次性使用眼内多点激光光纤：适用于后节眼科手术。\n⑦高性能自闭阀穿刺系统：适用于后节眼科手术。\n⑧吊顶照明光纤：适用于后节眼科手术。\n⑨粉碎部件：适用于后节眼科手术。\n⑩高效硅油注吸套包：适用于后节眼科手术。","specialty":"眼科"},"ja":{"title":"Unity Vitreoretinal Cataract System and Accessories","description":"①複合機能硝子体カッター：後眼部手術。\n②前後眼部兼用硝子体カッター：前眼部・後眼部手術。\n③前眼部超音波乳化パック付属品：前眼部手術。\n④前眼部硝子体カッター：前眼部手術。\n⑤後眼部硝子体カッター：後眼部手術。\n⑥単回使用眼内多点レーザーファイバー：後眼部手術。\n⑦高性能自己閉鎖弁トロカーシステム：後眼部手術。\n⑧シャンデリア照明ファイバー：後眼部手術。\n⑨粉砕部品：後眼部手術。\n⑩高効率シリコーンオイル注入・吸引セット：後眼部手術。","specialty":"眼科"},"en":{"title":"Unity Vitreoretinal Cataract System and Accessories","description":"① Combined-function vitrectomy cutter: for posterior segment ophthalmic surgery.\n② Combined anterior/posterior segment vitrectomy cutter: for anterior and posterior segment surgery.\n③ Anterior segment phaco pack accessories: for anterior segment ophthalmic surgery.\n④ Anterior segment vitrectomy cutter: for anterior segment ophthalmic surgery.\n⑤ Posterior segment vitrectomy cutter: for posterior segment ophthalmic surgery.\n⑥ Single-use intraocular multipoint laser fiber: for posterior segment ophthalmic surgery.\n⑦ High-performance self-sealing trocar system: for posterior segment ophthalmic surgery.\n⑧ Chandelier illumination fiber: for posterior segment ophthalmic surgery.\n⑨ Fragmentation component: for posterior segment ophthalmic surgery.\n⑩ High-efficiency silicone oil injection/aspiration pack: for posterior segment ophthalmic surgery.","specialty":"Ophthalmology"}}},{"id":343,"category":"device","number":138,"langs":{"zh":{"title":"三焦点人工晶状体Clareon PanOptix Pro Trifocal IOL","description":"该产品适用于白内障摘除术后需要一期植入人工晶状体于后房囊袋内，有远、中、近视力要求的成人患者，以期待改善近、中、远视力并减少眼镜依赖。","specialty":"眼科"},"ja":{"title":"Clareon PanOptix Pro Trifocal IOL 三焦点眼内レンズ","description":"白内障摘出後に後房嚢内への一期的眼内レンズ植込みを必要とし、遠・中・近距離視力を求める成人患者に使用し、近・中・遠視力改善および眼鏡依存低減を目的とする。","specialty":"眼科"},"en":{"title":"Clareon PanOptix Pro Trifocal IOL","description":"For adult patients who require primary implantation of an intraocular lens into the posterior capsular bag after cataract extraction and who have distance, intermediate, and near vision requirements, with the aim of improving near, intermediate, and distance vision and reducing spectacle dependence.","specialty":"Ophthalmology"}}},{"id":344,"category":"device","number":139,"langs":{"zh":{"title":"三焦点环曲面人工晶状体Clareon PanOptix Pro Trifocal Toric IOL","description":"该产品用于已摘除白内障晶体的成人患者，用于后房囊袋内一期植入，对无晶状体眼进行视力矫正并减少剩余的屈光性散光。与单焦点人工晶状体相比，该人工晶状体可改善中距和近距视力，同时可保持相当的远距视力的同时减少对眼镜的需求，从而缓解患者的老视问题。","specialty":"眼科"},"ja":{"title":"Clareon PanOptix Pro Trifocal Toric IOL 三焦点トーリック眼内レンズ","description":"白内障水晶体摘出後の成人患者に後房嚢内へ一期的に植え込み、無水晶体眼の視力を矯正し残存屈折性乱視を低減する。単焦点IOLと比べ、中間・近見視力を改善しつつ同等の遠見視力を維持し、眼鏡依存を低減して老視を緩和する。","specialty":"眼科"},"en":{"title":"Clareon PanOptix Pro Trifocal Toric IOL","description":"For adult patients after cataract lens extraction, for primary implantation in the posterior capsular bag to correct aphakic vision and reduce residual refractive astigmatism. Compared with a monofocal IOL, it improves intermediate and near vision while maintaining comparable distance vision and reducing spectacle dependence, thereby addressing presbyopia.","specialty":"Ophthalmology"}}},{"id":345,"category":"device","number":140,"langs":{"zh":{"title":"青光眼引流器（MINInject）","description":"适用于已确诊为开角型青光眼的成年患者。","specialty":"眼科"},"ja":{"title":"MINInject 緑内障ドレナージデバイス","description":"開放隅角緑内障と確定診断された成人患者に適応する。","specialty":"眼科"},"en":{"title":"MINInject Glaucoma Drainage Device","description":"For adult patients diagnosed with open-angle glaucoma.","specialty":"Ophthalmology"}}},{"id":346,"category":"device","number":141,"langs":{"zh":{"title":"景深延展型后房有晶体眼人工晶状体","description":"EVO Viva™ Implantable Collamer® Lens (ICL) with Aspheric (EDOF) Optic\n\n适用于 21-60 岁有晶状体眼患者的治疗，以及 21 岁及以上使用单焦点 IOL（带或不带柱镜矫正）的人工晶状体眼患者的治疗：\n•矫正/减轻眼镜平面上-0.5 D到-20.0 D的近视患者。\n•矫正/减轻眼镜平面上-0.5 D到-20.0 D的近视伴老视患者。\n•扩展焦距深度和改善近距离视敏度。\n•从角膜内皮到晶状体前囊的前房深度（ACD）大于等于2.8 mm。","specialty":"眼科"},"ja":{"title":"EVO Viva™ Implantable Collamer® Lens (ICL) with Aspheric (EDOF) Optic 焦点深度拡張型後房有水晶体眼内レンズ","description":"21～60歳の有水晶体眼患者、および単焦点IOL、円柱矯正あり／なし、を使用する21歳以上の偽水晶体眼患者に適応する：\n• 眼鏡面で-0.5 D～-20.0 Dの近視の矯正・低減。\n• 眼鏡面で-0.5 D～-20.0 Dの近視＋老視の矯正・低減。\n• 焦点深度拡張と近見視力改善。\n• 角膜内皮から水晶体前嚢までの前房深度（ACD）2.8 mm以上。","specialty":"眼科"},"en":{"title":"EVO Viva™ Implantable Collamer® Lens (ICL) with Aspheric (EDOF) Optic","description":"For treatment of phakic patients aged 21–60 years and pseudophakic patients aged 21 years and older using a monofocal IOL, with or without cylindrical correction:\n• correction/reduction of myopia from -0.5 D to -20.0 D at the spectacle plane;\n• correction/reduction of myopia with presbyopia from -0.5 D to -20.0 D at the spectacle plane;\n• extension of depth of focus and improvement of near visual acuity;\n• anterior chamber depth, ACD, from corneal endothelium to the anterior lens capsule ≥2.8 mm.","specialty":"Ophthalmology"}}},{"id":347,"category":"device","number":142,"langs":{"zh":{"title":"MacoGenic G2 光疗机","description":"MacoGenic G2 光疗机是一款辐照设备，用于对富含白细胞的血液进行长波紫外线照射，辐照剂量2J/cm2，辐照时间约 10 分钟。","specialty":"血液科"},"ja":{"title":"MacoGenic G2 光線療法装置","description":"白血球を多く含む血液に長波紫外線を照射する装置で、照射量2 J/cm²、照射時間約10分。","specialty":"血液科"},"en":{"title":"MacoGenic G2 Phototherapy Device","description":"An irradiation device for long-wave ultraviolet irradiation of leukocyte-rich blood at a dose of 2 J/cm² for approximately 10 minutes.","specialty":"Hematology"}}},{"id":348,"category":"device","number":143,"langs":{"zh":{"title":"MacoGenic Set 辐照袋","description":"存储血液的无菌袋，容量300ml","specialty":"血液科"},"ja":{"title":"MacoGenic Set 照射バッグ","description":"血液保存用滅菌バッグ、容量300 mL。","specialty":"血液科"},"en":{"title":"MacoGenic Set Irradiation Bag","description":"Sterile bag for blood storage, capacity 300 mL.","specialty":"Hematology"}}},{"id":349,"category":"device","number":144,"langs":{"zh":{"title":"Magmaris 西罗莫司洗脱可吸收冠脉镁合金支架系统","description":"适合在症状性冠状动脉疾病患者的原位原生冠状动脉病变治疗中用于改善管腔直径。参比血管直径应严格匹配支架标称直径。治疗的病变长度应小于标称支架长度。","specialty":"血液科"},"ja":{"title":"Magmaris シロリムス溶出性吸収性冠動脈マグネシウム合金スキャフォールドシステム","description":"症候性冠動脈疾患患者の新規原発冠動脈病変治療で内腔径を改善する。参照血管径はスキャフォールド公称径と厳密に一致させ、治療病変長は公称スキャフォールド長未満とする。","specialty":"血液科"},"en":{"title":"Magmaris Sirolimus-Eluting Resorbable Coronary Magnesium Scaffold System","description":"For improving luminal diameter in treatment of de novo native coronary lesions in patients with symptomatic coronary artery disease. Reference vessel diameter must strictly match the nominal scaffold diameter. The treated lesion length must be shorter than the nominal scaffold length.","specialty":"Hematology"}}},{"id":350,"category":"device","number":145,"langs":{"zh":{"title":"旋磨介入治疗系统","description":"采用 ROTAPRO 旋磨磨头推进一体化导管的经皮冠状动脉粥样硬化斑块旋磨术，可作为单独治疗方案或辅助经皮冠状动脉介入治疗(PCI)，适用于符合下列选择标准之一的钙化性冠状动脉疾病患者：单支血管动脉粥样硬化性冠状动脉疾病，导丝可通过狭窄处；医生判断多支血管冠状动脉疾病不会给患者带来不必要的风险；曾接受过 療が困難で再発性症状を有する発作性心房細動の治療に使用する。","specialty":"血液科"},"en":{"title":"HeartLight X3 Console","description":"Laser ablation system including HeartLight X3 balloon laser ablation catheter, Balloon Fill Media, and HeartLight Endoscope intracardiac imaging catheter.\nFor treatment of recurrent symptomatic paroxysmal atrial fibrillation that is difficult to treat with medication.","specialty":"Hematology"}}},{"id":353,"category":"device","number":148,"langs":{"zh":{"title":"可调控型导管鞘","description":"HeartLight Deflectable Sheath\n\n适用于经皮导管引入脉管系统和心脏腔室，鞘偏转有利于导管定位，与激光消融系统（HeartLight EndoscopicAblation System）配套使用，用于治疗药物难以治疗的有复发性症状的阵发性房颤。","specialty":"血液科"},"ja":{"title":"HeartLight Deflectable Sheath 可動式カテーテルシース","description":"経皮的にカテーテルを血管系および心腔へ導入する。シース偏向によりカテーテル位置決めを容易にする。HeartLight Endoscopic Ablation Systemと併用し、薬物治療が困難で再発性症状を有する発作性心房細動を治療する。","specialty":"血液科"},"en":{"title":"HeartLight Deflectable Sheath","description":"For percutaneous introduction of catheters into the vasculature and cardiac chambers. Sheath deflection facilitates catheter positioning. Used with the HeartLight Endoscopic Ablation System to treat recurrent symptomatic paroxysmal atrial fibrillation that is difficult to treat with medication.","specialty":"Hematology"}}},{"id":354,"category":"device","number":149,"langs":{"zh":{"title":"Catheter based left ventricular circulatory support device and accessories","description":"iVAC 2L经皮左心室辅助装置\n\niVAC 2L适用于需要左心室机械循环支持的左心室功能受损患者，辅助可长达 24 小时。应经股动脉将 iVAC 2L 头端置于左心室。","specialty":"血液科"},"ja":{"title":"Catheter-Based Left Ventricular Circulatory Support Device and Accessories / iVAC 2L 経皮的左室補助装置","description":"iVAC 2Lは、左室機能低下があり左室機械循環補助を必要とする患者に最大24時間使用する。大腿動脈経由でiVAC 2L先端を左室内へ配置する。","specialty":"血液科"},"en":{"title":"Catheter-Based Left Ventricular Circulatory Support Device and Accessories, iVAC 2L Percutaneous Left Ventricular Assist Device","description":"The iVAC 2L is intended for patients with impaired left ventricular function requiring mechanical circulatory support of the left ventricle for up to 24 hours. The tip of the iVAC 2L should be positioned in the left ventricle via the femoral artery.","specialty":"Hematology"}}},{"id":355,"category":"device","number":150,"langs":{"zh":{"title":"射频发生器","description":"Baylis Medical Company Radiofrequency Puncture Generator\n\nBaylis Medical Company 射频发生器和脚踏开关（可选附件）可与单独获得批准的射频器械一起用于在一般外科手术中切割软组织。","specialty":"血液科"},"ja":{"title":"高周波発生装置","description":"Baylis Medical Company Radiofrequency Puncture Generator。\nBaylis Medical Company高周波発生装置およびフットスイッチ、オプション付属品、は、別途承認された高周波器具と併用し、一般外科手術で軟組織を切開するために使用する。","specialty":"血液科"},"en":{"title":"Radiofrequency Generator","description":"Baylis Medical Company Radiofrequency Puncture Generator.\nThe Baylis Medical Company radiofrequency generator and optional footswitch may be used with separately approved radiofrequency devices to cut soft tissue during general surgical procedures.","specialty":"Hematology"}}},{"id":356,"category":"device","number":151,"langs":{"zh":{"title":"左心耳封堵射频导丝","description":"VersaCross Connect™ LAAC Access Solution\n\n加拿大获批适应症：适用于在心脏中形成房间隔缺损，用于通过房间隔穿孔/穿刺将各种类型的心血管导管和导丝经皮引入所有心腔，包括左心房。","specialty":"血液科"},"ja":{"title":"左心耳閉鎖用高周波ガイドワイヤー","description":"VersaCross Connect™ LAAC Access Solution。\nカナダ承認適応症：心臓内に心房中隔欠損を形成し、経中隔穿孔／穿刺により各種心血管カテーテル・ガイドワイヤーを左心房を含む全心腔へ経皮導入するために使用する。","specialty":"血液科"},"en":{"title":"Left Atrial Appendage Closure Radiofrequency Guidewire","description":"VersaCross Connect™ LAAC Access Solution.\nApproved indication in Canada: for creating an atrial septal defect in the heart to permit percutaneous introduction of various cardiovascular catheters and guidewires into all cardiac chambers, including the left atrium, by transseptal perforation/puncture.","specialty":"Hematology"}}},{"id":357,"category":"device","number":152,"langs":{"zh":{"title":"EAZ201 Epsila EV™ Transverse Tunneling Tool","description":"皮下隧道导入器\n\nEAZ201 型 Epsila EV 横向穿隧工具适用于兼容前纵膈除颤电极导线的植入。","specialty":"血液科"},"ja":{"title":"EAZ201 Epsila EV™ Transverse Tunneling Tool","description":"皮下トンネル導入器。\nEAZ201 Epsila EV横方向トンネリングツールは、対応する前縦隔除細動電極リードの植込みに使用する。","specialty":"血液科"},"en":{"title":"EAZ201 Epsila EV™ Transverse Tunneling Tool","description":"Subcutaneous tunneling introducer.\nThe EAZ201 Epsila EV transverse tunneling tool is intended for implantation of compatible anterior mediastinal defibrillation electrode leads.","specialty":"Hematology"}}},{"id":358,"category":"device","number":153,"langs":{"zh":{"title":"EAZ101 Epsila EV™ Sternal Tunneling Tool","description":"胸骨下隧道导入器\n\nEAZ101 型 Epsila EV 胸骨穿隧工具适用于兼容前纵膈除颤电极导线的植入。","specialty":"血液科"},"ja":{"title":"EAZ101 Epsila EV™ Sternal Tunneling Tool","description":"胸骨下トンネル導入器。\nEAZ101 Epsila EV胸骨トンネリングツールは、対応する前縦隔除細動電極リードの植込みに使用する。","specialty":"血液科"},"en":{"title":"EAZ101 Epsila EV™ Sternal Tunneling Tool","description":"Substernal tunneling introducer.\nThe EAZ101 Epsila EV sternal tunneling tool is intended for implantation of compatible anterior mediastinal defibrillation electrode leads.","specialty":"Hematology"}}},{"id":359,"category":"device","number":154,"langs":{"zh":{"title":"Aurora EV-ICD™ MRI SureScan™ SW041","description":"血管外植入式心律转复除颤器程控软件\n\n用于对植入的DVEA3E4型Aurora EV-ICD MRI SureScan系统做出决策。","specialty":"血液科"},"ja":{"title":"Aurora EV-ICD™ MRI SureScan™ SW041","description":"血管外植込み型除細動器プログラミングソフトウェア。\n植え込まれたDVEA3E4型Aurora EV-ICD MRI SureScanシステムのプログラミング判断に使用する。","specialty":"血液科"},"en":{"title":"Aurora EV-ICD™ MRI SureScan™ SW041","description":"Extravascular implantable cardioverter-defibrillator programming software.\nUsed to make programming decisions for an implanted DVEA3E4 Aurora EV-ICD MRI SureScan system.","specialty":"Hematology"}}},{"id":360,"category":"device","number":155,"langs":{"zh":{"title":"Epsila EV™ MRI SureScan™","description":"血管外植入式心脏除颤电极导线\n\nEpsila EV MRI SureScan EV2401型血管外电极导线适用于在适用血管外植入式心律转复除颤器患者的前纵膈中进行心律转复和除颤。","specialty":"血液科"},"ja":{"title":"Epsila EV™ MRI SureScan™","description":"血管外植込み型心臓除細動電極リード。\nEpsila EV MRI SureScan EV2401型血管外電極リードは、血管外植込み型除細動器の適応患者の前縦隔内でカルディオバージョンおよび除細動を行うために使用する。","specialty":"血液科"},"en":{"title":"Epsila EV™ MRI SureScan™","description":"Extravascular implantable cardiac defibrillation electrode lead.\nThe Epsila EV MRI SureScan EV2401 extravascular lead is intended for cardioversion and defibrillation in the anterior mediastinum of patients indicated for an extravascular implantable cardioverter-defibrillator.","specialty":"Hematology"}}},{"id":361,"category":"device","number":156,"langs":{"zh":{"title":"Aurora EV-ICD™ MRI SureScan™","description":"血管外植入式心律转复除颤器\n\nAurora EV-ICD MRI SureScan型DVEA3E4器械通过提供抗心动过速起搏、复律和除颤，自动治疗曾经发作或存在极大风险发展为危及生命的室性快速心律失常的患者。EV-ICD 用于因危及生命的室性快速心律失常而导致的心源性猝死，患者症状包括：有室性快速性心律失常病史、急性冠心病、左心室功能紊乱、心肌病、遗传性原发性心律失常综合征、先天性心脏病、炎症性、风湿性和瓣膜性心脏病\n注：对于特定于患者的建议，例如初级预防和二级预防，请参考来自欧洲心脏病学会（ESC）、美国心脏协会（ACC）、美国心脏病学会（AHA）和心律学会（HRS）的最新临床指南。","specialty":"心血管内科"},"ja":{"title":"Aurora EV-ICD™ MRI SureScan™","description":"血管外植込み型除細動器。\nAurora EV-ICD MRI SureScan DVEA3E4は、抗頻拍ペーシング、カルディオバージョン、除細動を提供し、生命を脅かす心室性頻脈性不整脈を発症した、または発症リスクが極めて高い患者を自動治療する。EV-ICDは生命を脅かす心室性頻脈性不整脈による心臓突然死を対象とし、心室性頻脈性不整脈既往、急性冠動脈疾患、左室機能障害、心筋症、遺伝性原発性不整脈症候群、先天性心疾患、炎症性・リウマチ性・弁膜性心疾患などを含む。\n注：一次予防・二次予防など患者別推奨については、ESC、ACC、AHA、HRSの最新臨床ガイドラインを参照する。","specialty":"循環器内科"},"en":{"title":"Aurora EV-ICD™ MRI SureScan™","description":"Extravascular implantable cardioverter-defibrillator.\nThe Aurora EV-ICD MRI SureScan DVEA3E4 device automatically treats patients who have experienced, or are at high risk of developing, life-threatening ventricular tachyarrhythmias by providing antitachycardia pacing, cardioversion, and defibrillation. EV-ICD is intended to prevent sudden cardiac death caused by life-threatening ventricular tachyarrhythmias in patients with conditions including a history of ventricular tachyarrhythmia, acute coronary disease, left ventricular dysfunction, cardiomyopathy, inherited primary arrhythmia syndromes, congenital heart disease, and inflammatory, rheumatic, and valvular heart disease.\nNote: for patient-specific recommendations, including primary and secondary prevention, refer to the latest clinical guidelines from the European Society of Cardiology, ESC, American College of Cardiology, ACC, American Heart Association, AHA, and Heart Rhythm Society, HRS.","specialty":"Cardiology"}}},{"id":362,"category":"device","number":157,"langs":{"zh":{"title":"Freesolve Sirolimus Eluting Coronary Resorbable Magnesium Scaffold System","description":"Freesolve西罗莫司洗脱冠脉可吸收镁合金支架系统\n\n适合用于出现症状的冠状动脉疾病患者冠状动脉原位原发狭窄性病变的治疗中改善管腔直径。参考血管直径应严格匹配支架标称直径。治疗的病变长度应小于标称支架长度。","specialty":"心血管内科"},"ja":{"title":"Freesolve Sirolimus Eluting Coronary Resorbable Magnesium Scaffold System","description":"症候性冠動脈疾患患者の新規原発冠動脈狭窄病変治療で内腔径を改善する。参照血管径はスキャフォールド公称径と厳密に一致し、治療病変長は公称スキャフォールド長未満である必要がある。","specialty":"循環器内科"},"en":{"title":"Freesolve Sirolimus Eluting Coronary Resorbable Magnesium Scaffold System","description":"For improving luminal diameter in treatment of de novo native coronary stenotic lesions in patients with symptomatic coronary artery disease. Reference vessel diameter should strictly match the nominal scaffold diameter. The treated lesion length should be shorter than the nominal scaffold length.","specialty":"Cardiology"}}},{"id":363,"category":"device","number":158,"langs":{"zh":{"title":"经导管主动脉瓣膜系统Medtronic Evolut FX System","description":"适用于缓解因严重的原生钙化性主动脉瓣膜狭窄而导致有症状的心脏病患者的主动脉狭窄，这些患者经心脏团队(包括心脏外科医生)判断，适合经导管心脏瓣膜置换治疗。该系统还适用于因手术生物主动脉失效(狭窄、不足或合并)而患有症状性心脏病的患者，这些患者被包括心脏外科医生在内的心脏团队判断为处于高风险或更大风险对于开放手术治疗(即，STS预测手术死亡风险评分大于等于 8%或 30 天死亡风险大于等于 15%)。","specialty":"心血管内科"},"ja":{"title":"Medtronic Evolut FX 経カテーテル大動脈弁システム","description":"重度の原発性石灰化大動脈弁狭窄による症候性心疾患患者で、心臓外科医を含むハートチームが経カテーテル心臓弁置換術に適すると判断した患者の大動脈弁狭窄を緩和する。さらに、外科的生体大動脈弁の機能不全、狭窄、不全または併存、による症候性心疾患患者で、心臓外科医を含むハートチームが開心術について高リスク以上、STS予測手術死亡リスク8%以上または30日死亡リスク15%以上、と判断した患者にも適応する。","specialty":"循環器内科"},"en":{"title":"Medtronic Evolut FX Transcatheter Aortic Valve System","description":"For relief of aortic stenosis in patients with symptomatic heart disease caused by severe native calcific aortic stenosis who are judged by a heart team, including a cardiac surgeon, to be appropriate candidates for transcatheter heart valve replacement. The system is also indicated for patients with symptomatic heart disease due to failure of a surgical bioprosthetic aortic valve, stenosis, insufficiency, or a combination, who are judged by a heart team including a cardiac surgeon to be at high or greater risk for open surgery, i.e. STS predicted risk of surgical mortality ≥8% or 30-day mortality risk ≥15%.","specialty":"Cardiology"}}},{"id":364,"category":"device","number":159,"langs":{"zh":{"title":"植入式双腔无导线起搏系统AveirTM DR Leadless System","description":"Aveir植入式无导线心脏起搏器系统适用于治疗以下一种或多种永久性疾病：晕厥、晕厥前期、疲劳损伤、定向障碍；频率适应性起搏适用于患有心脏变时性功能不全的患者以及将从增加的刺激频率与身体活动中受益的患者。双腔起搏适用于出现以下症状的患者：病态窦房结综合征、慢性、症状性二度和三度房室（AV）传导阻滞、复发性 Adams-Stokes 综合征、已排除快速性心律失常和其他原因的症状性双侧束支传导阻滞；心房起搏适用于以下患者：窦房结功能障碍且 AV 和心室内传导系统正常；心室起搏适用于以下患者：明显心动过缓以及正常窦性心律但偶尔出现房室传导阻滞或窦性停搏、慢性心房颤动、重度身体残疾","specialty":"心血管内科"},"ja":{"title":"Aveir™ DR Leadless System 植込み型二腔リードレスペーシングシステム","description":"Aveir植込み型リードレス心臓ペースメーカーシステムは、失神、失神前症状、疲労、見当識障害などを伴う1つ以上の永続的病態を治療する。レート応答ペーシングは変時性不全患者および身体活動に応じた刺激頻度上昇が有益な患者に適応する。二腔ペーシングは洞不全症候群、慢性症候性2度・3度房室（AV）ブロック、反復性Adams-Stokes症候群、頻脈性不整脈および他の原因を除外した症候性両脚ブロックに適応する。心房ペーシングは洞結節機能障害がありAVおよび心室内伝導が正常な患者に適応する。心室ペーシングは著明な徐脈、正常洞調律だが時折AVブロックまたは洞停止を示す患者、慢性心房細動、重度身体障害などに適応する。","specialty":"循環器内科"},"en":{"title":"Aveir™ DR Leadless System, Implantable Dual-Chamber Leadless Pacing System","description":"The Aveir implantable leadless cardiac pacemaker system is intended to treat one or more permanent conditions associated with syncope, presyncope, fatigue, or disorientation. Rate-responsive pacing is intended for patients with chronotropic incompetence and those who would benefit from increased pacing rate with physical activity. Dual-chamber pacing is indicated for patients with sick sinus syndrome, chronic symptomatic second- and third-degree atrioventricular, AV, block, recurrent Adams-Stokes syndrome, or symptomatic bilateral bundle branch block after tachyarrhythmias and other causes have been excluded. Atrial pacing is indicated for patients with sinus node dysfunction and normal AV and intraventricular conduction. Ventricular pacing is indicated for patients with marked bradycardia, normal sinus rhythm with intermittent AV block or sinus arrest, chronic atrial fibrillation, or severe physical disability.","specialty":"Cardiology"}}},{"id":365,"category":"device","number":160,"langs":{"zh":{"title":"皮下植入式心律转复除颤器","description":"与皮下植入式心脏除颤电极导线（3401型）配合使用，可以检测心脏电活动并提供除颤治疗。S-ICD系统旨在为发生致命性室性心动过速但没有心动过缓症状、持续性室性心动过速或自发性频发室性心动过速（可通过抗心动过速起搏治疗完全缓解）的患者提供除颤治疗","specialty":"心血管内科"},"ja":{"title":"皮下植込み型除細動器","description":"皮下植込み型心臓除細動電極リード、3401型、と併用し、心臓電気活動を検出して除細動治療を提供する。S-ICDシステムは、致命的心室頻拍を生じるが、症候性徐脈、持続性心室頻拍、または抗頻拍ペーシングで完全に軽減可能な自発性頻発心室頻拍を有しない患者への除細動治療を目的とする。","specialty":"循環器内科"},"en":{"title":"Subcutaneous Implantable Cardioverter-Defibrillator","description":"Used with a subcutaneous implantable cardiac defibrillation electrode lead, model 3401, to detect cardiac electrical activity and provide defibrillation therapy. The S-ICD system is intended for patients at risk of life-threatening ventricular tachycardia who do not have symptomatic bradycardia, sustained ventricular tachycardia, or spontaneous frequent ventricular tachycardia that can be completely relieved by antitachycardia pacing.","specialty":"Cardiology"}}},{"id":366,"category":"device","number":161,"langs":{"zh":{"title":"植入式心脏起搏器","description":"适用于改善心脏输出量、防止病症发生或预防由心脏搏动形成或传导紊乱而导致的心律失常","specialty":"心血管内科"},"ja":{"title":"植込み型心臓ペースメーカー","description":"心拍出量の改善、病態発生の防止、または心拍形成・伝導障害による不整脈の予防に適応する。","specialty":"循環器内科"},"en":{"title":"Implantable Cardiac Pacemaker","description":"For improving cardiac output, preventing disease occurrence, or preventing arrhythmias caused by disorders of cardiac impulse formation
