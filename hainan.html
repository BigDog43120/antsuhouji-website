学療法に適さない腫瘍に使用する。","specialty":""},"en":{"title":"Foscan","description":"For the treatment and palliation of symptoms of advanced head and neck squamous cell carcinoma (a cancer that begins in cells lining the mouth, nose, throat, or ear). It is used when other treatments have failed and the tumor is unsuitable for radiotherapy, surgery, or systemic chemotherapy.","specialty":""}}},{"id":26,"category":"drug","number":26,"langs":{"zh":{"title":"Talzenna","description":"Talazoparib是一种聚腺苷二磷酸核糖聚合酶（PARP）抑制剂，适用于治疗有害或疑似有害生殖系 BRCA 突变（gBRCAm）HER2 阴性局部晚期或转移性乳腺癌成人患者。","specialty":""},"ja":{"title":"Talzenna","description":"Talazoparibはポリ（ADP-リボース）ポリメラーゼ（PARP）阻害薬であり、有害または有害が疑われる生殖細胞系列BRCA変異（gBRCAm）を有するHER2陰性の局所進行または転移性乳癌の成人患者の治療に適応する。","specialty":""},"en":{"title":"Talzenna","description":"Talazoparib is a poly(ADP-ribose) polymerase (PARP) inhibitor indicated for the treatment of adult patients with deleterious or suspected deleterious germline BRCA-mutated (gBRCAm), HER2-negative locally advanced or metastatic breast cancer.","specialty":""}}},{"id":27,"category":"drug","number":27,"langs":{"zh":{"title":"他泽司他","description":"上皮样肉瘤(ES); 滤泡性淋巴瘤（FL）。","specialty":""},"ja":{"title":"タゼメトスタット","description":"類上皮肉腫（ES）、濾胞性リンパ腫（FL）。","specialty":""},"en":{"title":"Tazemetostat","description":"Epithelioid sarcoma (ES); follicular lymphoma (FL).","specialty":""}}},{"id":28,"category":"drug","number":28,"langs":{"zh":{"title":"芦比替定","description":"适用于治疗在铂类药物化疗期间或之后出现疾病进展的转移性小细胞肺癌(SCLC)成人患者。","specialty":""},"ja":{"title":"ルルビネクテジン","description":"プラチナ製剤化学療法中または治療後に病勢進行した転移性小細胞肺癌（SCLC）の成人患者を治療する。","specialty":""},"en":{"title":"Lurbinectedin","description":"Indicated for the treatment of adult patients with metastatic small cell lung cancer (SCLC) whose disease progressed during or after platinum-based chemotherapy.","specialty":""}}},{"id":29,"category":"drug","number":29,"langs":{"zh":{"title":"Retsevmo","description":"Retsevmo单药用于患有以下疾病的成人患者的治疗：–需要系统性治疗的既往曾接受免疫治疗和/或含铂化疗的RET基因融合的晚期非小 H1 or IDH2 mutation.","specialty":""}}},{"id":36,"category":"drug","number":36,"langs":{"zh":{"title":"Nivolumab（纳武利尤单抗）","description":"适用于在接受铂类药物为基础的化疗同步放疗后未出现疾病进展的不可切除、Ⅲ期非小细胞癌患者治疗","specialty":""},"ja":{"title":"Nivolumab（ニボルマブ）","description":"プラチナ製剤を基盤とする化学療法と放射線療法の同時併用後に病勢進行が認められない、切除不能なステージIII非小細胞癌患者の治療。","specialty":""},"en":{"title":"Nivolumab","description":"For the treatment of patients with unresectable stage III non-small cell carcinoma whose disease has not progressed following concurrent platinum-based chemotherapy and radiotherapy.","specialty":""}}},{"id":37,"category":"drug","number":37,"langs":{"zh":{"title":"Pembrolizumab（帕博利珠单抗注射液）","description":"黑色素瘤、非小细胞肺癌、食管癌","specialty":""},"ja":{"title":"Pembrolizumab（ペムブロリズマブ注射液）","description":"黒色腫、非小細胞肺癌、食道癌。","specialty":""},"en":{"title":"Pembrolizumab Injection","description":"Melanoma, non-small cell lung cancer, esophageal cancer.","specialty":""}}},{"id":38,"category":"drug","number":38,"langs":{"zh":{"title":"Melphalan hydrochloride for Injection（注射用盐酸美法仑）","description":"用于多发性骨髓瘤患者进行自体干细胞移植前高剂量治疗，或不适宜于美法仑口服制剂多发性骨髓瘤患者的姑息治疗。","specialty":""},"ja":{"title":"Melphalan hydrochloride for Injection（メルファラン塩酸塩注射剤）","description":"多発性骨髄腫患者の自家造血幹細胞移植前の大量療法、または経口メルファラン製剤が適さない多発性骨髄腫患者の緩和療法に使用する。","specialty":""},"en":{"title":"Melphalan hydrochloride for Injection","description":"For high-dose treatment prior to autologous stem cell transplantation in patients with multiple myeloma, or for palliative treatment of patients with multiple myeloma who are unsuitable for oral melphalan formulations.","specialty":""}}},{"id":39,"category":"drug","number":39,"langs":{"zh":{"title":"Palbociclib（哌柏西利胶囊）","description":"本品适用于激素受体（HR）阳性、人表皮生长因子受体2（HER2)阴性的局部晚期或转移性乳腺癌，应与芳香化酶抑制剂（。。曲唑、依曲美坦）联合使用作为绝经后女性患者的初始内分泌治疗","specialty":""},"ja":{"title":"Palbociclib（パルボシクリブカプセル）","description":"ホルモン受容体（HR）陽性、ヒト上皮成長因子受容体2（HER2）陰性の局所進行または転移性乳癌に適応し、閉経後女性患者の初回内分泌療法としてアロマターゼ阻害薬と併用する。","specialty":""},"en":{"title":"Palbociclib Capsules","description":"Indicated for hormone receptor (HR)-positive, human epidermal growth factor receptor 2 (HER2)-negative locally advanced or metastatic breast cancer, in combination with an aromatase inhibitor as initial endocrine therapy in postmenopausal women.","specialty":""}}},{"id":40,"category":"drug","number":40,"langs":{"zh":{"title":"Niraparib Capsules（尼拉帕尼胶囊）","description":"适用于对复发性上皮性卵巢癌、输卵管癌或原发性腹膜癌患者进行维持治疗","specialty":""},"ja":{"title":"Niraparib Capsules（ニラパリブカプセル）","description":"再発上皮性卵巣癌、卵管癌または原発性腹膜癌患者の維持療法に適応する。","specialty":""},"en":{"title":"Niraparib Capsules","description":"For maintenance treatment of patients with recurrent epithelial ovarian cancer, fallopian tube cancer, or primary peritoneal cancer.","specialty":""}}},{"id":41,"category":"drug","number":41,"langs":{"zh":{"title":"Trastuzumab emtansine（注射用恩美曲妥珠单抗注射液）","description":"接受了紫杉烷类联合曲妥珠单抗为基础的新辅助治疗后仍残存侵袭性病灶的HER2阳性早期乳腺癌患者的辅助治疗","specialty":""},"ja":{"title":"Trastuzumab emtansine（トラスツズマブ エムタンシン注射剤）","description":"タキサン系薬剤とトラスツズマブを基盤とする術前補助療法後にも浸潤性病変が残存するHER2陽性早期乳癌患者の術後補助療法。","specialty":""},"en":{"title":"Trastuzumab emtansine Injection","description":"Adjuvant treatment of patients with HER2-positive early breast cancer who have residual invasive disease after neoadjuvant therapy based on a taxane plus trastuzumab.","specialty":""}}},{"id":42,"category":"drug","number":42,"langs":{"zh":{"title":"pertuzumab（帕妥珠单抗）","description":"早期乳腺癌：\n本品与曲妥珠单抗和化疗联合\n用于 HER2 阳性、局部晚期、炎性或早期乳腺癌患者(直径 > 2 cm 或淋巴结阳性)的新辅助治疗，作为早期乳腺癌整体治疗方案的一部分。\n用于具有高复发风险 HER2 阳性早期乳腺癌患者的辅助治疗。\n转移性乳腺癌：帕妥珠单抗与曲妥珠单抗和多西他赛联合，适用于\nHER2 阳性、转移性或不可切除的局部复发性乳腺癌患者。针对转移性\n疾病，患者既往未接受过抗 HER2 治疗或替代化疗","specialty":""},"ja":{"title":"Pertuzumab（ペルツズマブ）","description":"早期乳癌：\nトラスツズマブおよび化学療法との併用により、HER2陽性の局所進行、炎症性または早期乳癌（腫瘍径 > 2 cmまたはリンパ節陽性）患者の術前補助療法として、早期乳癌の総合治療計画の一部として使用する。\n再発リスクが高いHER2陽性早期乳癌患者の術後補助療法に使用する。\n転移性乳癌：ペルツズマブをトラスツズマブおよびドセタキセルと併用し、HER2陽性の転移性または切除不能な局所再発乳癌患者に使用する。転移性疾患については、抗HER2療法または代替化学療法の既往がない患者を対象とする。","specialty":""},"en":{"title":"Pertuzumab","description":"Early breast cancer:\nIn combination with trastuzumab and chemotherapy:\nfor neoadjuvant treatment of patients with HER2-positive, locally advanced, inflammatory, or early-stage breast cancer (tumor diameter > 2 cm or node-positive) as part of the overall treatment regimen for early breast cancer;\nfor adjuvant treatment of patients with HER2-positive early breast cancer at high risk of recurrence.\nMetastatic breast cancer: pertuzumab in combination with trastuzumab and docetaxel is indicated for patients with HER2-positive metastatic or unresectable locally recurrent breast cancer. For metastatic disease, patients must not have received prior anti-HER2 therapy or alternative chemotherapy.","specialty":""}}},{"id":43,"category":"drug","number":43,"langs":{"zh":{"title":"艾拉司群","description":"ORSERDU 是一种雌激素受体拮抗剂，适用于：雌激素受体(ER)阳性、人表皮生长因子受体 2(HER2)阴性、ESR1基因突变且至少接受一线内分泌治疗后疾病进展的晚期或转移性绝经后女性乳腺癌或成年男性乳腺癌。","specialty":""},"ja":{"title":"エラセストラント","description":"ORSERDUはエストロゲン受容体拮抗薬であり、エストロゲン受容体（ER）陽性、ヒト上皮成長因子受容体2（HER2）陰性、ESR1遺伝子変異を有し、少なくとも1ラインの内分泌療法後に病勢進行した進行または転移性乳癌の閉経後女性または成人男性に適応する。","specialty":""},"en":{"title":"Elacestrant","description":"ORSERDU is an estrogen receptor antagonist indicated for postmenopausal women or adult men with ER-positive, HER2-negative, ESR1-mutated advanced or metastatic breast cancer whose disease has progressed after at least one line of endocrine therapy.","specialty":""}}},{"id":44,"category":"drug","number":44,"langs":{"zh":{"title":"艾拉司群","description":"ORSERDU 是一种雌激素受体拮抗剂，适用于：雌激素受体(ER)阳性、人表皮生长因子受体 2(HER2)阴性、ESR1基因突变且至少接受一线内分泌治疗后疾病进展的晚期或转移性绝经后女性乳腺癌或成年男性乳腺癌。","specialty":""},"ja":{"title":"エラセストラント","description":"ORSERDUはエストロゲン受容体拮抗薬であり、エストロゲン受容体（ER）陽性、ヒト上皮成長因子受容体2（HER2）陰性、ESR1遺伝子変異を有し、少なくとも1ラインの内分泌療法後に病勢進行した進行または転移性乳癌の閉経後女性または成人男性に適応する。","specialty":""},"en":{"title":"Elacestrant","description":"ORSERDU is an estrogen receptor antagonist indicated for postmenopausal women or adult men with ER-positive, HER2-negative, ESR1-mutated advanced or metastatic breast cancer whose disease has progressed after at least one line of endocrine therapy.","specialty":""}}},{"id":45,"category":"drug","number":45,"langs":{"zh":{"title":"TS-1复方胶囊（替吉奥胶囊）","description":"胰腺癌","specialty":""},"ja":{"title":"TS-1配合カプセル（テガフール・ギメラシル・オテラシルカプセル）","description":"膵癌。","specialty":""},"en":{"title":"TS-1 Combination Capsules (Tegafur/Gimeracil/Oteracil Capsules)","description":"Pancreatic cancer.","specialty":""}}},{"id":46,"category":"drug","number":46,"langs":{"zh":{"title":"优赫得（注射用德曲妥珠单抗）","description":"1.HER2阳性转移性乳腺癌 本品适用于既往在以下治疗中接受过含抗HER2药物治疗方案的HER2阳性不可切除或者转移性乳腺癌成人患者：\n●在转移性疾病治疗，或 ●在新辅助或辅助治疗期间或完成治疗6个月内疾病复发。 2.HER2低表达转移性乳腺癌 本品适用于治疗既往在转移性疾病治疗中接受过化疗，或者在辅助化疗期间或完成辅助化疗的6个月内疾病复发的不可切除或转移性HER2低表达（IHC 1+或IHC 2+/ISH-）乳腺癌（通过FDA批准的检测确定）成人患者。 3.不可切除或转移性HER2突变非小细胞肺癌 本品适用于治疗既往接受过系统治疗的携带HER2（ERBB2）激活突变（通过FDA批准的检测确定）的不可切除或转移性非小细胞肺癌（NSCLC）成人患者。 4.局部晚期或转移性胃癌 本品适用于治疗既往接受过含曲妥珠单抗治疗方案的局部晚期或转移性HER2阳性胃癌或食管胃结合部（GEJ）腺癌成人患者。","specialty":""},"ja":{"title":"ENHERTU（トラスツズマブ デルクステカン注射剤）","description":"1. HER2陽性転移性乳癌：転移性疾患の治療で抗HER2薬を含む治療歴がある、または術前・術後補助療法中もしくは終了後6か月以内に再発したHER2陽性の切除不能または転移性乳癌の成人患者に適応する。2. HER2低発現転移性乳癌：転移性疾患の治療で化学療法歴がある、または術後補助化学療法中もしくは終了後6か月以内に再発した、切除不能または転移性HER2低発現（IHC 1+またはIHC 2+/ISH-）乳癌（FDA承認検査で確認）の成人患者に適応する。3. 切除不能または転移性HER2変異非小細胞肺癌：FDA承認検査で確認されたHER2（ERBB2）活性化変異を有し、全身治療歴のある切除不能または転移性非小細胞肺癌（NSCLC）の成人患者に適応する。4. 局所進行または転移性胃癌：トラスツズマブを含む治療歴がある、局所進行または転移性HER2陽性胃癌または胃食道接合部（GEJ）腺癌の成人患者に適応する。","specialty":""},"en":{"title":"ENHERTU (Trastuzumab Deruxtecan for Injection)","description":"1. HER2-positive metastatic breast cancer: for adult patients with unresectable or metastatic HER2-positive breast cancer who previously received an anti-HER2-based regimen in the metastatic setting, or whose disease recurred during or within 6 months after completing neoadjuvant or adjuvant therapy. 2. HER2-low metastatic breast cancer: for adult patients with unresectable or metastatic HER2-low (IHC 1+ or IHC 2+/ISH-) breast cance "title":"Tenofovir Alafenamide Tablets","description":"Indicated for treatment of adults with chronic hepatitis B virus (HBV) infection.","specialty":"Gastroenterology"}}},{"id":69,"category":"drug","number":69,"langs":{"zh":{"title":"布地奈德迟释胶囊","description":"TARPEYO 用于治疗具有进展风险的原发性 IgA 肾病成人患者，降低蛋白尿水平。一般来说，这类患者的尿蛋白肌酐比值（UPCR）≥ 1.5g/g。","specialty":"肾内科"},"ja":{"title":"ブデソニド遅延放出カプセル","description":"TARPEYOは、進行リスクを有する原発性IgA腎症の成人患者に使用し、蛋白尿を低減する。一般的に、このような患者の尿蛋白／クレアチニン比（UPCR）は1.5 g/g以上である。","specialty":"腎臓内科"},"en":{"title":"Budesonide Delayed-Release Capsules","description":"TARPEYO is used to reduce proteinuria in adults with primary IgA nephropathy who are at risk of disease progression. In general, these patients have a urine protein-to-creatinine ratio (UPCR) ≥ 1.5 g/g.","specialty":"Nephrology"}}},{"id":70,"category":"drug","number":70,"langs":{"zh":{"title":"巴氯芬鞘内注射液","description":"巴氯芬鞘内注射液适用于患有严重的脊髓源性慢性痉挛（与损伤、多发性硬化症或其他脊髓疾病相关）或脑源性的患者，这些患者对口服抗痉挛药（包括口服巴氯芬）无反应，和/或经历了不可接受的有效口服剂量内的副作用。","specialty":"神经外科"},"ja":{"title":"バクロフェン髄腔内注射液","description":"バクロフェン髄腔内注射液は、損傷、多発性硬化症またはその他の脊髄疾患に関連する重度の脊髄性慢性痙縮、または脳由来の痙縮を有し、経口バクロフェンを含む経口抗痙縮薬に反応しない、または有効な経口用量で許容できない副作用を経験した患者に適応する。","specialty":"脳神経外科"},"en":{"title":"Intrathecal Baclofen Injection","description":"Intrathecal baclofen is indicated for patients with severe chronic spasticity of spinal origin, associated with injury, multiple sclerosis, or other spinal cord diseases, or of cerebral origin, who are unresponsive to oral antispastic agents including oral baclofen and/or experience unacceptable adverse effects at effective oral doses.","specialty":"Neurosurgery"}}},{"id":71,"category":"drug","number":71,"langs":{"zh":{"title":"替洛利生","description":"治疗成人嗜睡症患者的白天过度嗜睡。","specialty":"神经内科"},"ja":{"title":"ピトリサント","description":"成人ナルコレプシー患者の日中過度眠気の治療。","specialty":"脳神経内科"},"en":{"title":"Pitolisant","description":"Treatment of excessive daytime sleepiness in adults with narcolepsy.","specialty":"Neurology"}}},{"id":72,"category":"drug","number":72,"langs":{"zh":{"title":"艾加莫德α注射液","description":"适用于治疗乙酰胆碱受体（AChR）抗体阳性的成人全身型重症肌无力（gMG）患者。","specialty":"神经内科"},"ja":{"title":"エフガルチギモド アルファ注射液","description":"アセチルコリン受容体（AChR）抗体陽性の成人全身型重症筋無力症（gMG）患者の治療に適応する。","specialty":"脳神経内科"},"en":{"title":"Efgartigimod Alfa Injection","description":"Indicated for treatment of adult patients with generalized myasthenia gravis (gMG) who are anti-acetylcholine receptor (AChR) antibody positive.","specialty":"Neurology"}}},{"id":73,"category":"drug","number":73,"langs":{"zh":{"title":"艾普奈珠单抗（维安替）","description":"VYEPTI适用于成人偏头痛的预防性治疗。","specialty":"神经内科"},"ja":{"title":"エプチネズマブ（VYEPTI）","description":"VYEPTIは成人の片頭痛予防治療に適応する。","specialty":"脳神経内科"},"en":{"title":"Eptinezumab (VYEPTI)","description":"VYEPTI is indicated for preventive treatment of migraine in adults.","specialty":"Neurology"}}},{"id":74,"category":"drug","number":74,"langs":{"zh":{"title":"阿杜卡单抗 ADUHELM (aducanumab-avwa) injection","description":"ADUHELM是一种靶向β-淀粉样蛋白的单克隆抗体，用于治疗轻度阿尔茨海默（Alzheimer’ s disease, AD）以及AD源性的轻度认知障碍。目前还没有在疾病更早期（AD源性轻度认知障碍之前）或更晚期（中重度AD）起始治疗的安全性或疗效数据。此适应症的加速批准是基于ADUHELM治疗的患者中观察到β淀粉样蛋白斑块减少。","specialty":"神经内科"},"ja":{"title":"アデュカヌマブ ADUHELM (aducanumab-avwa) injection","description":"ADUHELMはβアミロイドを標的とするモノクローナル抗体で、軽度アルツハイマー病（Alzheimer's disease, AD）およびAD由来の軽度認知障害の治療に使用する。現時点では、より早期の段階（AD由来軽度認知障害より前）またはより後期の段階（中等度～重度AD）で治療を開始した場合の安全性または有効性データはない。本適応症の迅速承認は、ADUHELM治療患者で観察されたβアミロイド斑の減少に基づく。","specialty":"脳神経内科"},"en":{"title":"Aducanumab ADUHELM (aducanumab-avwa) Injection","description":"ADUHELM is a monoclonal antibody targeting beta-amyloid and is used to treat mild Alzheimer's disease (AD) and mild cognitive impairment due to AD. There are currently no safety or efficacy data on initiating treatment at an earlier stage of disease, before mild cognitive impairment due to AD, or at a later stage, moderate to severe AD. Accelerated approval of this indication was based on the observed reduction in beta-amyloid plaques in patients treated with ADUHELM.","specialty":"Neurology"}}},{"id":75,"category":"drug","number":75,"langs":{"zh":{"title":"瑞美吉泮","description":"成人偏头痛的急性治疗（有或无先兆）；成人发作性偏头痛的预防性治疗。","specialty":"神经内科"},"ja":{"title":"リメゲパント","description":"成人片頭痛の急性期治療（前兆の有無を問わない）、成人の反復性片頭痛の予防治療。","specialty":"脳神経内科"},"en":{"title":"Rimegepant","description":"Acute treatment of migraine in adults, with or without aura; preventive treatment of episodic migraine in adults.","specialty":"Neurology"}}},{"id":76,"category":"drug","number":76,"langs":{"zh":{"title":"他替瑞林","description":"用于治疗改善脊髓小脑性共济失调。","specialty":"神经内科"},"ja":{"title":"タルチレリン","description":"脊髄小脳性運動失調の改善治療に使用する。","specialty":"脳神経内科"},"en":{"title":"Taltirelin","description":"For treatment to improve spinocerebellar ataxia.","specialty":"Neurology"}}},{"id":77,"category":"drug","number":77,"langs":{"zh":{"title":"仑卡奈单抗（乐意保）","description":"用于治疗阿尔茨海默病（AD）。LEQEMBI治疗应开始于轻度认知障碍或轻度痴呆疾病阶段的患者，即临床试验中开始治疗的人群。","specialty":"神经内科"},"ja":{"title":"レカネマブ（レケンビ）","description":"アルツハイマー病（AD）の治療に使用する。LEQEMBI治療は、軽度認知障害または軽度認知症の疾患段階にある患者、すなわち臨床試験で治療を開始した集団で開始すべきである。","specialty":"脳神経内科"},"en":{"title":"Lecanemab (LEQEMBI)","description":"For treatment of Alzheimer's disease (AD). LEQEMBI treatment should be initiated in patients at the mild cognitive impairment or mild dementia stage of disease, the population in which treatment was initiated in clinical trials.","specialty":"Neurology"}}},{"id":78,"category":"drug","number":78,"langs":{"zh":{"title":"托夫生注射液 QALSODY","description":"Tofersen是一种反义寡核苷酸，用于治疗携带超氧化物歧化酶1（SOD1）基因突变的肌萎缩侧索硬化（ALS）成人患者。根据在接受tofersen治疗的患者中观察到的血浆神经丝轻链水平降低，该适应症通过加速批准程序获批。一旦在确认性试验中验证临床获益，则视情况决定继续批准该适应症。","specialty":"神经内科"},"ja":{"title":"トフェルセン注射液 QALSODY","description":"Tofersenはアンチセンスオリゴヌクレオチドで、スーパーオキシドジスムターゼ1（SOD1）遺伝子変異を有する筋萎縮性側索硬化症（ALS）の成人患者を治療する。Tofersen投与患者で血漿ニューロフィラメント軽鎖値の低下が観察されたことに基づき、本適応症は迅速承認された。確認試験で臨床的有用性が検証された場合、状況に応じて本適応症の承認継続が決定される。","specialty":"脳神経内科"},"en":{"title":"Tofersen Injection QALSODY","description":"Tofersen is an antisense oligonucleotide used to treat adult patients with amyotrophic lateral sclerosis (ALS) carrying a superoxide dismutase 1 (SOD1) gene mutation. This indication received accelerated approval based on reductions in plasma neurofilament light chain levels observed in patients treated with tofersen. Continued approval for this indication may depend on verification of clinical benefit in confirmatory trials.","specialty":"Neurology"}}},{"id":79,"category":"drug","number":79,"langs":{"zh":{"title":"Ongentys (Opicapone) hard capsule","description":"Ongentys 被批准作为一种辅助药物与左旋多巴/多巴脱羧酶抑制剂(DDCI)联合使用治疗伴有剂末运动波动症的帕金森病成年患者。","specialty":"神经内科"},"ja":{"title":"Ongentys (Opicapone) hard capsule","description":"Ongentysは、レボドパ／ドパ脱炭酸酵素阻害薬（DDCI）との併用補助薬として、wearing-offによる運動症状変動を有する成人パーキンソン病患者の治療に承認されている。","specialty":"脳神経内科"},"en":{"title":"Ongentys (Opicapone) Hard Capsule","description":"Ongentys is approved as adjunctive therapy with levodopa/dopa decarboxylase inhibitors (DDCI) for adult patients with Parkinson's disease who experience end-of-dose motor fluctuations.","specialty":"Neurology"}}},{"id":80,"category":"drug","number":80,"langs":{"zh":{"title":"Zebinix","description":"单药治疗新诊断患有癫痫的成人的部分性癫痫发作，伴或不伴继发性全身性发作；辅助治疗成人、青少年和6岁以上儿童的部分性癫痫发作，伴或不伴继发性全身性发作。","specialty":"神经内科"},"ja":{"title":"Zebinix","description":"新たにてんかんと診断された成人の部分発作に対する単剤療法。二次性全般化の有無を問わない。また、成人、青少年および6歳を超える小児の部分発作に対する補助療法。二次性全般化の有無を問わない。","specialty":"脳神経内科"},"en":{"title":"Zebinix","description":"Monotherapy for partial-onset seizures in newly diagnosed adults with epilepsy, with or without secondary generalization; adjunctive treatment of partial-onset seizures, with or without secondary generalization, in adults, adolescents, and children aged over 6 years.","specialty":"Neurology"}}},{"id":81,"category":"drug","number":81,"langs":{"zh":{"title":"甲磺酸普立地诺3mg片剂","description":"中枢和外周肌肉痉挛：成人的腰痛、斜颈、一般肌肉疼痛。","specialty":"神经内科"},"ja":{"title":"プリジノールメシル酸塩 3 mg錠","description":"中枢性および末梢性筋痙攣：成人の腰痛、斜頸、一般的な筋肉 al Medicine"}}},{"id":97,"category":"drug","number":97,"langs":{"zh":{"title":"尘螨变应原舌下片","description":"本品适用于根据临床病史和尘螨致敏试验（皮肤点刺试验和/或特异性IgE）阳性诊断为至少患有以下一种疾病的成人患者（18-65岁）： 使用了缓解症状的药物后仍持续患有中度至重度尘螨过敏性鼻炎； 吸入性皮质类固醇控制不佳且伴有轻度至重度尘螨过敏性鼻炎的尘螨过敏性哮喘。开始治疗前应仔细评估患者的哮喘状态。 ACARIZAX适用于根据临床病史和尘螨致敏试验（皮肤点刺试验和/或特异性IgE）阳性诊断，在使用了缓解症状的药物后仍持续患有中度至重度尘螨过敏性鼻炎的青少年患者（12-17岁）。","specialty":"内科"},"ja":{"title":"ダニアレルゲン舌下錠","description":"臨床病歴およびダニ感作試験（皮膚プリック試験および／または特異的IgE）陽性に基づき、少なくとも以下のいずれかを有すると診断された18～65歳の成人患者に適応する：症状緩和薬を使用しても持続する中等度～重度のダニアレルギー性鼻炎、または吸入ステロイドで十分にコントロールされず、軽度～重度のダニアレルギー性鼻炎を伴うダニアレルギー性喘息。治療開始前に患者の喘息状態を慎重に評価する必要がある。ACARIZAXは、臨床病歴およびダニ感作試験陽性に基づき診断され、症状緩和薬使用後も中等度～重度のダニアレルギー性鼻炎が持続する12～17歳の青少年患者に適応する。","specialty":"内科"},"en":{"title":"House Dust Mite Allergen Sublingual Tablets","description":"Indicated for adults aged 18–65 years diagnosed, based on clinical history and a positive house dust mite sensitization test, skin prick test and/or specific IgE, with at least one of the following: persistent moderate to severe house dust mite allergic rhinitis despite use of symptom-relieving medication; house dust mite allergic asthma inadequately controlled by inhaled corticosteroids and accompanied by mild to severe house dust mite allergic rhinitis. Asthma status should be carefully evaluated before treatment. ACARIZAX is indicated for adolescents aged 12–17 years diagnosed, based on clinical history and a positive house dust mite sensitization test, with persistent moderate to severe house dust mite allergic rhinitis despite symptom-relieving medication.","specialty":"Internal Medicine"}}},{"id":98,"category":"drug","number":98,"langs":{"zh":{"title":"YEZTUGO (Lenacapavir) Tablets","description":"YEZTUGO 是一种人类免疫缺陷病毒 1 型（HIV-1）衣壳抑制剂，适用于有感染 HIV-1 风险的成人和体重不小于 35kg 的青少年进行暴露前预防（PrEP），以降低通过性行为感染 HIV-1 的风险。个体必须为 HIV-1 阴性才可以启动治疗。","specialty":"内科"},"ja":{"title":"YEZTUGO (Lenacapavir) Tablets","description":"YEZTUGOはヒト免疫不全ウイルス1型（HIV-1）カプシド阻害薬であり、HIV-1感染リスクを有する成人および体重35 kg以上の青少年に対する曝露前予防（PrEP）に適応し、性行為によ 7,"category":"drug","number":127,"langs":{"zh":{"title":"Oraltek Birke Sublingualspray, Lösung","description":"适用于成人和5岁以上儿童，用于治疗经皮肤点刺试验和/或特异性IgE试验诊断的不同过敏原引起的I型过敏性呼吸系统疾病（IgE介导），例如过敏性鼻炎、过敏性结膜炎和/或过敏性鼻结膜炎伴或不伴支气管哮喘。","specialty":"呼吸内科、耳鼻喉科、儿科"},"ja":{"title":"Oraltek Birke Sublingualspray, Lösung","description":"成人および5歳を超える小児に適応し、皮膚プリック試験および／または特異的IgE試験で診断された各種アレルゲンによるI型アレルギー性呼吸器疾患（IgE介在性）、例えばアレルギー性鼻炎、アレルギー性結膜炎、および／または気管支喘息を伴うまたは伴わないアレルギー性鼻結膜炎を治療する。","specialty":"呼吸器内科・耳鼻咽喉科・小児科"},"en":{"title":"Oraltek Birke Sublingualspray, Lösung","description":"For adults and children aged over 5 years, for treatment of type I allergic respiratory diseases, IgE-mediated, caused by different allergens and diagnosed by skin prick testing and/or specific IgE testing, such as allergic rhinitis, allergic conjunctivitis, and/or allergic rhinoconjunctivitis with or without bronchial asthma.","specialty":"Respiratory Medicine, Otorhinolaryngology, Pediatrics"}}},{"id":128,"category":"drug","number":128,"langs":{"zh":{"title":"ITULAZAX","description":"ITULAZAX适用于治疗桦树同源树花粉引起的中度至重度过敏性鼻炎和/或结膜炎的成人患者[桦树同源组包括：垂枝桦（桦树）、欧洲桤木（桤木）、桦叶鹅耳枥（角树）、欧榛（榛树）、美国白栎（橡树）和欧洲水青冈（山毛榉）]。ITULAZAX适用于使用缓解症状药物后仍有临床症状且对任一桦树同源树花粉致敏试验（皮肤点刺试验和/或特异性IgE）呈阳性的患者。","specialty":"呼吸内科、耳鼻喉科、儿科、皮肤科"},"ja":{"title":"ITULAZAX","description":"ITULAZAXは、カバノキ同族樹木の花粉により生じる中等度～重度のアレルギー性鼻炎および／または結膜炎を有する成人患者の治療に適応する。カバノキ同族群には、シラカバ、ヨーロッパハンノキ、セイヨウシデ、セイヨウハシバミ、アメリカホワイトオーク、ヨーロッパブナが含まれる。症状緩和薬を使用しても臨床症状が持続し、いずれかのカバノキ同族樹木花粉に対する感作試験（皮膚プリック試験および／または特異的IgE）が陽性の患者に適応する。","specialty":"呼吸器内科・耳鼻咽喉科・小児科・皮膚科"},"en":{"title":"ITULAZAX","description":"ITULAZAX is indicated for adult patients with moderate to severe allergic rhinitis and/or conjunctivitis caused by pollen from trees homologous to birch. The birch homologous group includes silver birch, European alder, European hornbeam, common hazel, white oak, and European beech. ITULAZAX is indicated for patients who remain clinically symptomatic despite symptom-relieving medication and have a positive sensitization test, skin prick test and/or specific IgE, to pollen from any tree in the birch homologous group.","specialty":"Respiratory Medicine, Otorhinolaryngology, Pediatrics, Dermatology"}}},{"id":129,"category":"drug","number":129,"langs":{"zh":{"title":"（替沙格韦单抗和西加韦单抗）注射液","description":"成人和青少年（≥12岁，体重≥40 kg）的新型冠状病毒","specialty":"呼吸内科"},"ja":{"title":"チキサゲビマブ・シルガビマブ注射液","description":"成人および青少年（12歳以上、体重40 kg以上）の新型コロナウイルス。","specialty":"呼吸器内科"},"en":{"title":"Tixagevimab and Cilgavimab Injection","description":"Coronavirus disease in adults and adolescents aged ≥12 years and weighing ≥40 kg.","specialty":"Respiratory Medicine"}}},{"id":130,"category":"drug","number":130,"langs":{"zh":{"title":"Cefiderocol","description":"治疗选择有限的成人需氧革兰氏阴性菌引起的感染","specialty":"呼吸内科"},"ja":{"title":"Cefiderocol","description":"治療選択肢が限られる成人における好気性グラム陰性菌による感染症の治療。","specialty":"呼吸器内科"},"en":{"title":"Cefiderocol","description":"Treatment of infections caused by aerobic Gram-negative organisms in adults with limited treatment options.","specialty":"Respiratory Medicine"}}},{"id":131,"category":"drug","number":131,"langs":{"zh":{"title":"亚胺培南-西司他丁/雷利巴坦注射用冻干粉","description":"1.成人医院获得性肺炎（HAP）的治疗，包括呼吸机相关性肺炎（VAP）。\n2.与成人 HAP 或 VAP 相关或疑似与成人 HAP 或 VAP相关菌血症的治疗。\n3.治疗选择有限的成人需氧型革兰氏阴性菌引起感染的治疗。","specialty":"呼吸内科"},"ja":{"title":"イミペネム・シラスタチン／レレバクタム注射用凍結乾燥製剤","description":"1. 成人の院内肺炎（HAP）、人工呼吸器関連肺炎（VAP）を含む、の治療。\n2. 成人HAPまたはVAPに関連する、または関連が疑われる菌血症の治療。\n3. 治療選択肢が限られる成人における好気性グラム陰性菌による感染症の治療。","specialty":"呼吸器内科"},"en":{"title":"Imipenem-Cilastatin/Relebactam Lyophilized Powder for Injection","description":"1. Treatment of hospital-acquired pneumonia (HAP) in adults, including ventilator-associated pneumonia (VAP).\n2. Treatment of bacteremia associated with, or suspected to be associated with, adult HAP or VAP.\n3. Treatment of infections caused by aerobic Gram-negative organisms in adults with limited treatment options.","specialty":"Respiratory Medicine"}}},{"id":132,"category":"drug","number":132,"langs":{"zh":{"title":"恩塞芬汀","description":"OHTUVAYRE是一种磷酸二酯酶3（PDE3）抑制剂和磷酸二酯酶4（PDE4）抑制剂，适用于成人慢性阻塞性肺疾病（COPD）患者的维持治疗。","specialty":"呼吸内科"},"ja":{"title":"エンシフェントリン","description":"OHTUVAYREはホスホジエステラーゼ3（PDE3）阻害薬およびホスホジエステラーゼ4（PDE4）阻害薬で、成人慢性閉塞性肺疾患（COPD）患者の維持療法に適応する。","specialty":"呼吸器内科"},"en":{"title":"Ensifentrine","description":"OHTUVAYRE is a phosphodiesterase 3 (PDE3) inhibitor and phosphodiesterase 4 (PDE4) inhibitor indicated for maintenance treatment of adults with chronic obstructive pulmonary disease (COPD).","specialty":"Respiratory Medicine"}}},{"id":133,"category":"drug","number":133,"langs":{"zh":{"title":"甘露醇吸入粉雾剂","description":"用于治疗 18 岁及以上成人的囊性纤维化，作为最佳标准治疗的补充治疗。","specialty":"呼吸内科"},"ja":{"title":"マンニトール吸入粉末剤","description":"18歳以上の成人嚢胞性線維症患者に対し、最適な標準治療への追加療法として使用する。","specialty":"呼吸器内科"},"en":{"title":"Mannitol Inhalation Powder","description":"For treatment of cystic fibrosis in adults aged 18 years and older as add-on therapy to the best standard of care.","specialty":"Respiratory Medicine"}}},{"id":134,"category":"drug","number":134,"langs":{"zh":{"title":"曲拉西利","description":"在广泛期小细胞肺癌成人患者含铂/依托泊苷化疗方案或含拓扑替康化疗方案之前给药，用于降低化疗导致的骨髓抑制的发生率。","specialty":"呼吸内科"},"ja":{"title":"トリラシクリブ","description":"進展型小細胞肺癌の成人患者において、プラチナ製剤／エトポシドを含む化学療法またはトポテカンを含む化学療法の前に投与し、化学療法による骨髄抑制の発生率を低減する。","specialty":"呼吸器内科"},"en":{"title":"Trilaciclib","description":"Administered before platinum/etoposide-containing chemotherapy or topotecan-containing chemotherapy in adults with extensive-stage small cell lung cancer to reduce the incidence of chemotherapy-induced myelosuppression.","specialty":"Respiratory Medicine"}}},{"id":135,"category":"drug","number":135,"langs":{"zh":{"title":"IMDELLTRA（tarlatamab-dlle）","description":"适用于含铂化疗失败的广泛期小细胞肺癌（ES-SCLC）成人患者的治疗","specialty":"呼吸内科"},"ja":{"title":"IMDELLTRA（tarlatamab-dlle）","description":"プラチナ製剤を含む化学療法が不成功であった進展型小細胞肺癌（ES-SCLC）の成人患者の治療に適応する。","specialty":"呼吸器内科"},"en":{"title":"IMDELLTRA (tarlatamab-dlle)","description":"Indicated for adult patients with extensive-stage small cell lung cancer (ES-SCLC) that has failed platinum-containing chemotherapy.","specialty":"Respiratory Medicine"}}},{"id":136,"category":"drug","number":136,"langs":{"zh":{"title":"注射用他拉泊芬钠","description":"当无法采用手术切除等其他根治性治疗方法时，或需要保留肺功能的患者但无法采用其他治疗方法时，且可通过内窥镜观察整个病灶并可采用激光照射的下列疾病。（1)早期肺癌(0期或I期肺癌）。","specialty":"呼吸内科"},"ja":{"title":"タラポルフィンナトリウム注射剤","description":"手術切除など他の根治的治療が行えない場合、または肺機能温存が必要で他の治療法を使用できない患者で、病変全体を内視鏡で観察でき、レーザー照射が可能な以下の疾患に使用する。（1）早期肺癌（0期またはI期肺癌）。","specialty":"呼吸器内科"},"en":{"title":"Talaporfin Sodium for Injection","description":"For early-stage lung cancer, stage 0 or stage I, when other curative treatment methods such as surgical resection cannot be used, or when preservation of lung function is required and other treatments cannot be used, provided that the entire lesion can be visualized endoscopically and laser irradiation can be performed.","specialty":"Respiratory Medicine"}}},{"id":137,"category":"drug","number":137,"langs":{"zh":{"title":"塞伐艾替尼","description":"国外获批适应症适用于治疗经 FDA 批准的检测方法确认携带 HER2（ERBB2）酪氨酸激酶结构域（TKD）激活突变且既往接受过一种全身性治疗的局部晚期或转移性非鳞状非小细胞肺癌（NSCLC）成人患者。","specialty":"呼吸内科"},"ja":{"title":"セバベルチニブ","description":"海外承認適応症は、FDA承認検査法でHER2（ERBB2）チロシンキナーゼドメイン（TKD）活性化変異が確認され、1種類の全身治療歴がある局所進行または転移性非扁平上皮非小細胞肺癌（NSCLC）の成人患者。","specialty":"呼吸器内科"},"en":{"title":"Sevabertinib","description":"The approved overseas indication is for adult patients with locally advanced or metastatic non-squamous non-small cell lung cancer (NSCLC) harboring an activating HER2 (ERBB2) tyrosine kinase domain (TKD) mutation confirmed by an FDA-approved test and who have received one prior systemic therapy.","specialty":"Respiratory Medicine"}}},{"id":138,"category":"drug","number":138,"langs":{"zh":{"title":"sotatercept（Winrevair）","description":"Winrevair 与其他肺动脉高压（PAH）治疗药物联合使用，适用于治疗WHO 功能分级（FC）II 至 III级成人 PAH 患者，以改善运动能力。","specialty":"呼吸内科"},"ja":{"title":"sotatercept（Winrevair）","description":"Winrevairは他の肺動脈性肺高血圧症（PAH）治療薬と併用し、WHO機能分類（FC）II～IIIの成人PAH患者の運動能力を改善する目的で使用する。","specialty":"呼吸器内科"},"en":{"title":"Sotatercept (Winrevair)","description":"Winrevair, in combination with other pulmonary arterial hypertension (PAH) therapies, is indicated for adults with WHO functional class (FC) II to III PAH to improve exercise capacity.","specialty":"Respiratory Medicine"}}},{"id":139,"category":"drug","number":139,"langs":{"zh":{"title":"英菲格拉替尼","description":"用于既往接受过治疗的、不可切除的局部晚期或转移性FGFR2融合胆管癌成人患者。","specialty":"肝胆外科"},"ja":{"title":"インフィグラチニブ","description":"既治療の切除不能局所進行または転移性FGFR2融合陽性胆管癌の成人患者に使用する。","specialty":"肝胆膵外科"},"en":{"title":"Infigratinib","description":"For previously treated adult patients with unresectable locally advanced or metastatic FGFR2 fusion-positive cholangiocarcinoma.","specialty":"Hepatobiliary Surgery"}}},{"id":140,"category":"drug","number":140,"langs":{"zh":{"title":"唯乐思（布美兰肽注射液）","description":"VYLEESI是一种黑皮质素受体激动剂，用于治疗绝经期前妇女获得性、广义的机能减退性性功能障碍（HSDD）。HSDD的特征为性欲降低致使情绪低落或人际交往困难，并且不是由下列原因所致：共存的医疗或精神疾病，伴侣关系问题，或药物或原料药的影响（1）。\n使用限制（1）：不能用于治疗绝经后女性或男性的 HSDD。不能用于提高性能力。\n获得性HSDD指的是在以前没有性欲问题的患者身上发生的HSDD。广义的HSDD指的是不管刺激类型、情况或伴侣如何都会发生的HSDD。","specialty":"妇科、妇产科"},"ja":{"title":"VYLEESI（ブレメラノチド注射液）","description":"VYLEESIはメラノコルチン受容体作動薬で、閉経前女性の後天性・全般性の性的欲求低下障害（HSDD）の治療に使用する。HSDDは、性的欲求低下により精神的苦痛または対人関係上の困難を来し、併存する身体疾患または精神疾患、パートナーとの関係上の問題、または薬剤・原薬の影響によるものではないことを特徴とする。\n使用制限：閉経後女性または男性のHSDDには使用できず、性的能力を高める目的には使用できない。\n後天性HSDDとは、以前に性的欲求の問題がなかった患者に生じるHSDDを指す。全般性HSDDとは、刺激の種類、状況またはパートナーにかかわらず生じるHSDDを指す。","specialty":"婦人科・産婦人科"},"en":{"title":"VYLEESI (Bremelanotide Injection)","description":"VYLEESI is a melanocortin receptor agonist used to treat acquired, generalized hypoactive sexual desire disorder (HSDD) in premenopausal women. HSDD is characterized by decreased sexual desire that causes marked distress or interpersonal difficulty and is not due to a coexisting medical or psychiatric condition, problems within the relationship, or the effects of a medication or drug substance.\nLimitations of use: It is not indicated for HSDD in postmenopausal women or in men, and it is not indicated to enhance sexual performance.\nAcquired HSDD refers to HSDD developing in a patient who previously had no problems with sexual desire. Generalized HSDD refers to HSDD occurring regardless of type of stimulation, situation, or partner.","specialty":"Gynecology, Obstetrics and Gynecology"}}},{"id":141,"category":"drug","number":141,"langs":{"zh":{"title":"ELAHERE™（mirvetuximab soravtansine-gynx）","description":"ELAHERE是一种靶向叶酸受体α（FRα）的抗体和微管抑制剂偶联剂，适用于既往接受过1-3种系统性治疗、叶酸受体α（FRα）阳性、铂类耐药的卵巢上皮癌、输卵管癌或原发性腹膜癌成年患者。根据FDA批准的检测方法选择患者接受治疗。","specialty":"妇科、妇产科"},"ja":{"title":"ELAHERE™（mirvetuximab soravtansine-gynx）","description":"ELAHEREは葉酸受容体α（FRα）を標的とする抗体・微小管阻害薬複合体で、1～3種類の全身治療歴があるFRα陽性、プラチナ抵抗性の上皮性卵巣癌、卵管癌または原発性腹膜癌の成人患者に適応する。FDA承認検査法により治療対象患者を選択する。","specialty":"婦人科・産婦人科"},"en":{"title":"ELAHERE™ (mirvetuximab soravtansine-gynx)","description":"ELAHERE is a folate receptor alpha (FRα)-targeting antibody and microtubule inhibitor conjugate indicated for adult patients with FRα-positive, platinum-resistant epithelial ovarian, fallopian tube, or primary peritoneal cancer who have received 1–3 prior systemic treatment regimens. Patients are selected for treatment using an FDA-approved test.","specialty":"Gynecology, Obstetrics and Gynecology"}}},{"id":142,"category":"drug","number":142,"langs":{"zh":{"title":"非唑奈坦片","description":"Veoza用于治疗绝经相关的中度至重度血管舒缩症状（VMS）","specialty":"妇科、妇产科"},"ja":{"title":"フェゾリネタント錠","description":"Veozaは更年期に関連する中等度～重度の血管運動神経症状（VMS）の治療に使用する。","specialty":"婦人科・産婦人科"},"en":{"title":"Fezolinetant Tablets","description":"Veoza is used to treat moderate to severe vasomotor symptoms (VMS) associated with menopause.","specialty":"Gynecology, Obstetrics and Gynecology"}}},{"id":143,"category":"drug","number":143,"langs":{"zh":{"title":"安络定®","description":"本品适用于治疗成人、青少年、儿童和 8个月及以上婴幼儿（体重10kg及以上）患者的以下自身炎症性周期性发热综合征（冷炎素相关周期性综合征（CAPS）和家族性地中海热(FMF)）：\n冷炎素相关周期性综合征\n本品适用于治疗CAPS，包括：\n\n新生儿多系统炎性疾病（NOMID）/慢性婴儿神经皮肤关节综合征（CINCA）\nMuckle-Wells综合征（MWS）\n家族性冷自身炎症反应综合征（FCAS）\n家族性地中海热\n本品适用于治疗家族性地中海热（FMF）。如适用，应将本品与秋水仙碱联合使用。\n斯蒂尔病（Still’s Disease）\n本品适用于成人、青少年、儿童和8个月及以上婴幼儿（体重10 kg及以上）患者，用于治疗具有中度至高度疾病活动的活动性系统特征的斯蒂尔病，包括全身型幼年特发性关节炎（SJIA）和成人发病型斯蒂尔病（AOSD）；或用于治疗接受非甾体抗炎药（NSAIDs）或糖皮质激素治疗后仍有持续性疾病活动的患者。\n本品可以单独给药，或与其他抗炎药和改善病情的抗风湿药物（DMARDs）联合使用。","specialty":"风湿免疫科"},"ja":{"title":"アナキンラ®","description":"成人、青少年、小児および8か月以上の乳幼児（体重10 kg以上）における以下の自己炎症性周期性発熱症候群、クリオピリン関連周期性症候群（CAPS）および家族性地中海熱（FMF）の治療に適応する。\nクリオピリン関連周期性症候群：\nCAPSの治療に適応し、新生児発症多臓器系炎症性疾患（NOMID）／慢性乳児神経皮膚関節症候群（CINCA）、Muckle-Wells症候群（MWS）、家族性寒冷自己炎症症候群（FCAS）を含む。\n家族性地中海熱：\nFMFの治療に適応する。必要に応じてコルヒチンと併用する。\nStill病：\n成人、青少年、小児および8か月以上の乳幼児（体重10 kg以上）において、中等度～高度の疾患活動性を有し、活動性の全身症状を伴うStill病、全身型若年性特発性関節炎（SJIA）および成人発症Still病（AOSD）を含む、または非ステロイド性抗炎症薬（NSAIDs）もしくは糖質コルチコイド治療後も疾患活動性が持続する患者に適応する。\n単独投与、または他の抗炎症薬および疾患修飾性抗リウマチ薬（DMARDs）との併用が可能。","specialty":"リウマチ・免疫科"},"en":{"title":"Anakinra®","description":"Indicated for adults, adolescents, children, and infants aged 8 months and older weighing at least 10 kg with the following autoinflammatory periodic fever syndromes, cryopyrin-associated periodic syndromes (CAPS) and familial Mediterranean fever (FMF):\nCryopyrin-associated periodic syndromes:\nindicated for CAPS, including neonatal-onset multisystem inflammatory disease (NOMID)/chronic infantile neurologic, cutaneous and articular syndrome (CINCA), Muckle-Wells syndrome (MWS), and familial cold autoinflammatory syndrome (FCAS).\nFamilial Mediterranean fever:\nindicated for treatment of FMF. Where appropriate, it should be used in combination with colchicine.\nStill's disease:\nindicated in adults, adolescents, children, and infants aged 8 months and older weighing at least 10 kg for active Still's disease with moderate to high disease activity and active systemic features, including systemic juvenile idiopathic arthritis (SJIA) and adult-onset Still's disease (AOSD), or for patients with persistent disease activity after treatment with nonsteroidal anti-inflammatory drugs (NSAIDs) or glucocorticoids.\nIt may be given alone or in combination with other anti-inflammatory drugs and disease-modifying antirheumatic drugs (DMARDs).","specialty":"Rheumatology and Immunology"}}},{"id":144,"category":"drug","number":144,"langs":{"zh":{"title":"帕西生长素注射液","description":"Sogroya 适用于在生长激素缺乏症所致生长迟缓的 3 岁及以上儿童和青少年（儿童 GHD）和生长激素缺乏症成人（成人 GHD）中替代内源性生长激素（GH）。","specialty":"儿科、内分泌"},"ja":{"title":"ソマパシタン注射液","description":"Sogroyaは、成長ホルモン欠損症による成長障害を有する3歳以上の小児および青少年（小児GHD）、ならびに成長ホルモン欠損症の成人（成人GHD）において、内因性成長ホルモン（GH）を補充する目的で使用する。","specialty":"小児科・内分泌科"},"en":{"title":"Somapacitan Injection","description":"Sogroya is indicated to replace endogenous growth hormone (GH) in children and adolescents aged 3 years and older with growth failure due to growth hormone deficiency, pediatric GHD, and in adults with growth hormone deficiency, adult GHD.","specialty":"Pediatrics, Endocrinology"}}},{"id":145,"category":"drug","number":145,"langs":{"zh":{"title":"达妥昔单抗β注射液","description":"适用于治疗≥12月龄的高风险神经母细胞瘤患者；治疗伴或不伴有残留病灶的复发性或难治性神经母细胞瘤","specialty":"儿科、内分泌"},"ja":{"title":"ジヌツキシマブ ベータ注射液","description":"12か月齢以上の高リスク神経芽腫患者の治療、ならびに残存病変の有無を問わない再発または難治性神経芽腫の治療に適応する。","specialty":"小児科・内分泌科"},"en":{"title":"Dinutuximab Beta Injection","description":"For treatment of high-risk neuroblastoma in patients aged ≥12 months; and treatment of relapsed or refractory neuroblastoma with or without residual disease.","specialty":"Pediatrics, Endocrinology"}}},{"id":146,"category":"drug","number":146,"langs":{"zh":{"title":"半胱胺酒石酸胶囊","description":"治疗经确诊的肾病型胱氨酸贮积症（亦称范可尼综合征）的罕见病药","specialty":"儿科、内分泌"},"ja":{"title":"システアミン酒石酸塩カプセル","description":"確定診断された腎症性シスチノーシス（Fanconi症候群とも呼ばれる）を治療する希少疾病用医薬品。","specialty":"小児科・内分泌科"},"en":{"title":"Cysteamine Bitartrate Capsules","description":"A rare-disease medicine for confirmed nephropathic cystinosis, also known as Fanconi syndrome.","specialty":"Pediatrics, Endocrinology"}}},{"id":147,"category":"drug","number":147,"langs":{"zh":{"title":"那加硫酶注射液","description":"粘多糖症6型","specialty":"儿科、内分泌"},"ja":{"title":"ガルスルファーゼ注射液","description":"ムコ多糖症VI型。","specialty":"小児科・内分泌科"},"en":{"title":"Galsulfase Injection","description":"Mucopolysaccharidosis type VI.","specialty":"Pediatrics, Endocrinology"}}},{"id":148,"category":"drug","number":148,"langs":{"zh":{"title":"苯丁酸甘油酯口服液","description":"用于作为一种氮结合剂，用于不能单用饮食蛋白限制和/或补充剂治疗的UCD成人、青少年、儿童、婴幼儿患者的长期管理。","specialty":"儿科、内分泌"},"ja":{"title":"グリセロールフェニル酪酸経口液","description":"食事蛋白制限および／または補充剤のみでは治療できない尿素サイクル異常症（UCD）の成人、青少年、小児および乳幼児の長期管理に、窒素結合剤として使用する。","specialty":"小児科・内分泌科"},"en":{"title":"Glycerol Phenylbutyrate Oral Liquid","description":"As a nitrogen-binding agent for long-term management of adults, adolescents, children, and infants with urea cycle disorders (UCDs) who cannot be managed by dietary protein restriction and/or supplementation alone.","specialty":"Pediatrics, Endocrinology"}}},{"id":149,"category":"drug","number":149,"langs":{"zh":{"title":"马昔巴特口服液","description":"Alagille综合征(ALGS)患者的胆汁淤积瘙痒症","specialty":"儿科、内分泌"},"ja":{"title":"マラリキシバット経口液","description":"Alagille症候群（ALGS）患者の胆汁うっ滞性そう痒症。","specialty":"小児科・内分泌科"},"en":{"title":"Maralixibat Oral Solution","description":"Cholestatic pruritus in patients with Alagille syndrome (ALGS).","specialty":"Pediatrics, Endocrinology"}}},{"id":150,"category":"drug","number":150,"langs":{"zh":{"title":"伏佐高","description":"用于2岁及以上骨骺未闭合的软骨发育不全患者的治疗。软骨发育不全的诊断应通过适当的基因检测来证实。","specialty":"儿科、内分泌"},"ja":{"title":"ボソリチド","description":"2歳以上で骨端線が閉鎖していない軟骨無形成症患者の治療に使用する。軟骨無形成症の診断は適切な遺伝子検査で確認すべきである。","specialty":"小児科・内分泌科"},"en":{"title":"Vosoritide","description":"For treatment of patients aged 2 years and older with achondroplasia whose epiphyses are not closed. The diagnosis of achondroplasia should be confirmed by appropriate genetic testing.","specialty":"Pediatrics, Endocrinology"}}},{"id":151,"category":"drug","number":151,"langs":{"zh":{"title":"无水甜菜碱","description":"用于同型半胱氨酸尿症的辅助治疗，涉及以下缺乏或缺陷：胱硫醚β-合成酶(CBS)、5,10-亚甲基-四氢叶酸还原酶(MTHFR)、钴胺素辅因子代谢(cbl)","specialty":""},"ja":{"title":"無水ベタイン","description":"ホモシスチン尿症の補助治療に使用し、以下の欠損または異常を対象とする：シスタチオニンβ合成酵素（CBS）、5,10-メチレンテトラヒドロ葉酸還元酵素（MTHFR）、コバラミン補因子代謝（cbl）。","specialty":""},"en":{"title":"Anhydrous Betaine","description":"For adjunctive treatment of homocystinuria involving deficiencies or defects in cystathionine beta-synthase (CBS), 5,10-methylenetetrahydrofolate reductase (MTHFR), or cobalamin cofactor metabolism (cbl).","specialty":""}}},{"id":152,"category":"drug","number":152,"langs":{"zh":{"title":"氢化可的松可拆壳胶囊装颗粒","description":"婴儿、儿童和青少年（出生至小于18岁）肾上腺功能不全的替代疗法","specialty":""},"ja":{"title":"ヒドロコルチゾン開封可能カプセル内顆粒","description":"乳児、小児および青少年（出生から18歳未満）の副腎機能不全に対する補充療法。","specialty":""},"en":{"title":"Hydrocortisone Granules in Opening Capsules","description":"Replacement therapy for adrenal insufficiency in infants, children, and adolescents from birth to under 18 years of age.","specialty":""}}},{"id":153,"category":"drug","number":153,"langs":{"zh":{"title":"Strensiq (asfotase alfa)","description":"适用于作为在儿童期和青春期发病的低磷酸酯酶症患者的长期酶替代疗法，以改善骨骼问题","specialty":""},"ja":{"title":"Strensiq (asfotase alfa)","description":"小児期および思春期発症の低ホスファターゼ症患者に対する長期酵素補充療法として、骨格症状を改善する目的で使用する。","specialty":""},"en":{"title":"Strensiq (asfotase alfa)","description":"Indicated as long-term enzyme replacement therapy for patients with childhood- and adolescent-onset hypophosphatasia to improve skeletal manifestations.","specialty":""}}},{"id":154,"category":"drug","number":154,"langs":{"zh":{"title":"醋酸氟氢可的松","description":"适用于艾迪生氏病的原发性肾上腺皮质功能减退症的部分替代治疗和失盐型肾上腺生殖综合征的治疗","specialty":""},"ja":{"title":"フルドロコルチゾン酢酸エステル","description":"Addison病における原発性副腎皮質機能低下症の部分補充療法、および塩喪失型副腎性器症候群の治療に適応する。","specialty":""},"en":{"title":"Fludrocortisone Acetate","description":"Indicated for partial replacement therapy in primary adrenocortical insufficiency in Addison's disease and for treatment of salt-losing adrenogenital syndrome.","specialty":""}}},{"id":155,"category":"drug","number":155,"langs":{"zh":{"title":"替度鲁肽","description":"治疗1岁及以上的短肠综合征（SBS）患者。患者应在手术后经过一段时间的肠道适应并且病情稳定。","specialty":""},"ja":{"title":"テデュグルチド","description":"1歳以上の短腸症候群（SBS）患者を治療する。患者は術後一定期間の腸管適応を経て、病状が安定している必要がある。","specialty":""},"en":{"title":"Teduglutide","description":"Treatment of patients aged 1 year and older with short bowel syndrome (SBS). Patients should be stable after a period of intestinal adaptation following surgery.","specialty":""}}},{"id":156,"category":"drug","number":156,"langs":{"zh":{"title":"OAV101注射液","description":"用于治疗 2 岁以下的脊髓性肌萎缩症 (SMA) 儿童患者，其运动神经元存活基因1 (SMN1)中存在双等位基因突变。","specialty":""},"ja":{"title":"OAV101注射液","description":"運動ニューロン生存遺伝子1（SMN1）に両アレル変異を有する2歳未満の脊髄性筋萎縮症（SMA）小児患者の治療に使用する。","specialty":""},"en":{"title":"OAV101 Injection","description":"For treatment of children under 2 years of age with spinal muscular atrophy (SMA) who have biallelic mutations in the survival motor neuron 1 (SMN1) gene.","specialty":""}}},{"id":157,"category":"drug","number":157,"langs":{"zh":{"title":"Bylvay (Odevixibat)","description":"适用于治疗6个月或以上的患有进行性家族性肝内胆汁淤积症（PFIC）的患者。","specialty":""},"ja":{"title":"Bylvay (Odevixibat)","description":"6か月齢以上の進行性家族性肝内胆汁うっ滞症（PFIC）患者の治療に適応する。","specialty":""},"en":{"title":"Bylvay (Odevixibat)","description":"Indicated for treatment of patients aged 6 months and older with progressive familial intrahepatic cholestasis (PFIC).","specialty":""}}},{"id":158,"category":"drug","number":158,"langs":{"zh":{"title":"Cerliponase alfa (Brineura)","description":"Brineura适用于治疗神经元蜡样脂褐质沉着症2型（CLN2）疾病，也称为三肽基肽酶1（TPP1）缺乏症。","specialty":""},"ja":{"title":"Cerliponase alfa (Brineura)","description":"Brineuraは神経セロイドリポフスチン症2型（CLN2）、別名トリペプチジルペプチダーゼ1（TPP1）欠損症の治療に適応する。","specialty":""},"en":{"title":"Cerliponase alfa (Brineura)","description":"Brineura is indicated for treatment of neuronal ceroid lipofuscinosis type 2 (CLN2), also known as tripeptidyl peptidase 1 (TPP1) deficiency.","specialty":""}}},{"id":159,"category":"drug","number":159,"langs":{"zh":{"title":"Setmelanotide (IMCIVREE)","description":"IMCIVREE 是一款黑素皮质素 4（MC4）受体激动剂，用于由基因检测明确的致病变异、可能致病变异或意义不明变异导致的阿黑皮素原（POMC）、前蛋白转化酶枯草溶菌素 1（PCSK1）、瘦素受体（LEPR）基因缺陷相关的 6 岁及以上肥胖患者的长期体重管理。\nIMCIVREE 不适用于治疗有以下情况的患者，因为预计 IMCIVREE 对这些患者无效：\n● 由良性变异或者可能良性变异导致的POMC、PCSK1 或 LEPR 基因缺陷相关的肥胖\n● 与 POMC、PCSK1 或 LEPR 缺陷无关的其他类型的肥胖，包括与其他遗传综合征相关的肥胖和一般性（多基因性）肥胖","specialty":""},"ja":{"title":"Setmelanotide (IMCIVREE)","description":"IMCIVREEはメラノコルチン4（MC4）受容体作動薬で、遺伝子検査により病原性、病原性の可能性、または意義不明の変異が確認されたプロオピオメラノコルチン（POMC）、前駆体タンパク質転換酵素サブチリシン／ケキシン1（PCSK1）、レプチン受容体（LEPR）遺伝子欠損に関連する6歳以上の肥満患者の長期体重管理に使用する。\nIMCIVREEは以下の患者には有効性が期待されないため適応しない：\n● 良性または良性の可能性が高い変異によるPOMC、PCSK1またはLEPR遺伝子欠損関連肥満\n● POMC、PCSK1またはLEPR欠損とは無関係のその他の肥満。その他の遺伝性症候群に関連する肥満および一般的な多遺伝子性肥満を含む。","specialty":""},"en":{"title":"Setmelanotide (IMCIVREE)","description":"IMCIVREE is a melanocortin 4 (MC4) receptor agonist used for chronic weight management in patients aged 6 years and older with obesity due to genetically confirmed pathogenic, likely pathogenic, or variants of uncertain significance affecting proopiomelanocortin (POMC), proprotein convertase subtilisin/kexin type 1 (PCSK1), or leptin receptor (LEPR) genes.\nIMCIVREE is not indicated for the following patients because it is not expected to be effective:\n● obesity associated with POMC, PCSK1, or LEPR deficiency caused by benign or likely benign variants;\n● other forms of obesity unrelated to POMC, PCSK1, or LEPR deficiency, including obesity associated with other genetic syndromes and general polygenic obesity.","specialty":""}}},{"id":160,"category":"drug","number":160,"langs":{"zh":{"title":"维托拉生","description":"Viltepso是一种反义寡核苷酸，用于治疗经证实适合外显子 53 跳过治疗的DMD 基因突变的杜氏肌营养不良（DMD）患者。该适应症是基于在接受VILTEPSO治疗的患者中观察到的骨骼肌肌营养不良蛋白产生的增加而加速批准的。该适应症的继续批准可能取决于验证性试验中临床获益的验证和描述。","specialty":""},"ja":{"title":"ビルトラルセン","description":"Viltepsoはアンチセンスオリゴヌクレオチドで、エクソン53スキッピング治療に適合することが確認されたDMD遺伝子変異を有するデュシェンヌ型筋ジストロフィー（DMD）患者を治療する。本適応症は、VILTEPSO投与患者で骨格筋ジストロフィン産生の増加が観察されたことに基づき迅速承認された。本適応症の承認継続は、検証試験における臨床的有用性の確認および記述に依存する可能性がある。","specialty":""},"en":{"title":"Viltolarsen","description":"Viltepso is an antisense oligonucleotide used to treat patients with Duchenne muscular dystrophy (DMD) who have a confirmed DMD gene mutation amenable to exon 53 skipping. This indication received accelerated approval based on the observed increase in skeletal muscle dystrophin production in patients treated with VILTEPSO. Continued approval may depend on verification and description of clinical benefit in confirmatory trials.","specialty":""}}},{"id":161,"category":"drug","number":161,"langs":{"zh":{"title":"Vamorolon (AGAMREE)","description":"本品用于 4 岁及以上杜氏肌营养不良症(DMD)患者的治疗","specialty":""},"ja":{"title":"Vamorolon (AGAMREE)","description":"4歳以上のデュシェンヌ型筋ジストロフィー（DMD）患者の治療に使用する。","specialty":""},"en":{"title":"Vamorolon (AGAMREE)","description":"For treatment of patients aged 4 years and older with Duchenne muscular dystrophy (DMD).","specialty":""}}},{"id":162,"category":"drug","number":162,"langs":{"zh":{"title":"依氟鸟氨酸片","description":"IWILFIN是一种鸟氨酸脱羧酶抑制剂，用于降低成人和儿童高危神经母细胞瘤（HRNB）患者的复发风险，这些患者对包括抗-GD2免疫治疗在内的多药多模式治疗至少有部分反应。","specialty":""},"ja":{"title":"エフロルニチン錠","description":"IWILFINはオルニチン脱炭酸酵素阻害薬で、抗GD2免疫療法を含む多剤・多モダリティ治療に少なくとも部分奏効した成人および小児の高リスク神経芽腫（HRNB）患者における再発リスクを低減するために使用する。","specialty":""},"en":{"title":"Eflornithine Tablets","description":"IWILFIN is an ornithine decarboxylase inhibitor used to reduce the risk of relapse in adult and pediatric patients with high-risk neuroblastoma (HRNB) who have achieved at least a partial response to prior multiagent, multimodality therapy including anti-GD2 immunotherapy.","specialty":""}}},{"id":163,"category":"drug","number":163,"langs":{"zh":{"title":"伏佐高","description":"适用于4个月及以上骨骺未闭合的软骨发育不全患者。软骨发育不全的诊断应通过适当的基因检测来证实。","specialty":""},"ja":{"title":"ボソリチド","description":"4か月齢以上で骨端線が閉鎖していない軟骨無形成症患者に適応する。診断は適切な遺伝子検査で確認すべきである。","specialty":""},"en":{"title":"Vosoritide","description":"Indicated for patients aged 4 months and older with achondroplasia whose epiphyses are not closed. The diagnosis of achondroplasia should be confirmed by appropriate genetic testing.","specialty":""}}},{"id":164,"category":"drug","number":164,"langs":{"zh":{"title":"奥立扑酶α","description":"用于治疗被称为酸性鞘磷脂酶缺乏症（ASMD）的遗传性疾病。适用于 A/B 型或 B 型 ASMD 儿童和成人患者，以治疗与大脑无关的 ASMD 的体征和症状。","specialty":""},"ja":{"title":"オリプダーゼ アルファ","description":"酸性スフィンゴミエリナーゼ欠損症（ASMD）と呼ばれる遺伝性疾患の治療に使用する。A/B型またはB型ASMDの小児および成人患者に適応し、中枢神経系以外のASMD徴候および症状を治療する。","specialty":""},"en":{"title":"Olipudase Alfa","description":"For treatment of the inherited disorder acid sphingomyelinase deficiency (ASMD). Indicated for pediatric and adult patients with type A/B or type B ASMD to treat non-central nervous system manifestations and symptoms of ASMD.","specialty":""}}},{"id":165,"category":"drug","number":165,"langs":{"zh":{"title":"Birch bark extract (Filsuvez)","description":"治疗 6 月龄及以上患者的营养不良型和交界型大疱性表皮松解症（EB）相关的部分皮层伤口。","specialty":""},"ja":{"title":"Birch bark extract (Filsuvez)","description":"6か月齢以上の患者における栄養障害型および接合部型表皮水疱症（EB）に関連する部分層創傷を治療する。","specialty":""},"en":{"title":"Birch Bark Extract (Filsuvez)","description":"Treatment of partial-thickness wounds associated with dystrophic and junctional epidermolysis bullosa (EB) in patients aged 6 months and older.","specialty":""}}},{"id":166,"category":"drug","number":166,"langs":{"zh":{"title":"胆酸胶囊","description":"适用于治疗单酶缺陷(SEDs)引起的胆汁酸合成障碍。","specialty":""},"ja":{"title":"コール酸カプセル","description":"単一酵素欠損症（SEDs）による胆汁酸合成障害の治療に適応する。","specialty":""},"en":{"title":"Cholic Acid Capsules","description":"Indicated for treatment of bile acid synthesis disorders caused by single enzyme defects (SEDs).","specialty":""}}},{"id":167,"category":"drug","number":167,"langs":{"zh":{"title":"戈硫酯酶（那加硫酶）","description":"适用于黏多糖贮积症 VI 型患者的长期酶替代治疗（MPS VI；N-乙酰半乳糖胺-4-硫酸酯酶缺乏症；Maroteaux-Lamy 综合征）。","specialty":""},"ja":{"title":"ガルスルファーゼ","description":"ムコ多糖症VI型（MPS VI、N-アセチルガラクトサミン-4-スルファターゼ欠損症、Maroteaux-Lamy症候群）患者の長期酵素補充療法に適応する。","specialty":""},"en":{"title":"Galsulfase","description":"Indicated for long-term enzyme replacement therapy in patients with mucopolysaccharidosis type VI, MPS VI, N-acetylgalactosamine-4-sulfatase deficiency, Maroteaux-Lamy syndrome.","specialty":""}}},{"id":168,"category":"drug","number":168,"langs":{"zh":{"title":"丙通沙（索磷布韦维帕他韦）","description":"适用于治疗以下慢性 HCV 基因型 1、2、3、4、5或 6 感染年龄 3～12岁的儿童患者：\n•未患肝硬化或患有代偿性肝硬化\n•患有失代偿性肝硬化（与利巴韦林联合用药）","specialty":""},"ja":{"title":"エプクルーサ（ソホスブビル／ベルパタスビル）","description":"以下の慢性HCV遺伝子型1、2、3、4、5または6感染を有する3～12歳の小児患者の治療に適応する：\n• 肝硬変なし、または代償性肝硬変\n• 非代償性肝硬変（リバビリンとの併用）","specialty":""},"en":{"title":"Epclusa (Sofosbuvir/Velpatasvir)","description":"Indicated for treatment of pediatric patients aged 3–12 years with chronic HCV genotype 1, 2, 3, 4, 5, or 6 infection who:\n• have no cirrhosis or compensated cirrhosis;\n• have decompensated cirrhosis, in combination with ribavirin.","specialty":""}}},{"id":169,"category":"drug","number":169,"langs":{"zh":{"title":"Seladelpar (Lyvdelzi)","description":"Seladelpar适用于与熊去氧胆酸（UDCA）联合治疗对UDCA单药应答不佳的原发性胆汁性胆管炎（PBC）成人患者，或作为单药用于治疗无法耐受UDCA的PBC成人患者。","specialty":""},"ja":{"title":"Seladelpar (Lyvdelzi)","description":"Seladelparは、UDCA単剤療法への反応が不十分な原発性胆汁性胆管炎（PBC）の成人患者にウルソデオキシコール酸（UDCA）と併用する、またはUDCA不耐容のPBC成人患者に単剤で使用する。","specialty":""},"en":{"title":"Seladelpar (Lyvdelzi)","description":"Seladelpar is indicated in combination with ursodeoxycholic acid (UDCA) for adults with primary biliary cholangitis (PBC) who have an inadequate response to UDCA monotherapy, or as monotherapy in adults with PBC who are unable to tolerate UDCA.","specialty":""}}},{"id":170,"category":"drug","number":170,"langs":{"zh":{"title":"注射用两性霉素B脂质体","description":"适用于以下成人和1个月至18岁的儿童： •用于治疗对该抗真菌感染药物敏感的生物体引起的系统性真菌感染，如隐球菌病、北美芽生菌病、播散性念珠菌病、球孢子菌病、曲霉病、组织胞浆菌病、毛霉菌病，也用于治疗美洲粘膜皮肤利什曼病。 •用于治疗中性粒细胞减少症患者的不明原因发热。其中，不明原因发热的定义为持续发热，对至少96小时的抗生素治疗无反应；高度提示该患者人群中存在系统性真菌感染。在开始使用AmBisome治疗前，对于观察到的不明原因发热，也应尽可能排除是常见病毒、寄生虫或分枝杆菌感染所致。对于临床上不明显的常见真菌疾病且仅皮肤或血清学检测结果呈阳性，不应使用本品进行治疗。","specialty":""},"ja":{"title":"アムホテリシンBリポソーム注射剤","description":"成人および1か月～18歳の小児に適応する。抗真菌薬に感受性を有する病原体による全身性真菌感染症、例えばクリプトコックス症、北米ブラストミセス症、播種性カンジダ症、コクシジオイデス症、アスペルギルス症、ヒストプラズマ症、ムーコル症の治療、およびアメリカ粘膜皮膚リーシュマニア症の治療に使用する。また、好中球減少症患者の原因不明発熱の治療に使用する。原因不明発熱とは、少なくとも96時間の抗菌薬治療に反応しない持続性発熱で、この患者群に全身性真菌感染の存在を強く示唆するものと定義する。AmBisome治療開始前に、原因不明発熱について可能な限り一般的なウイルス、寄生虫または抗酸菌感染を除外すべきである。臨床的に明らかでない一般的真菌疾患で、皮膚検査または血清学的検査のみ陽性の場合には本剤を使用すべきでない。","specialty":""},"en":{"title":"Liposomal Amphotericin B for Injection","description":"Indicated for adults and children aged 1 month to 18 years for treatment of systemic fungal infections caused by organisms susceptible to this antifungal agent, including cryptococcosis, North American blastomycosis, disseminated candidiasis, coccidioidomycosis, aspergillosis, histoplasmosis, and mucormycosis, and for treatment of American mucocutaneous leishmaniasis. It is also used for fever of unknown origin in neutropenic patients, defined as persistent fever unresponsive to at least 96 hours of antibiotic therapy and highly suggestive of systemic fungal infection in this patient population. Before initiating AmBisome for observed fever of unknown origin, common viral, parasitic, or mycobacterial infections should be excluded whenever possible. This product should not be used for clinically unapparent common fungal diseases when only skin or serologic test results are positive.","specialty":""}}},{"id":171,"category":"drug","number":171,"langs":{"zh":{"title":"去氧胆酸注射液","description":"适用于改善成人颏下脂肪堆积所致的中度至重度突出或肥厚的外观。","specialty":""},"ja":{"title":"デオキシコール酸注射液","description":"成人のオトガイ下脂肪蓄積による中等度～重度の突出または膨隆の外観改善に適応する。","specialty":""},"en":{"title":"Deoxycholic Acid Injection","description":"Indicated to improve the appearance of moderate to severe convexity or fullness associated with submental fat in adults.","specialty":""}}},{"id":172,"category":"drug","number":172,"langs":{"zh":{"title":"硫酸艾沙康唑","description":"用于治疗18岁及以上人群血液或身体中某些类型的真菌感染，称为“曲霉病”和“毛霉病”（合胞菌病）。","specialty":""},"ja":{"title":"イサブコナゾニウム硫酸塩","description":"18歳以上の人における血液または体内の特定の真菌感染症、「アスペルギルス症」および「ムーコル症」の治療に使用する。","specialty":""},"en":{"title":"Isavuconazonium Sulfate","description":"For treatment of certain fungal infections of the blood or body in persons aged 18 years and older, known as aspergillosis and mucormycosis.","specialty":""}}},{"id":173,"category":"drug","number":173,"langs":{"zh":{"title":"马塔西单抗","description":"Hympavzi 是一种组织因子途径抑制物（TFPI）拮抗剂，适用于无凝血因子 VIII 抑制物的成人和 12岁及以上儿童 A 型血友病（先天性凝血因子 VIII缺乏症）患者，或无凝血因子 IX 抑制物的成人和12 岁及以上儿童 B 型血友病（先天性凝血因子 IX缺乏症）患者，作为常规预防用药，以预防或减少出血事件的发生频率。","specialty":""},"ja":{"title":"マルスタシマブ","description":"Hympavziは組織因子経路インヒビター（TFPI）拮抗薬で、凝固第VIII因子インヒビターを有しない成人および12歳以上のA型血友病（先天性第VIII因子欠乏症）患者、または凝固第IX因子インヒビターを有しない成人および12歳以上のB型血友病（先天性第IX因子欠乏症）患者に対し、出血イベントの発生頻度を予防または低減するための定期予防投与に適応する。","specialty":""},"en":{"title":"Marstacimab","description":"Hympavzi is a tissue factor pathway inhibitor (TFPI) antagonist indicated as routine prophylaxis to prevent or reduce the frequency of bleeding episodes in adults and children aged 12 years and older with hemophilia A, congenital factor VIII deficiency, without factor VIII inhibitors, or hemophilia B, congenital factor IX deficiency, without factor IX inhibitors.","specialty":""}}},{"id":174,"category":"drug","number":174,"langs":{"zh":{"title":"富马酸吉瑞替尼片","description":"治疗复发或难治性急性髓系白血病","specialty":""},"ja":{"title":"ギルテリチニブフマル酸塩錠","description":"再発または難治性急性骨髄性白血病の治療。","specialty":""},"en":{"title":"Gilteritinib Fumarate Tablets","description":"Treatment of relapsed or refractory acute myeloid leukemia.","specialty":""}}},{"id":175,"category":"drug","number":175,"langs":{"zh":{"title":"阿扎胞苷片","description":"用于接受强化诱导化疗实现首次完全缓解（CR）或血细胞计数未完全恢复的完全缓解（CRi）、且不能完成强化治愈性疗法（如造血干细胞移植）的AML成人患者的继续治疗。","specialty":""},"ja":{"title":"アザシチジン錠","description":"強力寛解導入化学療法により初回完全寛解（CR）または血球数の回復が不完全な完全寛解（CRi）を達成し、造血幹細胞移植などの強力な根治療法を完遂できない成人AML患者の継続治療に使用する。","specialty":""},"en":{"title":"Azacitidine Tablets","description":"For continued treatment of adults with AML who achieved first complete remission (CR) or complete remission with incomplete blood count recovery (CRi) after intensive induction chemotherapy and who are unable to complete intensive curative therapy such as hematopoietic stem cell transplantation.","specialty":""}}},{"id":176,"category":"drug","number":176,"langs":{"zh":{"title":"拓舒沃®（艾伏尼布片）","description":"用于先前接受过治疗的IDH1突变胆管癌成年患者的靶向治疗","specialty":""},"ja":{"title":"TIBSOVO®（イボシデニブ錠）","description":"既治療のIDH1変異胆管癌成人患者に対する標的治療。","specialty":""},"en":{"title":"TIBSOVO® (Ivosidenib Tablets)","description":"Targeted treatment for adult patients with previously treated IDH1-mutated cholangiocarcinoma.","specialty":""}}},{"id":177,"category":"drug","number":177,"langs":{"zh":{"title":"Blenrep","description":"BLENREP作为一种单药疗法，适用于单药治疗符合下列条件的成年多发性骨髓瘤患者：既往接受过至少四种疗法，对至少一种蛋白酶体抑制剂、一种免疫调节剂、一种抗CD38单克隆抗体难治，末次治疗出现疾病进展的多发性骨髓瘤成人患者。","specialty":""},"ja":{"title":"Blenrep","description":"BLENREP単剤療法は、少なくとも4種類の治療歴があり、少なくとも1種類のプロテアソーム阻害薬、1種類の免疫調節薬、1種類の抗CD38モノクローナル抗体に難治性で、直近の治療で病勢進行した成人多発性骨髄腫患者に適応する。","specialty":""},"en":{"title":"Blenrep","description":"BLENREP monotherapy is indicated for adult patients with multiple myeloma who have received at least four prior therapies, are refractory to at least one proteasome inhibitor, one immunomodulatory agent, and one anti-CD38 monoclonal antibody, and whose disease progressed on the last treatment.","specialty":""}}},{"id":178,"category":"drug","number":178,"langs":{"zh":{"title":"注射用罗特西普","description":"骨髓增生异常综合症（MDS）","specialty":""},"ja":{"title":"ルスパテルセプト注射剤","description":"骨髄異形成症候群（MDS）。","specialty":""},"en":{"title":"Luspatercept for Injection","description":"Myelodysplastic syndromes (MDS).","specialty":""}}},{"id":179,"category":"drug","number":179,"langs":{"zh":{"title":"赛可益(艾沙妥昔单抗注射液)","description":"1.与泊马度胺和地塞米松联用，治疗既往接受过至少两种治疗（包含来那度胺和一种蛋白酶体抑制剂，并在最后一次治疗中表现出疾病进展）的复发和难治性多发性骨髓瘤成年患者。\n2.与卡非佐米和地塞米松联用，治疗既往接受过至少一种治疗的多发性骨髓瘤成人患者。","specialty":""},"ja":{"title":"Sarclisa（イサツキシマブ注射液）","description":"1. ポマリドミドおよびデキサメタゾンとの併用により、少なくとも2種類の治療、レナリドミドおよびプロテアソーム阻害薬を含む、を受け、直近治療で病勢進行した再発・難治性多発性骨髄腫の成人患者を治療する。\n2. カルフィルゾミブおよびデキサメタゾンとの併用により、少なくとも1種類の治療歴がある多発性骨髄腫成人患者を治療する。","specialty":""},"en":{"title":"Sarclisa (Isatuximab Injection)","description":"1. In combination with pomalidomide and dexamethasone for adults with relapsed and refractory multiple myeloma who have received at least two prior therapies, including lenalidomide and a proteasome inhibitor, and demonstrated disease progression on the last therapy.\n2. In combination with carfilzomib and dexamethasone for adult patients with multiple myeloma who have received at least one prior therapy.","specialty":""}}},{"id":180,"category":"drug","number":180,"langs":{"zh":{"title":"康可期（阿可替尼胶囊）","description":"本品单药治疗或联合奥妥珠单抗治疗适用于既往未接受过治疗的慢性淋巴细胞性白血病（CLL）成人患者；本品单药治疗适用于已接受至少一种既往治疗的慢性淋巴细胞性白血病（CLL）成年患者。","specialty":""},"ja":{"title":"Calquence（アカラブルチニブカプセル）","description":"単剤またはオビヌツズマブとの併用により未治療の慢性リンパ性白血病（CLL）成人患者に適応する。単剤療法は少なくとも1種類の既治療を受けたCLL成人患者に適応する。","specialty":""},"en":{"title":"Calquence (Acalabrutinib Capsules)","description":"As monotherapy or in combination with obinutuzumab for previously untreated adult patients with chronic lymphocytic leukemia (CLL); as monotherapy for adult patients with CLL who have received at least one prior therapy.","specialty":""}}},{"id":181,"category":"drug","number":181,"langs":{"zh":{"title":"百斯瑞明®（聚乙二醇脯氨酸干扰素α-2b）","description":"真性红细胞增多症（仅限不适用现有治疗或现有治疗效果不佳）","specialty":""},"ja":{"title":"Besremi®（ロペグインターフェロン アルファ-2b）","description":"真性多血症（既存治療が適用できない、または既存治療の効果が不十分な場合に限る）。","specialty":""},"en":{"title":"Besremi® (Ropeginterferon alfa-2b)","description":"Polycythemia vera, only in patients for whom existing treatment is not suitable or is insufficiently effective.","specialty":""}}},{"id":182,"category":"drug","number":182,"langs":{"zh":{"title":"赛可益(艾沙妥昔单抗注射液)","description":"与泊马度胺和地塞米松联用，治疗既往接受过至少2种治疗（包括来那度胺和一种蛋白酶体抑制剂）的多发性骨髓瘤成人患者。\n与卡非佐米和地塞米松联用，治疗既往接受过1-3种治疗的复发性或难治性多发性骨髓瘤成人患者。","specialty":""},"ja":{"title":"Sarclisa（イサツキシマブ注射液）","description":"ポマリドミドおよびデキサメタゾンとの併用により、レナリドミドとプロテアソーム阻害薬を含む少なくとも2種類の治療歴がある多発性骨髄腫成人患者を治療する。\nカルフィルゾミブおよびデキサメタゾンとの併用により、1～3種類の治療歴がある再発または難治性多発性骨髄腫成人患者を治療する。","specialty":""},"en":{"title":"Sarclisa (Isatuximab Injection)","description":"In combination with pomalidomide and dexamethasone for adult patients with multiple myeloma who have received at least two prior therapies including lenalidomide and a proteasome inhibitor.\nIn combination with carfilzomib and dexamethasone for adult patients with relapsed or refractory multiple myeloma who have received 1–3 prior therapies.","specialty":""}}},{"id":183,"category":"drug","number":183,"langs":{"zh":{"title":"赛可益(艾沙妥昔单抗注射液)","description":"与泊马度胺和地塞米松联用，治疗既往接受过至少2种治疗（包括来那度胺和一种蛋白酶体抑制剂）的多发性骨髓瘤成人患者。\n与卡非佐米和地塞米松联用，治疗既往接受过1-3种治疗的复发性或难治性多发性骨髓瘤成人患者。","specialty":""},"ja":{"title":"Sarclisa（イサツキシマブ注射液）","description":"ポマリドミドおよびデキサメタゾンとの併用により、レナリドミドとプロテアソーム阻害薬を含む少なくとも2種類の治療歴がある多発性骨髄腫成人患者を治療する。\nカルフィルゾミブおよびデキサメタゾンとの併用により、1～3種類の治療歴がある再発または難治性多発性骨髄腫成人患者を治療する。","specialty":""},"en":{"title":"Sarclisa (Isatuximab Injection)","description":"In combination with pomalidomide and dexamethasone for adult patients with multiple myeloma who have received at least two prior therapies including lenalidomide and a proteasome inhibitor.\nIn combination with carfilzomib and dexamethasone for adult patients with relapsed or refractory multiple myeloma who have received 1–3 prior therapies.","specialty":""}}},{"id":184,"category":"drug","number":184,"langs":{"zh":{"title":"莫替福肽","description":"适用于联合人粒细胞刺激因子（G-CSF）动员多发性骨髓瘤患者造血干细胞到外周血中，以便进行采集和随后的自体移植。","specialty":""},"ja":{"title":"モチキサフォルチド","description":"ヒト顆粒球コロニー刺激因子（G-CSF）との併用により、多発性骨髄腫患者の造血幹細胞を末梢血へ動員し、採取およびその後の自家移植を行うために使用する。","specialty":""},"en":{"title":"Motixafortide","description":"Indicated in combination with human granulocyte colony-stimulating factor (G-CSF) to mobilize hematopoietic stem cells to peripheral blood in patients with multiple myeloma for collection and subsequent autologous transplantation.","specialty":""}}},{"id":185,"category":"drug","number":185,"langs":{"zh":{"title":"福坦替尼","description":"Fostamatinib是一种SYK抑制剂，用于治疗既往疗效不佳的持续性或治疗慢性免疫性血小板减少症患者。","specialty":""},"ja":{"title":"ホスタマチニブ","description":"FostamatinibはSYK阻害薬で、既治療で十分な効果が得られなかった持続性または慢性免疫性血小板減少症患者の治療に使用する。","specialty":""},"en":{"title":"Fostamatinib","description":"Fostamatinib is a SYK inhibitor used to treat patients with persistent or chronic immune thrombocytopenia who have had an insufficient response to previous treatment.","specialty":""}}},{"id":186,"category":"drug","number":186,"langs":{"zh":{"title":"替朗妥昔单抗冻干粉制剂","description":"适用于治疗两线或多线系统治疗后复发或难治的大B细胞淋巴瘤成年患者，包括非特指型DLBCL、源于低级别淋巴瘤的DLBCL和高级别B细胞淋巴瘤","specialty":""},"ja":{"title":"ロンカスツキシマブ テシリン凍結乾燥製剤","description":"2ライン以上の全身治療後に再発または難治となった大細胞型B細胞リンパ腫成人患者に適応し、非特定型DLBCL、低悪性度リンパ腫から移行したDLBCL、高悪性度B細胞リンパ腫を含む。","specialty":""},"en":{"title":"Loncastuximab Tesirine Lyophilized Powder","description":"Indicated for adult patients with relapsed or refractory large B-cell lymphoma after two or more lines of systemic therapy, including DLBCL not otherwise specified, DLBCL arising from low-grade lymphoma, and high-grade B-cell lymphoma.","specialty":""}}},{"id":187,"category":"drug","number":187,"langs":{"zh":{"title":"阿思尼布（暂定）","description":"SCEMBLIX是一种激酶抑制剂，适用于治疗以下成年患者：（1）既往接受过 ≥ 2种酪氨酸激酶抑制剂（TKI）治疗的费城染色体阳性慢性髓性白血病（Ph+ CML）慢性期（CP）。（2）携带T315I突变的Ph+ CML慢性期。","specialty":""},"ja":{"title":"アシミニブ（仮称）","description":"SCEMBLIXはキナーゼ阻害薬で、以下の成人患者に適応する：（1）2種類以上のチロシンキナーゼ阻害薬（TKI）治療歴があるフィラデルフィア染色体陽性慢性骨髄性白血病（Ph+ CML）の慢性期（CP）、（2）T315I変異を有するPh+ CML慢性期。","specialty":""},"en":{"title":"Asciminib (Tentative Name)","description":"SCEMBLIX is a kinase inhibitor indicated for adult patients with: (1) Philadelphia chromosome-positive chronic myeloid leukemia (Ph+ CML) in chronic phase (CP) previously treated with ≥2 tyrosine kinase inhibitors (TKIs); or (2) Ph+ CML in chronic phase with a T315I mutation.","specialty":""}}},{"id":188,"category":"drug","number":188,"langs":{"zh":{"title":"拓舒沃®（艾伏尼布片）","description":"携带易感IDH1突变的，新诊断的年龄75岁或以上或因合并症而无法使用强化诱导化疗的成人AML患者。","specialty":""},"ja":{"title":"TIBSOVO®（イボシデニブ錠）","description":"感受性IDH1変異を有する新規診断AML成人患者で、75歳以上、または併存症のため強力寛解導入化学療法を使用できない患者。","specialty":""},"en":{"title":"TIBSOVO® (Ivosidenib Tablets)","description":"For newly diagnosed adult AML patients with a susceptible IDH1 mutation who are aged 75 years or older or are unable to receive intensive induction chemotherapy because of comorbidities.","specialty":""}}},{"id":189,"category":"drug","number":189,"langs":{"zh":{"title":"甲磺酸贝舒地尔片","description":"用于治疗既往至少2线系统性治疗失败的成人和12岁及以上儿童慢性移植物抗宿主病（Chronic GVHD, cGVHD）患者。","specialty":""},"ja":{"title":"ベルモスジルメシル酸塩錠","description":"少なくとも2ラインの全身治療が不成功であった成人および12歳以上の小児の慢性移植片対宿主病（Chronic GVHD, cGVHD）患者を治療する。","specialty":""},"en":{"title":"Belumosudil Mesylate Tablets","description":"For treatment of chronic graft-versus-host disease (chronic GVHD, cGVHD) in adults and children aged 12 years and older after failure of at least two prior lines of systemic therapy.","specialty":""}}},{"id":190,"category":"drug","number":190,"langs":{"zh":{"title":"甲氧沙林 G.L.Pharma 20微克/毫升血液成分修饰溶液","description":"治疗晚期皮肤T细胞淋巴瘤的皮肤症状。","specialty":""},"ja":{"title":"メトキサレン G.L.Pharma 20マイクログラム/mL 血液成分修飾液","description":"進行皮膚T細胞リンパ腫の皮膚症状を治療する。","specialty":""},"en":{"title":"Methoxsalen G.L. Pharma 20 micrograms/mL Solution for Modification of Blood Components","description":"Treatment of cutaneous manifestations of advanced cutaneous T-cell lymphoma.","specialty":""}}},{"id":191,"category":"drug","number":191,"langs":{"zh":{"title":"盐酸奎扎替尼片","description":"初治 FLT3-ITD 突变阳性急性髓系白血病。","specialty":""},"ja":{"title":"キザルチニブ塩酸塩錠","description":"未治療FLT3-ITD変異陽性急性骨髄性白血病。","specialty":""},"en":{"title":"Quizartinib Hydrochloride Tablet
