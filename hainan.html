rtrophic cardiomyopathy (HCM), New York Heart Association (NYHA) class II–III, to improve functional capacity and symptoms.","specialty":""}}},{"id":199,"category":"drug","number":199,"langs":{"zh":{"title":"二十碳五烯酸乙酯胶囊","description":"作为最大耐受他汀类药物的联合治疗，用于甘油三酯（TG)水平升高（≥150mg/dL)的成人患者合并已确诊心血管疾病或糖尿病伴≥2种其他心血管疾病危险因素；作为饮食的联合治疗，降低重度（≥500mg/dL）高甘油三酯血症成人患者的TG水平","specialty":""},"ja":{"title":"イコサペント酸エチルカプセル","description":"最大耐容量のスタチン療法への追加治療として、トリグリセリド（TG）値が150 mg/dL以上で、確立した心血管疾患、または糖尿病に加えて2つ以上の他の心血管疾患リスク因子を有する成人患者に使用する。また食事療法への追加として、重度高トリグリセリド血症、500 mg/dL以上、の成人患者のTG値を低下させる。","specialty":""},"en":{"title":"Icosapent Ethyl Capsules","description":"As add-on therapy to maximally tolerated statin therapy in adults with elevated triglyceride (TG) levels, ≥150 mg/dL, and established cardiovascular disease or diabetes plus ≥2 additional cardiovascular risk factors; and as an adjunct to diet to reduce TG levels in adults with severe hypertriglyceridemia, ≥500 mg/dL.","specialty":""}}},{"id":200,"category":"drug","number":200,"langs":{"zh":{"title":"夫曲司兰","description":"治疗成人遗传性转甲状腺素蛋白淀粉样变性多发性神经病(hATTR-PN); 治疗成人野生型或遗传性转甲状腺素蛋白淀粉样变性心肌病(ATTR-CM)，以降低心血管死亡率、心血管住院率和紧急心力衰竭就诊率。","specialty":""},"ja":{"title":"ブトリシラン","description":"成人の遺伝性トランスサイレチンアミロイドーシス多発ニューロパチー（hATTR-PN）の治療。成人の野生型または遺伝性トランスサイレチンアミロイドーシス心筋症（ATTR-CM）の治療により、心血管死亡率、心血管入院率および緊急心不全受診率を低減する。","specialty":""},"en":{"title":"Vutrisiran","description":"Treatment of hereditary transthyretin amyloidosis with polyneuropathy in adults, hATTR-PN; treatment of wild-type or hereditary transthyretin amyloid cardiomyopathy in adults, ATTR-CM, to reduce cardiovascular mortality, cardiovascular hospitalization, and urgent heart failure visits.","specialty":""}}},{"id":201,"category":"drug","number":201,"langs":{"zh":{"title":"Leqvio","description":"用于治疗成人原发性高胆固醇血症（杂合子家族性和非家族性）或混合型血脂异常，具体为：（1）Leqvio联合他汀类药物或他汀类药物和其他降脂疗法，用于治疗接受最大耐受剂量他汀类药物无法达到LDL-C治疗目标的患者；（2）Leqvio联合其他降脂疗法，用于治疗他汀类药物不耐受或他汀类药物禁忌症的患者。","specialty":""},"ja":{"title":"Leqvio","description":"成人の原発性高コレステロール血症（ヘテロ接合性家族性および非家族性）または混合型脂質異常症の治療に使用する。具体的には：（1）最大耐容量のスタチンでもLDL-C治療目標に到達できない患者に、Leqvioをスタチンまたはスタチン＋他の脂質低下療法と併用する。（2）スタチン不耐容またはスタチン禁忌の患者に、Leqvioを他の脂質低下療法と併用する。","specialty":""},"en":{"title":"Leqvio","description":"For treatment of adults with primary hypercholesterolemia, heterozygous familial and non-familial, or mixed dyslipidemia: (1) Leqvio in combination with a statin, or a statin plus other lipid-lowering therapy, for patients unable to achieve LDL-C targets on the maximum tolerated statin dose; (2) Leqvio in combination with other lipid-lowering therapies for patients who are statin intolerant or have a contraindication to statins.","specialty":""}}},{"id":202,"category":"drug","number":202,"langs":{"zh":{"title":"帕罗培特立帕肽","description":"帕罗培特立帕肽是一种甲状旁腺激素(PTH)替代治疗药物，适用于治疗成人慢性甲状旁腺功能减退症。","specialty":""},"ja":{"title":"パロペグテリパラチド","description":"パロペグテリパラチドは副甲状腺ホルモン（PTH）補充療法薬で、成人の慢性副甲状腺機能低下症の治療に適応する。","specialty":""},"en":{"title":"Palopegteriparatide","description":"Palopegteriparatide is a parathyroid hormone (PTH) replacement therapy indicated for treatment of chronic hypoparathyroidism in adults.","specialty":""}}},{"id":203,"category":"drug","number":203,"langs":{"zh":{"title":"重组链激酶栓剂","description":"适用于 18 岁以上任何性别患者，临床诊断为急性痔疮(痔疮发作或血栓性痔疮)的人群。该病通常表现为肛周突发疼痛，伴随大小和形态不一的肿块，颜色可能呈红紫色，常合并肛门水肿、便血、瘙痒、异物感、便秘等症状。","specialty":""},"ja":{"title":"組換えストレプトキナーゼ坐剤","description":"18歳を超える男女いずれの患者にも適応し、急性痔核、痔核発作または血栓性痔核、と臨床診断された患者を対象とする。本疾患は通常、肛門周囲に突然の疼痛が生じ、さまざまな大きさ・形態の腫瘤を伴い、赤紫色を呈することがあり、肛門浮腫、血便、そう痒、異物感、便秘などを併発することが多い。","specialty":""},"en":{"title":"Recombinant Streptokinase Suppository","description":"Indicated for patients of either sex aged over 18 years with a clinical diagnosis of acute hemorrhoids, hemorrhoidal attack or thrombosed hemorrhoids. The condition commonly presents with sudden perianal pain accompanied by masses of varying size and shape, potentially reddish-purple in color, and is often associated with anal edema, rectal bleeding, itching, foreign-body sensation, constipation, and other symptoms.","specialty":""}}},{"id":204,"category":"drug","number":204,"langs":{"zh":{"title":"黄体酮栓","description":"辅助生殖技术（ART）治疗中的黄体期支持（LPS）","specialty":""},"ja":{"title":"プロゲステロン坐剤","description":"生殖補助医療（ART）治療における黄体期補充（LPS）。","specialty":""},"en":{"title":"Progesterone Suppository","description":"Luteal phase support (LPS) in assisted reproductive technology (ART) treatment.","specialty":""}}},{"id":205,"category":"drug","number":205,"langs":{"zh":{"title":"注射用丹曲林钠混悬剂","description":"1.结合适当的支持措施治疗恶性高热；\n2.预防高危患者的恶性高热。","specialty":""},"ja":{"title":"ダントロレンナトリウム注射用懸濁剤","description":"1. 適切な支持療法と併用して悪性高熱症を治療する。\n2. 高リスク患者の悪性高熱症を予防する。","specialty":""},"en":{"title":"Dantrolene Sodium Injectable Suspension","description":"1. Treatment of malignant hyperthermia in conjunction with appropriate supportive measures;\n2. Prevention of malignant hyperthermia in high-risk patients.","specialty":""}}},{"id":206,"category":"device","number":1,"langs":{"zh":{"title":"含利多卡因注射用交联透明质酸钠凝胶","description":"可满足18岁以上希望通过治疗恢复或创建面部容量的医美患者。利多卡因可减轻治疗过程中患者的疼痛","specialty":"整形外科"},"ja":{"title":"リドカイン含有注射用架橋ヒアルロン酸ナトリウムゲル","description":"治療により顔面ボリュームを回復または形成したい18歳以上の美容医療患者を対象とする。リドカインは治療中の患者の疼痛を軽減する。","specialty":"形成外科"},"en":{"title":"Cross-Linked Sodium Hyaluronate Gel for Injection with Lidocaine","description":"For aesthetic patients aged 18 years and older who wish to restore or create facial volume through treatment. Lidocaine can reduce patient pain during the treatment procedure.","specialty":"Plastic Surgery"}}},{"id":207,"category":"device","number":2,"langs":{"zh":{"title":"GEM PLUS HARD 组织修复用材料（GEM PLUS HARD）","description":"将交联葡聚糖注入到皮下，通过物理性修复，替换、修复、重建人体组织。","specialty":"整形外科"},"ja":{"title":"GEM PLUS HARD 組織修復材料","description":"架橋デキストランを皮下に注入し、物理的修復により人体組織を置換、修復、再建する。","specialty":"形成外科"},"en":{"title":"GEM PLUS HARD Tissue Repair Material","description":"Cross-linked dextran is injected subcutaneously to replace, repair, and reconstruct human tissue through physical repair.","specialty":"Plastic Surgery"}}},{"id":208,"category":"device","number":3,"langs":{"zh":{"title":"注射用面部修复材料（CYTOCARE）","description":"CYTOCARE系列产品用于减少面部受到的与年龄、生活方式或环境相关的不同可见影响。CYTOCARE系列产品用于注射到眶周线和口周线（垂直唇纹）的浅表和中层真皮中。CYTOCARE516可改善中度老化型皮肤的质地（填充细纹、保持水润与光泽）。在3次注射治疗后，患者会根据年龄和注射部位的初始状态，在7天内观察到细纹的轻微改善。","specialty":"整形外科"},"ja":{"title":"注射用顔面修復材料（CYTOCARE）","description":"CYTOCAREシリーズは、加齢、生活習慣または環境に関連する顔面のさまざまな目に見える影響を軽減するために使用する。眼周囲線および口周囲線、縦じわ、の表層および中層真皮に注入する。CYTOCARE 516は中等度に老化した皮膚の質感を改善し、細かな皺を充填し、水分と光沢を維持する。3回の注射治療後、患者は年齢および注射部位の初期状態に応じて、7日以内に細かな皺の軽度改善を認めることがある。","specialty":"形成外科"},"en":{"title":"Injectable Facial Repair Material (CYTOCARE)","description":"The CYTOCARE product series is used to reduce various visible facial effects related to age, lifestyle, or environment. CYTOCARE products are injected into the superficial and mid dermis of the periorbital lines and perioral lines, vertical lip lines. CYTOCARE 516 can improve the texture of moderately aged skin by filling fine lines and maintaining hydration and radiance. After three injection treatments, patients may observe slight improvement of fine lines within 7 days, depending on age and the initial condition of the injection site.","specialty":"Plastic Surgery"}}},{"id":209,"category":"device","number":4,"langs":{"zh":{"title":"注射用面部修复材料（CYTOCARE）","description":"CYTOCARE系列产品用于减少面部受到的与年龄、生活方式或环境相关的不同可见影响。CYTOCARE系列产品用于注射到眶周线和口周线（垂直唇纹）的浅表和中层真皮中。CYTOCARE532可改善重度老化型皮肤的质地（填充细纹、保持水润与光泽）。在3次注射治疗后，患者会根据年龄和注射部位的初始状态，在7天内观察到细纹的轻微改善。","specialty":"整形外科"},"ja":{"title":"注射用顔面修復材料（CYTOCARE）","description":"CYTOCAREシリーズは、加齢、生活習慣または環境に関連する顔面のさまざまな目に見える影響を軽減するために使用する。眼周囲線および口周囲線、縦じわ、の表層および中層真皮に注入する。CYTOCARE 532は高度に老化した皮膚の質感を改善し、細かな皺を充填し、水分と光沢を維持する。3回の注射治療後、患者は年齢および注射部位の初期状態に応じて、7日以内に細かな皺の軽度改善を認めることがある。","specialty":"形成外科"},"en":{"title":"Injectable Facial Repair Material (CYTOCARE)","description":"The CYTOCARE product series is used to reduce various visible facial effects related to age, lifestyle, or environment. CYTOCARE products are injected into the superficial and mid dermis of the periorbital lines and perioral lines, vertical lip lines. CYTOCARE 532 can improve the texture of severely aged skin by filling fine lines and maintaining hydration and radiance. After three injection treatments, patients may observe slight improvement of fine lines within 7 days, depending on age and the initial condition of the injection site.","specialty":"Plastic Surgery"}}},{"id":210,"category":"device","number":5,"langs":{"zh":{"title":"AestheFill 组织修复材料（AestheFill）","description":"AestheFill用于在皱纹的真皮层注入时，可以填补皱纹真皮层而增大立体感，改善面部皱纹。","specialty":"整形外科"},"ja":{"title":"AestheFill 組織修復材料","description":"AestheFillを皺の真皮層に注入することで、皺の真皮層を充填し、立体感を増大させ、顔面の皺を改善する。","specialty":"形成外科"},"en":{"title":"AestheFill Tissue Repair Material","description":"When injected into the dermal layer of wrinkles, AestheFill can fill the dermal layer of wrinkles, increase three-dimensional volume, and improve facial wrinkles.","specialty":"Plastic Surgery"}}},{"id":211,"category":"device","number":6,"langs":{"zh":{"title":"硅凝胶填充乳房植入体Perle™ Sterile Smooth Opaque Gel Filled Mammary Implants","description":"整形外科隆乳手术。\n乳房先天畸形的容积增大和轮廓矫正。\n皮下乳房切除术以及其他适当乳房切除术或创伤后的乳房再造。\n合并乳房和胸壁畸形。\n因医学和美容原因更换植入体。","specialty":"整形外科"},"ja":{"title":"Perle™ Sterile Smooth Opaque Gel Filled Mammary Implants シリコーンゲル充填乳房インプラント","description":"形成外科における豊胸術。\n先天性乳房変形の容積増大および輪郭矯正。\n皮下乳房切除術、その他適切な乳房切除術、または外傷後の乳房再建。\n乳房と胸壁の複合変形。\n医学的および美容上の理由によるインプラント交換。","specialty":"形成外科"},"en":{"title":"Perle™ Sterile Smooth Opaque Gel Filled Mammary Implants","description":"Plastic surgery breast augmentation.\nVolume augmentation and contour correction for congenital breast deformities.\nBreast reconstruction after subcutaneous mastectomy, other appropriate mastectomy procedures, or trauma.\nCombined breast and chest wall deformities.\nReplacement of implants for medical and cosmetic reasons.","specialty":"Plastic Surgery"}}},{"id":212,"category":"device","number":7,"langs":{"zh":{"title":"微绒面解剖型乳房植入体Luna XT Micro Textured Anatomical Breast Implant","description":"乳房先天畸形的外科手术容积增大和轮廓矫正；\n皮下乳房切除术以及其他适当乳房切除术或创伤后的乳房再造手术；\n合并乳房和胸壁畸形的外科手术矫正；\n因医学和美容原因更换乳房植入体。","specialty":"整形外科"},"ja":{"title":"Luna XT Micro Textured Anatomical Breast Implant 微細テクスチャー解剖型乳房インプラント","description":"先天性乳房変形の外科的容積増大および輪郭矯正。\n皮下乳房切除術、その他適切な乳房切除術または外傷後の乳房再建手術。\n乳房と胸壁の複合変形の外科的矯正。\n医学的および美容上の理由による乳房インプラント交換。","specialty":"形成外科"},"en":{"title":"Luna XT Micro Textured Anatomical Breast Implant","description":"Surgical volume augmentation and contour correction of congenital breast deformities;\nbreast reconstruction after subcutaneous mastectomy, other appropriate mastectomy procedures, or trauma;\nsurgical correction of combined breast and chest wall deformities;\nreplacement of breast implants for medical and cosmetic reasons.","specialty":"Plastic Surgery"}}},{"id":213,"category":"device","number":8,"langs":{"zh":{"title":"GEM PLUS GOLD 组织修复用材料（GEM PLUS GOLD）","description":"主要由交联葡聚糖构成，并不含有PMMA 微球，其更适合面部软组织填充。将交联葡聚糖注入到皮下，通过物理性修复，替换、修复、重建人体组织等","specialty":"整形外科"},"ja":{"title":"GEM PLUS GOLD 組織修復材料","description":"主として架橋デキストランで構成され、PMMAマイクロスフェアを含まないため、顔面軟組織の充填により適している。架橋デキストランを皮下に注入し、物理的修復によって人体組織を置換、修復、再建する。","specialty":"形成外科"},"en":{"title":"GEM PLUS GOLD Tissue Repair Material","description":"Mainly composed of cross-linked dextran and does not contain PMMA microspheres, making it more suitable for facial soft-tissue filling. Cross-linked dextran is injected subcutaneously to replace, repair, reconstruct, and otherwise physically restore human tissues.","specialty":"Plastic Surgery"}}},{"id":214,"category":"device","number":9,"langs":{"zh":{"title":"奥世博PCL骨骼填充物（Osteopore PCL Scaffold Bone Filler）","description":"主要用于修复神经外科钻孔、开颅手术切口和其他颅骨缺损，还可用于强化或修复颅面骨骼轮廓。使用中应将该产品轻轻塞入骨骼系统空隙或缝隙中。","specialty":"整形外科"},"ja":{"title":"Osteopore PCL Scaffold Bone Filler","description":"主として脳神経外科の穿頭孔、開頭術切開部およびその他の頭蓋骨欠損の修復に使用し、頭蓋顔面骨格輪郭の補強または修復にも使用できる。使用時は骨格系の空隙または隙間に本製品をやさしく充填する。","specialty":"形成外科"},"en":{"title":"Osteopore PCL Scaffold Bone Filler","description":"Mainly used to repair neurosurgical burr holes, craniotomy defects, and other skull defects, and may also be used to reinforce or repair craniofacial skeletal contours. During use, the product should be gently packed into gaps or voids in the skeletal system.","specialty":"Plastic Surgery"}}},{"id":215,"category":"device","number":10,"langs":{"zh":{"title":"注射用软骨再生胶原蛋白填充材料","description":"Chondrofiller liquid用于治疗不同关节（如膝关节、踝关节和肩关节）缺损表面积分别低于3cm²（Chondrofiller liquid，HCFL-23）,2cm²（Chondrofiller liquid，HCFL-15）和1.5cm²（Chondrofiller liquid，HCFL-10）且 Ooterbridge 分级为Ⅲ或Ⅳ度的（如下）软骨缺损。局部或关节软骨损伤、深部和/或软骨下缺损、骨软骨缺损。Chondrofiller liquid在某些身体部分如耳廓或乳房禁止使用。","specialty":"运动医学科"},"ja":{"title":"注射用軟骨再生コラーゲン充填材","description":"Chondrofiller liquidは、膝、足関節、肩などの各関節において、欠損表面積がそれぞれ3 cm²未満、Chondrofiller liquid HCFL-23、2 cm²未満、HCFL-15、1.5 cm²未満、HCFL-10、かつOuterbridge分類IIIまたはIV度の軟骨欠損を治療する。局所または関節軟骨損傷、深部および／または軟骨下欠損、骨軟骨欠損を含む。Chondrofiller liquidは耳介や乳房など一部の身体部位には使用禁止である。","specialty":"スポーツ医学科"},"en":{"title":"Injectable Cartilage Regeneration Collagen Filler","description":"Chondrofiller liquid is used to treat cartilage defects in different joints, such as the knee, ankle, and shoulder, with defect surface areas below 3 cm² for Chondrofiller liquid HCFL-23, 2 cm² for HCFL-15, and 1.5 cm² for HCFL-10, and with Outerbridge grade III or IV lesions, including localized or articular cartilage injury, deep and/or subchondral defects, and osteochondral defects. Chondrofiller liquid must not be used in certain body areas such as the auricle or breast.","specialty":"Sports Medicine"}}},{"id":216,"category":"device","number":11,"langs":{"zh":{"title":"关节腔内注射用透明质酸钠盐溶液预填充注射器","description":"适用于患有髋关节和膝关节退行性或机械性关节病的患者，该病将导致滑液的功能特性改变，但不包括活动性滑膜炎","specialty":"运动医学科"},"ja":{"title":"関節腔内注射用ヒアルロン酸ナトリウム溶液プレフィルドシリンジ","description":"股関節および膝関節の変性性または機械性関節症を有し、滑液の機能特性が変化した患者に適応する。ただし活動性滑膜炎を除く。","specialty":"スポーツ医学科"},"en":{"title":"Prefilled Syringe of Sodium Hyaluronate Solution for Intra-Articular Injection","description":"For patients with degenerative or mechanical arthropathy of the hip or knee that alters the functional characteristics of synovial fluid, excluding active synovitis.","specialty":"Sports Medicine"}}},{"id":217,"category":"device","number":12,"langs":{"zh":{"title":"聚酯胶原骨修复材料Smartbone ORTHO","description":"当骨小梁结构被撞击力破坏时，填充创伤性骨系统的骨缺损。在选择性骨科手术中填充骨缺损，在重建中的应用：在关节成形术和翻修关节成形术中，用于填充或重建髋臼骨或在同种异体嵌塞植骨中用于补充股骨；楔形截骨后；肿瘤源性骨骼系统骨缺损的填充：在刮除良性骨肿瘤和肿瘤样病变后，用于刮除病变的结构支架或填充；用于良性侵袭性肿瘤切除术后的几何截骨重建；用于恶性肿瘤切除术中整体定制骨重建。","specialty":"运动医学科"},"ja":{"title":"Smartbone ORTHO ポリエステル・コラーゲン骨修復材料","description":"衝撃力により骨梁構造が破壊された場合の外傷性骨欠損を充填する。選択的整形外科手術における骨欠損充填および再建に使用し、関節形成術および再置換術での寛骨臼骨の充填・再建、同種骨インパクション移植での大腿骨補充、楔状骨切り術後、腫瘍由来骨欠損の充填、良性骨腫瘍および腫瘍様病変掻爬後の構造支持または充填、良性侵襲性腫瘍切除後の幾何学的骨切り再建、悪性腫瘍切除時の全体的なカスタム骨再建に使用する。","specialty":"スポーツ医学科"},"en":{"title":"Smartbone ORTHO Polyester-Collagen Bone Repair Material","description":"For filling traumatic bone defects when trabecular bone structure has been damaged by impact. Used to fill bone defects in elective orthopedic surgery, including reconstruction applications: filling or reconstruction of acetabular bone in arthroplasty and revision arthroplasty or supplementation of the femur in allograft impaction grafting; after wedge osteotomy; filling bone defects caused by tumors, including use as a structural scaffold or filler after curettage of benign bone tumors and tumor-like lesions; geometric osteotomy reconstruction after resection of benign aggressive tumors; and overall customized bone reconstruction during malignant tumor resection.","specialty":"Sports Medicine"}}},{"id":218,"category":"device","number":13,"langs":{"zh":{"title":"InSpace 可吸收肩关节球囊（InSpace System Implantable Balloon）","description":"治疗肩袖损伤","specialty":"运动医学科"},"ja":{"title":"InSpace System Implantable Balloon 吸収性肩関節バルーン","description":"腱板損傷の治療。","specialty":"スポーツ医学科"},"en":{"title":"InSpace System Implantable Absorbable Shoulder Balloon","description":"Treatment of rotator cuff injury.","specialty":"Sports Medicine"}}},{"id":219,"category":"device","number":14,"langs":{"zh":{"title":"注射用软骨再生胶原蛋白 填充材料（ChondroFiller liquid）","description":"能够在软骨缺损处快速形成凝胶，诱导周围健康的软骨细胞迁移进入，形成透明软骨，达到软骨再生的目的。用于治疗软骨损伤。","specialty":"运动医学科"},"ja":{"title":"注射用軟骨再生コラーゲン充填材（ChondroFiller liquid）","description":"軟骨欠損部で速やかにゲルを形成し、周囲の健常軟骨細胞の移動を誘導し、硝子軟骨を形成して軟骨再生を促す。軟骨損傷の治療に使用する。","specialty":"スポーツ医学科"},"en":{"title":"Injectable Cartilage Regeneration Collagen Filler (ChondroFiller liquid)","description":"Rapidly forms a gel at the cartilage defect, induces migration of surrounding healthy chondrocytes into the area, forms hyaline cartilage, and thereby promotes cartilage regeneration. Used for treatment of cartilage injury.","specialty":"Sports Medicine"}}},{"id":220,"category":"device","number":15,"langs":{"zh":{"title":"X射线管组件 X-RAY TUBE Assembly","description":"X 射线管组件（CXB-750U）是将电气输入转换为诊疗手段的 X 射线输出，与冷却用的热交换器组合使用的电气设备。需要搭载在 Aquilion Precision（TSX-304A）设备使用，使用计算机处理患者多个方向的 X 射线透视信号，为诊断治疗提供重组图像。","specialty":"医学影像科"},"ja":{"title":"X-RAY TUBE Assembly X線管装置","description":"X線管装置（CXB-750U）は電気入力を診断・治療に用いるX線出力へ変換し、冷却用熱交換器と組み合わせて使用する電気機器である。Aquilion Precision（TSX-304A）に搭載して使用し、患者の複数方向からのX線透過信号をコンピュータ処理して、診断・治療用の再構成画像を提供する。","specialty":"医用画像診断科"},"en":{"title":"X-RAY TUBE Assembly","description":"The X-ray tube assembly CXB-750U is electrical equipment that converts electrical input into X-ray output for diagnosis and treatment and is used in combination with a heat exchanger for cooling. It must be installed in the Aquilion Precision TSX-304A system, which uses computer processing of X-ray projection signals from multiple directions around the patient to provide reconstructed images for diagnosis and treatment.","specialty":"Medical Imaging"}}},{"id":221,"category":"device","number":16,"langs":{"zh":{"title":"全身用 X 射线 CT 诊断装置 Aquilion Precision","description":"使用计算机处理患者多个方向的 X 射线透视信号，为诊断治疗提供重组图像。","specialty":"医学影像科"},"ja":{"title":"Aquilion Precision 全身用X線CT診断装置","description":"患者の複数方向からのX線透過信号をコンピュータ処理し、診断・治療用の再構成画像を提供する。","specialty":"医用画像診断科"},"en":{"title":"Aquilion Precision Whole-Body X-ray CT Diagnostic System","description":"Uses computer processing of X-ray projection signals from multiple directions around the patient to provide reconstructed images for diagnosis and treatment.","specialty":"Medical Imaging"}}},{"id":222,"category":"device","number":17,"langs":{"zh":{"title":"放射治疗计划软件（放射線治療計画プログラム）","description":"本软件(程序)利用医用图像，使用医生指定的放射线治疗区域设定信息以及使用的放射线治疗装置照射信息，计算并显示其体内的剂量分布，辅助医生做放射线治疗计划的决定。","specialty":"医学影像科"},"ja":{"title":"放射線治療計画プログラム","description":"医用画像を利用し、医師が指定した放射線治療領域設定情報および使用する放射線治療装置の照射情報に基づいて体内線量分布を計算・表示し、医師の放射線治療計画決定を補助する。","specialty":"医用画像診断科"},"en":{"title":"Radiation Treatment Planning Software","description":"This software uses medical images, physician-specified radiation treatment region settings, and irradiation information from the radiation treatment equipment to calculate and display dose distribution in the body, assisting physicians in making radiation treatment planning decisions.","specialty":"Medical Imaging"}}},{"id":223,"category":"device","number":18,"langs":{"zh":{"title":"乳腺螺旋数字化体层摄影设备 nu:view","description":"nu:view 适用于 18 岁以上的女性患者。接受乳腺 CT系统检查的患者需能在检查期间保持俯卧姿势静止不动。患者体重不得超过135公斤。俯卧状态下测量的乳房尺寸不得超过直径 190 毫米和长度 160 毫米。","specialty":"医学影像科"},"ja":{"title":"nu:view 乳房螺旋デジタル断層撮影装置","description":"nu:viewは18歳を超える女性患者に適応する。乳房CTシステムの検査を受ける患者は、検査中に腹臥位で静止できる必要がある。患者体重は135 kgを超えてはならない。腹臥位で測定した乳房寸法は直径190 mm、長さ160 mmを超えてはならない。","specialty":"医用画像診断科"},"en":{"title":"nu:view Spiral Digital Breast Tomography System","description":"nu:view is intended for female patients aged over 18 years. Patients undergoing breast CT examination must be able to remain still in the prone position during the examination. Patient weight must not exceed 135 kg. Breast dimensions measured in the prone position must not exceed 190 mm in diameter and 160 mm in length.","specialty":"Medical Imaging"}}},{"id":224,"category":"device","number":19,"langs":{"zh":{"title":"硼中子俘获疗法用剂量计算软件 Treatment planning program for boron neutron capture therapy","description":"无法切除的局部晚期或局部复发性头颈癌","specialty":"医学影像科"},"ja":{"title":"ホウ素中性子捕捉療法用線量計算ソフトウェア Treatment planning program for boron neutron capture therapy","description":"切除不能の局所進行または局所再発頭頸部癌。","specialty":"医用画像診断科"},"en":{"title":"Treatment Planning Program for Boron Neutron Capture Therapy","description":"Unresectable locally advanced or locally recurrent head and neck cancer.","specialty":"Medical Imaging"}}},{"id":225,"category":"device","number":20,"langs":{"zh":{"title":"硼中子俘获疗法用中子照射装置 Neutron irradiation system for boron neutron capture therapy","description":"无法切除的局部晚期或局部复发性头颈癌","specialty":"医学影像科"},"ja":{"title":"ホウ素中性子捕捉療法用中性子照射装置 Neutron irradiation system for boron neutron capture therapy","description":"切除不能の局所進行または局所再発頭頸部癌。","specialty":"医用画像診断科"},"en":{"title":"Neutron Irradiation System for Boron Neutron Capture Therapy","description":"Unresectable locally advanced or locally recurrent head and neck cancer.","specialty":"Medical Imaging"}}},{"id":226,"category":"device","number":21,"langs":{"zh":{"title":"Panoramic, cephalometric and tomographic X-ray system 口腔颌面锥形束计算机体层摄影设备","description":"NewTom GiANO HR 是一种用于数字、X 射线全貌拍片和断层拍片的口腔外放射拍片系统，设计为：\n(I) 颌面外区口腔科摄影、牙列、牙弓以及其它口腔结构的诊断检查；\n(II) 若装备了选配的远距X射线手臂（CEPH），则能对牙弓、部分颅骨以及腕部进行X射线检查以配合头影测量检查；\n(III) 若装备了选配的CBCT，则可获取一系列头部图像，包括耳朵、鼻子和咽喉（ENT）、牙颌面、牙齿、颌骨和下颌、颞下颌关节（TMJ），以及人类头骨和颈部的其他区域（包括颈椎），用于对诊断进行支持。","specialty":"医学影像科"},"ja":{"title":"Panoramic, cephalometric and tomographic X-ray system 口腔顎顔面コーンビームCT装置","description":"NewTom GiANO HRは、デジタルX線パノラマ撮影および断層撮影用の口腔外放射線撮影システムで、以下を目的とする：\n(I) 顎顔面外領域の歯科撮影、歯列、歯列弓およびその他口腔構造の診断検査。\n(II) オプションの遠距離X線アーム（CEPH）を装備した場合、歯列弓、頭蓋骨の一部および手関節のX線検査を行い、頭部X線規格撮影を補助する。\n(III) オプションのCBCTを装備した場合、耳・鼻・咽喉（ENT）、歯顎顔面、歯、上顎・下顎、顎関節（TMJ）、ならびに頸椎を含む頭蓋骨・頸部のその他領域の一連の画像を取得し、診断を支援する。","specialty":"医用画像診断科"},"en":{"title":"Panoramic, Cephalometric and Tomographic X-ray System / Oral and Maxillofacial Cone-Beam Computed Tomography System","description":"NewTom GiANO HR is an extraoral radiographic system for digital panoramic X-ray and tomographic imaging, designed for:\n(I) dental imaging and diagnostic examination of the extraoral maxillofacial region, dentition, dental arches, and other oral structures;\n(II) when equipped with the optional cephalometric X-ray arm, CEPH, X-ray examinations of the dental arches, portions of the skull, and wrist for cephalometric assessment;\n(III) when equipped with optional CBCT, acquisition of a series of head images including the ear, nose and throat, ENT, dentomaxillofacial region, teeth, maxilla and mandible, temporomandibular joint, TMJ, and other regions of the human skull and neck, including the cervical spine, to support diagnosis.","specialty":"Medical Imaging"}}},{"id":227,"category":"device","number":22,"langs":{"zh":{"title":"NeoLSD™ MSMS Kit 溶酶体贮积症检测试剂盒（串联质谱法）","description":"溶酶体贮积症检测试剂盒（串联质谱法）（英文名：NeoLSD MSMS kit）用于定量测定新生儿干血斑（DBS）中酸性-β-葡萄糖脑苷脂酶（ABG）、酸性神经磷脂酶（ASM）、酸性α-葡萄糖苷酶（GAA）、β-半乳糖脑苷酶（GALC）、α-半乳糖苷酶A（GLA）和α-L-艾杜糖醛酸酶（IDUA）活性。\n酶活性的分析有助于筛查新生儿下列溶酶体贮积症（LSD）：戈谢病，尼曼匹克A/B病，庞贝病（糖原累积病），克拉贝病（又名球形细胞脑白质营养不良，简称GLD），法布雷病，和黏多糖贮积症（MPS）I型疾病。","specialty":"医学检验科"},"ja":{"title":"NeoLSD™ MSMS Kit ライソゾーム病検査キット（タンデム質量分析法）","description":"NeoLSD MSMS kitは、新生児乾燥血液スポット（DBS）中の酸性β-グルコセレブロシダーゼ（ABG）、酸性スフィンゴミエリナーゼ（ASM）、酸性α-グルコシダーゼ（GAA）、β-ガラクトセレブロシダーゼ（GALC）、α-ガラクトシダーゼA（GLA）、α-L-イズロニダーゼ（IDUA）活性を定量測定する。\n酵素活性分析は、新生児の以下のライソゾーム病（LSD）スクリーニングに有用である：Gaucher病、Niemann-Pick A/B病、Pompe病、糖原病、Krabbe病、別名グロボイド細胞白質ジストロフィー、GLD、Fabry病、ムコ多糖症（MPS）I型。","specialty":"臨床検査科"},"en":{"title":"NeoLSD™ MSMS Kit, Lysosomal Storage Disease Test Kit (Tandem Mass Spectrometry)","description":"The lysosomal storage disease test kit, tandem mass spectrometry, NeoLSD MSMS kit, is used for quantitative determination of acid beta-glucocerebrosidase, ABG, acid sphingomyelinase, ASM, acid alpha-glucosidase, GAA, beta-galactocerebrosidase, GALC, alpha-galactosidase A, GLA, and alpha-L-iduronidase, IDUA, activity in neonatal dried blood spots, DBS.\nAnalysis of enzyme activity assists in screening newborns for the following lysosomal storage diseases, LSDs: Gaucher disease, Niemann-Pick disease types A/B, Pompe disease, glycogen storage disease, Krabbe disease, also known as globoid cell leukodystrophy, GLD, Fabry disease, and mucopolysaccharidosis type I.","specialty":"Laboratory Medicine"}}},{"id":228,"category":"device","number":23,"langs":{"zh":{"title":"Elecsys Total-Tau CSF 总Tau蛋白检测试剂盒（电化学发光法）","description":"用于定量测定人脑脊液（CSF）中的总Tau蛋白的浓度。\n·单独使用或与Elecsys β-Amyloid (1-42) CSF II检测联合使用得到比值，用于轻度认知功能障碍（MCI）的成人受试者，以辅助识别2年内出现临床评分变化认定的认知衰退风险较低和较高的受试者。\n·与Elecsys β-Amyloid (1-42) CSF II检测结合使用，得到测量值比值用于被评估为AD引起认知障碍或其他原因认知障碍的成人受试者，其中阳性和阴性CSF结果分别与阳性和阴性淀粉样蛋白正电子发射断层扫描（PET）结果一致。\ncobas e 免疫检测分析仪的工作原理是电化学发光免疫分析“ECLIA”。","specialty":"医学检验科"},"ja":{"title":"Elecsys Total-Tau CSF 総Tau蛋白検査キット（電気化学発光法）","description":"ヒト脳脊髄液（CSF）中の総Tau蛋白濃度を定量測定する。\n単独、またはElecsys β-Amyloid (1-42) CSF IIとの併用で比率を算出し、軽度認知障害（MCI）の成人被験者において、2年以内の臨床スコア変化で判定される認知低下リスクが低い群と高い群の識別を補助する。\nElecsys β-Amyloid (1-42) CSF IIと併用して測定値比を算出し、ADによる認知障害またはその他の原因による認知障害が評価される成人被験者に使用する。陽性・陰性のCSF結果はそれぞれ陽性・陰性のアミロイドPET結果と一致する。\ncobas e免疫分析装置は電気化学発光免疫測定法「ECLIA」を原理とする。","specialty":"臨床検査科"},"en":{"title":"Elecsys Total-Tau CSF Total Tau Protein Test Kit (Electrochemiluminescence)","description":"For quantitative determination of total tau protein concentration in human cerebrospinal fluid, CSF.\nUsed alone or in combination with Elecsys β-Amyloid (1-42) CSF II to obtain a ratio in adult subjects with mild cognitive impairment, MCI, to help identify subjects at lower or higher risk of cognitive decline as determined by changes in clinical scores within 2 years.\nUsed in combination with Elecsys β-Amyloid (1-42) CSF II to obtain a measured-value ratio in adults being evaluated for cognitive impairment due to Alzheimer's disease, AD, or other causes, in which positive and negative CSF results correspond respectively to positive and negative amyloid positron emission tomography, PET, results.\ncobas e immunoassay analyzers operate using electrochemiluminescence immunoassay, ECLIA.","specialty":"Laboratory Medicine"}}},{"id":229,"category":"device","number":24,"langs":{"zh":{"title":"CalSet Total-Tau 总Tau蛋白定标液","description":"用于Elecsys和cobas e免疫检测分析仪上Elecsys Total-Tau CSF定量检测的定标。","specialty":"医学检验科"},"ja":{"title":"CalSet Total-Tau 総Tau蛋白キャリブレータ","description":"Elecsysおよびcobas e免疫分析装置上でElecsys Total-Tau CSF定量検査を校正するために使用する。","specialty":"臨床検査科"},"en":{"title":"CalSet Total-Tau Calibration Solution","description":"For calibration of the Elecsys Total-Tau CSF quantitative assay on Elecsys and cobas e immunoassay analyzers.","specialty":"Laboratory Medicine"}}},{"id":230,"category":"device","number":25,"langs":{"zh":{"title":"PreciControl Total-Tau 总Tau蛋白质控品","description":"用于Elecsys和cobas e免疫检测分析仪上Elecsys Total-Tau CSF免疫检测的质控。","specialty":"医学检验科"},"ja":{"title":"PreciControl Total-Tau 総Tau蛋白精度管理物質","description":"Elecsysおよびcobas e免疫分析装置上でElecsys Total-Tau CSF免疫検査の品質管理に使用する。","specialty":"臨床検査科"},"en":{"title":"PreciControl Total-Tau Quality Control Material","description":"For quality control of the Elecsys Total-Tau CSF immunoassay on Elecsys and cobas e immunoassay analyzers.","specialty":"Laboratory Medicine"}}},{"id":231,"category":"device","number":26,"langs":{"zh":{"title":"Elecsys β-Amyloid (1-42) CSF II β-淀粉样蛋白（1-42）检测试剂盒（电化学发光法）","description":"用于定量测定人脑脊液（CSF）中的β-淀粉样蛋白（1-42）的浓度。\n用于被评估为阿尔茨海默病（AD）引起的认知障碍以及其他原因引起的认知障碍的成人受试者。高于cutoff值的结果与阴性淀粉样蛋白正电子发射断层扫描检查（PET）一致。阴性的β-淀粉样蛋白PET扫描结果表示稀疏至无的神经斑块，并提示在影像学检查时尚不符合AD神经病理学的诊断，阴性扫描结果降低了患者因AD造成认知障碍的可能性。\n与Elecsys Phospho-Tau (181P) CSF或Elecsys Total-Tau CSF检测结合使用，得到测量值比值用于被评估为AD引起认知障碍或其他原因认知障碍的成人受试者，其中阳性和阴性CSF结果分别与阳性和阴性淀粉样蛋白正电子发射断层扫描（PET）扫描结果一致。\n单独使用或与Elecsys Phospho-Tau (181P) CSF或Elecsys Total-Tau CSF检测联合使用得到比值，用于轻度认知功能障碍（MCI）的成人受试者，以辅助识别2年内出现临床评分变化认定的认知衰退风险较低和较高的受试者。\ncobas e免疫检测分析仪的工作原理是电化学发光免疫分析“ECLIA”。","specialty":"医学检验科"},"ja":{"title":"Elecsys β-Amyloid (1-42) CSF II βアミロイド（1-42）検査キット（電気化学発光法）","description":"ヒト脳脊髄液（CSF）中のβアミロイド（1-42）濃度を定量測定する。\nアルツハイマー病（AD）による認知障害またはその他の原因による認知障害が評価される成人被験者に使用する。カットオフ値を上回る結果は陰性アミロイドPETと一致する。陰性アミロイドPETは神経突起斑が乏しい、または認められないことを示し、画像検査時点でAD神経病理学的診断基準を満たしていないことを示唆し、認知障害がADによる可能性を低下させる。\nElecsys Phospho-Tau (181P) CSFまたはElecsys Total-Tau CSFと併用して測定値比を算出し、AD由来またはその他原因の認知障害を評価される成人被験者に使用する。陽性・陰性のCSF結果はそれぞれ陽性・陰性のアミロイドPET結果と一致する。\n単独またはElecsys Phospho-Tau (181P) CSFもしくはElecsys Total-Tau CSFと併用して比率を算出し、MCI成人被験者において2年以内の臨床スコア変化で判定される認知低下リスクの低い群と高い群の識別を補助する。\ncobas e免疫分析装置は電気化学発光免疫測定法「ECLIA」を原理とする。","specialty":"臨床検査科"},"en":{"title":"Elecsys β-Amyloid (1-42) CSF II Test Kit (Electrochemiluminescence)","description":"For quantitative determination of beta-amyloid 1-42 concentration in human cerebrospinal fluid, CSF.\nFor adult subjects being evaluated for cognitive impairment due to Alzheimer's disease, AD, or other causes. Results above the cutoff value are consistent with a negative amyloid positron emission tomography, PET, scan. A negative amyloid PET scan indicates sparse to no neuritic plaques and suggests that AD neuropathologic criteria are not met at the time of imaging; a negative scan reduces the likelihood that the patient's cognitive impairment is due to AD.\nWhen combined with Elecsys Phospho-Tau (181P) CSF or Elecsys Total-Tau CSF, the measured-value ratio is used in adult subjects evaluated for cognitive impairment due to AD or other causes, with positive and negative CSF results corresponding respectively to positive and negative amyloid PET scan results.\nUsed alone or combined with Elecsys Phospho-Tau (181P) CSF or Elecsys Total-Tau CSF to obtain a ratio in adult subjects with mild cognitive impairment, MCI, to help identify subjects at lower or higher risk of cognitive decline as determined by changes in clinical scores within 2 years.\ncobas e immunoassay analyzers operate using electrochemiluminescence immunoassay, ECLIA.","specialty":"Laboratory Medicine"}}},{"id":232,"category":"device","number":27,"langs":{"zh":{"title":"PreciControl β-Amyloid (1-42) II β-淀粉样蛋白（1-42）质控品","description":"β-淀粉样蛋白（1-42）质控品用于β-淀粉样蛋白（1-42）检测试剂盒（电化学发光法）检测试剂的质量控制。该质控品适用于cobas e 免疫检测分析仪。","specialty":"医学检验科"},"ja":{"title":"PreciControl β-Amyloid (1-42) II βアミロイド（1-42）精度管理物質","description":"βアミロイド（1-42）検査キット、電気化学発光法、の品質管理に使用する。cobas e免疫分析装置に適用する。","specialty":"臨床検査科"},"en":{"title":"PreciControl β-Amyloid (1-42) II Quality Control Material","description":"Used for quality control of the beta-amyloid (1-42) test kit, electrochemiluminescence assay. This control material is intended for use with cobas e immunoassay analyzers.","specialty":"Laboratory Medicine"}}},{"id":233,"category":"device","number":28,"langs":{"zh":{"title":"Elecsys® Phospho-Tau (181P) CSF 磷酸化Tau蛋白（181P）检测试剂盒（电化学发光法）","description":"用于定量测定人脑脊液（CSF）中的磷酸化Tau蛋白的浓度。\n·单独使用或与Elecsys β-Amyloid (1-42) CSF II检测联合使用得到比值，用于轻度认知功能障碍（MCI）的成人受试者，以辅助识别2年内出现临床评分变化认定的认知衰退风险较低和较高的受试者。\n·与Elecsys β-Amyloid (1-42) CSF II检测结合使用，得到测量值比值用于被评估为AD引起认知障碍或其他原因认知障碍的成人受试者，其中阳性和阴性CSF结果分别与阳性和阴性淀粉样蛋白正电子发射断层扫描（PET）结果一致。\ncobas e 免疫检测分析仪的工作原理是电化学发光免疫分析“ECLIA”。","specialty":"医学检验科"},"ja":{"title":"Elecsys® Phospho-Tau (181P) CSF リン酸化Tau蛋白（181P）検査キット（電気化学発光法）","description":"ヒト脳脊髄液（CSF）中のリン酸化Tau蛋白濃度を定量測定する。\n単独またはElecsys β-Amyloid (1-42) CSF IIとの併用で比率を算出し、MCI成人被験者において2年以内の臨床スコア変化で判定される認知低下リスクの低い群と高い群の識別を補助する。\nElecsys β-Amyloid (1-42) CSF IIと併用して測定値比を算出し、ADによる認知障害またはその他の原因による認知障害が評価される成人被験者に使用する。陽性・陰性のCSF結果はそれぞれ陽性・陰性のアミロイドPET結果と一致する。\ncobas e免疫分析装置は電気化学発光免疫測定法「ECLIA」を原理とする。","specialty":"臨床検査科"},"en":{"title":"Elecsys® Phospho-Tau (181P) CSF Test Kit (Electrochemiluminescence)","description":"For quantitative determination of phosphorylated tau protein concentration in human cerebrospinal fluid, CSF.\nUsed alone or in combination with Elecsys β-Amyloid (1-42) CSF II to obtain a ratio in adult subjects with mild cognitive impairment, MCI, to help identify subjects at lower or higher risk of cognitive decline as determined by changes in clinical scores within 2 years.\nUsed in combination with Elecsys β-Amyloid (1-42) CSF II to obtain a measured-value ratio in adults being evaluated for cognitive impairment due to AD or other causes, in which positive and negative CSF results correspond respectively to positive and negative amyloid PET results.\ncobas e immunoassay analyzers operate using electrochemiluminescence immunoassay, ECLIA.","specialty":"Laboratory Medicine"}}},{"id":234,"category":"device","number":29,"langs":{"zh":{"title":"CalSet β-Amyloid(1-42) II β-淀粉样蛋白（1-42）定标液","description":"用于β-淀粉样蛋白（1-42）检测项目的定标。\n该定标液适用于cobas e免疫检测分析仪。","specialty":"医学检验科"},"ja":{"title":"CalSet β-Amyloid (1-42) II βアミロイド（1-42）キャリブレータ","description":"βアミロイド（1-42）検査項目の校正に使用する。cobas e免疫分析装置に適用する。","specialty":"臨床検査科"},"en":{"title":"CalSet β-Amyloid (1-42) II Calibration Solution","description":"For calibration of the beta-amyloid (1-42) test. This calibration solution is intended for use with cobas e immunoassay analyzers.","specialty":"Laboratory Medicine"}}},{"id":235,"category":"device","number":30,"langs":{"zh":{"title":"PreciControl Phospho-Tau (181P) 磷酸化Tau蛋白（181P）质控品","description":"用于磷酸化Tau蛋白（181P）检测项目的质量控制。该质控品适用于cobas e免疫检测分析仪。","specialty":"医学检验科"},"ja":{"title":"PreciControl Phospho-Tau (181P) リン酸化Tau蛋白（181P）精度管理物質","description":"リン酸化Tau蛋白（181P）検査項目の品質管理に使用する。cobas e免疫分析装置に適用する。","specialty":"臨床検査科"},"en":{"title":"PreciControl Phospho-Tau (181P) Quality Control Material","description":"For quality control of the phosphorylated tau protein (181P) test. This control material is intended for use with cobas e immunoassay analyzers.","specialty":"Laboratory Medicine"}}},{"id":236,"category":"device","number":31,"langs":{"zh":{"title":"CalSet Phospho-Tau (181P) 磷酸化Tau蛋白（181P）定标液","description":"用于磷酸化Tau蛋白（181P）检测项目的定标。该定标液适用于cobas e免疫检测分析仪。","specialty":"医学检验科"},"ja":{"title":"CalSet Phospho-Tau (181P) リン酸化Tau蛋白（181P）キャリブレータ","description":"リン酸化Tau蛋白（181P）検査項目の校正に使用する。cobas e免疫分析装置に適用する。","specialty":"臨床検査科"},"en":{"title":"CalSet Phospho-Tau (181P) Calibration Solution","description":"For calibration of the phosphorylated tau protein (181P) test. This calibration solution is intended for use with cobas e immunoassay analyzers.","specialty":"Laboratory Medicine"}}},{"id":237,"category":"device","number":32,"langs":{"zh":{"title":"高效液相色谱柱HPLC Cartridge","description":"与全自动高效液相色谱串联质谱检测系统配套使用，用于对人体样本中的被测物进行分离。","specialty":"医学检验科"},"ja":{"title":"HPLC Cartridge 高速液体クロマトグラフィーカラム","description":"全自動高速液体クロマトグラフィー・タンデム質量分析システムと組み合わせ、人体試料中の測定対象物を分離する。","specialty":"臨床検査科"},"en":{"title":"HPLC Cartridge","description":"Used with a fully automated high-performance liquid chromatography tandem mass spectrometry system to separate analytes in human samples.","specialty":"Laboratory Medicine"}}},{"id":238,"category":"device","number":33,"langs":{"zh":{"title":"四种类固醇激素检测试剂盒（高效液相色谱-串联质谱法）Ionify Steroids 1 (iST1)","description":"用于体外定量测定人血清和血浆中的醛固酮，雄烯二酮，雌二醇和睾酮的浓度。醛固酮的测定用于辅助诊断和监测肾上腺功能性障碍。雄烯二酮的测定用于辅助诊断和监测与雄激素（男性性激素）生成过高相关的疾病。雌二醇的测定可用于辅助诊断和监测类固醇代谢紊乱、评估卵巢功能和监测生育治疗。睾酮的测定可用于辅助诊断和监测涉及男性性激素（雄激素）的疾病。","specialty":"医学检验科"},"ja":{"title":"Ionify Steroids 1 (iST1) 4種ステロイドホルモン検査キット（HPLC-タンデム質量分析法）","description":"ヒト血清・血漿中のアルドステロン、アンドロステンジオン、エストラジオール、テストステロン濃度を体外で定量測定する。アルドステロン測定は副腎機能障害の診断・モニタリングを補助する。アンドロステンジオン測定はアンドロゲン過剰産生に関連する疾患の診断・モニタリングを補助する。エストラジオール測定はステロイド代謝異常の診断・モニタリング、卵巣機能評価、生殖治療のモニタリングに使用できる。テストステロン測定は男性性ホルモン、アンドロゲン、に関連する疾患の診断・モニタリングを補助する。","specialty":"臨床検査科"},"en":{"title":"Ionify Steroids 1 (iST1), Four-Steroid Hormone Test Kit (HPLC-Tandem Mass Spectrometry)","description":"For in vitro quantitative determination of aldosterone, androstenedione, estradiol, and testosterone concentrations in human serum and plasma. Aldosterone measurement is used to assist in diagnosis and monitoring of functional adrenal disorders. Androstenedione measurement is used to assist in diagnosis and monitoring of disorders associated with excessive androgen production. Estradiol measurement may assist in diagnosis and monitoring of steroid metabolism disorders, assessment of ovarian function, and monitoring of fertility treatment. Testosterone measurement may assist in diagnosis and monitoring of disorders involving male sex hormones, androgens.","specialty":"Laboratory Medicine"}}},{"id":239,"category":"device","number":34,"langs":{"zh":{"title":"全自动高效液相色谱串联质谱检测系统cobas pro i 601 analyzer","description":"cobas pro i 601 analyzer 全自动高效液相色谱串联质谱检测系统基于液相色谱-质谱联用技术、以液相色谱作为分离系统，质谱作为检测系统，与配套的检测试剂共同使用，在临床上用于对来源于人体样本（如全血、血浆、血清、尿液样本）中的有机化合物样本的内源（如维生素、氨基酸、激素、有机酸、多肽、蛋白、糖类）或外源（如治疗药物、毒物）被分析物进行定性或定量检测。","specialty":"医学检验科"},"ja":{"title":"cobas pro i 601 analyzer 全自動HPLCタンデム質量分析システム","description":"cobas pro i 601 analyzerは液体クロマトグラフィー・質量分析技術を基盤とし、液体クロマトグラフィーを分離系、質量分析を検出系として使用する全自動HPLCタンデム質量分析システムである。対応試薬と併用し、全血、血漿、血清、尿などの人体試料中の有機化合物に含まれる内因性分析対象物、ビタミン、アミノ酸、ホルモン、有機酸、ペプチド、蛋白、糖類など、または外因性分析対象物、治療薬、毒物など、を定性・定量検出する。","specialty":"臨床検査科"},"en":{"title":"cobas pro i 601 Analyzer, Fully Automated HPLC-Tandem Mass Spectrometry System","description":"The cobas pro i 601 analyzer is a fully automated high-performance liquid chromatography tandem mass spectrometry system based on liquid chromatography-mass spectrometry technology, using liquid chromatography as the separation system and mass spectrometry as the detection system. Used with compatible reagents, it is clinically intended for qualitative or quantitative detection of endogenous analytes, such as vitamins, amino acids, hormones, organic acids, peptides, proteins, and carbohydrates, or exogenous analytes, such as therapeutic drugs and toxicants, in human samples such as whole blood, plasma, serum, and urine.","specialty":"Laboratory Medicine"}}},{"id":240,"category":"device","number":35,"langs":{"zh":{"title":"多项类固醇激素和维生素 D 校准品 Ionify CalSet Steroids and Vitamin D（iSV）","description":"用于类固醇激素和维生素 D 定量检测试剂盒的校准。\n该校准品适用于全自动 cobas i 分析仪。","specialty":"医学检验科"},"ja":{"title":"Ionify CalSet Steroids and Vitamin D（iSV）多項目ステロイドホルモン・ビタミンDキャリブレータ","description":"ステロイドホルモンおよびビタミンD定量検査キットの校正に使用する。全自動cobas i分析装置に適用する。","specialty":"臨床検査科"},"en":{"title":"Ionify CalSet Steroids and Vitamin D (iSV)","description":"For calibration of quantitative steroid hormone and vitamin D test kits. Intended for use with fully automated cobas i analyzers.","specialty":"Laboratory Medicine"}}},{"id":241,"category":"device","number":36,"langs":{"zh":{"title":"多项类固醇激素和维生素 D 质控品 Ionify ControlSet Steroids and Vitamin D（iCSSV）","description":"用于免疫抑制剂定量检测试剂盒的质量控制。该质控品适用于全自动 cobas i 分析仪","specialty":"医学检验科"},"ja":{"title":"Ionify ControlSet Steroids and Vitamin D（iCSSV）多項目ステロイドホルモン・ビタミンD精度管理物質","description":"免疫抑制薬定量検査キットの品質管理に使用する。全自動cobas i分析装置に適用する。","specialty":"臨床検査科"},"en":{"title":"Ionify ControlSet Steroids and Vitamin D (iCSSV)","description":"For quality control of quantitative immunosuppressant test kits. Intended for use with fully automated cobas i analyzers.","specialty":"Laboratory Medicine"}}},{"id":242,"category":"device","number":37,"langs":{"zh":{"title":"M2 型丙酮酸激酶检测试剂盒（胶体金法）","description":"丙型肝炎病毒抗体检测试剂盒","specialty":"医学检验科"},"ja":{"title":"M2型ピルビン酸キナーゼ検査キット（コロイド金法）","description":"C型肝炎ウイルス抗体検査キット。","specialty":"臨床検査科"},"en":{"title":"M2 Pyruvate Kinase Test Kit (Colloidal Gold Method)","description":"Hepatitis C virus antibody test kit.","specialty":"Laboratory Medicine"}}},{"id":243,"category":"device","number":38,"langs":{"zh":{"title":"M2 型丙酮酸激酶检测试剂盒（酶联免疫法）（ScheBo® · Tumor M2-PK™ Stool Test）","description":"检测可实现超早期肠癌的发现；\n用于体外定量检测人粪便中M2型丙酮酸激酶（M2-PK）的浓度；M2型丙酮酸激酶是新的肿瘤代谢标志物，血液中M2-PK的浓度与肿瘤的恶性程度相关；\n本试剂盒用于在粪便中定量测定M2-PK，用于结直肠癌筛查，并指示结直肠息肉，结直肠癌，急慢性肠炎及消化道相关疾病。","specialty":"医学检验科"},"ja":{"title":"M2型ピルビン酸キナーゼ検査キット（ELISA）（ScheBo® Tumor M2-PK™ Stool Test）","description":"超早期の腸癌発見を可能にする。\nヒト便中M2型ピルビン酸キナーゼ（M2-PK）濃度を体外で定量測定する。M2-PKは新しい腫瘍代謝マーカーで、血中M2-PK濃度は腫瘍悪性度と関連する。\n本キットは便中M2-PKを定量測定し、大腸癌スクリーニングに使用するとともに、大腸ポリープ、大腸癌、急性・慢性腸炎および消化管関連疾患を示唆する。","specialty":"臨床検査科"},"en":{"title":"M2 Pyruvate Kinase Test Kit (ELISA), ScheBo® Tumor M2-PK™ Stool Test","description":"The test can enable very early detection of intestinal cancer;\nfor in vitro quantitative measurement of M2 pyruvate kinase, M2-PK, concentration in human stool. M2-PK is a new tumor metabolic marker, and blood M2-PK concentration is associated with tumor malignancy;\nthis kit quantitatively measures M2-PK in stool for colorectal cancer screening and indicates colorectal polyps, colorectal cancer, acute and chronic enteritis, and gastrointestinal-related diseases.","specialty":"Laboratory Medicine"}}},{"id":244,"category":"device","number":39,"langs":{"zh":{"title":"增强性肝纤维化指数质控品 Atellica IM ELF Quality Control（ELF QC）","description":"增强性肝纤维化指数质控品用于体外监测ELF测试和HA，PIIINP以及TIMP - 1检测的精确度和准确度。","specialty":"医学检验科"},"ja":{"title":"Atellica IM ELF Quality Control（ELF QC）Enhanced Liver Fibrosis Index 精度管理物質","description":"ELF検査およびHA、PIIINP、TIMP-1測定の精密度と正確度を体外でモニタリングするために使用する。","specialty":"臨床検査科"},"en":{"title":"Atellica IM ELF Quality Control (ELF QC)","description":"Enhanced Liver Fibrosis index quality control material is used for in vitro monitoring of the precision and accuracy of the ELF test and HA, PIIINP, and TIMP-1 assays.","specialty":"Laboratory Medicine"}}},{"id":245,"category":"device","number":40,"langs":{"zh":{"title":"增强性肝纤维化指数测定试剂盒（直接化学发光法）Atellica IM Enhanced Liver Fibrosis（ELF）","description":"增强性肝纤维化指数测定试剂盒（直接化学发光法）用于体外诊断，使用AtellicaIM分析仪 对人血清中透明质酸、III型前胶原氨基末端前肽和组织基质金属蛋白酶抑制剂 - 1 进行联合定量测量，以确定ELF分数。\n增强性肝纤维化指数测定试剂盒（直接化学发光法）与实验室其他检查结果和临床评价相结合，可作为非酒精性脂肪性肝炎（NASH）导致的晚期纤维化（F3或F4）患者的预后标志物，以评估进展为肝硬化和肝脏相关临床事件的可能性。","specialty":"医学检验科"},"ja":{"title":"Atellica IM Enhanced Liver Fibrosis（ELF）測定試薬（直接化学発光法）","description":"体外診断用で、Atellica IM分析装置を使用してヒト血清中のヒアルロン酸、III型プロコラーゲンアミノ末端プロペプチド、組織マトリックスメタロプロテアーゼ阻害因子1を同時に定量測定し、ELFスコアを算出する。\n他の臨床検査結果および臨床評価と組み合わせることで、非アルコール性脂肪肝炎（NASH）による進行線維化、F3またはF4、患者の予後マーカーとして使用し、肝硬変および肝関連臨床イベントへの進展可能性を評価する。","specialty":"臨床検査科"},"en":{"title":"Atellica IM Enhanced Liver Fibrosis (ELF) Assay, Direct Chemiluminescence","description":"The Enhanced Liver Fibrosis assay, direct chemiluminescence, is for in vitro diagnostic use with the Atellica IM analyzer for combined quantitative measurement of hyaluronic acid, type III procollagen amino-terminal propeptide, and tissue inhibitor of metalloproteinases-1 in human serum to determine the ELF score.\nUsed together with other laboratory results and clinical assessment, the ELF assay can serve as a prognostic marker in patients with advanced fibrosis, F3 or F4, caused by nonalcoholic steatohepatitis, NASH, to assess the likelihood of progression to cirrhosis and liver-related clinical events.","specialty":"Laboratory Medicine"}}},{"id":246,"category":"device","number":41,"langs":{"zh":{"title":"胰弹性蛋白酶 1 检测试剂盒（酶 联免疫法）（ScheBo®·Pancreatic Elastase 1 Stool Test）","description":"用于诊断/排除与胃肠病状相关的胰腺问题，例如，腹痛，发育不良，消化不良（脂溢/腹泻），炎性肠病（IBD），肥胖症或骨质疏松症；\n诊断/排除由于慢性胰腺炎、糖尿病、胆结石、囊肿性纤维化、乳突狭窄、乳糜泄导致的胰腺外分泌功能不全；\n轻中度胰腺外分泌功能不全患者的随访监测","specialty":"医学检验科"},"ja":{"title":"ScheBo® Pancreatic Elastase 1 Stool Test 膵エラスターゼ1検査キット（ELISA）","description":"腹痛、発育不良、消化不良、脂肪便／下痢、炎症性腸疾患（IBD）、肥満症、骨粗鬆症など、消化器症状に関連する膵臓問題の診断／除外。\n慢性膵炎、糖尿病、胆石、嚢胞性線維症、乳頭狭窄、セリアック病による膵外分泌機能不全の診断／除外。\n軽度～中等度膵外分泌機能不全患者のフォローアップモニタリング。","specialty":"臨床検査科"},"en":{"title":"ScheBo® Pancreatic Elastase 1 Stool Test, ELISA","description":"For diagnosis/exclusion of pancreatic problems associated with gastrointestinal symptoms such as abdominal pain, failure to thrive, dyspepsia, steatorrhea/diarrhea, inflammatory bowel disease, IBD, obesity, or osteoporosis;\nfor diagnosis/exclusion of pancreatic exocrine insufficiency due to chronic pancreatitis, diabetes, gallstones, cystic fibrosis, papillary stenosis, or celiac disease;\nfor follow-up monitoring of patients with mild to moderate pancreatic exocrine insufficiency.","specialty":"Laboratory Medicine"}}},{"id":247,"category":"device","number":42,"langs":{"zh":{"title":"生长分化因子-15 检测试剂盒（电化学发光法）（Elecsys GDF-15）","description":"用于体外定量测定人血清和血浆中的生长分化因子-15（GDF-15）。该产品用于辅助急性冠状动脉综合征（ACS）或慢性心力衰竭（CHF）患者的风险分层。该产品用于辅助心房纤颤（AF）患者严重出血事件的风险预估。Elecsys 和 Cobas e免疫分析仪的工作原理是电化学发光免疫分析“ECLIA”。","specialty":"医学检验科"},"ja":{"title":"Elecsys GDF-15 成長分化因子15検査キット（電気化学発光法）","description":"ヒト血清および血漿中の成長分化因子15（GDF-15）を体外で定量測定する。急性冠症候群（ACS）または慢性心不全（CHF）患者のリスク層別化を補助し、心房細動（AF）患者の重篤出血イベントのリスク予測を補助する。Elecsysおよびcobas e免疫分析装置は電気化学発光免疫測定法「ECLIA」を原理とする。","specialty":"臨床検査科"},"en":{"title":"Elecsys GDF-15 Growth Differentiation Factor-15 Test Kit (Electrochemiluminescence)","description":"For in vitro quantitative determination of growth differentiation factor-15, GDF-15, in human serum and plasma. The product is used to assist risk stratification in patients with acute coronary syndrome, ACS, or chronic heart failure, CHF, and to assist prediction of the risk of severe bleeding events in patients with atrial fibrillation, AF. Elecsys and cobas e immunoassay analyzers operate using electrochemiluminescence immunoassay, ECLIA.","specialty":"Laboratory Medicine"}}},{"id":248,"category":"device","number":43,"langs":{"zh":{"title":"生长分化因子-15 定标液（CalSet GDF-15）","description":"用于生长分化因子-15项目定量检测的定标。该定标液适用于Elecsys和cobase免疫分析仪。","specialty":"医学检验科"},"ja":{"title":"CalSet GDF-15 成長分化因子15キャリブレータ","description":"GDF-15定量検査項目の校正に使用する。Elecsysおよびcobas e免疫分析装置に適用する。","specialty":"臨床検査科"},"en":{"title":"CalSet GDF-15 Calibration Solution","description":"For calibration of quantitative GDF-15 testing. Intended for use with Elecsys and cobas e immunoassay analyzers.","specialty":"Laboratory Medicine"}}},{"id":249,"category":"device","number":44,"langs":{"zh":{"title":"异常凝血酶原检测试剂盒（电化学发光法）（Elecsys PIVKA-II）","description":"用于定量测定人血清和血浆中维生素K缺乏或维生素K拮抗剂诱导产生的蛋白(PIVKA-II)，又称异常凝血酶原。该检测用于辅助诊断肝细胞癌（HCC）。必须根据标准临床管理指南结合其他方法进行结果解释。Cobase免疫分析仪的工作原理是电化学发光免疫分析“ECLIA”","specialty":"医学检验科"},"ja":{"title":"Elecsys PIVKA-II 異常プロトロンビン検査キット（電気化学発光法）","description":"ヒト血清・血漿中のビタミンK欠乏またはビタミンK拮抗薬により誘導される蛋白、PIVKA-II、別名異常プロトロンビン、を定量測定する。肝細胞癌（HCC）の診断補助に使用する。結果は標準的臨床管理ガイドラインに従い、他の方法と組み合わせて解釈する必要がある。cobas e免疫分析装置は電気化学発光免疫測定法「ECLIA」を原理とする。","specialty":"臨床検査科"},"en":{"title":"Elecsys PIVKA-II Abnormal Prothrombin Test Kit (Electrochemiluminescence)","description":"For quantitative determination in human serum and plasma of protein induced by vitamin K absence or antagonist-II, PIVKA-II, also known as abnormal prothrombin. The assay is used to assist diagnosis of hepatocellular carcinoma, HCC. Results must be interpreted together with other methods in accordance with standard clinical management guidelines. cobas e immunoassay analyzers operate using electrochemiluminescence immunoassay, ECLIA.","specialty":"Laboratory Medicine"}}},{"id":250,"category":"device","number":45,"langs":{"zh":{"title":"LIAISON ® FGF 23 化学发光检测试剂盒 (LIAISON® FGF 23 chemiluminescence immunoassay (CLIA) assay)","description":"拟用于体外定量测定的人血浆 EDTA 标本中完整的 FGF23 多肽。","specialty":"医学检验科"},"ja":{"title":"LIAISON® FGF 23 化学発光免疫測定（CLIA）キット","description":"ヒトEDTA血漿検体中の完全長FGF23ポリペプチドを体外で定量測定するために使用する。","specialty":"臨床検査科"},"en":{"title":"LIAISON® FGF 23 Chemiluminescence Immunoassay (CLIA)","description":"Intended for in vitro quantitative determination of intact FGF23 polypeptide in human EDTA plasma specimens.","specialty":"Laboratory Medicine"}}},{"id":251,"category":"device","number":46,"langs":{"zh":{"title":"潘多姆检测（PanTum Detect）","description":"通过检测巨噬细胞中Apo10、TKTL1,量化评估肿瘤病变。","specialty":"医学检验科"},"ja":{"title":"PanTum Detect","description":"マクロファージ中のApo10、TKTL1を検出し、腫瘍病変を定量評価する。","specialty":"臨床検査科"},"en":{"title":"PanTum Detect","description":"Quantitative assessment of tumor lesions by detecting Apo10 and TKTL1 in macrophages.","specialty":"Laboratory Medicine"}}},{"id":252,"category":"device","number":47,"langs":{"zh":{"title":"QuantiDNA™ 血浆游离DNA测定试剂盒","description":"QuantiDNA™ DNA Measurement Assay（Luminometer Assay）\nQuantiDNA DNA Measurement Assay是一种无细胞DNA（cfDNA）定量方法，可直接从血浆或血清中精确定量检测cfDNA。在临床上，该测试可以监测治疗期间或治疗后的肿瘤治疗效果。该产品通过CE认证，是美国境内仅供研究使用的产品。该检测使用直接cfDNA定量，无需DNA提取或qPCR来定量血浆和血清中的人cfDNA。该方法采用基于DNA杂交的改良支链DNA（bDNA）技术。通过DNA杂交捕获目标DNA，与目标DNA的数量相关的信号，而不是目标本身，通过luminometer仪器放大信号和量化。","specialty":"医学检验科"},"ja":{"title":"QuantiDNA™ 血漿遊離DNA測定キット","description":"QuantiDNA™ DNA Measurement Assay、Luminometer Assay、は無細胞DNA（cfDNA）定量法で、血漿または血清からcfDNAを直接かつ高精度に定量する。臨床では治療中または治療後の腫瘍治療効果をモニタリングできる。CE認証済みで、米国内では研究用に限る。DNA抽出やqPCRを必要とせず、血漿・血清中のヒトcfDNAを直接定量する。DNAハイブリダイゼーションに基づく改良分岐DNA（bDNA）技術を用い、標的DNAを捕捉し、標的そのものではなく標的DNA量に比例するシグナルをルミノメータで増幅・定量する。","specialty":"臨床検査科"},"en":{"title":"QuantiDNA™ Plasma Cell-Free DNA Measurement Assay","description":"QuantiDNA™ DNA Measurement Assay, luminometer assay, is a method for quantifying cell-free DNA, cfDNA, that can directly and precisely quantify cfDNA in plasma or serum. Clinically, the test can monitor tumor treatment response during or after therapy. The product is CE certified and is for research use only in the United States. The assay uses direct cfDNA quantitation and does not require DNA extraction or qPCR for quantifying human cfDNA in plasma or serum. The method uses modified branched-DNA, bDNA, technology based on DNA hybridization. Target DNA is captured by DNA hybridization, while a signal proportional to the amount of target DNA, rather than the target itself, is amplified and quantified by a luminometer.","specialty":"Laboratory Medicine"}}},{"id":253,"category":"device","number":48,"langs":{"zh":{"title":"AlzOn(寡聚化人β-淀粉样蛋白检测试剂盒(酶联免疫吸附法)AlzOn(Oligomerized Amyloid-B Measurement Kit)","description":"AlzOn(寡聚化人β-淀粉样蛋白检测试剂盒(酶联免疫吸附法))是一种基于酶联免疫吸附测定法(ELISA)的体外诊断医疗器械,用于通过测量EDTA血浆环境中β-淀粉样蛋白聚集水平，辅助诊断阿尔茨海默病。","specialty":"医学检验科"},"ja":{"title":"AlzOn オリゴマー化ヒトβアミロイド測定キット（ELISA）","description":"AlzOnは酵素結合免疫吸着測定法（ELISA）を基盤とする体外診断用医療機器で、EDTA血漿中のβアミロイド凝集レベルを測定し、アルツハイマー病の診断を補助する。","specialty":"臨床検査科"},"en":{"title":"AlzOn Oligomerized Amyloid-B Measurement Kit (ELISA)","description":"AlzOn is an in vitro diagnostic medical device based on enzyme-linked immunosorbent assay, ELISA, used to assist diagnosis of Alzheimer's disease by measuring the degree of beta-amyloid aggregation in EDTA plasma.","specialty":"Laboratory Medicine"}}},{"id":254,"category":"device","number":49,"langs":{"zh":{"title":"磷酸化tau-181蛋白血液检测试剂盒（电化学发光法）","description":"Elecsys Phospho-Tau (181P) Plasma是一种体外定量免疫测定法，用于检测人类血浆中磷酸化Tau 181蛋白。\nElecsys Phospho-Tau (181P) Plasma检测结果旨在用于55至80岁成人的淀粉样病理早期检测，这些成人可能有主观症状或非特异性认知损伤（主观认知下降）或医生怀疑其有轻度认知障碍，和正在初级、次级或三级护理环境中接受阿尔茨海默病和其他认知下降原因的评估。\n如果Elecsys Phospho-Tau (181P) Plasma检测结果为阴性，则表明其淀粉样正电子发射断层扫描/脑脊液结果为阴性的可能性高，因此患有淀粉样病理的可能性较低。建议调查其他可能导致认知障碍的原因。\n使用限制\nElecsys Phospho-Tau (181P) Plasma检测结果须结合其他临床信息，作为阿尔茨海默病的辅助诊断手段。\ncobas e免疫检测分析仪的工作原理是电化学发光免疫分析“ECLIA”。","specialty":"医学检验科"},"ja":{"title":"リン酸化Tau-181蛋白血液検査キット（電気化学発光法）","description":"Elecsys Phospho-Tau (181P) Plasmaは、ヒト血漿中のリン酸化Tau 181蛋白を測定する体外定量免疫測定法である。\n55～80歳の成人で、主観的症状または非特異的認知障害、主観的認知低下、を有する可能性がある者、または医師が軽度認知障害を疑い、一次・二次・三次医療環境でアルツハイマー病およびその他の認知低下原因の評価を受けている者のアミロイド病理早期検出に使用する。\nElecsys Phospho-Tau (181P) Plasmaが陰性の場合、アミロイドPET／脳脊髄液結果も陰性である可能性が高く、アミロイド病理を有する可能性が低いことを示す。他の認知障害原因を調査することが推奨される。\n使用上の制限：\nElecsys Phospho-Tau (181P) Plasmaの結果は、他の臨床情報と組み合わせてアルツハイマー病の診断補助として使用する。\ncobas e免疫分析装置は電気化学発光免疫測定法「ECLIA」を原理とする。","specialty":"臨床検査科"},"en":{"title":"Phospho-Tau 181 Blood Test Kit (Electrochemiluminescence)","description":"Elecsys Phospho-Tau (181P) Plasma is an in vitro quantitative immunoassay for measurement of phosphorylated Tau 181 protein in human plasma.\nThe results are intended for early detection of amyloid pathology in adults aged 55 to 80 years who may have subjective symptoms or nonspecific cognitive impairment, subjective cognitive decline, or whose physician suspects mild cognitive impairment, and who are being evaluated in primary, secondary, or tertiary care settings for Alzheimer's disease and other causes of cognitive decline.\nA negative Elecsys Phospho-Tau (181P) Plasma result indicates a high likelihood of negative amyloid PET/cerebrospinal fluid results and therefore a lower likelihood of amyloid pathology. Investigation of other possible causes of cognitive impairment is recommended.\nLimitations of use:\nElecsys Phospho-Tau (181P) Plasma results must be interpreted together with other clinical information as an aid in the diagnosis of Alzheimer's disease.\ncobas e immunoassay analyzers operate using electrochemiluminescence immunoassay, ECLIA.","specialty":"Laboratory Medicine"}}},{"id":255,"category":"device","number":50,"langs":{"zh":{"title":"磷酸化tau-181蛋白血液质控品","description":"PreciControl Phospho-Tau (181P) Plasma\n用于磷酸化tau-181蛋白血液检测项目的质量控制。该质控品适用于cobas e免疫检测分析仪。","specialty":"医学检验科"},"ja":{"title":"リン酸化Tau-181蛋白血液検査用精度管理物質","description":"PreciControl Phospho-Tau (181P) Plasma。\nリン酸化Tau-181蛋白血液検査項目の品質管理に使用する。cobas e免疫分析装置に適用する。","specialty":"臨床検査科"},"en":{"title":"Phospho-Tau 181 Blood Quality Control Material","description":"PreciControl Phospho-Tau (181P) Plasma.\nFor quality control of the phospho-Tau 181 blood test. Intended for use with cobas e immunoassay analyzers.","specialty":"Laboratory Medicine"}}},{"id":256,"category":"device","number":51,"langs":{"zh":{"title":"磷酸化tau-181蛋白血液定标液","description":"用于磷酸化tau-181蛋白血液检测项目的定标。该定标液适用于cobas e免疫检测分析仪","specialty":"医学检验科"},"ja":{"title":"リン酸化Tau-181蛋白血液検査用キャリブレータ","description":"リン酸化Tau-181蛋白血液検査項目の校正に使用する。cobas e免疫分析装置に適用する。","specialty":"臨床検査科"},"en":{"title":"Phospho-Tau 181 Blood Calibration Solution","description":"For calibration of the phospho-Tau 181 blood test. Intended for use with cobas e immunoassay analyzers.","specialty":"Laboratory Medicine"}}},{"id":257,"category":"device","number":52,"langs":{"zh":{"title":"过敏原特异性 IgE 抗体检测试剂（荧光免疫法）ImmunoCAP™ Specific IgE","description":"用于过敏原特异性 IgE 抗体检测","specialty":"医学检验科"},"ja":{"title":"ImmunoCAP™ Specific IgE アレルゲン特異的IgE抗体検査試薬（蛍光免疫法）","description":"アレルゲン特異的IgE抗体の検出に使用する。","specialty":"臨床検査科"},"en":{"title":"ImmunoCAP™ Specific IgE, Allergen-Specific IgE Antibody Test Reagent (Fluorescence Immunoassay)","description":"For detection of allergen-specific IgE antibodies.","specialty":"Laboratory Medicine"}}},{"id":258,"category":"device","number":53,"langs":{"zh":{"title":"七种类固醇激素检测试剂盒（高效液相色谱-串联质谱法）Ionify Steroids 2 (iST2)","description":"用于体外定量测定人血清和血浆中的 17α羟孕酮、皮质醇、硫酸去氢表雄酮（DHEA-S）、孕酮、去氢表雄酮（DHEA）、双氢睾酮和可的松的浓度。17α羟孕酮的测定用于辅助诊断和监测类固醇代谢紊乱。\n皮质醇的测定用于诊断和监测肾上腺功能障碍。硫酸去氢表雄酮的测定用于辅助诊断和监测类固醇代谢紊乱。孕酮的测定用于诊断女性生育障碍，即排卵检测和黄体期评估。去氢表雄酮的测定用于辅助诊断类固醇代谢紊乱。双氢睾酮的测定用于辅助诊断和监测类固醇代谢紊乱。可的松的测定用于辅助诊断和监测类固醇代谢紊乱。","specialty":"医学检验科"},"ja":{"title":"Ionify Steroids 2 (iST2) 7種ステロイドホルモン検査キット（HPLC-タンデム質量分析法）","description":"ヒト血清・血漿中の17α-ヒドロキシプロゲステロン、コルチゾール、デヒドロエピアンドロステロン硫酸（DHEA-S）、プロゲステロン、デヒドロエピアンドロステロン（DHEA）、ジヒドロテストステロン、コルチゾン濃度を体外で定量測定する。17α-ヒドロキシプロゲステロン測定はステロイド代謝異常の診断・モニタリングを補助する。コルチゾール測定は副腎機能障害の診断・モニタリングに使用する。DHEA-S測定はステロイド代謝異常の診断・モニタリングを補助する。プロゲステロン測定は女性の生殖障害、排卵確認および黄体期評価、の診断に使用する。DHEA、ジヒドロテストステロン、コルチゾン測定はステロイド代謝異常の診断・モニタリングを補助する。","specialty":"臨床検査科"},"en":{"title":"Ionify Steroids 2 (iST2), Seven-Steroid Hormone Test Kit (HPLC-Tandem Mass Spectrometry)","description":"For in vitro quantitative determination of 17α-hydroxyprogesterone, cortisol, dehydroepiandrosterone sulfate (DHEA-S), progesterone, dehydroepiandrosterone (DHEA), dihydrotestosterone, and cortisone in human serum and plasma. 17α-hydroxyprogesterone measurement assists in diagnosis and monitoring of steroid metabolism disorders. Cortisol measurement is used for diagnosis and monitoring of adrenal dysfunction. DHEA-S measurement assists in diagnosis and monitoring of steroid metabolism disorders. Progesterone measurement is used in diagnosis of female fertility disorders, including ovulation detection and luteal phase assessment. DHEA, dihydrotestosterone, and cortisone measurements assist in diagnosis and monitoring of steroid metabolism disorders.","specialty":"Laboratory Medicine"}}},{"id":259,"category":"device","number":54,"langs":{"zh":{"title":"快速液相色谱柱Rapid Cartridge B","description":"与全自动高效液相色谱串联质谱检测系统配套使用，用于对人体样本中的被测物进行分离。","specialty":"医学检验科"},"ja":{"title":"Rapid Cartridge B 高速液体クロマトグラフィーカラム","description":"全自動HPLCタンデム質量分析システムと組み合わせ、人体試料中の測定対象物を分離する。","specialty":"臨床検査科"},"en":{"title":"Rapid Cartridge B","description":"Used with a fully automated high-performance liquid chromatography tandem mass spectrometry system to separate analytes in human samples.","specialty":"Laboratory Medicine"}}},{"id":260,"category":"device","number":55,"langs":{"zh":{"title":"ColoScape™结直肠癌相关基因突变检测试剂","description":"ColoScape Colorectal Cancer Detection Test是一种多重实时PCR检测，用于同时定性检测结直肠癌相关基因突变和甲基化。突变基因包括APC（密码子1309、1367、1450和876）、BRAF（密码子600）、CTNNB1（密码子41和45）、KRAS（密码子12和13）、NRAS（密码子12和13）、PIK3CA（密码子545）、SMAD4（密码子361）和TP53（密码子175、248和273）。此外，甲基化基因包括MYO1G、KCNQ5、C9ORF50、FLI1、CLIP4、ZNF132和TWIST1。\n该检测试剂盒是对经福尔马林固定的石蜡包埋（FFPE）的组织样本或血浆样本中提取的DNA进行检测。本试剂盒识别目标区域是否存在突变和甲基化，但不能明确突变和甲基化的确切性质。\nColoScape Colorectal Cancer Detection Test将用于符合CE标准的实验室环境，而不用于在美国的体外诊断用途。","specialty":"医学检验科"},"ja":{"title":"ColoScape™ 大腸癌関連遺伝子変異検査試薬","description":"ColoScape Colorectal Cancer Detection Testは、多重リアルタイムPCRにより大腸癌関連遺伝子変異とメチル化を同時に定性的に検出する。変異遺伝子にはAPC、コドン1309、1367、1450、876、BRAF、コドン600、CTNNB1、コドン41、45、KRAS、コドン12、13、NRAS、コドン12、13、PIK3CA、コドン545、SMAD4、コドン361、TP53、コドン175、248、273、を含む。メチル化遺伝子にはMYO1G、KCNQ5、C9ORF50、FLI1、CLIP4、ZNF132、TWIST1を含む。\nホルマリン固定パラフィン包埋（FFPE）組織または血漿試料から抽出したDNAを検査する。標的領域に変異・メチル化が存在するかを識別するが、その正確な性質までは特定しない。\nCE基準に適合する検査室環境で使用し、米国内での体外診断用途には使用しない。","specialty":"臨床検査科"},"en":{"title":"ColoScape™ Colorectal Cancer-Related Gene Mutation Test Reagent","description":"The ColoScape Colorectal Cancer Detection Test is a multiplex real-time PCR assay for simultaneous qualitative detection of colorectal cancer-related gene mutations and methylation. Mutation targets include APC, codons 1309, 1367, 1450 and 876; BRAF, codon 600; CTNNB1, codons 41 and 45; KRAS, codons 12 and 13; NRAS, codons 12 and 13; PIK3CA, codon 545; SMAD4, codon 361; and TP53, codons 175, 248 and 273. Methylation targets include MYO1G, KCNQ5, C9ORF50, FLI1, CLIP4, ZNF132 and TWIST1.\nThe assay tests DNA extracted from formalin-fixed paraffin-embedded, FFPE, tissue samples or plasma samples. It identifies the presence of mutations and methylation in target regions but does not determine their exact nature.\nThe ColoScape Colorectal Cancer Detection Test is intended for use in CE-compliant laboratory settings and is not intended for in vitro diagnostic use in the United States.","specialty":"Laboratory Medicine"}}},{"id":261,"category":"device","number":56,"langs":{"zh":{"title":"聚左旋乳酸胶原蛋白刺激剂","description":"该产品仅应用于深层真皮或皮下层，用于增加面部和身体凹陷区域的体积、尤其适用于矫正皮肤凹陷。","specialty":"医疗美容科"},"ja":{"title":"ポリ-L-乳酸コラーゲン刺激剤","description":"深層真皮または皮下層のみに使用し、顔面・身体の陥凹部のボリュームを増加させる。特に皮膚陥凹の矯正に適する。","specialty":"美容医療科"},"en":{"title":"Poly-L-Lactic Acid Collagen Stimulator","description":"For use only in the deep dermis or subcutaneous layer to increase volume in depressed areas of the face and body, especially for correction of skin depressions.","specialty":"Medical Aesthetics"}}},{"id":262,"category":"device","number":57,"langs":{"zh":{"title":"全液态聚己内酯注射型植入剂","description":"Polycaprolactone Injectable Implant\n适用于面部组织丰满，中深层皮肤植入，以矫正中度至重度 面部皱纹和褶皱","specialty":"医疗美容科"},"ja":{"title":"完全液状ポリカプロラクトン注入型インプラント","description":"Polycaprolactone Injectable Implant。\n顔面組織のボリューム形成を目的に、中層～深層皮膚へ埋植し、中等度～重度の顔面皺および溝を矯正する。","specialty":"美容医療科"},"en":{"title":"Fully Liquid Polycaprolactone Injectable Implant","description":"Polycaprolactone Injectable Implant.\nFor facial tissue volumization, implanted in the mid-to-deep skin layers to correct moderate to severe facial wrinkles and folds.","specialty":"Medical Aesthetics"}}},{"id":263,"category":"device","number":58,"langs":{"zh":{"title":"MemoryGel Xtra","description":"人工乳房植入体\n该产品适用于隆乳和乳房再造","specialty":"医疗美容科"},"ja":{"title":"MemoryGel Xtra","description":"乳房インプラント。\n豊胸および乳房再建に適応する。","special
