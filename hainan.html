三次元マッピングシステムは、EP手術用の3Dマッピング・ナビゲーションシステム。SiSおよび関連付属品は、カテーテルや記録システムなど外部入出力装置のデータ接続経路を提供し、システムワークステーション・ソフトウェアへデータを送信する。","specialty":"循環器内科"},"en":{"title":"Rhythmia HDx Three-Dimensional Cardiac Electrophysiology Mapping System Components","description":"The RHYTHMIA HDx™ three-dimensional cardiac electrophysiology mapping system is a 3D mapping and navigation system for EP procedures. SiS and related accessories provide data connection pathways for external input/output devices, such as catheters and recording systems, and transmit data to the system workstation and software.","specialty":"Cardiology"}}},{"id":389,"category":"device","number":184,"langs":{"zh":{"title":"磁定位压力感应盐水灌注消融导管","description":"IntellaNav StablePoint 导管适用于需要基于导管进行心脏电生理标测（刺激和记录）的患者，当与射频消融仪联合使用时，可用于心脏消融。","specialty":"心血管内科"},"ja":{"title":"磁気位置決め圧力感知生理食塩水灌流アブレーションカテーテル","description":"IntellaNav StablePointカテーテルは、カテーテルベースの心臓電気生理マッピング、刺激・記録、を必要とする患者に使用し、高周波アブレーション装置と併用することで心臓アブレーションに使用できる。","specialty":"循環器内科"},"en":{"title":"Magnetic Localization Pressure-Sensing Irrigated Ablation Catheter","description":"The IntellaNav StablePoint catheter is intended for patients requiring catheter-based cardiac electrophysiology mapping, stimulation and recording, and, when used with a radiofrequency ablation generator, may be used for cardiac ablation.","specialty":"Cardiology"}}},{"id":390,"category":"device","number":185,"langs":{"zh":{"title":"经导管植入式无导线起搏系统","description":"Micra AV2 Transcatheter Pacing System\n\nMicra AV2 适用于有以下一种情况的患者：\n•阵发性或永久性高度房室传导阻滞，无房颤\n•阵发性或永久性高度房室传导阻滞，伴有阵发性房颤\n•阵发性或永久性高度房室传导阻滞，伴有持续性房颤，但仍计划尝试恢复窦性节律\n此器械仅设计用于右心室。","specialty":"心血管内科"},"ja":{"title":"Micra AV2 Transcatheter Pacing System 経カテーテル植込み型リードレスペーシングシステム","description":"以下のいずれかを有する患者に適応する：\n• 発作性または永続性高度房室ブロック、心房細動なし。\n• 発作性または永続性高度房室ブロック、発作性心房細動あり。\n• 発作性または永続性高度房室ブロック、持続性心房細動ありだが洞調律回復を試みる予定がある。\n本器械は右心室専用。","specialty":"循環器内科"},"en":{"title":"Micra AV2 Transcatheter Pacing System","description":"Micra AV2 is intended for patients with one of the following:\n• paroxysmal or permanent high-grade AV block without atrial fibrillation;\n• paroxysmal or permanent high-grade AV block with paroxysmal atrial fibrillation;\n• paroxysmal or permanent high-grade AV block with persistent atrial fibrillation when restoration of sinus rhythm is still planned.\nThis device is designed for use in the right ventricle only.","specialty":"Cardiology"}}},{"id":391,"category":"device","number":186,"langs":{"zh":{"title":"程控仪底座","description":"CareLink SmartSync Base\n\n器械管理器旨在用于查询和程控 Medtronic 植入式器械，并在 Medtronic 心脏器械植入或有创故障排除过程中进行心脏电极导线分析。底座在器械植入、有创故障排除和植入器械随访过程中提供分析仪和 ECG 硬件。底座上还有一个充电座和 USB 端口，用于为患者连接 器充电。此外，USB 端口还用于在患者连接器和器械管理器应用程序之间传输数据。底座适用于医疗专业人员或 Medtronic 代表在临床或医院环境中使用。","specialty":"心血管内科"},"ja":{"title":"CareLink SmartSync Base プログラマベース","description":"デバイスマネージャはMedtronic植込みデバイスの照会・プログラミング、Medtronic心臓デバイス植込みまたは侵襲的トラブルシューティング中の心臓リード解析に使用する。ベースはデバイス植込み、侵襲的トラブルシューティング、植込みデバイスフォローアップ中にアナライザ・ECGハードウェアを提供する。患者コネクタ充電用クレードルとUSBポートを備え、USBポートは患者コネクタとデバイスマネージャアプリ間のデータ転送にも使用する。医療従事者またはMedtronic担当者が臨床・病院環境で使用する。","specialty":"循環器内科"},"en":{"title":"CareLink SmartSync Base","description":"The device manager is intended to interrogate and program Medtronic implanted devices and to perform cardiac lead analysis during implantation of Medtronic cardiac devices or invasive troubleshooting. The base provides analyzer and ECG hardware during device implantation, invasive troubleshooting, and follow-up of implanted devices. The base also has a charging cradle and USB port for charging the patient connector. The USB port is also used to transfer data between the patient connector and the device manager application. Intended for use by healthcare professionals or Medtronic representatives in clinical or hospital settings.","specialty":"Cardiology"}}},{"id":392,"category":"device","number":187,"langs":{"zh":{"title":"程控仪器械管理器应用程序","description":"CareLink SmartSync Device Manager Application\n\n器械管理器应用程序旨在用作器械管理器的主要界面。器械管理器旨在用于查询和程控 Medtronic 植入式器械，并在 Medtronic 心脏器械植入或有创故障排除过程中进行心脏电极导线分析。器械管理器旨在由医疗专业人员在临床或医院环境中使用。","specialty":"心血管内科"},"ja":{"title":"CareLink SmartSync Device Manager Application","description":"デバイスマネージャの主要インターフェースとして使用する。Medtronic植込みデバイスの照会・プログラミングおよび心臓デバイス植込みまたは侵襲的トラブルシューティング中の心臓リード解析に使用し、医療従事者が臨床・病院環境で使用する。","specialty":"循環器内科"},"en":{"title":"CareLink SmartSync Device Manager Application","description":"The device manager application serves as the primary interface for the device manager. The device manager is intended to interrogate and program Medtronic implanted devices and to perform cardiac lead analysis during Medtronic cardiac device implantation or invasive troubleshooting. Intended for use by healthcare professionals in clinical or hospital settings.","specialty":"Cardiology"}}},{"id":393,"category":"device","number":188,"langs":{"zh":{"title":"程控仪患者连接器","description":"CareLink SmartSync Patient Connector\n\n患者连接器预期与 Medtronic 应用程序一起使用，用于查询、分析和/或程控 Medtronic 植入式器械。患者连接器使用 Bluetooth 技术将数据传输到 Medtronic 应用程序进行进一步处理。患者连接器适用于医疗专业人员或Medtronic代表在临床或医院环境中使用。","specialty":"心血管内科"},"ja":{"title":"CareLink SmartSync Patient Connector","description":"Medtronicアプリケーションと併用し、Medtronic植込みデバイスの照会、解析および／またはプログラミングに使用する。BluetoothでデータをMedtronicアプリへ送信し、追加処理を行う。医療従事者またはMedtronic担当者が臨床・病院環境で使用する。","specialty":"循環器内科"},"en":{"title":"CareLink SmartSync Patient Connector","description":"The patient connector is intended for use with Medtronic applications to interrogate, analyze, and/or program Medtronic implanted devices. It uses Bluetooth technology to transmit data to the Medtronic application for further processing. Intended for use by healthcare professionals or Medtronic representatives in clinical or hospital settings.","specialty":"Cardiology"}}},{"id":394,"category":"device","number":189,"langs":{"zh":{"title":"程控仪 AV2 应用程序","description":"CareLink SmartSync Micra AV2 Application\n\nMicra AV2 适用于有以下一种情况的患者：\n•阵发性或永久性高度房室传导阻滞，无房颤\n•阵发性或永久性高度房室传导阻滞，伴有阵发性房颤\n•阵发性或永久性高度房室传导阻滞，伴有持续性房颤，但仍计划尝试恢复窦性节律\n此器械仅设计用于右心室。","specialty":"心血管内科"},"ja":{"title":"CareLink SmartSync Micra AV2 Application","description":"Micra AV2は以下のいずれかを有する患者に適応する：\n• 発作性または永続性高度房室ブロック、心房細動なし。\n• 発作性または永続性高度房室ブロック、発作性心房細動あり。\n• 発作性または永続性高度房室ブロック、持続性心房細動ありだが洞調律回復を試みる予定がある。\n本器械は右心室専用。","specialty":"循環器内科"},"en":{"title":"CareLink SmartSync Micra AV2 Application","description":"Micra AV2 is intended for patients with one of the following:\n• paroxysmal or permanent high-grade AV block without atrial fibrillation;\n• paroxysmal or permanent high-grade AV block with paroxysmal atrial fibrillation;\n• paroxysmal or permanent high-grade AV block with persistent atrial fibrillation when restoration of sinus rhythm is still planned.\nThis device is designed for use in the right ventricle only.","specialty":"Cardiology"}}},{"id":395,"category":"device","number":190,"langs":{"zh":{"title":"手持式心电图仪远程监护设备系统","description":"KardiaMobile 6L\n\nKardiaMobile 6L 系统用于记录、存储和传输单通道和双通道的心电图 (EKG)心律。在单通道模式下，KardiaMobile 6L 系统可以记录 I 导联。在双通道模式下，KardiaMobile 6L 系统可以同时记录 I 导联和II 导联，并得出 III 导联和单极肢体导联 aVR、aVF和 aVL。KardiaMobile 6L 系统还能显示心电图心律和AliveCor 的KardiaAI 平台的心电图分析输出，包括检测是否存在正常窦性心律、心房颤动、心动过缓、心动过速等。KardiaMobile 6L 系统的使用对象是医疗卫生专业人士、已知或怀疑有心脏疾病的病人和有健康意识的个人。本设备尚未进行儿科测试，因此不应用于儿科。","specialty":"心血管内科"},"ja":{"title":"KardiaMobile 6L ハンドヘルド心電計遠隔モニタリングシステム","description":"単チャネル・二チャネル心電図、EKG、リズムを記録・保存・送信する。単チャネルモードではI誘導を記録する。二チャネルモードではI・II誘導を同時記録し、III誘導およびaVR、aVF、aVLを導出する。心電図リズムとAliveCor KardiaAIプラットフォームの解析出力を表示し、正常洞調律、心房細動、徐脈、頻脈などを検出できる。医療従事者、既知または疑いのある心疾患患者、健康意識の高い個人を対象とする。小児での試験は実施されておらず、小児には使用しない。","specialty":"循環器内科"},"en":{"title":"KardiaMobile 6L Handheld ECG Remote Monitoring System","description":"The KardiaMobile 6L system records, stores, and transmits single-channel and dual-channel electrocardiographic, EKG, rhythms. In single-channel mode, it records lead I. In dual-channel mode, it simultaneously records leads I and II and derives lead III and augmented limb leads aVR, aVF, and aVL. The system can display ECG rhythms and analysis outputs from AliveCor's KardiaAI platform, including detection of normal sinus rhythm, atrial fibrillation, bradycardia, tachycardia, and other findings. Intended for healthcare professionals, patients with known or suspected heart disease, and health-conscious individuals. The device has not been tested in pediatric populations and should not be used in children.","specialty":"Cardiology"}}},{"id":396,"category":"device","number":191,"langs":{"zh":{"title":"普乐司肽：可吸收止血凝胶\nPuraStat®: Absorbable Hemostatic Material","description":"针对消化系统内窥镜治疗时渗漏性出血，为减少止血钳的烧灼次数而使用的可吸收局部止血材料。","specialty":"消化内科"},"ja":{"title":"PuraStat® 吸収性止血材料","description":"消化管内視鏡治療時の滲出性出血に対し、止血鉗子による焼灼回数を減らすために使用する吸収性局所止血材。","specialty":"消化器内科"},"en":{"title":"PuraStat® Absorbable Hemostatic Material","description":"An absorbable topical hemostatic material used for oozing bleeding during gastrointestinal endoscopic treatment to reduce the number of cautery applications with hemostatic forceps.","specialty":"Gastroenterology"}}},{"id":397,"category":"device","number":192,"langs":{"zh":{"title":"Allurion Gastric Balloon System\n安瑞仁吞咽式减重胃水球系统","description":"吞咽式减重胃水球使用于辅助身体质量指数（BMI）≥27.0kg/m2的肥胖患者进行减重，吞咽式减重胃水球需与受控的营养计划配合使用。","specialty":"消化内科"},"ja":{"title":"Allurion Gastric Balloon System","description":"BMI 27.0 kg/m²以上の肥満患者の減量を補助する嚥下式胃内バルーン。管理された栄養プログラムと併用する。","specialty":"消化器内科"},"en":{"title":"Allurion Gastric Balloon System","description":"A swallowable weight-loss gastric balloon used to assist weight reduction in obese patients with body mass index, BMI, ≥27.0 kg/m². It must be used together with a controlled nutritional program.","specialty":"Gastroenterology"}}},{"id":398,"category":"device","number":193,"langs":{"zh":{"title":"3-D Matrix Syringe Adaptor\n注射器转换接头","description":"一种将注射器与导管、旋塞或其它结构连接的带有鲁尔锁的器具。\n（仅作为普乐司肽的配件，将普乐司肽与市售标准接口的内窥镜给药导管连接，以实现其在内镜下消化道止血的使用。）","specialty":"消化内科"},"ja":{"title":"3-D Matrix Syringe Adaptor","description":"シリンジをカテーテル、三方活栓、その他構造に接続するルアーロック付き器具。\nPuraStat専用付属品として、市販標準インターフェースの内視鏡薬剤投与カテーテルにPuraStatを接続し、内視鏡下消化管止血に使用する。","specialty":"消化器内科"},"en":{"title":"3-D Matrix Syringe Adaptor","description":"A device with a Luer lock for connecting a syringe to a catheter, stopcock, or other structure.\nUsed only as an accessory to PuraStat, connecting PuraStat to a commercially available endoscopic delivery catheter with a standard interface to enable its use for endoscopic gastrointestinal hemostasis.","specialty":"Gastroenterology"}}},{"id":399,"category":"device","number":194,"langs":{"zh":{"title":"内镜下缝合系统","description":"旨在用于胃肠内窥镜下缝合线的操作和对胃肠软组织的对合与缝合。","specialty":"外科"},"ja":{"title":"内視鏡下縫合システム","description":"消化管内視鏡下で縫合糸を操作し、消化管軟組織を寄せ合わせて縫合するために使用する。","specialty":"外科"},"en":{"title":"Endoscopic Suturing System","description":"Intended for manipulation of sutures and approximation and suturing of gastrointestinal soft tissue under gastrointestinal endoscopy.","specialty":"Surgery"}}},{"id":400,"category":"device","number":195,"langs":{"zh":{"title":"VenaSeal™ 闭合系统","description":"VenaSeal闭合系统预期用于静脉反流性疾病治疗中 大隐静脉（GSV）和相关静脉曲张的永久性、完全、血管内粘连","specialty":"外科"},"ja":{"title":"VenaSeal™ Closure System","description":"静脈逆流性疾患の治療において、大伏在静脈（GSV）および関連静脈瘤を永久的・完全に血管内接着閉鎖するために使用する。","specialty":"外科"},"en":{"title":"VenaSeal™ Closure System","description":"Intended for permanent, complete endovascular adhesive closure of the great saphenous vein, GSV, and associated varicose veins in treatment of venous reflux disease.","specialty":"Surgery"}}},{"id":401,"category":"device","number":196,"langs":{"zh":{"title":"电磁式智能变焦体外冲击波治疗仪及配件（Dornier Aries2）","description":"仅用于大转子疼痛综合征莫顿神经瘤、纤维肌痛、治疗肌筋膜触发点、缓解上运动神经元损伤后的痉挛性肌肉疼痛、皮下脂肪团、缓解骨关节炎疼痛及泌尿系病症的治疗。","specialty":"外科"},"ja":{"title":"Dornier Aries2 電磁式インテリジェント可変焦点体外衝撃波治療装置および付属品","description":"大転子痛症候群、Morton神経腫、線維筋痛症、筋膜トリガーポイント治療、上位運動ニューロン障害後の痙縮性筋痛緩和、皮下セルライト、変形性関節症疼痛緩和、泌尿器系疾患の治療にのみ使用する。","specialty":"外科"},"en":{"title":"Dornier Aries2 Electromagnetic Intelligent Variable-Focus Extracorporeal Shock Wave Therapy Device and Accessories","description":"For treatment only of greater trochanteric pain syndrome, Morton's neuroma, fibromyalgia, myofascial trigger points, spastic muscle pain following upper motor neuron injury, subcutaneous cellulite, osteoarthritis pain relief, and urologic conditions.","specialty":"Surgery"}}},{"id":402,"category":"device","number":197,"langs":{"zh":{"title":"Leonardo Mini光动力仪","description":"用于激活光敏剂Foscan所需的局部人体组织照射。Foscan适用于晚期头颈部鳞状细胞癌患者。或既往治疗失败，不适合放疗，手术或系统化疗的肿瘤患者","specialty":"外科"},"ja":{"title":"Leonardo Mini 光線力学療法装置","description":"光増感剤Foscanを活性化するために必要な局所人体組織照射に使用する。Foscanは進行頭頸部扁平上皮癌患者、または既治療が不成功で放射線療法、手術、全身化学療法に適さない腫瘍患者に使用する。","specialty":"外科"},"en":{"title":"Leonardo Mini Photodynamic Therapy Device","description":"For localized irradiation of human tissue required to activate the photosensitizer Foscan. Foscan is intended for patients with advanced head and neck squamous cell carcinoma, or tumors in patients whose previous treatment has failed and who are unsuitable for radiotherapy, surgery, or systemic chemotherapy.","specialty":"Surgery"}}},{"id":403,"category":"device","number":198,"langs":{"zh":{"title":"胃内球囊系统\nORBERA Intragastric Balloon","description":"胃内球囊系统用于体重指数（BMI）≥30 并≤40kg/m2的肥胖成人，结合长期监督饮食和行为改变计划使用，旨在显著增加长期减肥的可能性并维持该减肥效果。适用于未通过更保守减肥方案的成年患者，如监督饮食、锻炼和行为矫正计划。最长放置时间是 6 个月。","specialty":"外科"},"ja":{"title":"ORBERA Intragastric Balloon 胃内バルーンシステム","description":"BMI 30以上40 kg/m²以下の肥満成人に、長期監督下の食事療法・行動変容プログラムと併用し、長期減量達成と維持の可能性を大きく高めることを目的とする。監督下食事、運動、行動修正など、より保守的な減量法で成功しなかった成人患者に適応する。最長留置期間6か月。","specialty":"外科"},"en":{"title":"ORBERA Intragastric Balloon System","description":"For obese adults with BMI ≥30 and ≤40 kg/m², used in conjunction with a long-term supervised diet and behavior-modification program to substantially increase the likelihood of long-term weight loss and maintenance. Intended for adults who have failed more conservative weight-loss approaches, such as supervised diet, exercise, and behavior-modification programs. Maximum placement duration is 6 months.","specialty":"Surgery"}}},{"id":404,"category":"device","number":199,"langs":{"zh":{"title":"Da Vinci SP 单通道内窥镜手术系统","description":"Da Vinci SP 单通道内窥镜手术系统(Da VinciSPSurgicalSystem，SP1098)预期用于协助在适合单端口入路的泌尿外科手术、普通外科腔镜手术、妇科腔镜手术、胸外科腔镜手术和经口耳鼻喉科手术等内窥镜手术中精准控制 Intuitive Surgical EndoWristSP 手术器械。本系统可用于成人及儿童患者(经口手术除外)。","specialty":"外科"},"ja":{"title":"Da Vinci SP 単孔式内視鏡手術システム","description":"Da Vinci SP Single-Port Endoscopic Surgical System、SP1098、は、単一ポートアプローチに適する泌尿器外科、一般外科腹腔鏡、婦人科腹腔鏡、胸腔鏡、経口耳鼻咽喉科などの内視鏡手術でIntuitive Surgical EndoWrist SP手術器具を精密に制御することを補助する。経口手術を除き成人・小児患者に使用できる。","specialty":"外科"},"en":{"title":"Da Vinci SP Single-Port Endoscopic Surgical System","description":"The Da Vinci SP Single-Port Endoscopic Surgical System, Da Vinci SP Surgical System, SP1098, is intended to assist precise control of Intuitive Surgical EndoWrist SP surgical instruments in endoscopic procedures suitable for a single-port approach, including urologic surgery, general laparoscopic surgery, gynecologic laparoscopic surgery, thoracoscopic surgery, and transoral ENT surgery. The system may be used in adult and pediatric patients, except for transoral surgery.","specialty":"Surgery"}}},{"id":405,"category":"device","number":200,"langs":{"zh":{"title":"pEGASUS 支架系统","description":"自扩展管状血管植入物 pEGASUS（HPC）支架系统用于血管疾病的血管内治疗：1.囊状和梭状动脉瘤和假性动脉瘤，结合使用弹簧圈；2.急性期和慢性期的血管夹层；3.颅内动脉粥样硬化性血管狭窄。","specialty":"神经外科"},"ja":{"title":"pEGASUS ステントシステム","description":"自己拡張型管状血管インプラントpEGASUS（HPC）ステントシステムは血管疾患の血管内治療に使用する：1. コイル併用による嚢状・紡錘状動脈瘤および仮性動脈瘤、2. 急性期・慢性期血管解離、3. 頭蓋内アテローム性動脈硬化性血管狭窄。","specialty":"脳神経外科"},"en":{"title":"pEGASUS Stent System","description":"The self-expanding tubular vascular implant pEGASUS (HPC) stent system is used for endovascular treatment of vascular diseases: 1. saccular and fusiform aneurysms and pseudoaneurysms, in combination with coils; 2. acute and chronic vascular dissections; 3. intracranial atherosclerotic vascular stenosis.","specialty":"Neurosurgery"}}},{"id":406,"category":"device","number":201,"langs":{"zh":{"title":"Osteopore PCL Scaffold Bone Filler\n聚己内酯骨填充材料","description":"用于神经外科钻孔、颅骨切开及其它颅骨缺损的修复。","specialty":"神经外科"},"ja":{"title":"Osteopore PCL Scaffold Bone Filler ポリカプロラクトン骨充填材","description":"脳神経外科の穿頭孔、開頭部およびその他の頭蓋骨欠損の修復に使用する。","specialty":"脳神経外科"},"en":{"title":"Osteopore PCL Scaffold Bone Filler","description":"For repair of neurosurgical burr holes, craniotomy defects, and other skull defects.","specialty":"Neurosurgery"}}},{"id":407,"category":"device","number":202,"langs":{"zh":{"title":"脑深部刺激患者无线充电器\nRecharger Kit","description":"此充电器套件预期用于对兼容的 Medtronic 可充电神经刺激器和充电器充电。","specialty":"神经外科"},"ja":{"title":"脳深部刺激患者用ワイヤレス充電器 Recharger Kit","description":"対応するMedtronic充電式神経刺激装置および充電器を充電するために使用する。","specialty":"脳神経外科"},"en":{"title":"Deep Brain Stimulation Patient Wireless Recharger, Recharger Kit","description":"The charger kit is intended to charge compatible Medtronic rechargeable neurostimulators and the recharger.","specialty":"Neurosurgery"}}},{"id":408,"category":"device","number":203,"langs":{"zh":{"title":"患者程控仪Handset with Communicator","description":"患者程控仪由患者程控应用程序（A620）和通信器（TM91）组成。患者程控应用程序为患者提供用户界面，以调整治疗并从植入式神经刺激器获得系统信息，作为脑深部电刺激治疗神经刺激系统的一部分。通信器在手机和植入式神经刺激器之间提供通信桥梁。","specialty":"神经外科"},"ja":{"title":"患者用プログラマ Handset with Communicator","description":"患者用プログラマは患者プログラマアプリケーション（A620）とコミュニケータ（TM91）から構成される。患者プログラマアプリは、脳深部刺激治療用神経刺激システムの一部として、治療調整および植込み型神経刺激装置からのシステム情報取得のためのユーザーインターフェースを患者に提供する。コミュニケータは携帯電話と植込み型神経刺激装置の間の通信ブリッジを提供する。","specialty":"脳神経外科"},"en":{"title":"Patient Programmer Handset with Communicator","description":"The patient programmer consists of the patient programmer application, A620, and communicator, TM91. The patient programmer application provides the patient with a user interface to adjust therapy and obtain system information from the implanted neurostimulator as part of the deep brain stimulation neurostimulation system. The communicator provides a communication bridge between the mobile phone and implanted neurostimulator.","specialty":"Neurosurgery"}}},{"id":409,"category":"device","number":204,"langs":{"zh":{"title":"临床医生程控仪应用程序Clinician Programmer Application for Deep Brain Stimulation","description":"临床医生程控仪应用程序预期由临床医生用于程控Medtronic 神经刺激器进行脑深部电刺激。","specialty":"神经外科"},"ja":{"title":"Clinician Programmer Application for Deep Brain Stimulation","description":"臨床医がMedtronic神経刺激装置をプログラミングして脳深部刺激を行うために使用する。","specialty":"脳神経外科"},"en":{"title":"Clinician Programmer Application for Deep Brain Stimulation","description":"Intended for clinicians to program Medtronic neurostimulators for deep brain stimulation.","specialty":"Neurosurgery"}}},{"id":410,"category":"device","number":205,"langs":{"zh":{"title":"植入式可充电脑深部神经刺激器\nPerceptTM RC","description":"帕金森病\n对于患有帕金森病，对左旋多巴有反应，但病情未通过药物得到足够控制，患病已至少 4 年的患者，建议用 Medtronic 帕金森病 DBS 治疗对苍白球内侧核（GPi）或丘脑底核（STN）进行双侧刺激来辅助治疗，以便减轻某些症状，包括最近发生的运动相关并发症（4 个月到 3 年），或持续很长时间的运动相关并发症。\n\n震颤\n对于上肢震颤的抑制，建议用 Medtronic 震颤 DBS治疗对丘脑腹中间（VIM）进行单侧丘脑刺激。此系统预期用于已确诊有原发性震颤或帕金森病震颤但未通过药物得到足够控制的患者，以及因为震颤而形成严重功能残疾的情况。\n\n癫痫\n对于已确诊有癫痫，特点为局部发作，有或没有继发性全身发作，并且至少对三种抗癫痫药没有反应的年满 18 岁的患者，适合用 Medtronic 癫痫 DBS 系统进行双侧丘脑前核（ANT）刺激作为辅助治疗，以降低癫痫发作频率。\n\n肌张力障碍\n建议用 Medtronic 肌张力障碍 DBS 治疗进行单侧或双侧苍白球内侧核（GPi）或丘脑底核（STN）刺激，在年满七岁患者的慢性顽固（很难用药物治疗）原发性肌张力障碍（包括全身性和/或节段性肌张力障碍，偏身肌张力障碍及颈肌张力障碍（斜颈））的管理过程中用作辅助治疗。","specialty":"神经外科"},"ja":{"title":"Percept™ RC 植込み型充電式脳深部神経刺激装置","description":"パーキンソン病：\nレボドパに反応するが薬物で十分に制御されず、罹病期間4年以上の患者に対し、Medtronic Parkinson's DBS治療として淡蒼球内節（GPi）または視床下核（STN）の両側刺激を補助療法として行い、最近発症した運動関連合併症、4か月～3年、または長期間持続する運動関連合併症を含む症状を軽減する。\n\n振戦：\n上肢振戦の抑制には、Medtronic Tremor DBSによる視床腹中間核（VIM）の片側刺激を推奨する。薬物で十分に制御されない本態性振戦またはパーキンソン病振戦と診断された患者、および振戦により重度機能障害を生じている患者を対象とする。\n\nてんかん：\n局所発作、二次性全般化の有無を問わない、を特徴とし、少なくとも3種類の抗てんかん薬に反応しない18歳以上のてんかん患者に、Medtronic Epilepsy DBSシステムによる両側視床前核（ANT）刺激を補助療法として使用し、発作頻度を低下させる。\n\nジストニア：\n7歳以上の慢性難治性原発性ジストニア、全身性および／または分節性ジストニア、片側ジストニア、頸部ジストニア、斜頸、の管理において、Medtronic Dystonia DBSによる片側または両側GPiまたはSTN刺激を補助療法として使用する。","specialty":"脳神経外科"},"en":{"title":"Percept™ RC Implantable Rechargeable Deep Brain Neurostimulator","description":"Parkinson's disease:\nFor patients with Parkinson's disease who respond to levodopa but whose disease is not adequately controlled by medication and who have had the disease for at least 4 years, Medtronic Parkinson's DBS therapy is recommended as adjunctive treatment with bilateral stimulation of the globus pallidus internus, GPi, or subthalamic nucleus, STN, to reduce certain symptoms, including recently occurring motor-related complications, 4 months to 3 years, or long-standing motor-related complications.\n\nTremor:\nFor suppression of upper-limb tremor, Medtronic Tremor DBS therapy is recommended for unilateral stimulation of the ventral intermediate nucleus, VIM, of the thalamus. The system is intended for patients with diagnosed essential tremor or Parkinsonian tremor not adequately controlled by medication and causing severe functional disability.\n\nEpilepsy:\nFor patients aged 18 years and older with diagnosed epilepsy characterized by partial-onset seizures with or without secondary generalization who have failed to respond to at least three antiepileptic drugs, the Medtronic Epilepsy DBS system is suitable as adjunctive therapy using bilateral stimulation of the anterior nucleus of the thalamus, ANT, to reduce seizure frequency.\n\nDystonia:\nMedtronic Dystonia DBS therapy is recommended using unilateral or bilateral stimulation of the globus pallidus internus, GPi, or subthalamic nucleus, STN, as adjunctive therapy in the management of chronic refractory primary dystonia in patients aged 7 years and older, including generalized and/or segmental dystonia, hemidystonia, and cervical dystonia, torticollis.","specialty":"Neurosurgery"}}},{"id":411,"category":"device","number":206,"langs":{"zh":{"title":"经颅脉冲刺激仪（NEUROLITH）","description":"适用阿尔茨海默症、帕金森病、中风和脊柱创伤等神经疾病的治疗。\n经颅脉冲刺激（TPS）的主要机理是机械传导。对生长因子，主要是血管内皮生长因子（VEGF）的刺激不仅可以改善颅内血流，而且有助于新血管形成（血管新生）和神经再生,附加效应是释放一氧化氮，令血管舒张并改善血液循环。","specialty":"神经外科"},"ja":{"title":"NEUROLITH 経頭蓋パルス刺激装置","description":"アルツハイマー病、パーキンソン病、脳卒中、脊椎外傷などの神経疾患治療に適用する。\n経頭蓋パルス刺激（TPS）の主な機序は機械的伝達。主に血管内皮増殖因子（VEGF）などの成長因子を刺激し、頭蓋内血流改善、新生血管形成、血管新生、神経再生を促す。さらに一酸化窒素を放出し、血管拡張・血液循環改善をもたらす。","specialty":"脳神経外科"},"en":{"title":"NEUROLITH Transcranial Pulse Stimulation Device","description":"For treatment of neurological diseases such as Alzheimer's disease, Parkinson's disease, stroke, and spinal trauma.\nThe main mechanism of transcranial pulse stimulation, TPS, is mechanical transmission. Stimulation of growth factors, mainly vascular endothelial growth factor, VEGF, can improve intracranial blood flow and promote neovascularization, angiogenesis, and neural regeneration. An additional effect is release of nitric oxide, resulting in vasodilation and improved circulation.","specialty":"Neurosurgery"}}},{"id":412,"category":"device","number":207,"langs":{"zh":{"title":"Nerivio\n远程神经调控低频电刺激仪","description":"Nerivio适用于12岁或以上偏头痛患者的急性期治疗和/或者预防性治疗，包括有先兆和无先兆偏头痛。该产品是一个由患者自主控制、居家使用的处方产品。该产品可以在偏头痛发作时或者先兆出现时用于急性期治疗、或者每两日使用作为预防性治疗。","specialty":"神经内科"},"ja":{"title":"Nerivio 遠隔神経調節低周波電気刺激装置","description":"12歳以上の片頭痛患者の急性期治療および／または予防治療に使用し、前兆あり・なしを含む。患者が自ら操作して家庭で使用する処方製品。片頭痛発作時または前兆出現時に急性期治療として使用、あるいは隔日使用で予防治療とする。","specialty":"脳神経内科"},"en":{"title":"Nerivio Remote Neuromodulation Low-Frequency Electrical Stimulation Device","description":"For acute and/or preventive treatment of migraine, with or without aura, in patients aged 12 years and older. This is a prescription product controlled by the patient and used at home. It can be used at migraine onset or during aura for acute treatment, or every other day for preventive treatment.","specialty":"Neurology"}}},{"id":413,"category":"device","number":208,"langs":{"zh":{"title":"ActiGraft®","description":"在医疗保健专业人员的监督下，将抽取的患者自身外周血，通过ActiGraft安全、快速地制备全血凝块(WBC)，用于现场处理有渗液的皮肤伤口，如腿部溃疡、压力性溃疡、糖尿病溃疡和机械或手术清除的伤口。","specialty":"灼伤整形科"},"ja":{"title":"ActiGraft®","description":"医療従事者の監督下で患者自身の末梢血を採取し、ActiGraftにより安全・迅速に全血凝血塊（WBC）を作製し、下腿潰瘍、褥瘡、糖尿病性潰瘍、機械的・外科的デブリードマン創など滲出性皮膚創傷を現場で治療する。","specialty":"熱傷形成外科"},"en":{"title":"ActiGraft®","description":"Under supervision of a healthcare professional, the patient's peripheral blood is drawn and safely and rapidly processed with ActiGraft into a whole-blood clot, WBC, for point-of-care treatment of exuding skin wounds such as leg ulcers, pressure ulcers, diabetic ulcers, and mechanically or surgically debrided wounds.","specialty":"Burns and Plastic Surgery"}}},{"id":414,"category":"device","number":209,"langs":{"zh":{"title":"人工真皮\nPermeaderm","description":"PermeaDerm B，C 和 G 预期用作接触性创面修复材料，以便在已经止血的经清洁清创的伤口上提供一个湿性伤口愈合环境。\nPermeaDerm B 适用于部分厚度烧伤伤口、供区和网状自体移植物的覆盖部分。PermeaDermC适用于部分厚度伤口、压力性损伤、静脉溃疡、糖尿病溃疡、慢性血管炎性溃疡、手术伤口（供区/移植、Moh’s手术后、激光手术后、足病、伤口裂开）、外伤性伤口（擦伤、裂伤、二度烧伤和皮肤撕裂伤）和引流伤口。\nPermeaDerm G 适用于经清创的部分厚度手部烧伤。","specialty":"烧伤科"},"ja":{"title":"PermeaDerm 人工真皮","description":"PermeaDerm B、C、Gは接触型創傷修復材として、止血後に洗浄・デブリードマンされた創に湿潤創傷治癒環境を提供する。\nPermeaDerm Bは部分層熱傷、採皮部、メッシュ自家移植片被覆に使用する。PermeaDerm Cは部分層創、褥瘡、静脈性潰瘍、糖尿病性潰瘍、慢性血管炎性潰瘍、手術創、採皮／移植、Mohs手術後、レーザー手術後、足病、創離開、外傷創、擦過傷、裂創、II度熱傷、皮膚裂傷、排液創に使用する。\nPermeaDerm Gはデブリードマン済み部分層手熱傷に使用する。","specialty":"熱傷科"},"en":{"title":"PermeaDerm Artificial Dermis","description":"PermeaDerm B, C, and G are intended as contact wound-repair materials to provide a moist wound-healing environment on cleaned and debrided wounds after hemostasis.\nPermeaDerm B is intended for partial-thickness burn wounds, donor sites, and coverage of meshed autografts. PermeaDerm C is intended for partial-thickness wounds, pressure injuries, venous ulcers, diabetic ulcers, chronic vasculitic ulcers, surgical wounds, donor/graft sites, post-Mohs surgery, post-laser surgery, podiatric wounds, wound dehiscence, traumatic wounds, abrasions, lacerations, second-degree burns and skin tears, and draining wounds.\nPermeaDerm G is intended for debrided partial-thickness hand burns.","specialty":"Burns"}}},{"id":415,"category":"device","number":210,"langs":{"zh":{"title":"普拉索玛冷等离子体治疗系统\nPLASOMA System","description":"PLASOMA(普拉索玛)系统在伤口处产生冷等离子体，作为创面管理和治疗的辅助疗法，对真皮层已遭破坏的愈合缓慢创面或不愈合创面起到促进愈合作用。","specialty":"烧伤科"},"ja":{"title":"PLASOMA 冷プラズマ治療システム","description":"創部に冷プラズマを発生させ、創傷管理・治療の補助療法として、真皮が損傷した治癒遅延創または難治性創の治癒を促進する。","specialty":"熱傷科"},"en":{"title":"PLASOMA Cold Plasma Treatment System","description":"The PLASOMA system generates cold plasma at the wound site as an adjunctive therapy for wound management and treatment and promotes healing in slow-healing or non-healing wounds in which the dermis has been damaged.","specialty":"Burns"}}},{"id":416,"category":"device","number":211,"langs":{"zh":{"title":"VERGENIX FLOWABLE GEL\nI型重组人胶原蛋白","description":"用于慢性和急性创伤的治疗，包括：全厚度和部分厚度的伤口，压疮，静脉溃疡，混合血管病因引起的溃疡，糖尿病溃疡，二度烧伤，供体部位和其他表面出血伤，擦伤，创伤愈合的二次目的，手术的伤口，隧道型/潜行性伤口。","specialty":"烧伤科"},"ja":{"title":"VERGENIX FLOWABLE GEL I型組換えヒトコラーゲン","description":"慢性・急性創傷の治療に使用し、全層・部分層創、褥瘡、静脈性潰瘍、混合血管病因潰瘍、糖尿病性潰瘍、II度熱傷、ドナー部位およびその他表在性出血創、擦過傷、二次治癒目的の創傷、手術創、トンネル／ポケット形成創を含む。","specialty":"熱傷科"},"en":{"title":"VERGENIX FLOWABLE GEL, Type I Recombinant Human Collagen","description":"For treatment of chronic and acute wounds, including full-thickness and partial-thickness wounds, pressure ulcers, venous ulcers, ulcers of mixed vascular etiology, diabetic ulcers, second-degree burns, donor sites and other superficial bleeding wounds, abrasions, wounds healing by secondary intention, surgical wounds, and tunneling/undermining wounds.","specialty":"Burns"}}},{"id":417,"category":"device","number":212,"langs":{"zh":{"title":"双向真空辅助乳房活检与旋切系统\n（Mammotome Revolve Dual Vacuum Assisted Biopsy (VAB) System） EX 穿刺旋切针和真空套件（Mammotome revolve EX probe with EZ-Sleeve）","description":"双向真空辅助乳房活检与旋切系统的目的是通过部分或完全切除影像下的异常，以及部分切除触诊的异常,提供乳房组织来进行组织学检查","specialty":"乳腺外科"},"ja":{"title":"Mammotome Revolve Dual Vacuum Assisted Biopsy (VAB) System、EX Probe with EZ-Sleeveおよび真空キット","description":"画像で確認された異常を部分または完全切除し、触知異常を部分切除して、組織学的検査用の乳房組織を採取することを目的とする。","specialty":"乳腺外科"},"en":{"title":"Mammotome Revolve Dual Vacuum Assisted Biopsy (VAB) System, EX Probe with EZ-Sleeve and Vacuum Kit","description":"The dual vacuum-assisted breast biopsy and excision system is intended to provide breast tissue for histological examination by partial or complete removal of imaging-detected abnormalities and partial removal of palpable abnormalities.","specialty":"Breast Surgery"}}},{"id":418,"category":"device","number":213,"langs":{"zh":{"title":"ClotTriever Thrombectomy\nSystem\n外周静脉取栓支架系统","description":"外周静脉取栓支架系统适用于：\n非外科手术方式清除血管内血栓和栓子。\n向血管注射、输注和/或从血管抽吸造影剂和其他液体。\n外周静脉取栓支架系统预期用于外周血管系统，包括治疗深静脉血栓形成（DVT）。","specialty":"普外科"},"ja":{"title":"ClotTriever Thrombectomy System 外周静脈血栓除去ステントシステム","description":"適応：\n非外科的方法による血管内血栓・塞栓の除去。\n血管への造影剤・その他液体の注入・輸注および／または血管からの吸引。\n末梢血管系で使用し、深部静脈血栓症（DVT）の治療を含む。","specialty":"一般外科"},"en":{"title":"ClotTriever Thrombectomy System, Peripheral Venous Thrombectomy Stent System","description":"Indicated for:\nnon-surgical removal of intravascular thrombi and emboli;\ninjection, infusion, and/or aspiration of contrast media and other fluids into/from vessels.\nThe system is intended for the peripheral vascular system, including treatment of deep vein thrombosis, DVT.","specialty":"General Surgery"}}},{"id":419,"category":"device","number":214,"langs":{"zh":{"title":"外周血管内光学相干断层成像定向斑块切除导管Pantheris System","description":"Pantheris System 使用光学相干断层成像（OCT）辅助定向成像手段，用于切除部分闭塞的外周血管（参考直径为 3.0mm 至7.0mm）中的原发性或继发性病变（斑块切除术），包括支架内再狭窄（ISR）。该系统通过提供血管内腔、管壁结构和血管形态的图像来辅助 X线透视。Pantheris System 不适用于髂、冠脉、脑、肾或颈动脉血管系统。","specialty":"普外科"},"ja":{"title":"Pantheris System 末梢血管内OCT誘導方向性アテレクトミーカテーテル","description":"光干渉断層法（OCT）による方向性画像支援を用い、参照径3.0～7.0 mmの部分閉塞末梢血管内の原発・続発病変、ステント内再狭窄（ISR）を含む、を切除する。血管内腔、血管壁構造、血管形態の画像を提供してX線透視を補助する。腸骨、冠動脈、脳、腎、頸動脈血管系には使用しない。","specialty":"一般外科"},"en":{"title":"Pantheris System, Peripheral Intravascular OCT-Guided Directional Atherectomy Catheter","description":"Pantheris uses optical coherence tomography, OCT, assisted directional imaging to excise primary or secondary lesions, atherectomy, from partially occluded peripheral vessels with reference diameters of 3.0 mm to 7.0 mm, including in-stent restenosis, ISR. The system supplements X-ray fluoroscopy by providing images of the vascular lumen, vessel wall structure, and vascular morphology. Pantheris is not intended for iliac, coronary, cerebral, renal, or carotid vascular systems.","specialty":"General Surgery"}}},{"id":420,"category":"device","number":215,"langs":{"zh":{"title":"外周血管内光学相干断层成像定向斑块切除导管Pantheris SV","description":"Pantheris SV 使用光学相干断层成像（OCT）辅助定向成像手段，用于切除部分闭塞的外周血管（参考直径为 2.0mm 至4.0mm）中的原发性或继发性病变（斑块切除术）。该系统通过提供血管内腔、管壁结构和血管形态的图像来辅助 X 线透视。Pantheris SV 不适用于髂、冠脉、脑、肾或颈动脉血管系统。","specialty":"普外科"},"ja":{"title":"Pantheris SV 末梢血管内OCT誘導方向性アテレクトミーカテーテル","description":"OCT方向性画像支援を用い、参照径2.0～4.0 mmの部分閉塞末梢血管内の原発・続発病変を切除する。血管内腔、血管壁構造、血管形態の画像を提供してX線透視を補助する。腸骨、冠動脈、脳、腎、頸動脈血管系には使用しない。","specialty":"一般外科"},"en":{"title":"Pantheris SV, Peripheral Intravascular OCT-Guided Directional Atherectomy Catheter","description":"Pantheris SV uses OCT-assisted directional imaging to excise primary or secondary lesions, atherectomy, from partially occluded peripheral vessels with reference diameters of 2.0 mm to 4.0 mm. It supplements X-ray fluoroscopy by providing images of the vascular lumen, vessel wall structure, and vascular morphology. Pantheris SV is not intended for iliac, coronary, cerebral, renal, or carotid vascular systems.","specialty":"General Surgery"}}},{"id":421,"category":"device","number":216,"langs":{"zh":{"title":"外周血管内光学相干断层成像慢性闭塞病变通路导管Tigereye ST CTO-Crossing Catheter","description":"Tigereye ST 使用光学相干断层成像（OCT）辅助定向成像手段，用于开通外周血管狭窄与闭塞病变（包括次全闭塞和慢性全闭塞病变）并辅助置入导丝。该系统通过提供血管内腔、管壁结构和血管形态的图像来辅助 X 线透视。","specialty":"普外科"},"ja":{"title":"Tigereye ST CTO-Crossing Catheter 末梢血管内OCT誘導慢性閉塞病変通過カテーテル","description":"OCT方向性画像支援により、末梢血管の狭窄・閉塞病変、亜全閉塞および慢性完 For coagulation of vessels in patients with superficial venous reflux.","specialty":"General Surgery"}}},{"id":427,"category":"device","number":222,"langs":{"zh":{"title":"一次性冷却系统EPack","description":"非无菌一次性使用，预期配合 Theraclion的超声设备进行治疗\n提供声学耦合和皮肤冷却功能。","specialty":"普外科"},"ja":{"title":"EPack ディスポーザブル冷却システム","description":"非滅菌・単回使用で、Theraclion超音波装置による治療と併用し、音響結合・皮膚冷却機能を提供する。","specialty":"一般外科"},"en":{"title":"EPack Disposable Cooling System","description":"Non-sterile, single-use system intended for use with Theraclion ultrasound equipment during treatment to provide acoustic coupling and skin cooling.","specialty":"General Surgery"}}},{"id":428,"category":"device","number":223,"langs":{"zh":{"title":"外周血管内光学相干断层成像定向斑块切除系统Lightbox 3","description":"外周血管内光学相干断层成像定向斑块切除系统用于\n与 Avinger 公司产品兼容的外周血管手术。","specialty":"普外科"},"ja":{"title":"Lightbox 3 末梢血管内OCT誘導方向性アテレクトミーシステム","description":"Avinger社製品と互換性のある末梢血管手術に使用する。","specialty":"一般外科"},"en":{"title":"Lightbox 3 Peripheral Intravascular OCT-Guided Directional Atherectomy System","description":"For peripheral vascular procedures using compatible Avinger products.","specialty":"General Surgery"}}},{"id":429,"category":"device","number":224,"langs":{"zh":{"title":"微点聚焦超声治疗仪","description":"治疗原理是将超声波聚焦到表皮下特定的软组织层，精确、界限分明的形成独特的热凝固点，从而在不损伤皮肤表面的情况下使胶原变性，新胶原蛋白重塑。从而改善面部老化，达到提拉紧致皮肤、抗衰除皱的效果","specialty":"皮肤科"},"ja":{"title":"マイクロフォーカス超音波治療装置","description":"超音波を表皮下の特定軟組織層へ集束し、皮膚表面を損傷せずに精密で境界明瞭な熱凝固点を形成し、コラーゲン変性・新生コラーゲン再構築を誘導する。顔面老化を改善し、皮膚のリフトアップ・引き締め、抗老化・皺改善を行う。","specialty":"皮膚科"},"en":{"title":"Microfocused Ultrasound Treatment Device","description":"The treatment principle is to focus ultrasound on specific soft-tissue layers beneath the epidermis to create precise, well-defined thermal coagulation points, causing collagen denaturation and new collagen remodeling without damaging the skin surface. This improves facial aging, lifts and tightens the skin, and provides anti-aging and wrinkle-reduction effects.","specialty":"Dermatology"}}},{"id":430,"category":"device","number":225,"langs":{"zh":{"title":"半导体激光减脂仪","description":"用于腹部、侧腹、背部、大腿内侧、大腿外侧和颈下区域的非侵入性脂肪分解","specialty":"皮肤科"},"ja":{"title":"半導体レーザー脂肪減少装置","description":"腹部、側腹部、背部、大腿内側・外側、オトガイ下の非侵襲的脂肪分解に使用する。","specialty":"皮膚科"},"en":{"title":"Semiconductor Laser Fat-Reduction Device","description":"For non-invasive lipolysis of the abdomen, flanks, back, inner thighs, outer thighs, and submental area.","specialty":"Dermatology"}}},{"id":431,"category":"device","number":226,"langs":{"zh":{"title":"脱细胞异体真皮（MegaDerm\nPlus）","description":"用于替换或修复因事故或疾病而缺损或损坏的人体皮肤。","specialty":"皮肤科"},"ja":{"title":"MegaDerm Plus 脱細胞同種真皮","description":"事故または疾患により欠損・損傷した人体皮膚を置換・修復する。","specialty":"皮膚科"},"en":{"title":"MegaDerm Plus Acellular Allogeneic Dermis","description":"For replacement or repair of human skin missing or damaged due to accidents or disease.","specialty":"Dermatology"}}},{"id":432,"category":"device","number":227,"langs":{"zh":{"title":"HAIRCARE","description":"Hairare是一种可吸收的植入物，由2 mg透明质酸+重组毛发复合物组成，可通过微量注射到靠近发根的头皮真皮中","specialty":"皮肤科"},"ja":{"title":"HAIRCARE","description":"Hairareは2 mgヒアルロン酸＋組換え毛髪複合体からなる吸収性インプラントで、毛根近傍の頭皮真皮に微量注射できる。","specialty":"皮膚科"},"en":{"title":"HAIRCARE","description":"Hairare is an absorbable implant consisting of 2 mg hyaluronic acid plus recombinant hair complex, which can be microinjected into the scalp dermis near the hair roots.","specialty":"Dermatology"}}},{"id":433,"category":"device","number":228,"langs":{"zh":{"title":"Plexr Plus 及\nPlexr Tips","description":"用于眼睑整形抗衰，面部和身体紧致提升，上肢和腹部多余皮肤提拉紧致，肚脐提拉，皮肤色素性病变，脐周妊娠纹治疗，纤维瘤，痣、疣、睑黄瘤的祛除、皮肤角化不良、痤疮后痘印痘疤的改善修复，以及非药物性痤疮治疗等","specialty":"皮肤科"},"ja":{"title":"Plexr Plus および Plexr Tips","description":"眼瞼形成・抗老化、顔面・身体の引き締め・リフトアップ、上肢・腹部余剰皮膚のリフト・引き締め、臍リフト、皮膚色素病変、臍周囲妊娠線治療、線維腫、母斑、疣贅、眼瞼黄色腫の除去、角化異常、ざ瘡後色素沈着・瘢痕の改善・修復、非薬物的ざ瘡治療などに使用する。","specialty":"皮膚科"},"en":{"title":"Plexr Plus and Plexr Tips","description":"For eyelid rejuvenation, facial and body tightening and lifting, lift
