(()=>{
const T=window.ANTSU_TEXT;
const getSiteLang=()=>localStorage.getItem('antsuSiteLang')||'ja';
let siteLang=getSiteLang();
function applySiteLang(){
 document.documentElement.lang=siteLang==='ja'?'ja':'en';
 document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(T[siteLang][k]!=null)el.textContent=T[siteLang][k]});
 document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{const k=el.dataset.i18nPlaceholder;if(T[siteLang][k]!=null)el.placeholder=T[siteLang][k]});
 document.querySelectorAll('[data-site-lang]').forEach(b=>b.classList.toggle('active',b.dataset.siteLang===siteLang));
 window.dispatchEvent(new CustomEvent('antsu:lang',{detail:{lang:siteLang}}));
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-site-lang]');if(b){siteLang=b.dataset.siteLang;localStorage.setItem('antsuSiteLang',siteLang);applySiteLang()}});
const menu=document.querySelector('.mobile-menu'), mobile=document.querySelector('.mobile-nav');if(menu&&mobile)menu.addEventListener('click',()=>mobile.classList.toggle('open'));
window.Antsu={getSiteLang:()=>siteLang,applySiteLang};
applySiteLang();
})();
